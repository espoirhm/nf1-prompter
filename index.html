<!doctype html>
<html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'></head><body>

<style>
/* Layout: one-screen stage — slide bar on top, the current slide's script in the middle (current sentence large), controls at the bottom. Dark stage by default, light for rehearsal. */
:root {
  --stage: #0f1415;        /* hall-dark ground, slight teal bias */
  --panel: #182022;
  --line: #2a3537;
  --ink: #f2f6f5;          /* current sentence */
  --ink-dim: #7f8f8e;      /* read / upcoming */
  --must: #ffc861;         /* bold = not on the slide */
  --teal: #19a6a3;         /* deck teal: cues, progress */
  --teal-ink: #04201f;
  --btn: #26343a;          /* control buttons */
  --rec: #ff5a4f;          /* microphone live */
  --warn: #ff8a7a;
  --f-read: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --size: 34px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --stage: #f7f9f9; --panel: #ffffff; --line: #d7e0e0;
  --ink: #0d1718; --ink-dim: #8a9898; --must: #9a5b00;
  --teal: #007f7d; --teal-ink: #ffffff; --warn: #b3261e; --btn: #e4ecec; --rec: #c62828;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--stage); color: var(--ink); font-family: var(--f-read); margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto; grid-template-areas: "bar" "mic" "stage" "ctrl"; }
.bar { grid-area: bar; } #stage { grid-area: stage; } .ctrl { grid-area: ctrl; } .micline { grid-area: mic; }
.micline { display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.micline #mic { min-height: 36px; padding: 4px 12px; font-size: 14px; white-space: nowrap; color: var(--ink-dim); }
.micline #mic.live { color: var(--rec); border-color: var(--rec); }
.micline #heard { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }

/* 3-line "karaoke" view: previous / current / next, same size, current in yellow */
.k3 #stage { display: block; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: auto; padding-block: 12px; }
.k3 .col { width: 100%; gap: 0.9em; }
.k3 .histbox { display: flex; flex-direction: column; gap: 0.5em; padding-top: 4px; }
.k3 .s.hist { font-size: calc(var(--size) * 0.7); line-height: 1.4; color: var(--ink-dim); opacity: .7; transition: none; }
.k3 .s.hist b { color: inherit; }
.k3 .histtag { font-family: var(--f-mono); font-size: 11px; color: var(--teal); opacity: .8; margin-top: 4px; }
.k3 .core { display: flex; flex-direction: column; justify-content: center; }
.k3 .coreIn { display: flex; flex-direction: column; gap: 0.9em; }
.k3 .s, .k3 .s.cur { font-size: calc(var(--size) * 0.8 * var(--k3s, 1)); line-height: 1.45; transition: none; }
.k3 .s { color: var(--ink-dim); opacity: .75; }
.k3 .s.cur { color: var(--must); opacity: 1; }
.k3 .s.cur b { color: var(--must); }
.k3 .s .ko { font-size: .7em; }
.k3 .nexttag { font-family: var(--f-mono); font-size: 12px; color: var(--teal); display: block; margin-bottom: 2px; }
.k3 .next { display: none; }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.slideno { font-family: var(--f-mono); font-size: 15px; color: var(--teal); white-space: nowrap; }
.slidetitle { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { font-family: var(--f-mono); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.clock .tgt { color: var(--ink-dim); }
.clock.late .now { color: var(--warn); }
.thumb { height: 54px; aspect-ratio: 16 / 9; border-radius: 4px; border: 1px solid var(--line); object-fit: cover; background: #000; flex: none; }
.thumb[hidden] { display: none !important; }

/* stage */
#stage { position: relative; overflow-y: auto; padding: 24px 16px 60vh; scroll-behavior: smooth; min-height: 0; }
.col { max-width: 30em; margin: 0 auto; display: flex; flex-direction: column; gap: 0.7em; }
.s { font-size: calc(var(--size) * 0.62); line-height: 1.4; color: var(--ink-dim); transition: color .2s, font-size .2s; cursor: pointer; }
.s b { font-weight: 700; color: inherit; }
.s.cur { font-size: var(--size); color: var(--ink); line-height: 1.32; }
.s.cur b { color: var(--must); }
.s.done { opacity: .55; }
.s .q { font-style: italic; color: var(--teal); font-size: .8em; }
.s .ko { color: var(--ink-dim); font-size: .62em; }
.cue { align-self: flex-start; font-family: var(--f-mono); font-size: calc(var(--size) * 0.5); background: var(--teal); color: var(--teal-ink); padding: .12em .6em; border-radius: 999px; letter-spacing: .04em; }
.cue.dim { background: transparent; color: var(--teal); border: 1px solid var(--teal); }
.cue.flash { animation: flash 1s ease-out 2; }
@keyframes flash { 50% { transform: scale(1.12); } }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: .3em; }
.meter i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .25s linear; }
.next { margin-top: 1.6em; padding-top: 1em; border-top: 1px dashed var(--line); color: var(--ink-dim); font-size: 15px; }
.next strong { color: var(--ink); }

/* controls */
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 2px solid var(--teal); }
.ctrl .grow { flex: 1; }
.ctrl .main { display: flex; gap: 8px; align-items: center; }
.ctrl .extra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#more { display: none; }
button { font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); background: var(--btn); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 44px; }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
button.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 700; min-width: 5.5em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--teal); color: var(--teal-ink); }
.wpm { font-family: var(--f-mono); font-size: 14px; color: var(--ink-dim); white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--teal); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); }
.status { font-size: 13px; color: var(--ink-dim); white-space: nowrap; }
.status.on { color: var(--teal); }

/* slide list */
#list { position: fixed; inset: 0; background: var(--stage); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px; }
#list h2 { font-size: 18px; margin: 0 0 12px; }
#list ol { list-style: none; margin: 0; padding: 0; max-width: 40em; }
#list li button { width: 100%; text-align: left; display: flex; gap: 12px; align-items: baseline; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
#list .n { font-family: var(--f-mono); color: var(--teal); min-width: 2.5em; }
#list .t { flex: 1; min-width: 0; }
#list .m { font-family: var(--f-mono); color: var(--ink-dim); font-size: 13px; }

@media (max-width: 560px) {
  :root { --size: 26px; }
  /* phone: one slim header line, big thumb-friendly controls, extras behind 설정 */
  .bar { gap: 8px; padding: calc(6px + env(safe-area-inset-top, 0px)) 12px 6px; }
  .thumb { display: none; }
  .slideno, .clock { font-size: 13px; }
  .slidetitle { font-size: 13px; }
  #stage { padding-top: 10px; }
  /* phone: controls sit at the top, under the slide line, clear of Safari's bottom toolbar */
  #app { grid-template-rows: auto auto auto 1fr; grid-template-areas: "bar" "ctrl" "mic" "stage"; }
  .micline { padding: 6px 12px; }
  .ctrl { flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 12px 10px; border-top: 0; border-bottom: 2px solid var(--teal); }
  .ctrl .main { width: 100%; }
  .ctrl .main button { flex: 1; min-height: 56px; font-size: 20px; }
  .ctrl .main #go { flex: 1.4; font-size: 18px; }
  .ctrl .main #more { display: block; flex: 0.9; font-size: 15px; }
  .ctrl .extra { display: none; }
  .ctrl.open .extra { display: flex; }
  .ctrl .status { display: none; }
}
@media (prefers-reduced-motion: reduce) { #stage { scroll-behavior: auto; } .cue.flash { animation: none; } .s, .meter i { transition: none; } }
</style>

<script>
window.NF1_SCRIPT=[{"n":1,"title":"2026 MGH Noon Lecture 0 Neurofibromatosis type 1","target":null,"items":[{"text":"Okay, I think it’s time, so let’s get started.","html":"\u003cb\u003eOkay, I think it’s time, so let’s get started.\u003c/b\u003e","cue":null},{"text":"Hi, everyone.","html":"\u003cb\u003eHi, everyone.\u003c/b\u003e","cue":null},{"text":"Good afternoon.","html":"\u003cb\u003eGood afternoon.\u003c/b\u003e","cue":null},{"text":"I\u0027m Heemang Yoon from Pediatric Radiology.","html":"\u003cb\u003eI\u0026#39;m\u003c/b\u003e Heemang Yoon from \u003cb\u003ePediatric\u003c/b\u003e Radiology.","cue":null},{"text":"Actually, I had planned to use today\u0027s noon conference — and the October 6 morning conference — for a very interesting AI research project.","html":"\u003cb\u003eActually, I had planned to use today\u0026#39;s\u003c/b\u003e noon \u003cb\u003econference — and the October 6 morning conference — for a very interesting AI research project.\u003c/b\u003e","cue":null},{"text":"Unfortunately, the IRB approval has been delayed, so I can\u0027t do that yet.","html":"\u003cb\u003eUnfortunately, the IRB approval has been delayed, so I can\u0026#39;t do that yet.\u003c/b\u003e","cue":null},{"text":"So instead, I\u0027ve prepared another pediatric radiology lecture for you today.","html":"\u003cb\u003eSo instead, I\u0026#39;ve prepared another pediatric\u003c/b\u003e radiology lecture for you \u003cb\u003etoday.\u003c/b\u003e","cue":null},{"text":"Today\u0027s topic is neurofibromatosis type 1, or NF1.","html":"\u003cb\u003eToday\u0026#39;s topic\u003c/b\u003e is neurofibromatosis type 1, or \u003cb\u003eNF1.\u003c/b\u003e","cue":null},{"text":"NF1 is a multisystem disease, so we see these patients in almost every section — neuro, MSK, body imaging, and of course, pediatrics.","html":"\u003cb\u003eNF1 is a multisystem disease, so we see these patients in almost every section — neuro, MSK, body imaging, and of course, pediatrics.\u003c/b\u003e","cue":null},{"text":"My goal today is simple.","html":"\u003cb\u003eMy goal today is simple.\u003c/b\u003e","cue":null},{"text":"When you see a patient with NF1 on your worklist, I want you to know what to look for — and, more importantly, what not to miss.","html":"\u003cb\u003eWhen you see a patient with NF1 on your worklist, I want you to know what to look for — and, more importantly, what not to miss.\u003c/b\u003e","cue":null}]},{"n":2,"title":"Contents","target":null,"items":[{"text":"Here is the outline.","html":"\u003cb\u003eHere is the outline.\u003c/b\u003e","cue":null},{"text":"First, I\u0027ll briefly cover the definition and the genetics.","html":"\u003cb\u003eFirst, I\u0026#39;ll briefly cover\u003c/b\u003e the definition and the genetics.","cue":null},{"text":"Then, I\u0027ll spend most of the time on the imaging findings.","html":"\u003cb\u003eThen, I\u0026#39;ll spend most of the time on the imaging findings.\u003c/b\u003e","cue":null},{"text":"And at the end, I’ll briefly touch on surveillance.","html":"\u003cb\u003eAnd at the end, I’ll briefly touch\u003c/b\u003e on surveillance.","cue":null}]},{"n":3,"title":"My NF1 experiences at Asan Medical Center","target":null,"items":[{"text":"Before we start, let me tell you a little bit about me and NF1.","html":"\u003cb\u003eBefore we start, let me tell you a little bit\u003c/b\u003e about me and NF1.","cue":null},{"text":"Before I came here about a year ago, I worked at Asan Medical Center in Korea.","html":"\u003cb\u003eBefore I came here about a year ago, I worked\u003c/b\u003e at Asan Medical Center in \u003cb\u003eKorea.\u003c/b\u003e","cue":null},{"text":"We had a very large NF1 program there, with many NF1 patients.","html":"\u003cb\u003eWe had a very large\u003c/b\u003e NF1 \u003cb\u003eprogram there, with many\u003c/b\u003e NF1 \u003cb\u003epatients.\u003c/b\u003e","cue":null},{"text":"At that time, I was actually a junior attending.","html":"\u003cb\u003eAt that time, I was actually a junior attending.\u003c/b\u003e","cue":null},{"text":"Most of my senior colleagues didn\u0027t really want to read whole-body MRIs for NF1, so I somehow became the primary radiologist reading most of them — both pediatric and adult cases.","html":"\u003cb\u003eMost of my senior colleagues didn\u0026#39;t really want to read\u003c/b\u003e whole-body MRIs for NF1, so I \u003cb\u003esomehow became the primary radiologist reading most of them — both pediatric and adult cases.\u003c/b\u003e","cue":null},{"text":"Take a look at this picture.","html":"\u003cb\u003eTake a look at this picture.\u003c/b\u003e","cue":null},{"text":"This is my worklist from Asan.","html":"\u003cb\u003eThis\u003c/b\u003e is my worklist from Asan.","cue":null},{"text":"Each line you see here is an NF1 whole-body MRI waiting to be read.","html":"\u003cb\u003eEach line you see\u003c/b\u003e here is an NF1 whole-body MRI \u003cb\u003ewaiting to be read.\u003c/b\u003e","cue":null},{"text":"So, I\u0027m not exaggerating when I say that escaping this endless list of whole-body MRIs was one of the reasons I came to Boston.","html":"\u003cb\u003eSo, I\u0026#39;m not exaggerating when I say that escaping this endless list\u003c/b\u003e of whole-body MRIs was one of the \u003cb\u003ereasons I came to Boston.\u003c/b\u003e","cue":null},{"text":"But the funny thing is, after I moved here, the very first case I read at MGH was — guess what — an NF1 whole-body MRI.","html":"\u003cb\u003eBut the funny thing is, after I moved here, the very first case I read at MGH was — guess\u003c/b\u003e what — an NF1 whole-body MRI.","cue":null},{"text":"And I remember thinking, \"Wow, NF1 followed me all the way to Boston.\"","html":"\u003cb\u003eAnd I remember thinking, \u0026quot;Wow,\u003c/b\u003e NF1 \u003cb\u003efollowed me all the way to Boston.\u0026quot;\u003c/b\u003e","cue":null}]},{"n":4,"title":"My NF1 experiences at Asan Medical Center","target":null,"items":[{"text":"Anyway, because we had such a large NF1 population at Asan, I also had many opportunities to do research on NF1.","html":"\u003cb\u003eAnyway, because we had such a large\u003c/b\u003e NF1 \u003cb\u003epopulation\u003c/b\u003e at Asan, I also had \u003cb\u003emany opportunities to do research\u003c/b\u003e on NF1.","cue":null},{"text":"I worked on several different projects, and as you can see here, about half of them were related to selumetinib.","html":"\u003cb\u003eI worked on several different projects, and as you can see here, about half of them were related to selumetinib.\u003c/b\u003e","cue":null},{"text":"Selumetinib is a relatively new treatment for NF1, so it has become a pretty active research topic in recent years.","html":"\u003cb\u003eSelumetinib is a relatively new treatment\u003c/b\u003e for NF1, so it has \u003cb\u003ebecome a pretty active research topic in recent years.\u003c/b\u003e","cue":null},{"text":"So that\u0027s a little bit about my history with NF1, and that\u0027s why I chose NF1 as today\u0027s topic.","html":"\u003cb\u003eSo that\u0026#39;s a little bit about my history\u003c/b\u003e with NF1, and that\u0026#39;s why I \u003cb\u003echose\u003c/b\u003e NF1 as \u003cb\u003etoday\u0026#39;s topic.\u003c/b\u003e","cue":null},{"text":"One more thing before we start: all of the cases I\u0027m going to show you today are from Asan Medical Center.","html":"\u003cb\u003eOne more thing before we start:\u003c/b\u003e all of the cases \u003cb\u003eI\u0026#39;m going to show you today\u003c/b\u003e are from Asan Medical Center.","cue":null},{"text":"Okay, with that, let\u0027s get started.","html":"\u003cb\u003eOkay, with that, let\u0026#39;s get started.\u003c/b\u003e","cue":null}]},{"n":5,"title":"Neurofibromatosis type 1 (NF1)","target":null,"items":[{"text":"Let\u0027s start with the basics.","html":"\u003cb\u003eLet\u0026#39;s start with the basics.\u003c/b\u003e","cue":null},{"text":"NF1 is an autosomal dominant syndrome that affects multiple organ systems.","html":"NF1 is an autosomal dominant syndrome that affects multiple organ systems.","cue":null},{"text":"The classic findings are multiple cutaneous café-au-lait spots and neurofibromas.","html":"\u003cb\u003eThe classic findings\u003c/b\u003e are multiple cutaneous caf\u0026#233;-au-lait spots and neurofibromas.","cue":null},{"text":"It is caused by loss-of-function mutations in the tumor suppressor gene NF1, located on chromosome 17.","html":"\u003cb\u003eIt is caused\u003c/b\u003e by loss-of-function mutations in the tumor suppressor gene NF1, located on chromosome \u003cb\u003e17.\u003c/b\u003e","cue":null},{"text":"This gene encodes the neurofibromin protein.","html":"\u003cb\u003eThis\u003c/b\u003e gene encodes the neurofibromin protein.","cue":null}]},{"n":6,"title":"Gutmann DH, et al. Nat Rev Dis Primers. 2017 Feb 23;3:17004.","target":null,"items":[{"text":"This diagram shows what neurofibromin normally does.","html":"\u003cb\u003eThis diagram shows what neurofibromin normally does.\u003c/b\u003e","cue":null},{"text":"Normally, neurofibromin turns RAS (래스) off — from the active form to the inactive form.","html":"\u003cb\u003eNormally, neurofibromin turns RAS\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(래스)\u003c/span\u003e \u003cb\u003eoff — from the active form to the inactive form.\u003c/b\u003e","cue":null},{"text":"It works as a brake on cell growth.","html":"\u003cb\u003eIt works as a brake on cell growth.\u003c/b\u003e","cue":null},{"text":"When neurofibromin is lost, the brake is gone.","html":"\u003cb\u003eWhen neurofibromin is lost, the brake is gone.\u003c/b\u003e","cue":"CLICK"},{"text":"RAS stays active, and it keeps signaling through two main pathways: MEK–ERK (멕-얼크) and AKT–mTOR (에이케이티-엠토어).","html":"\u003cb\u003eRAS stays active, and it keeps signaling through two main pathways: MEK–ERK\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(멕-얼크)\u003c/span\u003e \u003cb\u003eand AKT–mTOR\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(에이케이티-엠토어)\u003c/span\u003e.","cue":null},{"text":"(클릭) The result is increased cell growth.","html":"\u003cspan class=\u0027ko\u0027\u003e(클릭)\u003c/span\u003e \u003cb\u003eThe result is increased cell growth.\u003c/b\u003e","cue":null},{"text":"Neurofibromin also affects cAMP (씨-앰프) signaling (클릭), and the result is increased cell survival.","html":"\u003cb\u003eNeurofibromin also affects cAMP\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(씨-앰프)\u003c/span\u003e \u003cb\u003esignaling\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(클릭)\u003c/span\u003e\u003cb\u003e, and the result is increased cell survival.\u003c/b\u003e","cue":null},{"text":"Please remember MEK (멕)(click).","html":"\u003cb\u003ePlease remember MEK\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(멕)\u003c/span\u003e\u003cb\u003e(click).\u003c/b\u003e","cue":null},{"text":"It will come back later when we talk about treatment.","html":"\u003cb\u003eIt will come back later when we talk about treatment.\u003c/b\u003e","cue":null}]},{"n":7,"title":"Neurofibromatosis type 1 (NF1)","target":null,"items":[{"text":"NF1 is not rare, affecting about 1 in 3,000 people.","html":"NF1 is not \u003cb\u003erare, affecting\u003c/b\u003e about 1 in \u003cb\u003e3,000 people.\u003c/b\u003e","cue":null},{"text":"About half of cases are sporadic, with no family history.","html":"\u003cb\u003eAbout half of cases\u003c/b\u003e are sporadic, with \u003cb\u003eno family history.\u003c/b\u003e","cue":null},{"text":"NF1 has high penetrance but variable expressivity, meaning most people with the mutation develop clinical features, but the features and severity vary widely.","html":"NF1 has high penetrance but variable expressivity, \u003cb\u003emeaning most people with the mutation\u003c/b\u003e develop clinical features, but the features and severity vary widely.","cue":null}]},{"n":8,"title":"Diagnosis NIH criteria","target":null,"items":[{"text":"This is how we diagnose NF1 — the revised criteria from 2021.","html":"\u003cb\u003eThis is how we diagnose NF1 — the revised\u003c/b\u003e criteria from 2021.","cue":null},{"text":"I won\u0027t read them all.","html":"\u003cb\u003eI won\u0026#39;t read them all.\u003c/b\u003e","cue":null},{"text":"There are seven features.","html":"\u003cb\u003eThere are seven features.\u003c/b\u003e","cue":null},{"text":"Some are clinical findings — café-au-lait macules (캐페이-오-레이 매큘즈), freckling (프레클링), and Lisch (리쉬) nodules (나쥴즈) in the iris, as in these photos.","html":"\u003cb\u003eSome are clinical findings\u003c/b\u003e — caf\u0026#233;-au-lait macules \u003cspan class=\u0027ko\u0027\u003e(캐페이-오-레이 매큘즈)\u003c/span\u003e, freckling \u003cspan class=\u0027ko\u0027\u003e(프레클링)\u003c/span\u003e, and Lisch \u003cspan class=\u0027ko\u0027\u003e(리쉬)\u003c/span\u003e nodules \u003cspan class=\u0027ko\u0027\u003e(나쥴즈)\u003c/span\u003e in the iris, as in these \u003cb\u003ephotos.\u003c/b\u003e","cue":null},{"text":"The rule is simple: two or more features.","html":"\u003cb\u003eThe rule is simple: two or more features.\u003c/b\u003e","cue":null},{"text":"Or, if a parent has NF1, just one.","html":"\u003cb\u003eOr, if a parent has NF1, just one.\u003c/b\u003e","cue":null},{"text":"For us, three features matter most, because we find them on imaging: neurofibromas, optic pathway glioma, and distinctive bone lesions.","html":"\u003cb\u003eFor us, three features matter most, because we find them on imaging: neurofibromas, optic pathway glioma, and distinctive bone lesions.\u003c/b\u003e","cue":"CLICK"},{"text":"So radiologists are really part of the diagnosis.","html":"\u003cb\u003eSo radiologists are really part\u003c/b\u003e of the diagnosis.","cue":null}]},{"n":9,"title":"Radiologic manifestations","target":null,"items":[{"text":"Beyond these three diagnostic features, NF1 has many other imaging findings.","html":"\u003cb\u003eBeyond these three diagnostic features, NF1 has many other imaging findings.\u003c/b\u003e","cue":null},{"text":"I\u0027ve grouped them into four parts: neurofibromas and MPNST; the central nervous system; mesodermal dysplasia, which includes bones and vessels; and other tumors.","html":"\u003cb\u003eI\u0026#39;ve grouped them into four\u003c/b\u003e parts: neurofibromas and MPNST; the \u003cb\u003ecentral nervous system;\u003c/b\u003e mesodermal dysplasia, which \u003cb\u003eincludes\u003c/b\u003e bones and \u003cb\u003evessels;\u003c/b\u003e and other tumors.","cue":null},{"text":"Let\u0027s begin with neurofibromas.","html":"\u003cb\u003eLet\u0026#39;s begin\u003c/b\u003e with neurofibromas.","cue":null}]},{"n":10,"title":"Neurofibromas","target":null,"items":[{"text":"Neurofibromas are the most common tumors in NF1.","html":"Neurofibromas are the most common tumors in NF1.","cue":null},{"text":"They are benign nerve sheath tumors.","html":"They are benign nerve sheath tumors.","cue":null},{"text":"But even though they are benign, they can cause serious problems.","html":"\u003cb\u003eBut even though\u003c/b\u003e they are benign, they can \u003cb\u003ecause serious problems.\u003c/b\u003e","cue":null},{"text":"Clinically, neurofibromas are divided into two groups: cutaneous and plexiform.","html":"Clinically, neurofibromas are \u003cb\u003edivided into two groups:\u003c/b\u003e cutaneous and plexiform.","cue":"CLICK"},{"text":"You can see examples in these photos.","html":"\u003cb\u003eYou can see examples in these photos.\u003c/b\u003e","cue":null}]},{"n":11,"title":"Histological classification","target":null,"items":[{"text":"Pathology uses a slightly different system.","html":"\u003cb\u003ePathology uses a slightly different system.\u003c/b\u003e","cue":null},{"text":"There are three main types.","html":"\u003cb\u003eThere are three main types.\u003c/b\u003e","cue":null},{"text":"First, cutaneous neurofibroma.","html":"\u003cb\u003eFirst,\u003c/b\u003e cutaneous neurofibroma.","cue":"CLICK"},{"text":"It can be localized or diffuse.","html":"It can be localized or diffuse.","cue":null},{"text":"It shows a loose arrangement of tumor cells.","html":"\u003cb\u003eIt shows\u003c/b\u003e a loose arrangement of tumor cells.","cue":null},{"text":"Second, intraneural neurofibroma.","html":"\u003cb\u003eSecond,\u003c/b\u003e intraneural neurofibroma.","cue":"CLICK"},{"text":"It can be plexiform or localized.","html":"It can be plexiform or localized.","cue":null},{"text":"The nerve fascicles (패시클즈) are expanded by tumor cells, and encompassed (인컴퍼스트) by the perineurium (페리뉴리엄).","html":"The nerve fascicles \u003cspan class=\u0027ko\u0027\u003e(패시클즈)\u003c/span\u003e are expanded by tumor cells, and encompassed \u003cspan class=\u0027ko\u0027\u003e(인컴퍼스트)\u003c/span\u003e by the perineurium \u003cspan class=\u0027ko\u0027\u003e(페리뉴리엄)\u003c/span\u003e.","cue":null},{"text":"Third, massive soft tissue neurofibroma.","html":"\u003cb\u003eThird,\u003c/b\u003e massive soft tissue neurofibroma.","cue":"CLICK"},{"text":"It shows regional soft tissue enlargement — pendulous (펜줄러스), bag-like or cape-like masses — with overlying skin hyperpigmentation (하이퍼피그먼테이션).","html":"\u003cb\u003eIt shows\u003c/b\u003e regional soft tissue enlargement — pendulous \u003cspan class=\u0027ko\u0027\u003e(펜줄러스)\u003c/span\u003e, bag-like or cape-like masses — with overlying skin hyperpigmentation \u003cspan class=\u0027ko\u0027\u003e(하이퍼피그먼테이션)\u003c/span\u003e.","cue":null}]},{"n":12,"title":"Imaging classification","target":null,"items":[{"text":"Now, let’s see how these pathologic types appear on imaging","html":"\u003cb\u003eNow, let’s see how these pathologic types appear\u003c/b\u003e on imaging","cue":null},{"text":"First, the localized cutaneous neurofibroma.","html":"\u003cb\u003eFirst,\u003c/b\u003e the localized cutaneous neurofibroma.","cue":"CLICK"},{"text":"On this whole-body STIR, you can see many small bright nodules in the skin.","html":"\u003cb\u003eOn this whole-body\u003c/b\u003e STIR, you can \u003cb\u003esee many small bright nodules in the skin.\u003c/b\u003e","cue":null}]},{"n":13,"title":"Imaging classification","target":null,"items":[{"text":"They are in the skin and the dermis.","html":"\u003cb\u003eThey are in the skin and the dermis.\u003c/b\u003e","cue":null},{"text":"They appears as multiple nodular or polypoid lesions.","html":"\u003cb\u003eThey appears\u003c/b\u003e as multiple nodular or polypoid lesions.","cue":null},{"text":"They show low attenuation on CT, and bright high signal on STIR.","html":"\u003cb\u003eThey show\u003c/b\u003e low attenuation on CT, and bright high \u003cb\u003esignal\u003c/b\u003e on STIR.","cue":null},{"text":"And shows enhancement.","html":"\u003cb\u003eAnd shows\u003c/b\u003e enhancement.","cue":null}]},{"n":14,"title":"Imaging classification","target":null,"items":[{"text":"Next, the diffuse cutaneous neurofibroma — here, in the right buttock.","html":"\u003cb\u003eNext,\u003c/b\u003e the diffuse cutaneous neurofibroma — here, in the \u003cb\u003eright buttock.\u003c/b\u003e","cue":"CLICK"},{"text":"It looks like a plaque that spreads into the subcutaneous fat.","html":"\u003cb\u003eIt looks\u003c/b\u003e like a plaque that \u003cb\u003espreads\u003c/b\u003e into the subcutaneous \u003cb\u003efat.\u003c/b\u003e","cue":"CLICK"},{"text":"The margin is infiltrative, and it enhances strongly.","html":"The margin is infiltrative, and it \u003cb\u003eenhances strongly.\u003c/b\u003e","cue":null},{"text":"In some cases, it goes deeper and involves the muscle.","html":"\u003cb\u003eIn some cases, it goes deeper\u003c/b\u003e and involves the muscle.","cue":null}]},{"n":15,"title":"Imaging classification","target":null,"items":[{"text":"Now, the intraneural neurofibromas.","html":"Now, the intraneural neurofibromas.","cue":null},{"text":"First, the plexiform type.","html":"\u003cb\u003eFirst,\u003c/b\u003e the plexiform \u003cb\u003etype.\u003c/b\u003e","cue":"CLICK"},{"text":"Plexiform means network-like, similar to a nerve plexus.","html":"Plexiform \u003cb\u003emeans network-like, similar to a nerve plexus.\u003c/b\u003e","cue":null},{"text":"Plexiform intraneural neurofibromas grow along multiple branches of a nerve, as you can see here in the pelvis and thigh.","html":"Plexiform intraneural neurofibromas \u003cb\u003egrow along multiple branches of a nerve, as you can see here in the pelvis and thigh.\u003c/b\u003e","cue":null},{"text":"They look like a group of worms following the nerves.","html":"\u003cb\u003eThey look like a group of worms following the nerves.\u003c/b\u003e","cue":null}]},{"n":16,"title":"Imaging classification","target":null,"items":[{"text":"Here are the typical imaging features.","html":"\u003cb\u003eHere are the typical\u003c/b\u003e imaging \u003cb\u003efeatures.\u003c/b\u003e","cue":null},{"text":"First, the \"bag of worms\" appearance.","html":"\u003cb\u003eFirst,\u003c/b\u003e the \u0026quot;bag of worms\u0026quot; appearance.","cue":null},{"text":"Second, [CLICK] the target sign, also called the central dot sign.","html":"\u003cb\u003eSecond,\u003c/b\u003e \u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e the target sign, also \u003cb\u003ecalled\u003c/b\u003e the central dot sign.","cue":null},{"text":"The center is dark [CLICK] on T2 because of collagen, while the outer rim [CLICK] is bright because of myxoid tissue.","html":"\u003cb\u003eThe center is dark\u003c/b\u003e \u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eon T2 because of collagen, while the outer\u003c/b\u003e rim \u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eis bright because of myxoid\u003c/b\u003e tissue.","cue":null},{"text":"After contrast, the enhancement is usually mild, fuzzy, and central.","html":"\u003cb\u003eAfter contrast,\u003c/b\u003e the enhancement is \u003cb\u003eusually\u003c/b\u003e mild, fuzzy, and central.","cue":null},{"text":"The target sign is very important.","html":"The target sign is very \u003cb\u003eimportant.\u003c/b\u003e","cue":null},{"text":"Please remember it — we\u0027ll come back to it when we talk about malignancy.","html":"\u003cb\u003ePlease remember it — we\u0026#39;ll come back to it when we talk about malignancy.\u003c/b\u003e","cue":null}]},{"n":17,"title":"Imaging classification","target":null,"items":[{"text":"Next, the localized intraneural neurofibroma.","html":"\u003cb\u003eNext,\u003c/b\u003e the localized intraneural neurofibroma.","cue":null},{"text":"It is a single, fusiform mass along one nerve — like these two lesions in the leg.","html":"\u003cb\u003eIt is a single, fusiform mass along one nerve — like these two lesions in the leg.\u003c/b\u003e","cue":"CLICK"}]},{"n":18,"title":"Imaging classification","target":null,"items":[{"text":"Localized intraneural neurofibroma is a well-defined mass.","html":"Localized intraneural neurofibroma is a well-defined mass.","cue":null},{"text":"In this patient, there are two of them.","html":"\u003cb\u003eIn this patient, there are two of them.\u003c/b\u003e","cue":null},{"text":"The upper lesion has no central dot sign, and it shows heterogeneous enhancement.","html":"\u003cb\u003eThe upper\u003c/b\u003e lesion has \u003cb\u003eno\u003c/b\u003e central dot sign, and it \u003cb\u003eshows\u003c/b\u003e heterogeneous enhancement.","cue":"point to the upper lesion"},{"text":"The lesion near the knee has a central dot sign, and it shows homogeneous enhancement.","html":"The lesion \u003cb\u003enear the knee\u003c/b\u003e has a central dot sign, and it \u003cb\u003eshows\u003c/b\u003e homogeneous enhancement.","cue":"point to the lesion near the knee"},{"text":"So, it can be with or without a central dot sign, and the enhancement can be heterogeneous or homogeneous.","html":"So, it can be with or without a central dot sign, and the enhancement can be heterogeneous or homogeneous.","cue":null},{"text":"Now, here is an important term: distinct nodular lesion.","html":"\u003cb\u003eNow, here is an important term:\u003c/b\u003e distinct nodular lesion.","cue":null},{"text":"It is a well-demarcated lesion, 3 cm or larger, without a central dot sign.","html":"It is a well-demarcated lesion, \u003cb\u003e3\u003c/b\u003e cm or \u003cb\u003elarger,\u003c/b\u003e without a central dot sign.","cue":null},{"text":"This is important because it can represent a premalignant or even malignant lesion.","html":"\u003cb\u003eThis is important because it can represent a premalignant or even malignant\u003c/b\u003e lesion.","cue":null},{"text":"We\u0027ll come back to this soon.","html":"\u003cb\u003eWe\u0026#39;ll come back to this soon.\u003c/b\u003e","cue":null}]},{"n":19,"title":"Imaging classification","target":null,"items":[{"text":"Lastly, massive soft tissue neurofibroma.","html":"\u003cb\u003eLastly,\u003c/b\u003e massive soft tissue neurofibroma.","cue":null},{"text":"On imaging, it is an extensive, infiltrative diffuse cutaneous neurofibroma — even into the skeletal muscles.","html":"On imaging, it is an extensive, infiltrative diffuse cutaneous neurofibroma — even into the skeletal muscles.","cue":null},{"text":"And there is regional soft tissue enlargement — pendulous (펜쥴러스), bag-like or cape-like masses, as in these patients.","html":"And there is regional soft tissue enlargement — pendulous \u003cspan class=\u0027ko\u0027\u003e(펜쥴러스)\u003c/span\u003e, bag-like or cape-like masses, as in these \u003cb\u003epatients.\u003c/b\u003e","cue":null},{"text":"And as you can see in these patients, the extent can be really striking — sometimes causing massive disfigurement.","html":"\u003cb\u003eAnd as you can see in these patients, the extent can be really striking — sometimes causing\u003c/b\u003e massive \u003cb\u003edisfigurement.\u003c/b\u003e","cue":null}]},{"n":20,"title":"Imaging classification","target":null,"items":[{"text":"To summarize: on imaging, massive soft tissue neurofibroma looks like an extensive form of diffuse cutaneous neurofibroma.","html":"\u003cb\u003eTo summarize:\u003c/b\u003e on imaging, massive soft tissue neurofibroma \u003cb\u003elooks like an extensive form\u003c/b\u003e of diffuse cutaneous neurofibroma.","cue":null},{"text":"So we can put them together.","html":"\u003cb\u003eSo we can put them together.\u003c/b\u003e","cue":"CLICK"},{"text":"That leaves us with four imaging types: localized cutaneous, diffuse cutaneous, plexiform, and localized intraneural neurofibroma.","html":"\u003cb\u003eThat leaves us with four\u003c/b\u003e imaging \u003cb\u003etypes:\u003c/b\u003e localized cutaneous, diffuse cutaneous, plexiform, and localized intraneural neurofibroma.","cue":null},{"text":"This is a simple and practical way to think about them.","html":"\u003cb\u003eThis is a simple and practical way to think about them.\u003c/b\u003e","cue":null}]},{"n":21,"title":".","target":null,"items":[{"text":"But in reality, many different terms are used, and they are often mixed up.","html":"\u003cb\u003eBut in reality, many different terms are used, and they are often mixed up.\u003c/b\u003e","cue":null},{"text":"This table shows the classifications of neurofibromas proposed over the years.","html":"\u003cb\u003eThis table shows the classifications of neurofibromas proposed over the years.\u003c/b\u003e","cue":null},{"text":"There is still no single standard system.","html":"\u003cb\u003eThere is still no single standard system.\u003c/b\u003e","cue":null}]},{"n":22,"title":"Plexiform intraneural neurofibroma","target":null,"items":[{"text":"In my opinion, there are two reasons for this confusion.","html":"\u003cb\u003eIn my opinion, there are two reasons for this confusion.\u003c/b\u003e","cue":null},{"text":"First, the word \"plexiform\" is used differently.","html":"\u003cb\u003eFirst, the word\u003c/b\u003e \u0026quot;plexiform\u0026quot; is \u003cb\u003eused differently.\u003c/b\u003e","cue":null},{"text":"Clinically, when an NF1 patient has soft tissue thickening with a mass, like this foot, it is often called a plexiform neurofibroma.","html":"Clinically, when an \u003cb\u003eNF1 patient has soft tissue thickening with a mass, like this foot, it is often called\u003c/b\u003e a plexiform neurofibroma.","cue":null},{"text":"But on imaging, it may be a diffuse cutaneous neurofibroma — or a true plexiform intraneural neurofibroma.","html":"But on imaging, it may be a diffuse cutaneous neurofibroma — or a \u003cb\u003etrue\u003c/b\u003e plexiform intraneural neurofibroma.","cue":"CLICK"},{"text":"Second, different types often coexist in the same patient:","html":"\u003cb\u003eSecond, different types often coexist in the same patient:\u003c/b\u003e","cue":"CLICK"},{"text":"diffuse cutaneous plus localized intraneural, diffuse cutaneous plus plexiform, and plexiform plus localized intraneural.","html":"diffuse cutaneous \u003cb\u003eplus\u003c/b\u003e localized intraneural, diffuse cutaneous \u003cb\u003eplus\u003c/b\u003e plexiform, and plexiform \u003cb\u003eplus\u003c/b\u003e localized intraneural.","cue":null},{"text":"So it can sometimes be difficult to give them a single label.","html":"\u003cb\u003eSo it can sometimes be difficult to give them a single label.\u003c/b\u003e","cue":null},{"text":"The important thing is to recognize the different imaging patterns and describe the components you see.","html":"\u003cb\u003eThe important thing is to recognize the different\u003c/b\u003e imaging \u003cb\u003epatterns and describe the components you see.\u003c/b\u003e","cue":null}]},{"n":23,"title":"Plexiform neurofibroma (PN)","target":null,"items":[{"text":"Now let\u0027s focus on plexiform neurofibromas, or PN, because they matter most in NF1.","html":"\u003cb\u003eNow let\u0026#39;s focus\u003c/b\u003e on plexiform neurofibromas, or PN, because they \u003cb\u003ematter\u003c/b\u003e most in NF1.","cue":null},{"text":"They are found in approximately 50% of patients with NF1, and they are pathognomonic for the diagnosis of NF1.","html":"\u003cb\u003eThey are found\u003c/b\u003e in approximately 50% of patients with NF1, and they are pathognomonic for the diagnosis of NF1.","cue":null},{"text":"They cause significant morbidity:","html":"\u003cb\u003eThey cause\u003c/b\u003e significant morbidity:","cue":null},{"text":"pain, disfigurement, and orthopedic issues — like the leg overgrowth in this patient.","html":"pain, disfigurement, and orthopedic issues — like the \u003cb\u003eleg overgrowth in this\u003c/b\u003e patient.","cue":null},{"text":"They can also compress vital structures.","html":"\u003cb\u003eThey can also compress\u003c/b\u003e vital structures.","cue":null},{"text":"Here, a retropharyngeal plexiform neurofibroma is compressing the airway.","html":"\u003cb\u003eHere, a retropharyngeal\u003c/b\u003e plexiform neurofibroma is \u003cb\u003ecompressing\u003c/b\u003e the airway.","cue":null},{"text":"And here, it involves the bladder wall.","html":"\u003cb\u003eAnd here, it involves\u003c/b\u003e the bladder \u003cb\u003ewall.\u003c/b\u003e","cue":null},{"text":"So, they can cause airway problems, vision issues, and bowel or bladder dysfunction.","html":"\u003cb\u003eSo, they can cause\u003c/b\u003e airway problems, vision issues, and bowel or bladder dysfunction.","cue":null},{"text":"There is about a 10 to 15% risk of malignant transformation.","html":"There is about a 10 to 15% risk of malignant transformation.","cue":null},{"text":"Regarding treatment, surgery used to be the only option.","html":"\u003cb\u003eRegarding treatment,\u003c/b\u003e surgery \u003cb\u003eused to be the only option.\u003c/b\u003e","cue":null},{"text":"But complete removal is often impossible, and even after surgery, the tumor regrows in about 44% of patients.","html":"But complete removal is often impossible, and even after surgery, the \u003cb\u003etumor regrows\u003c/b\u003e in about 44% of patients.","cue":null}]},{"n":24,"title":"Selumetinib","target":null,"items":[{"text":"So, this brings us to selumetinib.","html":"\u003cb\u003eSo, this brings\u003c/b\u003e us to selumetinib.","cue":null},{"text":"As I mentioned, surgery used to be the only treatment option.","html":"\u003cb\u003eAs I mentioned, surgery used to be the only treatment option.\u003c/b\u003e","cue":null},{"text":"But that changed with selumetinib.","html":"\u003cb\u003eBut that changed\u003c/b\u003e with selumetinib.","cue":null},{"text":"Selumetinib is a MEK inhibitor.","html":"Selumetinib is a \u003cb\u003eMEK inhibitor.\u003c/b\u003e","cue":null},{"text":"It blocks the MEK step in the pathway I showed you at the beginning.","html":"\u003cb\u003eIt blocks the MEK step in the pathway I showed you at the beginning.\u003c/b\u003e","cue":null},{"text":"In 2020, it was approved for pediatric patients with NF1 who have symptomatic, inoperable plexiform neurofibromas.","html":"\u003cb\u003eIn 2020, it was approved\u003c/b\u003e for pediatric patients with NF1 who have symptomatic, inoperable plexiform neurofibromas.","cue":null},{"text":"Here is a 12-year-old boy.","html":"\u003cb\u003eHere is a 12-year-old boy.\u003c/b\u003e","cue":"CLICK"},{"text":"He had extensive plexiform neurofibromas in the neck, mediastinum, along the portal vein in the liver, and throughout the mesentery.","html":"\u003cb\u003eHe had extensive\u003c/b\u003e plexiform neurofibromas in the \u003cb\u003eneck, mediastinum, along the portal vein in the liver, and throughout the mesentery.\u003c/b\u003e","cue":null},{"text":"After four years of selumetinib, the tumors decreased significantly.","html":"\u003cb\u003eAfter four years\u003c/b\u003e of selumetinib, the \u003cb\u003etumors decreased significantly.\u003c/b\u003e","cue":null}]},{"n":25,"title":"Selumetinib","target":null,"items":[{"text":"Here are two more patients treated with selumetinib.","html":"\u003cb\u003eHere are two more patients treated\u003c/b\u003e with selumetinib.","cue":null},{"text":"The first patient had extensive plexiform neurofibromas in the pelvis and buttocks.","html":"\u003cb\u003eThe first patient had extensive plexiform neurofibromas in the pelvis and buttocks.\u003c/b\u003e","cue":null},{"text":"After four and a half years of treatment, they decreased dramatically.","html":"\u003cb\u003eAfter four and a half years of treatment, they decreased dramatically.\u003c/b\u003e","cue":"CLICK"},{"text":"The second patient also had extensive plexiform neurofibromas in the chest and abdomen — encasing the celiac trunk and the SMA, and extending into the liver.","html":"\u003cb\u003eThe second patient also had extensive plexiform neurofibromas in the chest and abdomen — encasing the celiac trunk and the SMA, and extending into the liver.\u003c/b\u003e","cue":"CLICK"},{"text":"After four years, they also decreased a lot.","html":"\u003cb\u003eAfter four years, they also decreased a lot.\u003c/b\u003e","cue":"CLICK"},{"text":"So, both patients responded very well.","html":"\u003cb\u003eSo, both patients responded very well.\u003c/b\u003e","cue":null},{"text":"And treatment has continued to evolve since then.","html":"\u003cb\u003eAnd treatment has continued to evolve since then.\u003c/b\u003e","cue":null}]},{"n":26,"title":"What’s New in Treatment?","target":null,"items":[{"text":"So, what\u0027s new?","html":"So, what\u0026#39;s new?","cue":null},{"text":"After selumetinib was approved for children in 2020, treatment options expanded further.","html":"\u003cb\u003eAfter\u003c/b\u003e selumetinib was \u003cb\u003eapproved\u003c/b\u003e for children in 2020, treatment \u003cb\u003eoptions\u003c/b\u003e expanded \u003cb\u003efurther.\u003c/b\u003e","cue":null},{"text":"In 2025, a new MEK inhibitor, mirdametinib, was approved, extending treatment to adults as well.","html":"In 2025, a new MEK \u003cb\u003einhibitor,\u003c/b\u003e mirdametinib, was \u003cb\u003eapproved, extending\u003c/b\u003e treatment to adults as well.","cue":null},{"text":"One unique thing about these treatments is how we assess treatment response.","html":"\u003cb\u003eOne unique thing\u003c/b\u003e about these treatments is how we \u003cb\u003eassess\u003c/b\u003e treatment response.","cue":null},{"text":"For most tumors, we measure response using one- or two-dimensional measurements.","html":"For most tumors, we \u003cb\u003emeasure\u003c/b\u003e response \u003cb\u003eusing one- or two-dimensional measurements.\u003c/b\u003e","cue":null},{"text":"But plexiform neurofibromas are very irregular in shape, so volumetric measurement is preferred.","html":"But plexiform neurofibromas are very \u003cb\u003eirregular in shape, so volumetric measurement is preferred.\u003c/b\u003e","cue":null},{"text":"We look at changes in tumor volume, together with clinical benefit, such as less pain or better function.","html":"\u003cb\u003eWe look at changes\u003c/b\u003e in tumor volume, \u003cb\u003etogether\u003c/b\u003e with clinical benefit, \u003cb\u003esuch as less pain or better function.\u003c/b\u003e","cue":null},{"text":"So, NF1-associated PN is now a medically treatable tumor, and this makes reproducible, longitudinal MRI assessment more important than ever.","html":"So, NF1-associated PN is now a medically treatable tumor, and \u003cb\u003ethis makes\u003c/b\u003e reproducible, longitudinal MRI assessment more important than \u003cb\u003eever.\u003c/b\u003e","cue":null}]},{"n":27,"title":"Malignant peripheral nerve sheath tumors (MPNST)","target":null,"items":[{"text":"But even with these new treatment options, there is one thing we really need to watch for: malignant transformation.","html":"\u003cb\u003eBut even with these new treatment options, there is one thing we really need to watch\u003c/b\u003e for: malignant \u003cb\u003etransformation.\u003c/b\u003e","cue":null},{"text":"Malignant peripheral nerve sheath tumor, or MPNST, is the most serious complication of NF1.","html":"Malignant peripheral nerve sheath tumor, or MPNST, is the most \u003cb\u003eserious complication\u003c/b\u003e of NF1.","cue":null},{"text":"MPNSTs are highly malignant soft-tissue sarcomas that can arise from neurofibromas.","html":"MPNSTs are highly malignant soft-tissue sarcomas that can arise from neurofibromas.","cue":null},{"text":"They are key contributors to mortality in patients with NF1.","html":"They are key contributors to mortality in patients with NF1.","cue":null}]},{"n":28,"title":"Malignant peripheral nerve sheath tumors (MPNST)","target":null,"items":[{"text":"It starts with loss of NF1 in a Schwann cell, which leads to a plexiform neurofibroma.","html":"\u003cb\u003eIt starts\u003c/b\u003e with loss of NF1 in a \u003cb\u003eSchwann cell, which leads to a plexiform\u003c/b\u003e neurofibroma.","cue":null},{"text":"Then, additional changes lead to MPNST.","html":"\u003cb\u003eThen, additional changes lead\u003c/b\u003e to MPNST.","cue":null}]},{"n":29,"title":"Malignant peripheral nerve sheath tumors (MPNST)","target":null,"items":[{"text":"The step in the middle is important — the premalignant lesion.","html":"\u003cb\u003eThe step in the middle is important\u003c/b\u003e — the premalignant lesion.","cue":null},{"text":"Its full name is atypical neurofibromatous neoplasm of uncertain biological potential, or atypical neurofibroma.","html":"\u003cb\u003eIts full name\u003c/b\u003e is atypical neurofibromatous neoplasm of uncertain biological potential, or atypical neurofibroma.","cue":null},{"text":"Atypical neurofibromas are premalignant lesions.","html":"Atypical neurofibromas are premalignant lesions.","cue":null},{"text":"After resection, they usually do not recur, and they do not metastasize.","html":"After resection, they \u003cb\u003eusually do not recur, and they do not metastasize.\u003c/b\u003e","cue":null},{"text":"MPNST is different.","html":"MPNST is \u003cb\u003edifferent.\u003c/b\u003e","cue":null},{"text":"It has a poor prognosis, with local recurrence after resection and metastasis at an early stage.","html":"\u003cb\u003eIt has a poor\u003c/b\u003e prognosis, with local recurrence after resection and metastasis at an early stage.","cue":null},{"text":"So early detection is the key — we want to find the tumor at the atypical neurofibroma stage.","html":"So early detection is the key — we \u003cb\u003ewant to find\u003c/b\u003e the tumor at the atypical neurofibroma stage.","cue":"CLICK"},{"text":"On imaging, atypical neurofibromas often appear as a distinct nodular lesion — a mass larger than 3 cm, lacking the central dot sign.","html":"On imaging, atypical neurofibromas \u003cb\u003eoften appear\u003c/b\u003e as a distinct nodular lesion — a mass \u003cb\u003elarger\u003c/b\u003e than 3 cm, lacking the central dot sign.","cue":null},{"text":"But the data are still limited, and more research is needed.","html":"\u003cb\u003eBut the data are still limited, and more research is needed.\u003c/b\u003e","cue":null}]},{"n":30,"title":"Malignant vs. Benign nerve sheath tumors","target":null,"items":[{"text":"So, how can imaging tell benign from malignant?","html":"\u003cb\u003eSo, how can imaging tell\u003c/b\u003e benign from malignant?","cue":null},{"text":"This meta-analysis includes nerve sheath tumors in general.","html":"\u003cb\u003eThis meta-analysis includes\u003c/b\u003e nerve sheath tumors in \u003cb\u003egeneral.\u003c/b\u003e","cue":null},{"text":"Ill-defined margins and perilesional edema are highly specific for malignancy, and loss of the target sign is very sensitive.","html":"\u003cb\u003eIll-defined margins and perilesional edema are highly specific for malignancy, and loss of the target sign is very sensitive.\u003c/b\u003e","cue":null},{"text":"A size over 5 cm is also a warning sign.","html":"\u003cb\u003eA size over 5 cm is also a warning sign.\u003c/b\u003e","cue":null},{"text":"In this NF1 patient, the MPNST shows peritumoral infiltration — it spreads into the surrounding tissue.","html":"\u003cb\u003eIn this\u003c/b\u003e NF1 patient, the \u003cb\u003eMPNST shows\u003c/b\u003e peritumoral infiltration — it \u003cb\u003espreads into the surrounding tissue.\u003c/b\u003e","cue":"point to the case"}]},{"n":31,"title":"MPNST vs. BPNST","target":null,"items":[{"text":"But NF1 is different.","html":"But NF1 is \u003cb\u003edifferent.\u003c/b\u003e","cue":null},{"text":"These patients have many plexiform neurofibromas, and even benign ones can be large and heterogeneous.","html":"These patients have \u003cb\u003emany plexiform neurofibromas, and even benign ones can be large and heterogeneous.\u003c/b\u003e","cue":null},{"text":"So in this NF1 study, shape, margin, and target sign were much less reliable — the AUCs were only about 0.5.","html":"\u003cb\u003eSo in this\u003c/b\u003e NF1 \u003cb\u003estudy, shape, margin, and target sign were much less reliable — the AUCs were only about 0.5.\u003c/b\u003e","cue":null},{"text":"In contrast, ADC worked very well, with AUCs of 0.97 to 0.98.","html":"\u003cb\u003eIn contrast, ADC worked very well, with AUCs of 0.97 to 0.98.\u003c/b\u003e","cue":null},{"text":"So in NF1, DWI is the key.","html":"So in NF1, \u003cb\u003eDWI is the key.\u003c/b\u003e","cue":null}]},{"n":32,"title":"Malignant vs. Benign nerve sheath tumors","target":null,"items":[{"text":"In one study that included atypical neurofibromas, the ADC decreased step by step — from benign neurofibromas, to atypical neurofibromas, and then to MPNST.","html":"\u003cb\u003eIn one study that included atypical neurofibromas, the ADC decreased step by step\u003c/b\u003e — from benign \u003cb\u003eneurofibromas, to atypical neurofibromas,\u003c/b\u003e and then to MPNST.","cue":null},{"text":"ADC also showed pretty good diagnostic performance in distinguishing atypical neurofibromas and MPNSTs from benign neurofibromas.","html":"\u003cb\u003eADC also showed pretty good diagnostic performance in distinguishing atypical neurofibromas\u003c/b\u003e and MPNSTs from benign \u003cb\u003eneurofibromas.\u003c/b\u003e","cue":null},{"text":"So, a low ADC in a nodule within a plexiform neurofibroma should raise concern.","html":"\u003cb\u003eSo, a low ADC in a nodule within a plexiform neurofibroma should raise concern.\u003c/b\u003e","cue":null}]},{"n":33,"title":"Malignant vs. Benign nerve sheath tumors","target":null,"items":[{"text":"Other imaging techniques can also help.","html":"Other imaging \u003cb\u003etechniques can also help.\u003c/b\u003e","cue":null},{"text":"On perfusion MRI, early arterial enhancement favors MPNST.","html":"On perfusion MRI, early arterial enhancement \u003cb\u003efavors MPNST.\u003c/b\u003e","cue":null},{"text":"On PET-CT, an SUVmax of 3.5 or higher can be used as a threshold for biopsy.","html":"On PET-CT, an SUVmax of \u003cb\u003e3.5 or higher can be used as a threshold\u003c/b\u003e for biopsy.","cue":null},{"text":"But clinical signs are actually very important.","html":"But clinical signs are actually very \u003cb\u003eimportant.\u003c/b\u003e","cue":"CLICK"},{"text":"Watch for these red flags: a painful PN; rapid growth, a new hard texture; and a new or unexplained neurologic deficit associated with a neurofibroma.","html":"\u003cb\u003eWatch for these red flags:\u003c/b\u003e a painful PN; rapid growth, a new hard texture; and a new or unexplained neurologic deficit associated with a neurofibroma.","cue":null},{"text":"Often, these symptoms are the first clue to MPNST.","html":"\u003cb\u003eOften, these symptoms are the first clue to MPNST.\u003c/b\u003e","cue":null},{"text":"So when you see them in the clinical history, look very carefully.","html":"\u003cb\u003eSo when you see\u003c/b\u003e them in the clinical \u003cb\u003ehistory, look very carefully.\u003c/b\u003e","cue":null}]},{"n":34,"title":"21/M Pelvic pain","target":null,"items":[{"text":"Let me show you a case.","html":"\u003cb\u003eLet me show you a case.\u003c/b\u003e","cue":null},{"text":"This is a 21-year-old man with NF1 and pelvic pain.","html":"\u003cb\u003eThis is a 21-year-old man with NF1\u003c/b\u003e and pelvic pain.","cue":null},{"text":"He had many plexiform neurofibromas along the spinal nerves and the peripheral nerves of the lower extremities.","html":"\u003cb\u003eHe had many plexiform neurofibromas along the spinal\u003c/b\u003e nerves and the peripheral nerves of the \u003cb\u003elower extremities.\u003c/b\u003e","cue":null},{"text":"But in the pelvis, there was one large mass, about 12 cm — much bigger than the other lesions.","html":"\u003cb\u003eBut in the pelvis, there was one large\u003c/b\u003e mass, about 12 cm — \u003cb\u003emuch bigger than the other lesions.\u003c/b\u003e","cue":null},{"text":"On T2, it was heterogeneous, and it showed heterogeneous enhancement.","html":"On T2, it was \u003cb\u003eheterogeneous, and it showed heterogeneous enhancement.\u003c/b\u003e","cue":null},{"text":"This is different from the other small plexiform neurofibromas, which showed homogeneous bright T2 signal and no obvious enhancement.","html":"\u003cb\u003eThis is different from the other small plexiform neurofibromas, which showed homogeneous bright\u003c/b\u003e T2 \u003cb\u003esignal and no obvious enhancement.\u003c/b\u003e","cue":null},{"text":"On DWI and the ADC map, part of the mass showed diffusion restriction.","html":"On DWI and the ADC \u003cb\u003emap, part\u003c/b\u003e of the mass \u003cb\u003eshowed diffusion restriction.\u003c/b\u003e","cue":"CLICK"},{"text":"And PET-CT showed high FDG uptake in the same area.","html":"\u003cb\u003eAnd PET-CT showed high FDG uptake in the same area.\u003c/b\u003e","cue":null},{"text":"All of these findings suggested MPNST.","html":"\u003cb\u003eAll of these findings suggested MPNST.\u003c/b\u003e","cue":null},{"text":"He had surgery. [CLICK]","html":"\u003cb\u003eHe had surgery.\u003c/b\u003e \u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e","cue":"CLICK"},{"text":"Unfortunately, the tumor came back just 4 months later, and he passed away.","html":"\u003cb\u003eUnfortunately,\u003c/b\u003e the tumor \u003cb\u003ecame back\u003c/b\u003e just 4 months later, and he \u003cb\u003epassed away.\u003c/b\u003e","cue":null},{"text":"This case shows two things.","html":"\u003cb\u003eThis case shows two things.\u003c/b\u003e","cue":null},{"text":"First, to diagnose MPNST, we need both conventional MRI and functional imaging, like DWI and PET-CT.","html":"\u003cb\u003eFirst, to diagnose MPNST, we need both conventional MRI and functional imaging,\u003c/b\u003e like DWI and \u003cb\u003ePET-CT.\u003c/b\u003e","cue":null},{"text":"Second, it shows how poor the prognosis of MPNST is.","html":"\u003cb\u003eSecond, it shows how poor the prognosis of MPNST is.\u003c/b\u003e","cue":null}]},{"n":35,"title":"28/F","target":null,"items":[{"text":"Here is another case — a 28-year-old woman with NF1.","html":"\u003cb\u003eHere is another case — a 28-year-old woman with NF1.\u003c/b\u003e","cue":null},{"text":"There is a 7 cm localized intraneural neurofibroma in the popliteal fossa.","html":"There is a 7 cm localized intraneural neurofibroma in the \u003cb\u003epopliteal fossa.\u003c/b\u003e","cue":null},{"text":"It is quite large.","html":"\u003cb\u003eIt is quite large.\u003c/b\u003e","cue":null},{"text":"The DWI findings were equivocal.","html":"The DWI \u003cb\u003efindings were equivocal.\u003c/b\u003e","cue":null},{"text":"It was excised, and the pathology was atypical neurofibroma.","html":"\u003cb\u003eIt was excised, and the pathology\u003c/b\u003e was atypical neurofibroma.","cue":null},{"text":"This case shows that the ADC of an atypical neurofibroma is not as low as that of an MPNST.","html":"\u003cb\u003eThis case shows\u003c/b\u003e that the ADC of an atypical neurofibroma is not as \u003cb\u003elow as that of an MPNST.\u003c/b\u003e","cue":null},{"text":"So the diagnosis is not easy.","html":"\u003cb\u003eSo the diagnosis is not easy.\u003c/b\u003e","cue":null},{"text":"In my opinion, if the lesion is large and symptomatic, and it can be removed, it is better to remove it.","html":"\u003cb\u003eIn my opinion,\u003c/b\u003e if the lesion is \u003cb\u003elarge and symptomatic, and it can be removed, it is better to remove it.\u003c/b\u003e","cue":null}]},{"n":36,"title":"Radiologic manifestations","target":null,"items":[{"text":"So far, we have covered neurofibromas and MPNST.","html":"\u003cb\u003eSo far, we have covered\u003c/b\u003e neurofibromas and MPNST.","cue":null},{"text":"Next, let\u0027s look at the central nervous system.","html":"\u003cb\u003eNext, let\u0026#39;s look at the central nervous system.\u003c/b\u003e","cue":null}]},{"n":37,"title":"Optic pathway glioma","target":null,"items":[{"text":"Optic pathway glioma is the most common CNS tumor in NF1.","html":"Optic pathway glioma is the most common CNS tumor in NF1.","cue":null},{"text":"Most occur in children under 7, and most are pilocytic (파일로시틱) astrocytomas.","html":"\u003cb\u003eMost occur\u003c/b\u003e in children under 7, and most are pilocytic \u003cspan class=\u0027ko\u0027\u003e(파일로시틱)\u003c/span\u003e astrocytomas.","cue":null},{"text":"About half of the patients have symptoms, mainly vision problems.","html":"\u003cb\u003eAbout half of the patients have symptoms, mainly vision problems.\u003c/b\u003e","cue":null},{"text":"Chemotherapy is given when there is visual loss.","html":"Chemotherapy is \u003cb\u003egiven\u003c/b\u003e when there is visual loss.","cue":null},{"text":"Even if the tumor is found on imaging, we may not treat it if the patient has no symptoms.","html":"Even if the tumor is \u003cb\u003efound on imaging, we may not treat it if the patient has no symptoms.\u003c/b\u003e","cue":null}]},{"n":38,"title":"Optic pathway glioma","target":null,"items":[{"text":"Optic pathway gliomas can occur anywhere along the optic pathway — the optic nerves, the chiasm, the optic tracts, and the optic radiations.","html":"Optic pathway gliomas can \u003cb\u003eoccur\u003c/b\u003e anywhere along the optic pathway — the optic nerves, the chiasm, the optic tracts, and the optic radiations.","cue":null},{"text":"Here, the optic nerve shows tubular thickening with enhancement.","html":"Here, the optic nerve \u003cb\u003eshows\u003c/b\u003e tubular thickening with enhancement.","cue":"point to the first image"},{"text":"Here, there is a suprasellar tumor at the chiasm.","html":"Here, there is a suprasellar tumor at the chiasm.","cue":"point to the second and third images"},{"text":"It is hyperintense on T2, and it enhances after contrast.","html":"It is hyperintense on \u003cb\u003eT2, and it enhances after contrast.\u003c/b\u003e","cue":null},{"text":"And here, the tumor extends along the optic tract and radiation — you can see high signal on FLAIR.","html":"And here, the tumor \u003cb\u003eextends\u003c/b\u003e along the optic tract and radiation — you can \u003cb\u003esee high signal on FLAIR.\u003c/b\u003e","cue":"point to the last image"},{"text":"The enhancement is variable.","html":"The enhancement is variable.","cue":null},{"text":"And in NF1, they are usually less aggressive than in children without NF1.","html":"And in NF1, they are usually less aggressive than in children without NF1.","cue":null}]},{"n":39,"title":"3yr","target":null,"items":[{"text":"Here are two patients with suspected optic pathway glioma.","html":"\u003cb\u003eHere are two patients with suspected optic pathway glioma.\u003c/b\u003e","cue":null},{"text":"This 3-year-old girl had enhancing thickening of the right optic tract.","html":"\u003cb\u003eThis 3-year-old girl had enhancing thickening of the right optic tract.\u003c/b\u003e","cue":"point to the left"},{"text":"And this 6-year-old girl had a similar finding in the left optic nerve.","html":"\u003cb\u003eAnd this 6-year-old girl had a similar finding in the left optic nerve.\u003c/b\u003e","cue":"point to the right"},{"text":"They were just followed because they didn’t have any clinical symptoms.","html":"\u003cb\u003eThey were just followed because they didn’t have any clinical symptoms.\u003c/b\u003e","cue":null},{"text":"On follow-up three years later, the enhancement disappeared in the first patient.","html":"\u003cb\u003eOn follow-up three years later, the enhancement disappeared in the first patient.\u003c/b\u003e","cue":"CLICK"},{"text":"And six years later, both the thickening and enhancement disappeared in the second patient.","html":"\u003cb\u003eAnd six years later, both the thickening and enhancement disappeared in the second patient.\u003c/b\u003e","cue":null},{"text":"So, optic pathway gliomas in NF1 can regress on their own.","html":"\u003cb\u003eSo, optic pathway gliomas in NF1 can regress on their own.\u003c/b\u003e","cue":null},{"text":"That’s why imaging findings alone are not necessarily a reason to treat.","html":"\u003cb\u003eThat’s why imaging findings alone are not necessarily a reason to treat.\u003c/b\u003e","cue":null}]},{"n":40,"title":"Focal areas of signal intensity (FASIs)","target":null,"items":[{"text":"Next, let’s talk about FASIs — focal areas of signal intensity.","html":"\u003cb\u003eNext, let’s talk\u003c/b\u003e about FASIs — focal areas of signal intensity.","cue":null},{"text":"They are seen in about 70% of patients with NF1.","html":"\u003cb\u003eThey are seen\u003c/b\u003e in about 70% of \u003cb\u003epatients\u003c/b\u003e with NF1.","cue":null},{"text":"Pathologically, they represent myelin vacuolization, meaning small fluid-filled vacuoles within the myelin.","html":"\u003cb\u003ePathologically, they represent\u003c/b\u003e myelin vacuolization, \u003cb\u003emeaning small fluid-filled vacuoles within\u003c/b\u003e the myelin.","cue":null},{"text":"They change in number and size over time.","html":"They change in number and size over \u003cb\u003etime.\u003c/b\u003e","cue":null},{"text":"They typically appear by around age 3 and usually disappear by late adolescence.","html":"\u003cb\u003eThey typically appear by around\u003c/b\u003e age 3 and \u003cb\u003eusually disappear\u003c/b\u003e by late adolescence.","cue":null},{"text":"On MRI, FASIs are commonly found in the basal ganglia, thalami, cerebellum, and brainstem.","html":"\u003cb\u003eOn MRI,\u003c/b\u003e FASIs are \u003cb\u003ecommonly found\u003c/b\u003e in the basal ganglia, thalami, cerebellum, and brainstem.","cue":"Point to the upper image"},{"text":"They are bright on T2 and FLAIR, like you see here, and iso- to mildly hyperintense on T1.","html":"\u003cb\u003eThey are bright on T2\u003c/b\u003e and FLAIR, like you \u003cb\u003esee here, and iso- to mildly hyperintense on T1.\u003c/b\u003e","cue":null},{"text":"They often have slightly ill-defined margins.","html":"\u003cb\u003eThey often have slightly ill-defined margins.\u003c/b\u003e","cue":null},{"text":"They look like a thumbprint with blurry edges.","html":"\u003cb\u003eThey look like a thumbprint with blurry edges.\u003c/b\u003e","cue":null},{"text":"And the most important point is this: there should be no enhancement and no mass effect.","html":"\u003cb\u003eAnd the most important point is this:\u003c/b\u003e there should be no enhancement and no mass effect.","cue":null}]},{"n":41,"title":"Non–Optic Pathway Intracranial Gliomas","target":null,"items":[{"text":"Next, non-optic pathway gliomas are less common, occurring in about 1 to 2% of patients with NF1.","html":"\u003cb\u003eNext,\u003c/b\u003e non-optic pathway gliomas are \u003cb\u003eless common, occurring\u003c/b\u003e in about 1 to 2% of patients with NF1.","cue":null},{"text":"Most are low-grade gliomas, usually pilocytic astrocytomas, and tend to have an indolent course.","html":"Most are low-grade gliomas, \u003cb\u003eusually\u003c/b\u003e pilocytic astrocytomas, and \u003cb\u003etend\u003c/b\u003e to have an indolent course.","cue":null},{"text":"It involves Brainstem or posterior fossa.","html":"\u003cb\u003eIt involves\u003c/b\u003e Brainstem or posterior fossa.","cue":null},{"text":"This is a 37-year-old man with a small lesion in the left thalamus.","html":"\u003cb\u003eThis is a 37-year-old man with a small lesion in the left thalamus.\u003c/b\u003e","cue":null},{"text":"It is bright on FLAIR and clearly low signal on T1.","html":"\u003cb\u003eIt is bright on FLAIR and clearly\u003c/b\u003e low \u003cb\u003esignal on T1.\u003c/b\u003e","cue":null},{"text":"Compared with a typical FASI, the margins are much sharper, and the lesion is much more conspicuous on T1 because of its low signal.","html":"\u003cb\u003eCompared with a typical FASI,\u003c/b\u003e the margins are \u003cb\u003emuch sharper, and the lesion is much more conspicuous on T1\u003c/b\u003e because of its low \u003cb\u003esignal.\u003c/b\u003e","cue":null},{"text":"These features can help us distinguish a glioma from a typical FASI.","html":"\u003cb\u003eThese features can help us distinguish\u003c/b\u003e a glioma from a \u003cb\u003etypical FASI.\u003c/b\u003e","cue":null},{"text":"Also, unlike FASIs, gliomas can enhance, although this particular lesion does not.","html":"\u003cb\u003eAlso, unlike FASIs,\u003c/b\u003e gliomas can \u003cb\u003eenhance, although this particular lesion does not.\u003c/b\u003e","cue":null},{"text":"They can also have mass effect.","html":"They can also have mass effect.","cue":null}]},{"n":42,"title":"Non–Optic Pathway Intracranial Gliomas","target":null,"items":[{"text":"Here is an 11-year-old boy who presented with right arm weakness.","html":"\u003cb\u003eHere is an 11-year-old boy who presented\u003c/b\u003e with right \u003cb\u003earm\u003c/b\u003e weakness.","cue":null},{"text":"There is a large, well-defined mass in the left thalamus.","html":"\u003cb\u003eThere is a large, well-defined mass in the left thalamus.\u003c/b\u003e","cue":null},{"text":"It shows heterogeneously high T2 signal, heterogeneous enhancement, and significant mass effect.","html":"\u003cb\u003eIt shows heterogeneously high T2 signal, heterogeneous enhancement, and significant mass effect.\u003c/b\u003e","cue":null},{"text":"Biopsy confirmed a pilocytic astrocytoma.","html":"\u003cb\u003eBiopsy confirmed\u003c/b\u003e a pilocytic astrocytoma.","cue":null},{"text":"Now, compare that with this FASI in the globus pallidus.","html":"\u003cb\u003eNow, compare that with this FASI in the globus pallidus.\u003c/b\u003e","cue":"Click"},{"text":"The FASI looks more blurry and ill-defined, while the tumor has much sharper margins and more obvious signal abnormality.","html":"\u003cb\u003eThe FASI looks more blurry and ill-defined, while the tumor has much sharper margins and more obvious signal abnormality.\u003c/b\u003e","cue":null},{"text":"So, you can clearly see the difference between a glioma and a typical FASI in the same patient.","html":"\u003cb\u003eSo, you can clearly see the difference between\u003c/b\u003e a glioma and a \u003cb\u003etypical FASI in the same patient.\u003c/b\u003e","cue":null}]},{"n":43,"title":"Non–Optic Pathway Intracranial Gliomas","target":null,"items":[{"text":"High-grade gliomas are rare in NF1.","html":"High-grade gliomas are rare in \u003cb\u003eNF1.\u003c/b\u003e","cue":null},{"text":"They occur more commonly in adults and tend to grow rapidly.","html":"\u003cb\u003eThey occur more commonly in adults and tend to grow rapidly.\u003c/b\u003e","cue":null},{"text":"They also tend to involve the cerebral hemispheres, unlike typical FASIs or low-grade gliomas.","html":"\u003cb\u003eThey also tend to involve\u003c/b\u003e the cerebral hemispheres, \u003cb\u003eunlike typical FASIs or low-grade\u003c/b\u003e gliomas.","cue":null},{"text":"Here we have a 14-year-old boy.","html":"\u003cb\u003eHere we have a 14-year-old boy.\u003c/b\u003e","cue":"Point to the images from left to right"},{"text":"His initial MRI was normal.","html":"\u003cb\u003eHis initial MRI was normal.\u003c/b\u003e","cue":null},{"text":"One year later, a small FLAIR-high signal lesion appeared in the left cerebral hemisphere.","html":"\u003cb\u003eOne year later, a small FLAIR-high signal lesion appeared in the left\u003c/b\u003e cerebral hemisphere.","cue":null},{"text":"The following year, it had grown slightly.","html":"\u003cb\u003eThe following year, it had grown slightly.\u003c/b\u003e","cue":null},{"text":"Then, just four months later, it showed rapid growth with hemorrhage.","html":"\u003cb\u003eThen, just four months later, it showed\u003c/b\u003e rapid growth with \u003cb\u003ehemorrhage.\u003c/b\u003e","cue":null},{"text":"It was confirmed to be a glioblastoma.","html":"\u003cb\u003eIt was confirmed\u003c/b\u003e to be a glioblastoma.","cue":null},{"text":"So, if you see a new lesion in the cerebral hemisphere that continues to grow, don\u0027t assume it is a FASI.","html":"\u003cb\u003eSo, if you see a new lesion\u003c/b\u003e in the cerebral hemisphere that \u003cb\u003econtinues to grow, don\u0026#39;t assume it is a FASI.\u003c/b\u003e","cue":null},{"text":"It needs close follow-up.","html":"\u003cb\u003eIt needs close follow-up.\u003c/b\u003e","cue":null}]},{"n":44,"title":"Radiologic manifestations","target":1800,"items":[{"text":"Next, part three: bone dysplasia, vasculopathy, dural ectasia, and scoliosis.","html":"\u003cb\u003eNext,\u003c/b\u003e part \u003cb\u003ethree:\u003c/b\u003e bone dysplasia, vasculopathy, dural ectasia, and scoliosis.","cue":null},{"text":"They share one cause: mesodermal (메소더멀) dysplasia — abnormal development of the tissues that form bones, connective tissues, and blood vessels.","html":"\u003cb\u003eThey share one cause:\u003c/b\u003e mesodermal \u003cspan class=\u0027ko\u0027\u003e(메소더멀)\u003c/span\u003e dysplasia — abnormal development of the tissues that form bones, connective tissues, and blood vessels.","cue":"CLICK"}]},{"n":45,"title":"Bone dysplasia","target":null,"items":[{"text":"Bone dysplasia is one of the diagnostic features of NF1.","html":"Bone dysplasia is one of the \u003cb\u003ediagnostic features of NF1.\u003c/b\u003e","cue":null},{"text":"It can result from primary mesodermal dysplasia, and the bony abnormalities can be further worsened by pressure from adjacent neurofibromas.","html":"\u003cb\u003eIt can result from primary\u003c/b\u003e mesodermal dysplasia, and the \u003cb\u003ebony abnormalities can be further worsened\u003c/b\u003e by pressure from \u003cb\u003eadjacent\u003c/b\u003e neurofibromas.","cue":null},{"text":"Sphenoid wing dysplasia is a very classic finding in NF1.","html":"Sphenoid wing dysplasia is a very \u003cb\u003eclassic finding in NF1.\u003c/b\u003e","cue":null},{"text":"In this patient, the right sphenoid wing is essentially absent, resulting in proptosis of the right eye.","html":"\u003cb\u003eIn this patient, the right\u003c/b\u003e sphenoid wing is \u003cb\u003eessentially absent, resulting in proptosis of the right eye.\u003c/b\u003e","cue":null},{"text":"This is a very typical appearance of sphenoid wing dysplasia.","html":"\u003cb\u003eThis is a very typical appearance\u003c/b\u003e of sphenoid wing dysplasia.","cue":null},{"text":"NF1 can also cause calvarial defects, like you see here.","html":"\u003cb\u003eNF1 can also cause\u003c/b\u003e calvarial defects, like you \u003cb\u003esee here.\u003c/b\u003e","cue":null},{"text":"And here, we have paraspinal plexiform neurofibromas.","html":"\u003cb\u003eAnd here, we have paraspinal plexiform\u003c/b\u003e neurofibromas.","cue":null},{"text":"The underlying bones are already dysplastic, and the adjacent plexiform neurofibromas can cause additional extrinsic pressure and bony remodeling.","html":"\u003cb\u003eThe underlying\u003c/b\u003e bones are \u003cb\u003ealready dysplastic, and the adjacent plexiform\u003c/b\u003e neurofibromas can \u003cb\u003ecause additional\u003c/b\u003e extrinsic pressure and \u003cb\u003ebony remodeling.\u003c/b\u003e","cue":null},{"text":"As a result, the pedicles and laminae become thin and irregular, and the neural foramina can become enlarged.","html":"\u003cb\u003eAs a result,\u003c/b\u003e the pedicles and laminae \u003cb\u003ebecome thin and irregular,\u003c/b\u003e and the neural \u003cb\u003eforamina can become enlarged.\u003c/b\u003e","cue":null}]},{"n":46,"title":"1/F","target":null,"items":[{"text":"Long bone bowing and pseudarthrosis are also typical skeletal manifestations of NF1 and are included in the diagnostic criteria.","html":"\u003cb\u003eLong bone\u003c/b\u003e bowing and pseudarthrosis are also \u003cb\u003etypical skeletal manifestations of NF1 and are included in the diagnostic criteria.\u003c/b\u003e","cue":null},{"text":"This is a 1-year-old girl with anterolateral bowing of the tibia and fibula.","html":"\u003cb\u003eThis is a 1-year-old girl with anterolateral\u003c/b\u003e bowing of the \u003cb\u003etibia and fibula.\u003c/b\u003e","cue":"Point to the left images"},{"text":"At age 2, she developed a fibular fracture.","html":"\u003cb\u003eAt age\u003c/b\u003e 2, she \u003cb\u003edeveloped a fibular\u003c/b\u003e fracture.","cue":"Click"},{"text":"And by age 5, it had progressed to pseudarthrosis — basically, the fracture failed to heal.","html":"\u003cb\u003eAnd by age\u003c/b\u003e 5, it had \u003cb\u003eprogressed\u003c/b\u003e to pseudarthrosis — \u003cb\u003ebasically,\u003c/b\u003e the fracture \u003cb\u003efailed to heal.\u003c/b\u003e","cue":null},{"text":"One important tip: if you see anterolateral tibial bowing in a young child, always think of NF1.","html":"\u003cb\u003eOne important tip: if you see anterolateral tibial\u003c/b\u003e bowing in a \u003cb\u003eyoung child, always think of NF1.\u003c/b\u003e","cue":null}]},{"n":47,"title":"Vasculopathy","target":null,"items":[{"text":"Next, vasculopathy.","html":"\u003cb\u003eNext,\u003c/b\u003e vasculopathy.","cue":null},{"text":"This is also related to mesodermal dysplasia involving the arterial wall.","html":"\u003cb\u003eThis is also related\u003c/b\u003e to mesodermal dysplasia \u003cb\u003einvolving\u003c/b\u003e the arterial \u003cb\u003ewall.\u003c/b\u003e","cue":null},{"text":"In this 9-year-old girl, the normal flow void of the left MCA is lost on T2, and MRA shows narrowing of the artery.","html":"\u003cb\u003eIn this 9-year-old girl,\u003c/b\u003e the normal \u003cb\u003eflow\u003c/b\u003e void of the \u003cb\u003eleft MCA is lost on T2, and MRA shows\u003c/b\u003e narrowing of the artery.","cue":"Point to the left case"},{"text":"In this 19-year-old woman, there is an abnormally large flow void in the neck, corresponding to an aneurysm of the left internal carotid artery.","html":"\u003cb\u003eIn this 19-year-old woman,\u003c/b\u003e there is an abnormally \u003cb\u003elarge flow\u003c/b\u003e void in the \u003cb\u003eneck, corresponding\u003c/b\u003e to an aneurysm of the \u003cb\u003eleft internal carotid\u003c/b\u003e artery.","cue":"Point to the right case"},{"text":"So, when you look at a T2-weighted image, always check the flow voids.","html":"\u003cb\u003eSo, when you look at a T2-weighted image, always check the flow\u003c/b\u003e voids.","cue":null},{"text":"They can be lost because of narrowing, or enlarged because of aneurysmal dilatation.","html":"\u003cb\u003eThey can be lost\u003c/b\u003e because of narrowing, or enlarged because of \u003cb\u003eaneurysmal dilatation.\u003c/b\u003e","cue":null},{"text":"NF1 vasculopathy can also involve the renal arteries and the aorta.","html":"\u003cb\u003eNF1\u003c/b\u003e vasculopathy can also \u003cb\u003einvolve\u003c/b\u003e the renal \u003cb\u003earteries\u003c/b\u003e and the aorta.","cue":null}]},{"n":48,"title":"Vasculopathy","target":null,"items":[{"text":"Here is another case — a 13-year-old girl.","html":"\u003cb\u003eHere is another case — a 13-year-old girl.\u003c/b\u003e","cue":null},{"text":"On the coronal T2 image, the normal flow void of the left MCA is difficult to see.","html":"\u003cb\u003eOn the coronal\u003c/b\u003e T2 \u003cb\u003eimage, the normal\u003c/b\u003e flow void of the \u003cb\u003eleft MCA is difficult to see.\u003c/b\u003e","cue":"Point to the first image"},{"text":"On FLAIR, there is tissue loss and abnormal signal in the left parietotemporal (퍼라이어토템퍼럴)lobe, consistent with chronic ischemic change.","html":"\u003cb\u003eOn FLAIR, there is tissue loss and abnormal signal in the left parietotemporal\u003c/b\u003e \u003cspan class=\u0027ko\u002
