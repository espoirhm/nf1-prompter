<style>
/* Layout: one-screen stage — slide bar on top, the current slide's script in the middle (current sentence large), controls at the bottom. Dark stage by default, light for rehearsal. */
:root {
  --stage: #0f1415;        /* hall-dark ground, slight teal bias */
  --panel: #182022;
  --line: #2a3537;
  --ink: #f2f6f5;          /* current sentence */
  --ink-dim: #7f8f8e;      /* read / upcoming */
  --must: #ffc861;         /* bold = not on the slide */
  --teal: #19a6a3;         /* deck teal: cues, progress */
  --teal-ink: #04201f;
  --btn: #26343a;          /* control buttons */
  --rec: #ff5a4f;          /* microphone live */
  --warn: #ff8a7a;
  --f-read: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --size: 34px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --stage: #f7f9f9; --panel: #ffffff; --line: #d7e0e0;
  --ink: #0d1718; --ink-dim: #8a9898; --must: #9a5b00;
  --teal: #007f7d; --teal-ink: #ffffff; --warn: #b3261e; --btn: #e4ecec; --rec: #c62828;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--stage); color: var(--ink); font-family: var(--f-read); margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto; grid-template-areas: "bar" "mic" "stage" "ctrl"; }
.bar { grid-area: bar; } #stage { grid-area: stage; } .ctrl { grid-area: ctrl; } .micline { grid-area: mic; }
.micline { display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.micline #mic { min-height: 36px; padding: 4px 12px; font-size: 14px; white-space: nowrap; color: var(--ink-dim); }
.micline #mic.live { color: var(--rec); border-color: var(--rec); }
.micline #heard { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }

/* 3-line "karaoke" view: previous / current / next, same size, current in yellow */
.k3 #stage { display: block; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: auto; padding-block: 12px; }
.k3 .col { width: 100%; gap: 0.9em; }
.k3 .histbox { display: flex; flex-direction: column; gap: 0.5em; padding-top: 4px; }
.k3 .s.hist { font-size: calc(var(--size) * 0.7); line-height: 1.4; color: var(--ink-dim); opacity: .7; transition: none; }
.k3 .s.hist b { color: inherit; }
.k3 .histtag { font-family: var(--f-mono); font-size: 12px; color: var(--teal); opacity: .85; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k3 #hist { padding-bottom: 12px; }     /* keeps the extra lines just out of sight while the three lines are shown */
.k3 #ahead { padding-top: 12px; padding-bottom: 8px; }
.k3 .core { display: flex; flex-direction: column; justify-content: center; }
.k3 .coreIn { display: flex; flex-direction: column; gap: 0.9em; }
.k3 .s, .k3 .s.cur { font-size: calc(var(--size) * 0.8 * var(--k3s, 1)); line-height: 1.45; transition: none; }
.k3 .s { color: var(--ink-dim); opacity: .75; }
.k3 .s.cur { color: var(--must); opacity: 1; }
.k3 .s.cur b { color: var(--must); }
.k3 .s .ko { font-size: .7em; }
.k3 .nexttag { font-family: var(--f-mono); font-size: 12px; color: var(--teal); display: block; margin-bottom: 2px; }
.k3 .next { display: none; }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.slideno { font-family: var(--f-mono); font-size: 15px; color: var(--teal); white-space: nowrap; }
.slidetitle { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { font-family: var(--f-mono); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.clock .tgt { color: var(--ink-dim); }
.clock.late .now { color: var(--warn); }
.thumb { height: 54px; aspect-ratio: 16 / 9; border-radius: 4px; border: 1px solid var(--line); object-fit: cover; background: #000; flex: none; }
.thumb[hidden] { display: none !important; }

/* stage */
#stage { position: relative; overflow-y: auto; padding: 24px 16px 60vh; scroll-behavior: smooth; min-height: 0; }
.col { max-width: 30em; margin: 0 auto; display: flex; flex-direction: column; gap: 0.7em; }
.s { font-size: calc(var(--size) * 0.62); line-height: 1.4; color: var(--ink-dim); transition: color .2s, font-size .2s; cursor: pointer; }
.s b { font-weight: 700; color: inherit; }
.s.cur { font-size: var(--size); color: var(--ink); line-height: 1.32; }
.s.cur b { color: var(--must); }
.s.done { opacity: .55; }
.s .q { font-style: italic; color: var(--teal); font-size: .8em; }
.s .ko { color: var(--ink-dim); font-size: .62em; }
.cue { align-self: flex-start; font-family: var(--f-mono); font-size: calc(var(--size) * 0.5); background: var(--teal); color: var(--teal-ink); padding: .12em .6em; border-radius: 999px; letter-spacing: .04em; }
.cue.dim { background: transparent; color: var(--teal); border: 1px solid var(--teal); }
.cue.flash { animation: flash 1s ease-out 2; }
@keyframes flash { 50% { transform: scale(1.12); } }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: .3em; }
.meter i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .25s linear; }
.next { margin-top: 1.6em; padding-top: 1em; border-top: 1px dashed var(--line); color: var(--ink-dim); font-size: 15px; }
.next strong { color: var(--ink); }

/* controls */
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 2px solid var(--teal); }
.ctrl .grow { flex: 1; }
.ctrl .main { display: flex; gap: 8px; align-items: center; }
.ctrl .extra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#more { display: none; }
button { font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); background: var(--btn); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 44px; }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
button.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 700; min-width: 5.5em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--teal); color: var(--teal-ink); }
.wpm { font-family: var(--f-mono); font-size: 14px; color: var(--ink-dim); white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--teal); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); }
.status { font-size: 13px; color: var(--ink-dim); white-space: nowrap; }
.status.on { color: var(--teal); }

/* slide list */
#list { position: fixed; inset: 0; background: var(--stage); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px; }
#list h2 { font-size: 18px; margin: 0 0 12px; }
#list ol { list-style: none; margin: 0; padding: 0; max-width: 40em; }
#list li button { width: 100%; text-align: left; display: flex; gap: 12px; align-items: baseline; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
#list .n { font-family: var(--f-mono); color: var(--teal); min-width: 2.5em; }
#list .t { flex: 1; min-width: 0; }
#list .m { font-family: var(--f-mono); color: var(--ink-dim); font-size: 13px; }

@media (max-width: 560px) {
  :root { --size: 26px; }
  /* phone: one slim header line, big thumb-friendly controls, extras behind 설정 */
  .bar { gap: 8px; padding: calc(6px + env(safe-area-inset-top, 0px)) 12px 6px; }
  .thumb { display: none; }
  .slideno, .clock { font-size: 13px; }
  .slidetitle { font-size: 13px; }
  #stage { padding-top: 10px; }
  /* phone: controls sit at the top, under the slide line, clear of Safari's bottom toolbar */
  #app { grid-template-rows: auto auto auto 1fr; grid-template-areas: "bar" "ctrl" "mic" "stage"; }
  .micline { padding: 6px 12px; }
  .ctrl { flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 12px 10px; border-top: 0; border-bottom: 2px solid var(--teal); }
  .ctrl .main { width: 100%; }
  .ctrl .main button { flex: 1; min-height: 56px; font-size: 20px; }
  .ctrl .main #go { flex: 1.4; font-size: 18px; }
  .ctrl .main #more { display: block; flex: 0.9; font-size: 15px; }
  .ctrl .extra { display: none; }
  .ctrl.open .extra { display: flex; }
  .ctrl .status { display: none; }
}
@media (prefers-reduced-motion: reduce) { #stage { scroll-behavior: auto; } .cue.flash { animation: none; } .s, .meter i { transition: none; } }
</style>

<script>
window.NF1_SCRIPT=[{"n":1,"title":"2026 MGH AM Lecture Radiologic approach to the diagnosis of …","target":null,"items":[{"text":"Good morning, everyone.","html":"\u003cb\u003eGood morning, everyone.\u003c/b\u003e","cue":null},{"text":"I’m Heemang Yoon.","html":"\u003cb\u003eI’m\u003c/b\u003e Heemang Yoon.","cue":null},{"text":"I gave a lecture last Thursday, and here I am again.","html":"\u003cb\u003eI gave\u003c/b\u003e a lecture \u003cb\u003elast Thursday,\u003c/b\u003e and here I am \u003cb\u003eagain.\u003c/b\u003e","cue":null},{"text":"As I mentioned last time, I originally planned to do an AI-related research study during this session.","html":"\u003cb\u003eAs I mentioned last time, I originally planned to do an AI-related research study during this session.\u003c/b\u003e","cue":null},{"text":"But because of some delays with the IRB, we’ll save that for another time.","html":"\u003cb\u003eBut because of some delays with the IRB, we’ll save that for another time.\u003c/b\u003e","cue":null},{"text":"So today, I have another interesting topic for you.","html":"\u003cb\u003eSo today, I have another interesting topic for you.\u003c/b\u003e","cue":null},{"text":"The title is “Radiologic Approach to the Diagnosis of Pediatric Airway and Lung Malformations.”","html":"\u003cb\u003eThe title\u003c/b\u003e is “Radiologic Approach to the Diagnosis of Pediatric Airway and Lung Malformations.”","cue":null},{"text":"If you look at these images, they’re pretty, right?","html":"\u003cb\u003eIf you look at these images, they’re pretty, right?\u003c/b\u003e","cue":null},{"text":"But at first glance, you might be wondering, “What am I looking at?”","html":"\u003cb\u003eBut at first glance, you might be wondering,\u003c/b\u003e “What am I \u003cb\u003elooking at?”\u003c/b\u003e","cue":null},{"text":"Hopefully, by the end of this lecture, you’ll be able to look at these images and make the diagnosis right away.","html":"\u003cb\u003eHopefully, by the end of this\u003c/b\u003e lecture, \u003cb\u003eyou’ll be able to look at these images and make\u003c/b\u003e the diagnosis \u003cb\u003eright away.\u003c/b\u003e","cue":null},{"text":"Okay, let’s get started.","html":"\u003cb\u003eOkay, let’s get started.\u003c/b\u003e","cue":null},{"text":"All the cases today are from Asan Medical Center in Seoul, where I worked before.","html":"All the cases \u003cb\u003etoday\u003c/b\u003e are from Asan Medical Center in Seoul, where I \u003cb\u003eworked before.\u003c/b\u003e","cue":null}]},{"n":2,"title":"Airway and lung malformations","target":null,"items":[{"text":"Here is the textbook classification of upper and lower large airway malformations.","html":"\u003cb\u003eHere is the textbook classification\u003c/b\u003e of upper and lower large airway malformations.","cue":null},{"text":"Upper airway malformations mainly involve the supraglottis and larynx.","html":"Upper airway malformations \u003cb\u003emainly involve the supraglottis and larynx.\u003c/b\u003e","cue":null},{"text":"These are often diagnosed by ENT with direct laryngoscopy, so imaging plays a relatively smaller role.","html":"\u003cb\u003eThese are often diagnosed by ENT with direct laryngoscopy, so imaging plays a relatively smaller role.\u003c/b\u003e","cue":null},{"text":"For lower large airway malformations, we have tracheal agenesis, tracheal bronchus, accessory bronchus, congenital tracheal stenosis, and tracheobronchomegaly.","html":"For lower large airway malformations, we have tracheal agenesis, tracheal bronchus, \u003cb\u003eaccessory\u003c/b\u003e bronchus, congenital tracheal stenosis, and tracheobronchomegaly.","cue":null},{"text":"And for dynamic disorders, we have tracheobronchomalacia.","html":"And for dynamic disorders, we have tracheobronchomalacia.","cue":null},{"text":"It would be great to cover all of these, but I think that would be like torturing you guys.","html":"\u003cb\u003eIt would be great to cover all of these, but I think that would be like torturing you guys.\u003c/b\u003e","cue":null},{"text":"So today, we’ll focus on just these two.","html":"\u003cb\u003eSo today, we’ll focus on just these two.\u003c/b\u003e","cue":null}]},{"n":3,"title":"Airway and lung malformations","target":null,"items":[{"text":"Here is the textbook classification of upper and lower large airway malformations.","html":"\u003cb\u003eHere is the textbook classification\u003c/b\u003e of upper and lower large airway malformations.","cue":null},{"text":"Upper airway malformations mainly involve the supraglottis and larynx.","html":"Upper airway malformations \u003cb\u003emainly involve the supraglottis and larynx.\u003c/b\u003e","cue":null},{"text":"These are often diagnosed by ENT with direct laryngoscopy, so imaging plays a relatively smaller role.","html":"\u003cb\u003eThese are often diagnosed by ENT with direct laryngoscopy, so imaging plays a relatively smaller role.\u003c/b\u003e","cue":null},{"text":"For lower large airway malformations, we have tracheal agenesis, tracheal bronchus, accessory bronchus, congenital tracheal stenosis, and tracheobronchomegaly.","html":"For lower large airway malformations, we have tracheal agenesis, tracheal bronchus, \u003cb\u003eaccessory\u003c/b\u003e bronchus, congenital tracheal stenosis, and tracheobronchomegaly.","cue":null},{"text":"And for dynamic disorders, we have tracheobronchomalacia.","html":"And for dynamic disorders, we have tracheobronchomalacia.","cue":null},{"text":"It would be great to cover all of these, but I think that would be like torturing you guys.","html":"\u003cb\u003eIt would be great to cover all of these, but I think that would be like torturing you guys.\u003c/b\u003e","cue":null},{"text":"So today, we’ll focus on just these two.","html":"\u003cb\u003eSo today, we’ll focus on just these two.\u003c/b\u003e","cue":null}]},{"n":4,"title":"Airway and lung malformations","target":null,"items":[{"text":"Now, let’s move on to congenital lung anomalies.","html":"\u003cb\u003eNow, let’s move\u003c/b\u003e on to congenital lung anomalies.","cue":null},{"text":"We can broadly divide them into parenchymal, vascular, and combined parenchymal and vascular lesions.","html":"\u003cb\u003eWe can broadly divide\u003c/b\u003e them into parenchymal, vascular, and combined parenchymal and vascular lesions.","cue":null},{"text":"Today, we’ll focus on the parenchymal lesions and pulmonary sequestration.","html":"\u003cb\u003eToday, we’ll focus\u003c/b\u003e on the parenchymal lesions and pulmonary sequestration.","cue":null}]},{"n":5,"title":"Airway and lung malformations","target":null,"items":[{"text":"Now, let’s move further down into the lung parenchyma.","html":"\u003cb\u003eNow, let’s move further down\u003c/b\u003e into the lung \u003cb\u003eparenchyma.\u003c/b\u003e","cue":null},{"text":"We can broadly divide congenital lung malformations into three groups: parenchymal lesions, vascular lesions, and combined parenchymal and vascular lesions.","html":"\u003cb\u003eWe can broadly divide\u003c/b\u003e congenital lung malformations into \u003cb\u003ethree groups:\u003c/b\u003e parenchymal lesions, vascular lesions, and combined parenchymal and vascular lesions.","cue":null},{"text":"For parenchymal lesions, we have bronchial atresia, bronchogenic cyst, congenital lobar hyperinflation, and congenital pulmonary airway malformation, or CPAM.","html":"For parenchymal lesions, we have bronchial atresia, bronchogenic cyst, congenital lobar \u003cb\u003ehyperinflation,\u003c/b\u003e and congenital pulmonary airway malformation, or \u003cb\u003eCPAM.\u003c/b\u003e","cue":null},{"text":"These are all important, and we’ll talk about them today.","html":"\u003cb\u003eThese are all important, and we’ll talk about them today.\u003c/b\u003e","cue":null},{"text":"The vascular lesions mainly include abnormalities of the pulmonary arteries and veins.","html":"The vascular lesions \u003cb\u003emainly include abnormalities\u003c/b\u003e of the pulmonary \u003cb\u003earteries\u003c/b\u003e and veins.","cue":null},{"text":"These are usually discussed more in the context of congenital heart disease, so I’m not going to cover them today.","html":"\u003cb\u003eThese are usually discussed more in the context\u003c/b\u003e of congenital \u003cb\u003eheart disease, so I’m not going to cover them today.\u003c/b\u003e","cue":null},{"text":"Then we have combined parenchymal and vascular lesions.","html":"Then we have combined parenchymal and vascular lesions.","cue":null},{"text":"The most important one here is bronchopulmonary sequestration, so we’ll definitely cover that.","html":"\u003cb\u003eThe most important\u003c/b\u003e one here is bronchopulmonary sequestration, so \u003cb\u003ewe’ll definitely cover that.\u003c/b\u003e","cue":null},{"text":"And if we have time, we’ll also briefly talk about Hypogenetic Lung Syndrome (Scimitar Syndrome).","html":"\u003cb\u003eAnd if we have time, we’ll also briefly talk\u003c/b\u003e about Hypogenetic Lung Syndrome (Scimitar Syndrome).","cue":null}]},{"n":6,"title":"When should we suspect congenital airway and lung malformati…","target":null,"items":[{"text":"So first, let’s think about when we should suspect a congenital airway or lung malformation in children.","html":"\u003cb\u003eSo first, let’s think\u003c/b\u003e about when we should suspect a congenital airway or lung malformation in \u003cb\u003echildren.\u003c/b\u003e","cue":null},{"text":"Of course, we don’t suspect it in every patient.","html":"\u003cb\u003eOf course, we don’t\u003c/b\u003e suspect it in \u003cb\u003eevery patient.\u003c/b\u003e","cue":null},{"text":"One clue is a persistent unusual opacity or radiodensity on chest imaging.","html":"\u003cb\u003eOne clue\u003c/b\u003e is a persistent \u003cb\u003eunusual opacity or radiodensity on chest imaging.\u003c/b\u003e","cue":null},{"text":"Another important clue is recurrent pneumonia in the same lung or the same lobe.","html":"\u003cb\u003eAnother important clue\u003c/b\u003e is recurrent pneumonia in the same lung or the same lobe.","cue":null},{"text":"When you see these findings, you should start thinking about an underlying congenital airway or lung malformation.","html":"\u003cb\u003eWhen you see these findings, you should start thinking about an underlying\u003c/b\u003e congenital airway or lung malformation.","cue":null}]},{"n":7,"title":"Postnatal imaging","target":null,"items":[{"text":"So, once we suspect a congenital airway or lung malformation, how do we evaluate it?","html":"\u003cb\u003eSo, once we suspect a congenital\u003c/b\u003e airway or \u003cb\u003elung malformation, how do we evaluate it?\u003c/b\u003e","cue":null},{"text":"Chest radiography is usually the initial imaging modality.","html":"Chest \u003cb\u003eradiography is usually the initial\u003c/b\u003e imaging modality.","cue":null},{"text":"We look for focal hyperlucency, fluid- or air-filled cystic lesions, vascular or airway abnormalities, and thoracic asymmetry.","html":"\u003cb\u003eWe look\u003c/b\u003e for focal hyperlucency, fluid- or air-filled cystic lesions, vascular or airway \u003cb\u003eabnormalities,\u003c/b\u003e and thoracic asymmetry.","cue":null},{"text":"It’s also very useful for comparison with prior imaging and follow-up over time.","html":"\u003cb\u003eIt’s also very useful\u003c/b\u003e for comparison with \u003cb\u003eprior\u003c/b\u003e imaging and follow-up over \u003cb\u003etime.\u003c/b\u003e","cue":null},{"text":"For further evaluation, CT is the modality of choice.","html":"\u003cb\u003eFor further evaluation,\u003c/b\u003e CT is the modality of choice.","cue":null},{"text":"It provides excellent evaluation of the lung parenchyma and vascular anatomy.","html":"\u003cb\u003eIt provides excellent evaluation of the lung\u003c/b\u003e parenchyma and vascular anatomy.","cue":null},{"text":"For the initial evaluation of a congenital lung lesion, contrast-enhanced CT is preferred, because we also want to look for associated vascular abnormalities.","html":"\u003cb\u003eFor the initial evaluation of a congenital lung\u003c/b\u003e lesion, contrast-enhanced CT is \u003cb\u003epreferred, because we also want to look for associated\u003c/b\u003e vascular \u003cb\u003eabnormalities.\u003c/b\u003e","cue":null},{"text":"The main downside, of course, is radiation exposure.","html":"\u003cb\u003eThe main downside, of course,\u003c/b\u003e is radiation exposure.","cue":null}]},{"n":8,"title":"Postnatal imaging","target":null,"items":[{"text":"So, what about MRI?","html":"\u003cb\u003eSo, what about MRI?\u003c/b\u003e","cue":null},{"text":"Of course, the biggest advantage is no ionizing radiation.","html":"\u003cb\u003eOf course, the biggest advantage\u003c/b\u003e is no ionizing radiation.","cue":null},{"text":"But spatial resolution is still lower than CT.","html":"But spatial resolution is still lower than CT.","cue":null},{"text":"Recently, lung MRI has improved a lot with newer techniques like UTE and ZTE.","html":"\u003cb\u003eRecently,\u003c/b\u003e lung \u003cb\u003eMRI\u003c/b\u003e has improved a \u003cb\u003elot with newer\u003c/b\u003e techniques like UTE and ZTE.","cue":null},{"text":"Here is an example of cystic congenital lung lesions in an eight-month-old baby.","html":"\u003cb\u003eHere is an example of cystic congenital\u003c/b\u003e lung \u003cb\u003elesions in an eight-month-old baby.\u003c/b\u003e","cue":null},{"text":"Look at the conventional T2 image here.","html":"\u003cb\u003eLook at the conventional T2 image here.\u003c/b\u003e","cue":null},{"text":"The lesion is barely visible.","html":"\u003cb\u003eThe lesion is barely visible.\u003c/b\u003e","cue":null},{"text":"But with UTE and ZTE, we can see the lung lesion much better, with findings that correlate well with CT.","html":"But with UTE and ZTE, we can \u003cb\u003esee\u003c/b\u003e the lung \u003cb\u003elesion much better, with findings that correlate\u003c/b\u003e well with CT.","cue":null},{"text":"So, these newer techniques are opening up new possibilities for pediatric lung MRI, although it is still used more in research than in routine clinical practice.","html":"\u003cb\u003eSo, these newer\u003c/b\u003e techniques are \u003cb\u003eopening up new possibilities for pediatric\u003c/b\u003e lung \u003cb\u003eMRI, although it is still used more in research than in routine clinical practice.\u003c/b\u003e","cue":null}]},{"n":9,"title":"Postnatal imaging","target":null,"items":[{"text":"Ultrasound and fluoroscopy can also be useful in selected cases.","html":"\u003cb\u003eUltrasound\u003c/b\u003e and fluoroscopy can also be \u003cb\u003euseful in selected cases.\u003c/b\u003e","cue":null},{"text":"Ultrasound can help identify the systemic feeding vessel in pulmonary sequestration.","html":"\u003cb\u003eUltrasound can help identify the systemic feeding vessel\u003c/b\u003e in pulmonary sequestration.","cue":null},{"text":"And fluoroscopy can demonstrate an abnormal communication between the airway and esophagus.","html":"And fluoroscopy can \u003cb\u003edemonstrate an abnormal\u003c/b\u003e communication between the airway and esophagus.","cue":null},{"text":"We’ll see examples of both later.","html":"\u003cb\u003eWe’ll see examples of both later.\u003c/b\u003e","cue":null}]},{"n":10,"title":"Airway malformations","target":null,"items":[{"text":"Okay, now let’s move on to the actual diseases.","html":"\u003cb\u003eOkay, now let’s move on to the actual diseases.\u003c/b\u003e","cue":null},{"text":"We’ll start with airway malformations.","html":"\u003cb\u003eWe’ll start\u003c/b\u003e with airway malformations.","cue":null}]},{"n":11,"title":"11d/M","target":null,"items":[{"text":"Okay, let’s start with our first case.","html":"\u003cb\u003eOkay, let’s start with our first case.\u003c/b\u003e","cue":null},{"text":"This is a neonate with congenital heart disease and a cloacal anomaly.","html":"\u003cb\u003eThis\u003c/b\u003e is a neonate with congenital heart disease and a cloacal anomaly.","cue":null},{"text":"This chest radiograph was taken at 11 days of age.","html":"\u003cb\u003eThis chest radiograph was taken at 11 days of age.\u003c/b\u003e","cue":null},{"text":"There is some rotation, and the pulmonary vessels are a little prominent, but there is no focal lung lesion.","html":"\u003cb\u003eThere is some rotation, and the pulmonary vessels are a little prominent, but there is no focal lung lesion.\u003c/b\u003e","cue":null},{"text":"Now, look at the follow-up radiographs at 2 and 3 years of age.","html":"\u003cb\u003eNow, look at the follow-up radiographs\u003c/b\u003e at 2 and 3 \u003cb\u003eyears of age.\u003c/b\u003e","cue":null},{"text":"What do you see?","html":"\u003cb\u003eWhat do you see?\u003c/b\u003e","cue":null},{"text":"Yes.","html":"\u003cb\u003eYes.\u003c/b\u003e","cue":null},{"text":"As you mentioned, there is consolidation in the right lower lobe.","html":"\u003cb\u003eAs you mentioned, there is consolidation in the right lower lobe.\u003c/b\u003e","cue":null},{"text":"And importantly, this patient had pneumonia in the same location twice.","html":"\u003cb\u003eAnd importantly, this patient had pneumonia in the same location twice.\u003c/b\u003e","cue":null},{"text":"When you see recurrent pneumonia in the same location, you should suspect an underlying congenital lung lesion.","html":"\u003cb\u003eWhen you see recurrent pneumonia in the same location, you should suspect an underlying\u003c/b\u003e congenital \u003cb\u003elung lesion.\u003c/b\u003e","cue":null}]},{"n":12,"title":"3/M","target":null,"items":[{"text":"So, we obtained a CT.","html":"\u003cb\u003eSo, we obtained a CT.\u003c/b\u003e","cue":null},{"text":"There is consolidation in the right lower lobe with associated bronchiectasis.","html":"\u003cb\u003eThere is consolidation in the right lower lobe with associated bronchiectasis.\u003c/b\u003e","cue":null},{"text":"Now, let’s look at the airway.","html":"\u003cb\u003eNow, let’s look at the airway.\u003c/b\u003e","cue":null},{"text":"At this upper level, here is the aorta, slightly to the left.","html":"\u003cb\u003eAt this upper level, here is the aorta, slightly to the left.\u003c/b\u003e","cue":null},{"text":"Right next to it is the esophagus, and here is the trachea.","html":"\u003cb\u003eRight next to it is the esophagus, and here is the trachea.\u003c/b\u003e","cue":null},{"text":"Now, if we move down to this level, this is the esophagus next to the aorta.","html":"\u003cb\u003eNow, if we move down to this level, this is the esophagus next to the aorta.\u003c/b\u003e","cue":null},{"text":"It’s a little subtle, but this bronchus appears to connect with the esophagus.","html":"\u003cb\u003eIt’s a little subtle, but this\u003c/b\u003e bronchus \u003cb\u003eappears to connect with the esophagus.\u003c/b\u003e","cue":null},{"text":"So, we performed an esophagram.","html":"\u003cb\u003eSo, we performed an esophagram.\u003c/b\u003e","cue":null},{"text":"Here, you can see contrast in the distal esophagus and stomach.","html":"\u003cb\u003eHere, you can see contrast in the distal esophagus and stomach.\u003c/b\u003e","cue":null},{"text":"But you can also see this unusual branching structure extending into the right lower lobe.","html":"\u003cb\u003eBut you can also see this unusual branching structure extending into the right lower lobe.\u003c/b\u003e","cue":null},{"text":"If we correlate this with the CT, we can see that the bronchus is actually arising from the esophagus.","html":"\u003cb\u003eIf we correlate this with the CT, we can see\u003c/b\u003e that the bronchus is actually \u003cb\u003earising from the esophagus.\u003c/b\u003e","cue":null},{"text":"So, this is an esophageal bronchus supplying the right lower lobe.","html":"\u003cb\u003eSo, this\u003c/b\u003e is an esophageal bronchus \u003cb\u003esupplying the right lower lobe.\u003c/b\u003e","cue":null},{"text":"And this explains the recurrent pneumonia in the same location.","html":"\u003cb\u003eAnd this explains the recurrent pneumonia in the same location.\u003c/b\u003e","cue":null}]},{"n":13,"title":"0d/F","target":null,"items":[{"text":"This is another premature baby who was admitted to the NICU.","html":"\u003cb\u003eThis is another premature baby who was admitted to the NICU.\u003c/b\u003e","cue":null},{"text":"On the radiograph from the day of birth, the baby is intubated, with an enteric tube in place.","html":"\u003cb\u003eOn the radiograph from the day of birth, the baby is intubated, with an enteric tube in place.\u003c/b\u003e","cue":null},{"text":"There is complete opacification of the right lung with volume loss.","html":"\u003cb\u003eThere is complete opacification of the right lung with volume loss.\u003c/b\u003e","cue":null},{"text":"The left lung shows granular opacities.","html":"\u003cb\u003eThe left lung shows granular opacities.\u003c/b\u003e","cue":null},{"text":"Now, look at the follow-up radiograph one month later.","html":"\u003cb\u003eNow, look at the follow-up radiograph one month later.\u003c/b\u003e","cue":null},{"text":"The right lung remains completely opacified with low volume, while the left lung is hyperinflated, with some linear opacities, likely atelectasis.","html":"\u003cb\u003eThe right lung remains completely opacified with low volume, while the left lung is hyperinflated, with some linear opacities, likely atelectasis.\u003c/b\u003e","cue":null},{"text":"But if you look carefully, there is branching air density in the right lower lung zone.","html":"\u003cb\u003eBut if you look carefully, there is branching air density in the right lower lung zone.\u003c/b\u003e","cue":null},{"text":"It looks like an airway, but normally, the bronchi should course toward the hilum.","html":"\u003cb\u003eIt looks like an airway, but normally, the bronchi should course toward the hilum.\u003c/b\u003e","cue":null},{"text":"This one has a more horizontal course and seems to extend toward the adjacent esophagus.","html":"\u003cb\u003eThis one has a more horizontal course and seems to extend toward the adjacent esophagus.\u003c/b\u003e","cue":null},{"text":"Of course, we just saw an esophageal bronchus, so it may look obvious now.","html":"\u003cb\u003eOf course, we just saw an esophageal bronchus, so it may look obvious now.\u003c/b\u003e","cue":null},{"text":"But honestly, it would be very difficult to make that diagnosis from this radiograph alone.","html":"\u003cb\u003eBut honestly, it would be very difficult to make that diagnosis from this radiograph alone.\u003c/b\u003e","cue":null},{"text":"So, we obtained a CT.","html":"\u003cb\u003eSo, we obtained a CT.\u003c/b\u003e","cue":null}]},{"n":14,"title":"Preterm infant with persistent CXR abnormality","target":null,"items":[{"text":"On CT, here is the esophagus with the enteric tube inside.","html":"\u003cb\u003eOn CT, here is the esophagus with the enteric tube inside.\u003c/b\u003e","cue":null},{"text":"And here, we can see a bronchus that appears to arise from the esophagus.","html":"\u003cb\u003eAnd here, we can see a bronchus that appears to arise from the esophagus.\u003c/b\u003e","cue":null},{"text":"The esophagram confirms the esophageal bronchus.","html":"\u003cb\u003eThe esophagram confirms\u003c/b\u003e the esophageal \u003cb\u003ebronchus.\u003c/b\u003e","cue":null},{"text":"This is a 3D reconstruction of the tracheobronchial tree.","html":"\u003cb\u003eThis is a 3D reconstruction of the tracheobronchial tree.\u003c/b\u003e","cue":null},{"text":"The trachea is also irregular, and there is abnormal branching of the left bronchial tree.","html":"\u003cb\u003eThe trachea is also irregular, and there is abnormal branching of the left bronchial tree.\u003c/b\u003e","cue":null},{"text":"But importantly, there is no right main bronchus at all.","html":"\u003cb\u003eBut importantly, there is no right main bronchus at all.\u003c/b\u003e","cue":null},{"text":"So the entire right lung is supplied by this airway arising from the esophagus.","html":"\u003cb\u003eSo the entire right\u003c/b\u003e lung is \u003cb\u003esupplied by this airway arising from the esophagus.\u003c/b\u003e","cue":null},{"text":"When the entire lung is supplied by an esophageal bronchus like this, we call it an esophageal lung.","html":"\u003cb\u003eWhen the entire\u003c/b\u003e lung is \u003cb\u003esupplied\u003c/b\u003e by an esophageal \u003cb\u003ebronchus like this, we call\u003c/b\u003e it an esophageal lung.","cue":null},{"text":"So, this is a right esophageal lung.","html":"\u003cb\u003eSo, this is a right\u003c/b\u003e esophageal lung.","cue":null}]},{"n":15,"title":"Esophageal bronchus or lung","target":null,"items":[{"text":"So, these are examples of an esophageal bronchus or esophageal lung.","html":"\u003cb\u003eSo, these are examples\u003c/b\u003e of an esophageal bronchus or esophageal lung.","cue":null},{"text":"Basically, a lobar or main bronchus arises directly from the esophagus, instead of the tracheobronchial tree.","html":"\u003cb\u003eBasically,\u003c/b\u003e a lobar or main bronchus arises directly from the esophagus, \u003cb\u003einstead of the tracheobronchial tree.\u003c/b\u003e","cue":null},{"text":"This is thought to result from abnormal budding and separation of the primitive foregut.","html":"\u003cb\u003eThis is thought to result from abnormal\u003c/b\u003e budding and separation of the primitive foregut.","cue":null},{"text":"As you can see here, normally the respiratory tract buds from the foregut and then separates from the esophagus.","html":"\u003cb\u003eAs you can see here, normally\u003c/b\u003e the respiratory tract \u003cb\u003ebuds\u003c/b\u003e from the foregut and then \u003cb\u003eseparates\u003c/b\u003e from the esophagus.","cue":null},{"text":"If this process goes wrong, you can get an abnormal connection between the esophagus and the bronchial tree.","html":"\u003cb\u003eIf this process goes wrong, you can get an abnormal connection between\u003c/b\u003e the esophagus and the \u003cb\u003ebronchial tree.\u003c/b\u003e","cue":null},{"text":"Clinically, these patients may present with feeding difficulties or recurrent respiratory infections.","html":"\u003cb\u003eClinically, these patients may present\u003c/b\u003e with feeding difficulties or recurrent respiratory infections.","cue":null},{"text":"And as we saw in the first case, recurrent pneumonia in the same location can be an important clue.","html":"\u003cb\u003eAnd as we saw in the first case,\u003c/b\u003e recurrent \u003cb\u003epneumonia in the same location can be an important clue.\u003c/b\u003e","cue":null}]},{"n":16,"title":"Esophageal bronchus or lung","target":null,"items":[{"text":"An esophagogram is the key test.","html":"An esophagogram is the \u003cb\u003ekey test.\u003c/b\u003e","cue":null},{"text":"It shows the direct communication between the bronchus and the esophagus.","html":"\u003cb\u003eIt shows\u003c/b\u003e the direct communication between the bronchus and the esophagus.","cue":null},{"text":"CT is also important.","html":"CT is also \u003cb\u003eimportant.\u003c/b\u003e","cue":null},{"text":"It shows aspiration pneumonia in the involved lung and other associated anomalies.","html":"\u003cb\u003eIt shows\u003c/b\u003e aspiration pneumonia in the \u003cb\u003einvolved\u003c/b\u003e lung and other \u003cb\u003eassociated\u003c/b\u003e anomalies.","cue":null}]},{"n":17,"title":"28+3-week premature neonate, 1.16 kg","target":null,"items":[{"text":"Let’s look at one more case.","html":"\u003cb\u003eLet’s look at one more case.\u003c/b\u003e","cue":null},{"text":"This baby was born at 28 weeks and developed respiratory distress immediately after birth.","html":"\u003cb\u003eThis baby was born at 28\u003c/b\u003e weeks and \u003cb\u003edeveloped\u003c/b\u003e respiratory distress immediately after birth.","cue":null},{"text":"They tried to intubate the baby, but intubation was unsuccessful.","html":"\u003cb\u003eThey tried\u003c/b\u003e to intubate the \u003cb\u003ebaby,\u003c/b\u003e but intubation was \u003cb\u003eunsuccessful.\u003c/b\u003e","cue":null},{"text":"Interestingly, oxygenation improved with bag-mask ventilation.","html":"\u003cb\u003eInterestingly,\u003c/b\u003e oxygenation improved with bag-mask ventilation.","cue":null},{"text":"So they suspected a tracheoesophageal fistula.","html":"So they suspected a tracheoesophageal fistula.","cue":null},{"text":"They then attempted a tracheostomy, but they couldn’t find the trachea.","html":"They then attempted a tracheostomy, but they \u003cb\u003ecouldn’t find\u003c/b\u003e the trachea.","cue":null},{"text":"All they could see was a dilated esophagus.","html":"\u003cb\u003eAll they could see\u003c/b\u003e was a dilated esophagus.","cue":null},{"text":"So they intubated the esophagus for ventilation.","html":"\u003cb\u003eSo they intubated\u003c/b\u003e the esophagus for ventilation.","cue":null},{"text":"They also placed a Foley catheter through the esophagus and inflated the balloon to help maintain ventilation through the esophageal route.","html":"They also placed a Foley catheter \u003cb\u003ethrough\u003c/b\u003e the esophagus and \u003cb\u003einflated\u003c/b\u003e the balloon to \u003cb\u003ehelp maintain\u003c/b\u003e ventilation \u003cb\u003ethrough\u003c/b\u003e the esophageal \u003cb\u003eroute.\u003c/b\u003e","cue":null},{"text":"So, what do you think is going on here?","html":"\u003cb\u003eSo, what do you think is going on here?\u003c/b\u003e","cue":null}]},{"n":18,"title":"Neonate with r/o tracheoesophageal fistula","target":null,"items":[{"text":"Now, let’s look at the CT reconstruction.","html":"\u003cb\u003eNow, let’s look at the CT reconstruction.\u003c/b\u003e","cue":null},{"text":"This is the dilated esophagus, and this is the Foley catheter.","html":"\u003cb\u003eThis is the dilated esophagus, and this is the Foley catheter.\u003c/b\u003e","cue":null},{"text":"Anterior to the esophagus, you can see the airways supplying both lungs.","html":"\u003cb\u003eAnterior to the esophagus, you can see the airways supplying both lungs.\u003c/b\u003e","cue":null},{"text":"But there is no trachea at all.","html":"\u003cb\u003eBut there is no trachea at all.\u003c/b\u003e","cue":null},{"text":"On the coronal image, again, you can see the markedly dilated esophagus.","html":"\u003cb\u003eOn the coronal image, again, you can see the markedly dilated esophagus.\u003c/b\u003e","cue":null},{"text":"And on the axial images, the right and left bronchi are connected to each other.","html":"\u003cb\u003eAnd on the axial images, the right and left bronchi are connected to each other.\u003c/b\u003e","cue":null},{"text":"And there is a tiny communication between the esophagus and the right bronchus.","html":"\u003cb\u003eAnd there is a tiny communication between the esophagus and the right bronchus.\u003c/b\u003e","cue":null},{"text":"This is a case of tracheal agenesis with a bronchoesophageal fistula.","html":"\u003cb\u003eThis is a case\u003c/b\u003e of tracheal agenesis with a bronchoesophageal fistula.","cue":null},{"text":"Unfortunately, this baby also had multiple other congenital anomalies.","html":"\u003cb\u003eUnfortunately, this baby also had multiple other congenital anomalies.\u003c/b\u003e","cue":null},{"text":"Tracheal agenesis is generally not compatible with long-term survival with current treatment options.","html":"Tracheal agenesis is \u003cb\u003egenerally not compatible with long-term survival with current treatment options.\u003c/b\u003e","cue":null},{"text":"After discussion with the family, they decided to withdraw life-sustaining treatment, and the baby passed away in the mother’s arms.","html":"\u003cb\u003eAfter discussion with the family, they decided to withdraw life-sustaining treatment, and the baby passed away in the mother’s arms.\u003c/b\u003e","cue":null}]},{"n":19,"title":"Tracheal agenesis","target":null,"items":[{"text":"So, tracheal agenesis is a very rare and usually lethal congenital anomaly.","html":"So, tracheal agenesis is a very rare and usually lethal congenital anomaly.","cue":null},{"text":"It is one of the causes of congenital high airway obstruction syndrome, or CHAOS.","html":"\u003cb\u003eIt is one of the causes\u003c/b\u003e of congenital high airway obstruction syndrome, or CHAOS.","cue":null},{"text":"Similar to the esophageal bronchus we just discussed, it results from abnormal development of the primitive foregut.","html":"\u003cb\u003eSimilar to the esophageal bronchus we just discussed, it results from abnormal development\u003c/b\u003e of the primitive foregut.","cue":null},{"text":"Basically, there is complete or partial absence of the trachea below the larynx.","html":"\u003cb\u003eBasically,\u003c/b\u003e there is complete or partial absence of the trachea below the larynx.","cue":null},{"text":"There may or may not be a fistula between the airway and the esophagus.","html":"There may or may not be a fistula \u003cb\u003ebetween\u003c/b\u003e the airway and the \u003cb\u003eesophagus.\u003c/b\u003e","cue":null},{"text":"There are three types based on the airway anatomy and its connection to the esophagus.","html":"\u003cb\u003eThere are three types based\u003c/b\u003e on the airway \u003cb\u003eanatomy and its connection to the esophagus.\u003c/b\u003e","cue":null}]},{"n":20,"title":"Lung malformations","target":null,"items":[{"text":"Now, let\u0027s move on to lung malformations.","html":"\u003cb\u003eNow, let\u0026#39;s move\u003c/b\u003e on to lung malformations.","cue":null}]},{"n":21,"title":"32/F incidental lesion on CXR","target":null,"items":[{"text":"This is an adult patient.","html":"\u003cb\u003eThis is an adult patient.\u003c/b\u003e","cue":null},{"text":"On the chest radiograph, you can see an unusual tubular opacity in the left lower lung zone.","html":"\u003cb\u003eOn the chest radiograph, you can see an unusual tubular opacity in the left lower lung zone.\u003c/b\u003e","cue":null},{"text":"There also seems to be some hyperlucency around it, although it’s quite subtle on the radiograph.","html":"\u003cb\u003eThere also seems to be some hyperlucency around it, although it’s quite subtle on the radiograph.\u003c/b\u003e","cue":null},{"text":"Let’s look at the CT.","html":"\u003cb\u003eLet’s look at the CT.\u003c/b\u003e","cue":null},{"text":"In the left lower lobe, there is focal hyperinflation with decreased attenuation compared with the surrounding lung.","html":"\u003cb\u003eIn the left lower lobe, there is focal hyperinflation with decreased attenuation compared with the surrounding lung.\u003c/b\u003e","cue":null},{"text":"And on the mediastinal window, you can see this dilated tubular structure along the bronchovascular bundle.","html":"\u003cb\u003eAnd on the mediastinal window, you can see this dilated tubular structure along the bronchovascular bundle.\u003c/b\u003e","cue":null},{"text":"This is a mucus-filled bronchus, or bronchocele.","html":"\u003cb\u003eThis is a mucus-filled bronchus, or bronchocele.\u003c/b\u003e","cue":null},{"text":"So, this is the classic appearance of bronchial atresia: a bronchocele with distal hyperinflation.","html":"\u003cb\u003eSo, this is the classic appearance\u003c/b\u003e of bronchial atresia: a \u003cb\u003ebronchocele with distal hyperinflation.\u003c/b\u003e","cue":null}]},{"n":22,"title":"Bronchial atresia","target":null,"items":[{"text":"So, what exactly is bronchial atresia?","html":"\u003cb\u003eSo, what exactly\u003c/b\u003e is bronchial atresia?","cue":null},{"text":"Bronchial atresia is a congenital interruption of a bronchus, as you can see in this illustration.","html":"Bronchial atresia is a congenital interruption of a bronchus, as you can \u003cb\u003esee in this illustration.\u003c/b\u003e","cue":null},{"text":"Distal to the atresia, mucus accumulates and dilates the bronchus, forming a bronchocele or mucocele.","html":"Distal to the atresia, mucus \u003cb\u003eaccumulates and dilates\u003c/b\u003e the bronchus, \u003cb\u003eforming\u003c/b\u003e a bronchocele or mucocele.","cue":null},{"text":"Interestingly, the distal lung usually doesn’t collapse.","html":"\u003cb\u003eInterestingly,\u003c/b\u003e the distal lung \u003cb\u003eusually doesn’t collapse.\u003c/b\u003e","cue":null},{"text":"Because of collateral ventilation, air can still enter the affected lung.","html":"Because of collateral ventilation, air can still \u003cb\u003eenter the affected\u003c/b\u003e lung.","cue":null},{"text":"Over time, this leads to air trapping, hyperinflation, and hyperlucency.","html":"\u003cb\u003eOver time, this leads\u003c/b\u003e to air trapping, hyperinflation, and hyperlucency.","cue":null},{"text":"In neonates, however, the affected lung may initially appear atelectatic or consolidated, before collateral aeration develops.","html":"In neonates, \u003cb\u003ehowever, the affected\u003c/b\u003e lung may initially appear atelectatic or consolidated, \u003cb\u003ebefore\u003c/b\u003e collateral \u003cb\u003eaeration develops.\u003c/b\u003e","cue":null},{"text":"And the most common location is the apicoposterior segment of the left upper lobe.","html":"And the most common \u003cb\u003elocation\u003c/b\u003e is the apicoposterior segment of the \u003cb\u003eleft upper lobe.\u003c/b\u003e","cue":null}]},{"n":23,"title":"GA17w6d/M","target":null,"items":[{"text":"Let’s look at this neonatal case.","html":"\u003cb\u003eLet’s look at this neonatal case.\u003c/b\u003e","cue":null},{"text":"This baby had an abnormal lung lesion detected on fetal ultrasound.","html":"\u003cb\u003eThis baby had an abnormal lung lesion detected\u003c/b\u003e on fetal \u003cb\u003eultrasound.\u003c/b\u003e","cue":null},{"text":"On the chest radiograph, the baby is intubated, with an enteric tube in place.","html":"\u003cb\u003eOn the chest radiograph, the baby is intubated, with an enteric tube in place.\u003c/b\u003e","cue":null},{"text":"There is consolidation obscuring the right heart border and right hemidiaphragm, indicating involvement of the right middle and lower lobes.","html":"\u003cb\u003eThere is consolidation obscuring the right heart border and right hemidiaphragm, indicating involvement of the right middle and lower lobes.\u003c/b\u003e","cue":null},{"text":"There is also mild leftward mediastinal shift.","html":"\u003cb\u003eThere is also mild leftward mediastinal shift.\u003c/b\u003e","cue":null}]},{"n":24,"title":"7d initial CT","target":null,"items":[{"text":"We have a chest CT.","html":"\u003cb\u003eWe have a chest\u003c/b\u003e CT.","cue":null},{"text":"CT confirms consolidation of the right middle and lower lobes.","html":"CT \u003cb\u003econfirms consolidation of the right middle and lower lobes.\u003c/b\u003e","cue":null},{"text":"You can see the right middle lobe bronchus here, and on the coronal image, it corresponds to this structure.","html":"\u003cb\u003eYou can see the right middle lobe bronchus here, and on the coronal image, it corresponds to this structure.\u003c/b\u003e","cue":null},{"text":"But importantly, it is not connected to the central tracheobronchial tree.","html":"\u003cb\u003eBut importantly, it is not connected to the central tracheobronchial tree.\u003c/b\u003e","cue":null},{"text":"Normally, the right main bronchus gives off the right upper lobe bronchus and then continues as the bronchus intermedius, which branches into the middle and lower lobe bronchi.","html":"\u003cb\u003eNormally, the right main bronchus gives off the right upper lobe bronchus and then continues as the bronchus intermedius, which branches into the middle and lower lobe bronchi.\u003c/b\u003e","cue":null},{"text":"But here, we only see the right upper lobe bronchus.","html":"\u003cb\u003eBut here, we only see the right upper lobe bronchus.\u003c/b\u003e","cue":null},{"text":"There is no bronchus intermedius.","html":"\u003cb\u003eThere is no bronchus intermedius.\u003c/b\u003e","cue":null},{"text":"In the right lower lobe, we don’t see an air-filled bronchus, but these low-density tubular structures may represent fluid-filled bronchi.","html":"\u003cb\u003eIn the right lower lobe, we don’t see an air-filled bronchus, but these low-density tubular structures may represent fluid-filled bronchi.\u003c/b\u003e","cue":null},{"text":"So, this is bronchial atresia involving the right middle and lower lobes.","html":"\u003cb\u003eSo, this\u003c/b\u003e is bronchial atresia \u003cb\u003einvolving the right middle and lower lobes.\u003c/b\u003e","cue":null}]},{"n":25,"title":"Atelectasis","target":null,"items":[{"text":"Here are the radiographs over time.","html":"\u003cb\u003eHere are the radiographs over time.\u003c/b\u003e","cue":null},{"text":"On day 0, the right lower lung is opaque, as we saw before.","html":"\u003cb\u003eOn day 0, the right lower lung is opaque, as we saw before.\u003c/b\u003e","cue":null},{"text":"At 8 days, it is partially aerated.","html":"\u003cb\u003eAt 8 days, it is partially aerated.\u003c/b\u003e","cue":null},{"text":"And at 1 month, it becomes hyperlucent and expanded, pushing the mediastinum to the left.","html":"\u003cb\u003eAnd at 1 month, it becomes hyperlucent and expanded, pushing the mediastinum to the left.\u003c/b\u003e","cue":null},{"text":"So, it changed from atelectasis to air trapping through collateral ventilation.","html":"\u003cb\u003eSo, it changed\u003c/b\u003e from atelectasis to air trapping \u003cb\u003ethrough\u003c/b\u003e collateral ventilation.","cue":"CLICK"}]},{"n":26,"title":"Bronchogenic cysts","target":null,"items":[{"text":"Next is the bronchogenic cyst.","html":"\u003cb\u003eNext\u003c/b\u003e is the bronchogenic cyst.","cue":null},{"text":"It results from abnormal budding of the primitive foregut and usually does not communicate with the tracheobronchial tree.","html":"It results from abnormal budding of the primitive foregut and usually \u003cb\u003edoes\u003c/b\u003e not communicate with the tracheobronchial tree.","cue":null},{"text":"It can occur in the mediastinum or within the lung and typically appears as a unilocular fluid- or mucus-filled cyst.","html":"\u003cb\u003eIt can occur\u003c/b\u003e in the mediastinum or within the lung and \u003cb\u003etypically appears\u003c/b\u003e as a unilocular fluid- or mucus-filled cyst.","cue":null},{"text":"MRI can be helpful to confirm its cystic nature.","html":"MRI can be \u003cb\u003ehelpful to confirm\u003c/b\u003e its cystic nature.","cue":null},{"text":"The main differential diagnosis includes an esophageal duplication cyst.","html":"\u003cb\u003eThe main\u003c/b\u003e differential diagnosis \u003cb\u003eincludes\u003c/b\u003e an esophageal duplication cyst.","cue":null},{"text":"Okay, let’s look at a case.","html":"\u003cb\u003eOkay, let’s look at a case.\u003c/b\u003e","cue":null}]},{"n":27,"title":"4/M incidental finding on spine MR","target":null,"items":[{"text":"This 4-year-old boy had an incidental finding on spine MRI.","html":"\u003cb\u003eThis 4-year-old boy\u003c/b\u003e had an incidental finding on spine \u003cb\u003eMRI.\u003c/b\u003e","cue":null},{"text":"On T2-weighted imaging, there is a well-defined, very bright cystic lesion.","html":"\u003cb\u003eOn T2-weighted imaging, there is a well-defined, very bright cystic lesion.\u003c/b\u003e","cue":null},{"text":"The chest radiograph looks almost normal, but if you look carefully, there is a round opacity in the right paratracheal region.","html":"\u003cb\u003eThe chest radiograph looks almost normal, but if you look carefully, there is a round opacity in the right paratracheal region.\u003c/b\u003e","cue":null},{"text":"On CT, it appears as a low-density cystic mass in the posterior mediastinum.","html":"\u003cb\u003eOn CT, it appears as a low-density cystic\u003c/b\u003e mass in the posterior \u003cb\u003emediastinum.\u003c/b\u003e","cue":null},{"text":"The lesion was surgically removed, and pathology showed a cyst lined by respiratory epithelium with cartilage, consistent with a bronchogenic cyst.","html":"\u003cb\u003eThe lesion was surgically removed, and pathology showed\u003c/b\u003e a cyst \u003cb\u003elined\u003c/b\u003e by respiratory epithelium with cartilage, consistent with a bronchogenic cyst.","cue":null}]},{"n":28,"title":"https://epos.myesr.org/posterimage/esr/ecr2019/146923/mediag…","target":null,"items":[{"text":"The main differential diagnosis is an esophageal duplication cyst.","html":"\u003cb\u003eThe main differential diagnosis is an esophageal duplication cyst.\u003c/b\u003e","cue":null},{"text":"I don’t have a case of my own, so this example is from the literature.","html":"\u003cb\u003eI don’t have a case of my own, so this example is from the literature.\u003c/b\u003e","cue":null},{"text":"As you can see, there is a lesion causing indentation of the right lateral wall of the esophagus.","html":"\u003cb\u003eAs you can see, there is a lesion causing indentation of the right lateral wall of the esophagus.\u003c/b\u003e","cue":null},{"text":"On CT, there is a cystic lesion right next to the esophagus, which contains an enteric tube.","html":"\u003cb\u003eOn CT, there is a cystic lesion right next to the esophagus, which contains an enteric tube.\u003c/b\u003e","cue":null},{"text":"The imaging appearance itself is very similar to a bronchogenic cyst.","html":"\u003cb\u003eThe imaging appearance itself is very similar to a bronchogenic cyst.\u003c/b\u003e","cue":null},{"text":"So, when a cystic lesion is closely associated with the esophagus, an esophageal duplication cyst should be considered.","html":"\u003cb\u003eSo, when a cystic lesion is closely associated with the esophagus, an esophageal duplication cyst should be considered.\u003c/b\u003e","cue":null},{"text":"In practice, these two are often considered together in the differential diagnosis.","html":"\u003cb\u003eIn practice, these two are often considered together in the differential diagnosis.\u003c/b\u003e","cue":null}]},{"n":29,"title":"6/M incidental finding on CXR","target":null,"items":[{"text":"Here is another case, a 6-year-old with an incidental finding on chest radiograph.","html":"\u003cb\u003eHere is another case, a 6-year-old\u003c/b\u003e with an incidental finding on \u003cb\u003echest radiograph.\u003c/b\u003e","cue":null},{"text":"There is a bulging mass in the right lower paraspinal region.","html":"\u003cb\u003eThere is a bulging mass in the right lower paraspinal region.\u003c/b\u003e","cue":null},{"text":"On contrast-enhanced CT, there is a paraspinal mass.","html":"\u003cb\u003eOn contrast-enhanced CT, there is a paraspinal mass.\u003c/b\u003e","cue":null},{"text":"Most of the lesion is low density, so at first glance, it could easily be mistaken for a cyst.","html":"\u003cb\u003eMost of the lesion is low density, so at first glance, it could easily be mistaken for a cyst.\u003c/b\u003e","cue":null},{"text":"But if you look carefully, there is subtle peripheral enhancement.","html":"\u003cb\u003eBut if you look carefully, there is subtle peripheral enhancement.\u003c/b\u003e","cue":null},{"text":"The lesion was surgically removed and confirmed to be a ganglioneuroma.","html":"\u003cb\u003eThe lesion was surgically removed and confirmed\u003c/b\u003e to be a ganglioneuroma.","cue":null},{"text":"So, if a lesion looks like a cyst but you suspect subtle enhancement, MRI can help determine whether it is really a cyst or a solid mass.","html":"\u003cb\u003eSo, if a lesion looks like a cyst but you suspect subtle enhancement, MRI can help determine whether it is really a cyst or a solid mass.\u003c/b\u003e","cue":null}]},{"n":30,"title":"Congenital lobar overinflation","target":null,"items":[{"text":"Next is congenital lobar overinflation, also called congenital lobar emphysema.","html":"\u003cb\u003eNext\u003c/b\u003e is congenital lobar overinflation, also \u003cb\u003ecalled\u003c/b\u003e congenital lobar emphysema.","cue":null},{"text":"Basically, there is bronchial narrowing, which causes air trapping and progressive overinflation of the affected lobe.","html":"\u003cb\u003eBasically,\u003c/b\u003e there is bronchial narrowing, which \u003cb\u003ecauses\u003c/b\u003e air trapping and progressive overinflation of the affected lobe.","cue":null},{"text":"The narrowing can be intrinsic, usually related to abnormal or deficient bronchial cartilage, or extrinsic, from compression by an adjacent mass or enlarged vessel.","html":"The narrowing can be intrinsic, \u003cb\u003eusually related\u003c/b\u003e to abnormal or deficient bronchial cartilage, or extrinsic, from compression by an adjacent mass or enlarged vessel.","cue":null},{"text":"On imaging, we see progressive lobar hyperinflation and hyperlucency, with attenuated pulmonary vessels.","html":"On imaging, we \u003cb\u003esee\u003c/b\u003e progressive lobar hyperinflation and hyperlucency, with attenuated pulmonary vessels.","cue":null},{"text":"If severe, it can compress the adjacent lung and mediastinum.","html":"\u003cb\u003eIf severe, it can compress\u003c/b\u003e the adjacent lung and mediastinum.","cue":null},{"text":"Let’s first look at a case of intrinsic bronchial narrowing.","html":"\u003cb\u003eLet’s first look at a case\u003c/b\u003e of intrinsic bronchial narrowing.","cue":null}]},{"n":31,"title":"24d/F","target":null,"items":[{"text":"This baby had a tongue mass and underwent tracheostomy shortly after birth.","html":"\u003cb\u003eThis baby\u003c/b\u003e had a tongue mass and \u003cb\u003eunderwent tracheostomy shortly after birth.\u003c/b\u003e","cue":null},{"text":"The initial chest radiograph shows the tracheostomy tube and pneumomediastinum.","html":"\u003cb\u003eThe initial chest radiograph shows the tracheostomy tube and pneumomediastinum.\u003c/b\u003e","cue":null},{"text":"But by day 24, there was marked hyperinflation of the right mid to lower lung, with leftward mediastinal shift.","html":"\u003cb\u003eBut by day 24, there was marked hyperinflation of the right mid to lower lung, with leftward mediastinal shift.\u003c/b\u003e","cue":null},{"text":"There was also increased haziness in the right upper lobe.","html":"\u003cb\u003eThere was also increased haziness in the right upper lobe.\u003c/b\u003e","cue":null}]},{"n":32,"title":"Lung, (right lower lobe), wedge resection:","target":null,"items":[{"text":"Now, here is the CT.","html":"\u003cb\u003eNow, here is the CT.\u003c/b\u003e","cue":null},{"text":"I didn’t include all the images here, but the overall tracheobronchial anatomy was normal.","html":"\u003cb\u003eI didn’t include all the images here, but the overall tracheobronchial anatomy was normal.\u003c/b\u003e","cue":null},{"text":"Here is the right lower lobe bronchus.","html":"Here is the right lower lobe \u003cb\u003ebronchus.\u003c/b\u003e","cue":null},{"text":"It looks slightly narrowed at this level, but overall, it remains patent and is not atretic.","html":"\u003cb\u003eIt looks slightly narrowed at this level, but overall, it remains patent and is not atretic.\u003c/b\u003e","cue":null},{"text":"As you can see, the right lower lobe is markedly hyperinflated, compressing the surrounding lung, causing diffuse haziness, and shifting the mediastinum to the left.","html":"\u003cb\u003eAs you can see,\u003c/b\u003e the right lower lobe is \u003cb\u003emarkedly hyperinflated, compressing the surrounding\u003c/b\u003e lung, \u003cb\u003ecausing diffuse haziness, and shifting the mediastinum to the left.\u003c/b\u003e","cue":null},{"text":"Because of worsening respiratory distress, the patient underwent surgery, and the diagnosis of congenital lobar hyperinflation was confirmed.","html":"\u003cb\u003eBecause of worsening respiratory distress, the patient underwent surgery, and the diagnosis\u003c/b\u003e of congenital lobar \u003cb\u003ehyperinflation was confirmed.\u003c/b\u003e","cue":null},{"text":"So, this is an example of congenital lobar hyperinflation caused by intrinsic bronchial narrowing.","html":"\u003cb\u003eSo, this is an example\u003c/b\u003e of congenital lobar \u003cb\u003ehyperinflation caused\u003c/b\u003e by intrinsic bronchial narrowing.","cue":null}]},{"n":33,"title":"3m/F","target":null,"items":[{"text":"Now, let’s look at an example of extrinsic bronchial compression.","html":"\u003cb\u003eNow, let’s look at an example\u003c/b\u003e of extrinsic bronchial \u003cb\u003ecompression.\u003c/b\u003e","cue":null},{"text":"This is a 3-month-old girl.","html":"\u003cb\u003eThis is a 3-month-old girl.\u003c/b\u003e","cue":null},{"text":"On this radiograph, the left lung is markedly hyperlucent and hyperinflated, with mild mass effect toward the right.","html":"\u003cb\u003eOn this radiograph, the left lung is markedly hyperlucent and hyperinflated, with mild mass effect toward the right.\u003c/b\u003e","cue":null},{"text":"On CT, there is a low-density, septated mass between the pulmonary trunk and the main bronchi.","html":"\u003cb\u003eOn CT, there is a low-density, septated mass between the pulmonary trunk and the main bronchi.\u003c/b\u003e","cue":null},{"text":"The mass compresses the left main bronchus, resulting in marked hyperinflation of the left lung.","html":"\u003cb\u003eThe mass compresses the left main bronchus, resulting in marked hyperinflation of the left lung.\u003c/b\u003e","cue":null},{"text":"The patient underwent surgery, and the mass was confirmed to be a bronchogenic cyst.","html":"\u003cb\u003eThe patient underwent surgery, and the mass was confirmed\u003c/b\u003e to be a bronchogenic cyst.","cue":null},{"text":"So, this is lobar hyperinflation secondary to extrinsic bronchial compression by a bronchogenic cyst.","html":"\u003cb\u003eSo, this\u003c/b\u003e is lobar \u003cb\u003ehyperinflation secondary\u003c/b\u003e to extrinsic bronchial \u003cb\u003ecompression\u003c/b\u003e by a bronchogenic cyst.","cue":null},{"text":"We’ve now seen both mechanisms.","html":"\u003cb\u003eWe’ve now seen both mechanisms.\u003c/b\u003e","cue":null},{"text":"Intrinsic bronchial narrowing is the classic mechanism, but extrinsic bronchial compression can produce the same pattern of lobar hyperinflation.","html":"\u003cb\u003eIntrinsic\u003c/b\u003e bronchial narrowing is the \u003cb\u003eclassic mechanism,\u003c/b\u003e but extrinsic bronchial \u003cb\u003ecompression can produce the same pattern\u003c/b\u003e of lobar \u003cb\u003ehyperinflation.\u003c/b\u003e","cue":null}]},{"n":34,"title":"Congenital pulmonary airway malformation (CPAM)","target":null,"items":[{"text":"Now, let’s move on to CPAM, the most common congenital lung malformation.","html":"\u003cb\u003eNow, let’s move\u003c/b\u003e on to CPAM, the most common congenital lung malformation.","cue":null},{"text":"It results from abnormal development of the terminal airways and is classified into five types, from type 0 to type 4.","html":"\u003cb\u003eIt results\u003c/b\u003e from abnormal development of the terminal airways and is \u003cb\u003eclassified into five\u003c/b\u003e types, from type 0 to type 4.","cue":null},{"text":"The key is the cyst size.","html":"The key is the cyst size.","cue":null},{"text":"For us, types 1, 2, and 3, in green, are the important ones.","html":"For us, types 1, 2, and 3, in \u003cb\u003egreen, are the important ones.\u003c/b\u003e","cue":null},{"text":"Type 1 is the most common.","html":"Type 1 is the most common.","cue":null},{"text":"It has large cysts, more than 2 centimeters.","html":"It has large cysts, more than 2 \u003cb\u003ecentimeters.\u003c/b\u003e","cue":null},{"text":"Rarely, it can turn into cancer.","html":"\u003cb\u003eRarely, it can turn into cancer.\u003c/b\u003e","cue":null},{"text":"Type 2 has small cysts, less than 2 centimeters.","html":"Type 2 has small cysts, \u003cb\u003eless\u003c/b\u003e than 2 \u003cb\u003ecentimeters.\u003c/b\u003e","cue":null},{"text":"It often comes with other anomalies, or with sequestration (시퀘스트레이션).","html":"It often \u003cb\u003ecomes\u003c/b\u003e with other anomalies, or with sequestration \u003cspan class=\u0027ko\u0027\u003e(시퀘스트레이션)\u003c/span\u003e.","cue":null},{"text":"Type 3 has tiny cysts, so it looks solid.","html":"Type 3 has \u003cb\u003etiny\u003c/b\u003e cysts, so it looks solid.","cue":null},{"text":"Type 0 is lethal at birth, so we don’t see it on imaging.","html":"Type 0 is lethal at birth, so we \u003cb\u003edon’t see\u003c/b\u003e it on imaging.","cue":null},{"text":"And type 4 looks the same as cystic pleuropulmonary blastoma that we will discuss later (플루로펄머네리 블래스토마).","html":"And type 4 looks the same as cystic \u003cb\u003epleuropulmonary blastoma that we will discuss later\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(플루로펄머네리 블래스토마)\u003c/span\u003e.","cue":null}]},{"n":35,"title":"Congenital pulmonary airway malformation (CPAM)","target":null,"items":[{"text":"On imaging, type 1 shows large cysts with several smaller cysts.","html":"On imaging, type 1 \u003cb\u003eshows\u003c/b\u003e large cysts with several smaller cysts.","cue":null},{"text":"Type 2 shows partially air-filled multicystic masses, with some solid-appearing lung tissue.","html":"Type 2 \u003cb\u003eshows\u003c/b\u003e partially air-filled multicystic masses, with some solid-appearing lung tissue.","cue":null},{"text":"Type 3 looks solid, with mild contrast enhancement, because the cysts are microscopic.","html":"Type 3 \u003cb\u003elooks\u003c/b\u003e solid, with mild contrast enhancement, because the cysts are microscopic.","cue":null},{"text":"In newborns, the cysts can be filled with fluid at first.","html":"\u003cb\u003eIn newborns,\u003c/b\u003e the cysts can be filled with \u003cb\u003efluid at first.\u003c/b\u003e","cue":null},{"text":"CPAM can get infected.","html":"CPAM can \u003cb\u003eget infected.\u003c/b\u003e","cue":null},{"text":"Then it looks like pneumonia or a lung abscess.","html":"\u003cb\u003eThen it looks like pneumonia\u003c/b\u003e or a lung \u003cb\u003eabscess.\u003c/b\u003e","cue":null},{"text":"And the most important differential diagnosis is pleuropulmonary blastoma (플루로펄머네리 블래스토마).","html":"\u003cb\u003eAnd the most important differential diagnosis is pleuropulmonary blastoma\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(플루로펄머네리 블래스토마)\u003c/span\u003e.","cue":null}]},{"n":36,"title":"3d/F","target":null,"items":[{"text":"Let’s look at the first case.","html":"\u003cb\u003eLet’s look at the first case.\u003c/b\u003e","cue":null},{"text":"This newborn girl had an abnormal lung lesion on fetal ultrasound.","html":"\u003cb\u003eThis newborn girl\u003c/b\u003e had an abnormal lung lesion on fetal \u003cb\u003eultrasound.\u003c/b\u003e","cue":null},{"text":"This is the day-one radiograph.","html":"\u003cb\u003eThis is the day-one radiograph.\u003c/b\u003e","cue":null},{"text":"The baby is intubated, and there is a cystic mass in the left lung.","html":"\u003cb\u003eThe baby is intubated, and there is a cystic mass in the left\u003c/b\u003e lung.","cue":null},{"text":"The image is slightly rotated, but there also appears to be some rightward mediastinal shift.","html":"\u003cb\u003eThe image is slightly rotated, but there also appears to be some rightward mediastinal shift.\u003c/b\u003e","cue":null},{"text":"Two days later, the cyst has increased in size and developed internal opacity, possibly from fluid or hemorrhage.","html":"\u003cb\u003eTwo days later, the cyst has increased in size and developed internal opacity, possibly from fluid or hemorrhage.\u003c/b\u003e","cue":null},{"text":"There is also a large left pneumothorax with collapse of the left lower lobe.","html":"\u003cb\u003eThere is also a large left pneumothorax with collapse of the left lower lobe.\u003c/b\u003e","cue":null},{"text":"CT was obtained after chest tube placement.","html":"\u003cb\u003eCT was obtained after chest tube placement.\u003c/b\u003e","cue":null},{"text":"We can see a large cystic lesion with an air-fluid level, residual pneumothorax, and significant rightward mediastinal shift.","html":"\u003cb\u003eWe can see a large cystic\u003c/b\u003e lesion with an \u003cb\u003eair-fluid level, residual pneumothorax, and significant rightward mediastinal shift.\u003c/b\u003e","cue":null},{"text":"The patient underwent surgery, and pathology confirmed type 1 CPAM.","html":"\u003cb\u003eThe patient underwent surgery, and pathology confirmed\u003c/b\u003e type 1 CPAM.","cue":null},{"text":"This is the classic large-cyst type of CPAM, with a dominant cyst measuring greater than 2 cm.","html":"\u003cb\u003eThis is the classic large-cyst\u003c/b\u003e type of CPAM, with a \u003cb\u003edominant cyst measuring greater than 2 cm.\u003c/b\u003e","cue":null}]},{"n":37,"title":"3d/F","target":null,"items":[{"text":"Here is another newborn girl with suspected CPAM on fetal ultrasound.","html":"\u003cb\u003eHere is another newborn girl with suspected\u003c/b\u003e CPAM on fetal \u003cb\u003eultrasound.\u003c/b\u003e","cue":null},{"text":"There is a large multicystic lesion in the left lung, with left pneumothorax and rightward mediastinal shift.","html":"\u003cb\u003eThere is a large multicystic\u003c/b\u003e lesion in the \u003cb\u003eleft\u003c/b\u003e lung, with \u003cb\u003eleft pneumothorax and rightward mediastinal shift.\u003c/b\u003e","cue":null},{"text":"CT shows large air-filled cysts.","html":"\u003cb\u003eCT shows large air-filled cysts.\u003c/b\u003e","cue":null}]},{"n":38,"title":"0d/M","target":null,"items":[{"text":"This patient also had an abnormal lung lesion on fetal ultrasound.","html":"\u003cb\u003eThis patient\u003c/b\u003e also had an abnormal lung lesion on fetal \u003cb\u003eultrasound.\u003c/b\u003e","cue":null},{"text":"On the chest radiograph, there is increased opacity in the right upper lobe, with multiple small, round lucencies clustered within the lesion.","html":"\u003cb\u003eOn the chest radiograph, there is increased opacity\u003c/b\u003e in the right upper lobe, with \u003cb\u003emultiple small, round lucencies clustered within\u003c/b\u003e the lesion.","cue":null},{"text":"On CT, we can clearly see multiple small cysts clustered together in the right upper lobe.","html":"\u003cb\u003eOn CT, we can clearly see multiple small cysts clustered together\u003c/b\u003e in the right upper lobe.","cue":null},{"text":"Unlike the previous case, these cysts are much smaller.","html":"\u003cb\u003eUnlike the previous case, these cysts are much smaller.\u003c/b\u003e","cue":null},{"text":"So, this has the typical appearance of type 2 CPAM, and the diagnosis was confirmed after surgery.","html":"\u003cb\u003eSo, this has the typical appearance\u003c/b\u003e of type 2 CPAM, and the diagnosis was \u003cb\u003econfirmed after surgery.\u003c/b\u003e","cue":null}]},{"n":39,"title":"Congenital pulmonary airway malformation (CPAM)","target":null,"items":[{"text":"CPAM can get infected.","html":"CPAM can \u003cb\u003eget infected.\u003c/b\u003e","cue":null},{"text":"Then it looks like pneumonia or a lung abscess.","html":"\u003cb\u003eThen it looks\u003c/b\u003e like pneumonia or a lung abscess.","cue":null},{"text":"And the most important differential diagnosis is pleuropulmonary blastoma (플루로펄머네리 블래스토마).","html":"\u003cb\u003eAnd the most important differential diagnosis\u003c/b\u003e is pleuropulmonary blastoma \u003cspan class=\u0027ko\u0027\u003e(플루로펄머네리 블래스토마)\u003c/span\u003e.","cue":null}]},{"n":40,"title":"DIAGNOSIS:","target":null,"items":[{"text":"Here is an example of superimposed infection.","html":"\u003cb\u003eHere is an example of superimposed infection.\u003c/b\u003e","cue":null},{"text":"This is a 4-month-old girl with multiple congenital anomalies and a tracheostomy.","html":"\u003cb\u003eThis is a 4-month-old girl with multiple\u003c/b\u003e congenital \u003cb\u003eanomalies and a tracheostomy.\u003c/b\u003e","cue":null},{"text":"On the radiograph, there are multiple air-containing cystic lesions in the right mid to lower lung.","html":"\u003cb\u003eOn the radiograph, there are multiple air-containing cystic lesions\u003c/b\u003e in the right \u003cb\u003emid\u003c/b\u003e to lower lung.","cue":null},{"text":"CT shows a cluster of small cysts in the right lower lobe, suggesting CPAM.","html":"\u003cb\u003eCT shows a cluster of small cysts\u003c/b\u003e in the right lower lobe, \u003cb\u003esuggesting CPAM.\u003c/b\u003e","cue":null},{"text":"Now, look at the follow-up study at 10 months.","html":"\u003cb\u003eNow, look at the follow-up study at 10 months.\u003c/b\u003e","cue":null},{"text":"There is new consolidation in the same area, obscuring the underlying cystic lesions.","html":"\u003cb\u003eThere is new consolidation in the same area, obscuring the underlying cystic lesions.\u003c/b\u003e","cue":null},{"text":"On CT, there is low-attenuation consolidation in the right lower lobe, consistent with superimposed pneumonia.","html":"\u003cb\u003eOn CT, there is low-attenuation consolidation\u003c/b\u003e in the right lower lobe, \u003cb\u003econsistent with superimposed pneumonia.\u003c/b\u003e","cue":null},{"text":"The patient later underwent surgery, and type 2 CPAM was confirmed.","html":"\u003cb\u003eThe patient later underwent surgery,\u003c/b\u003e and type 2 \u003cb\u003eCPAM was confirmed.\u003c/b\u003e","cue":null},{"text":"The important point is that infection can obscure the underlying CPAM.","html":"\u003cb\u003eThe important point is that infection can obscure the underlying CPAM.\u003c/b\u003e","cue":null},{"text":"If you only saw the later study, the diagnosis could be difficult.","html":"\u003cb\u003eIf you only saw the later study,\u003c/b\u003e the diagnosis could be \u003cb\u003edifficult.\u003c/b\u003e","cue":null},{"text":"So, comparison with prior imaging and clinical history is very important.","html":"\u003cb\u003eSo, comparison with prior imaging and clinical history is very important.\u003c/b\u003e","cue":null}]},{"n":41,"title":"2/M","target":null,"items":[{"text":"Let’s look at the next case.","html":"\u003cb\u003eLet’s look at the next case.\u003c/b\u003e","cue":null},{"text":"This is a 2-year-old boy who was initially treated for pneumonia at an outside hospital.","html":"\u003cb\u003eThis is a 2-year-old boy who was initially treated\u003c/b\u003e for pneumonia at an \u003cb\u003eoutside hospital.\u003c/b\u003e","cue":null},{"text":"CT showed a thick-walled, septated cavitary lesion in the right lower lobe with internal components.","html":"\u003cb\u003eCT showed a thick-walled, septated cavitary lesion\u003c/b\u003e in the right \u003cb\u003elower\u003c/b\u003e lobe with \u003cb\u003einternal components.\u003c/b\u003e","cue":null},{"text":"It was initially thought to be a lung abscess, so a drainage catheter was placed.","html":"\u003cb\u003eIt was initially thought\u003c/b\u003e to be a lung \u003cb\u003eabscess, so a drainage catheter was placed.\u003c/b\u003e","cue":null},{"text":"Despite aggressive treatment and additional drainage, the lesion did not improve.","html":"\u003cb\u003eDespite aggressive treatment and additional drainage, the lesion did not improve.\u003c/b\u003e","cue":null},{"text":"In fact, two weeks later, it had increased significantly in size.","html":"\u003cb\u003eIn fact, two\u003c/b\u003e weeks later, it had \u003cb\u003eincreased significantly in size.\u003c/b\u003e","cue":null},{"text":"Of course, an abscess can get worse.","html":"\u003cb\u003eOf course, an abscess can get worse.\u003c/b\u003e","cue":null},{"text":"But rapid growth despite appropriate treatment and drainage is concerning.","html":"\u003cb\u003eBut rapid growth despite appropriate treatment and drainage is concerning.\u003c/b\u003e","cue":null},{"text":"So, we became concerned about a tumor, particularly pleuropulmonary blastoma.","html":"\u003cb\u003eSo, we became concerned about a tumor, particularly\u003c/b\u003e pleuropulmonary blastoma.","cue":null},{"text":"The patient underwent surgery, and PPB was confirmed.","html":"\u003cb\u003eThe patient underwent surgery, and PPB was confirmed.\u003c/b\u003e","cue":null},{"text":"If you compare this with the previous case of CPAM with superimposed pneumonia, they can actually look quite similar.","html":"\u003cb\u003eIf you compare this with the previous case\u003c/b\u003e of CPAM with \u003cb\u003esuperimposed\u003c/b\u003e pneumonia, they can actually \u003cb\u003elook quite similar.\u003c/b\u003e","cue":null},{"text":"So, the important point is that PPB can sometimes mimic an infected CPAM or lung abscess, making the diagnosis challenging.","html":"\u003cb\u003eSo, the important point is that PPB can sometimes mimic an infected\u003c/b\u003e CPAM or lung \u003cb\u003eabscess, making\u003c/b\u003e the diagnosis \u003cb\u003echallenging.\u003c/b\u003e","cue":null}]},{"n":42,"title":"Pleuropulmonary blastoma (PPB)","target":null,"items":[{"text":"So, pleuropulmonary blastoma, or PPB, is a malignant tumor of early childhood.","html":"So, pleuropulmonary blastoma, or PPB, is a malignant tumor of \u003cb\u003eearly\u003c/b\u003e childhood.","cue":null},{"text":"It can involve the lung, pleura, or both, and it is strongly associated with DICER1 mutations.","html":"\u003cb\u003eIt can involve\u003c/b\u003e the lung, \u003cb\u003epleura,\u003c/b\u003e or both, and it is \u003cb\u003estrongly associated\u003c/b\u003e with DICER1 mutations.","cue":null},{"text":"PPB is classified into three main types based on its imaging and pathologic appearance.","html":"PPB is \u003cb\u003eclassified into three main\u003c/b\u003e types \u003cb\u003ebased on its imaging and pathologic appearance.\u003c/b\u003e","cue":null},{"text":"Type I is purely cystic and has the least malignant potential.","html":"Type I is \u003cb\u003epurely\u003c/b\u003e cystic and has the \u003cb\u003eleast\u003c/b\u003e malignant \u003cb\u003epotential.\u003c/b\u003e","cue":null},{"text":"Type II has both cystic and solid components, like this.","html":"Type II has both cystic and solid \u003cb\u003ecomponents, like this.\u003c/b\u003e","cue":null},{"text":"And type III is predominantly solid and is the most aggressive form.","html":"And type III is \u00
