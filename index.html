7\u003e(퍼라이어토템퍼럴)\u003c/span\u003e\u003cb\u003elobe, consistent with chronic ischemic change.\u003c/b\u003e","cue":"Point to the FLAIR images"},{"text":"Remember, most routine brain MRIs in NF1 do not include MRA.","html":"\u003cb\u003eRemember, most routine brain MRIs in NF1 do not include\u003c/b\u003e MRA.","cue":"Point to the box"},{"text":"So, always check the flow voids of the major vessels on T2-weighted images.","html":"So, always check the flow voids of the \u003cb\u003emajor\u003c/b\u003e vessels on \u003cb\u003eT2-weighted images.\u003c/b\u003e","cue":null}]},{"n":49,"title":"Dural ectasia and meningoceles","target":null,"items":[{"text":"Next, dural ectasia — a focal dilatation of the dural sac, related to underlying bony weakness.","html":"\u003cb\u003eNext,\u003c/b\u003e dural ectasia — a focal dilatation of the dural sac, related to underlying bony weakness.","cue":null},{"text":"On CT, there is a large water-density mass next to the spine with adjacent bone erosion.","html":"\u003cb\u003eOn CT, there is a large water-density mass next to the spine with adjacent bone erosion.\u003c/b\u003e","cue":"Point to the CT"},{"text":"It can look like a posterior mediastinal mass.","html":"\u003cb\u003eIt can look like a posterior mediastinal mass.\u003c/b\u003e","cue":null},{"text":"But on MRI, it follows CSF signal and communicates with the spinal canal.","html":"\u003cb\u003eBut on MRI, it follows CSF signal and communicates with the spinal canal.\u003c/b\u003e","cue":"Point to the coronal MRI"},{"text":"So, we can tell that this is a lateral thoracic meningocele.","html":"\u003cb\u003eSo, we can tell that this is a lateral thoracic\u003c/b\u003e meningocele.","cue":null},{"text":"And here, you can see dilatation of the dural sac, with scalloping of the posterior vertebral bodies.","html":"\u003cb\u003eAnd here, you can see\u003c/b\u003e dilatation of the dural sac, with \u003cb\u003escalloping of the posterior vertebral bodies.\u003c/b\u003e","cue":"Point to the sagittal MRI"}]},{"n":50,"title":"Scoliosis","target":null,"items":[{"text":"Scoliosis is seen in about 21% of patients with NF1.","html":"Scoliosis is \u003cb\u003eseen\u003c/b\u003e in about 21% of patients with NF1.","cue":null},{"text":"Dystrophic scoliosis is associated with dysplastic changes of the vertebrae.","html":"Dystrophic scoliosis is \u003cb\u003eassociated\u003c/b\u003e with dysplastic changes of the vertebrae.","cue":null},{"text":"It tends to start earlier and progress rapidly.","html":"\u003cb\u003eIt tends to start\u003c/b\u003e earlier and \u003cb\u003eprogress rapidly.\u003c/b\u003e","cue":null},{"text":"And as you can see in this image, it can become very severe, sometimes even causing respiratory compromise.","html":"\u003cb\u003eAnd as you can see in this image, it can become very severe, sometimes even causing\u003c/b\u003e respiratory compromise.","cue":null}]},{"n":51,"title":"Radiologic manifestations","target":null,"items":[{"text":"Finally, part four: other tumors. .","html":"\u003cb\u003eFinally,\u003c/b\u003e part \u003cb\u003efour:\u003c/b\u003e other tumors. .","cue":null}]},{"n":52,"title":"Gastrointestinal stromal tumor (GIST)","target":null,"items":[{"text":"First, non-ossifying fibromas, or NOFs.","html":"\u003cb\u003eFirst,\u003c/b\u003e non-ossifying fibromas, or \u003cb\u003eNOFs.\u003c/b\u003e","cue":"Point to the knees"},{"text":"Although I included them in this section, they are more of a developmental bone lesion than a true tumor.","html":"\u003cb\u003eAlthough I included them in this section, they are more of a developmental bone lesion than a true\u003c/b\u003e tumor.","cue":null},{"text":"Here, you can see multiple NOFs around both knees.","html":"\u003cb\u003eHere, you can see multiple NOFs around both knees.\u003c/b\u003e","cue":null},{"text":"NF1 patients also have a higher risk of GIST (기스트).","html":"\u003cb\u003eNF1 patients also have a higher risk\u003c/b\u003e of GIST \u003cspan class=\u0027ko\u0027\u003e(기스트)\u003c/span\u003e.","cue":"Point to the middle image"},{"text":"Here, you can see an enhancing mass in the small bowel.","html":"\u003cb\u003eHere, you can see an enhancing mass in the small bowel.\u003c/b\u003e","cue":null},{"text":"NF1 is also associated with pheochromocytomas 피-오-크로-모-사이-토-머즈 and paragangliomas 패러-갱-글리-오-머즈.","html":"\u003cb\u003eNF1 is also associated\u003c/b\u003e with pheochromocytomas \u003cb\u003e피-오-크로-모-사이-토-머즈\u003c/b\u003e and paragangliomas \u003cb\u003e패러-갱-글리-오-머즈.\u003c/b\u003e","cue":"Point to the right image"},{"text":"Here, you can see a small enhancing nodule next to the aorta.","html":"\u003cb\u003eHere, you can see a small enhancing nodule next to the aorta.\u003c/b\u003e","cue":null},{"text":"So, on abdominal imaging in NF1, remember to check the small bowel, adrenal glands, and along the aorta.","html":"\u003cb\u003eSo, on abdominal imaging in NF1, remember to check the small bowel, adrenal glands, and along the aorta.\u003c/b\u003e","cue":null}]},{"n":53,"title":"Surveillance","target":null,"items":[{"text":"So far, we’ve seen many different imaging manifestations of NF1.","html":"\u003cb\u003eSo far, we’ve seen many different imaging manifestations of NF1.\u003c/b\u003e","cue":null},{"text":"But one important thing to remember is that these findings don’t all appear at the same time.","html":"\u003cb\u003eBut one important thing to remember is that these findings don’t all appear at the same time.\u003c/b\u003e","cue":null},{"text":"They tend to develop at different ages.","html":"\u003cb\u003eThey tend to develop at different\u003c/b\u003e ages.","cue":null},{"text":"For example, café-au-lait macules, skeletal dysplasia, plexiform neurofibroma can appear very early in life.","html":"\u003cb\u003eFor example, caf\u0026#233;-au-lait macules, skeletal dysplasia, plexiform neurofibroma can appear very early in life.\u003c/b\u003e","cue":null},{"text":"In early childhood, we start to see optic pathway gliomas, as well as learning and developmental problems.","html":"\u003cb\u003eIn early childhood, we start to see optic pathway gliomas, as well as learning and developmental problems.\u003c/b\u003e","cue":null},{"text":"Neurofibromas become more common later in childhood and adolescence.","html":"\u003cb\u003eNeurofibromas become more common later in childhood and adolescence.\u003c/b\u003e","cue":null},{"text":"And in adulthood, we become more concerned about malignancies, particularly MPNST, breast cancer, and high-grade glioma.","html":"\u003cb\u003eAnd in adulthood, we become more concerned about malignancies, particularly MPNST, breast cancer, and high-grade glioma.\u003c/b\u003e","cue":null},{"text":"I didn\u0027t cover breast cancer today, but women with NF1 also have an increased risk of breast cancer, particularly at a younger age.","html":"\u003cb\u003eI didn\u0026#39;t cover breast cancer today, but women with NF1 also have an increased risk of breast cancer, particularly at a younger\u003c/b\u003e age.","cue":null},{"text":"So, the key point is that NF1 surveillance needs to be age-appropriate.","html":"\u003cb\u003eSo, the key point is that NF1\u003c/b\u003e surveillance \u003cb\u003eneeds\u003c/b\u003e to be age-appropriate.","cue":null}]},{"n":54,"title":"Role of Imaging in the Management of Plexiform Neurofibroma","target":null,"items":[{"text":"Now, among these manifestations, plexiform neurofibromas need particular attention because of the risk of malignant transformation to MPNST.","html":"\u003cb\u003eNow, among these manifestations,\u003c/b\u003e plexiform neurofibromas \u003cb\u003eneed particular attention because of the risk of malignant transformation\u003c/b\u003e to MPNST.","cue":null},{"text":"So, how should we follow them?","html":"\u003cb\u003eSo, how should we follow them?\u003c/b\u003e","cue":null},{"text":"At baseline, if the patient has no symptoms, whole-body MRI without contrast can be performed around the transition to adulthood, mainly to assess the overall internal PN burden.","html":"At baseline, if the \u003cb\u003epatient\u003c/b\u003e has no symptoms, whole-body MRI \u003cb\u003ewithout\u003c/b\u003e contrast can be \u003cb\u003eperformed around\u003c/b\u003e the transition to adulthood, \u003cb\u003emainly to assess the overall\u003c/b\u003e internal PN burden.","cue":null},{"text":"If the patient has symptoms, we can perform local or whole-body MRI.","html":"\u003cb\u003eIf the patient\u003c/b\u003e has symptoms, we can \u003cb\u003eperform\u003c/b\u003e local or whole-body MRI.","cue":null},{"text":"For surveillance of a known PN, we usually use local MRI.","html":"For surveillance of a \u003cb\u003eknown\u003c/b\u003e PN, we \u003cb\u003eusually use\u003c/b\u003e local MRI.","cue":null},{"text":"And if we suspect malignant transformation to MPNST, we use local MRI with contrast, along with FDG PET/CT.","html":"\u003cb\u003eAnd if we suspect malignant transformation\u003c/b\u003e to MPNST, we \u003cb\u003euse\u003c/b\u003e local MRI with contrast, \u003cb\u003ealong\u003c/b\u003e with FDG PET/CT.","cue":null},{"text":"For suspected MPNST, I also recommend adding DWI to the MRI protocol.","html":"For suspected MPNST, I also \u003cb\u003erecommend adding\u003c/b\u003e DWI to the MRI \u003cb\u003eprotocol.\u003c/b\u003e","cue":null}]},{"n":55,"title":"Summary","target":null,"items":[{"text":"This is my last slide.","html":"\u003cb\u003eThis is my last slide.\u003c/b\u003e","cue":null},{"text":"Let me summarize.","html":"\u003cb\u003eLet me summarize.\u003c/b\u003e","cue":null},{"text":"NF1 is a common, multisystemic genetic disease with heterogeneous phenotypes, so patients need lifelong surveillance.","html":"\u003cb\u003eNF1\u003c/b\u003e is a common, multisystemic genetic disease with heterogeneous phenotypes, so \u003cb\u003epatients need\u003c/b\u003e lifelong surveillance.","cue":null},{"text":"We’ve seen many different findings today, but please remember these three, because they are part of the diagnostic criteria.","html":"\u003cb\u003eWe’ve seen many\u003c/b\u003e different findings \u003cb\u003etoday, but please remember these three, because they are part\u003c/b\u003e of the diagnostic criteria.","cue":null},{"text":"The first three are part of the diagnostic criteria.","html":"\u003cb\u003eThe first three are part\u003c/b\u003e of the diagnostic criteria.","cue":null},{"text":"First, neurofibromas — remember the four imaging types.","html":"\u003cb\u003eFirst,\u003c/b\u003e neurofibromas — \u003cb\u003eremember the four\u003c/b\u003e imaging types.","cue":null},{"text":"Plexiform neurofibroma is the hallmark.","html":"Plexiform neurofibroma is the hallmark.","cue":null},{"text":"Second, optic pathway glioma.","html":"\u003cb\u003eSecond,\u003c/b\u003e optic pathway glioma.","cue":null},{"text":"It can regress, so we treat only for vision loss.","html":"It can regress, so we treat only for vision loss.","cue":null},{"text":"Third, bone dysplasia — sphenoid wing dysplasia, tibial bowing, and pseudarthrosis.","html":"\u003cb\u003eThird,\u003c/b\u003e bone dysplasia — sphenoid wing dysplasia, tibial bowing, and pseudarthrosis.","cue":null},{"text":"Fourth, and most important: detect atypical neurofibroma and MPNST early.","html":"\u003cb\u003eFourth, and most important:\u003c/b\u003e detect atypical neurofibroma and MPNST early.","cue":null},{"text":"Look for a distinct nodular lesion and low ADC.","html":"\u003cb\u003eLook\u003c/b\u003e for a distinct nodular lesion and low ADC.","cue":null},{"text":"And finally, surveillance should be age-appropriate.","html":"\u003cb\u003eAnd finally,\u003c/b\u003e surveillance should be age-appropriate.","cue":null}]},{"n":56,"title":"Thank you for your attention","target":null,"items":[{"text":"Thank you for your attention.","html":"Thank you for your attention.","cue":null},{"text":"I\u0027m happy to take any questions.","html":"\u003cb\u003eI\u0026#39;m happy to take any questions.\u003c/b\u003e","cue":null}]}];

<script>
(function () {
  const DATA = window.NF1_SCRIPT || [];
  // flatten to sentences
  const S = [];
  DATA.forEach((sl, si) => sl.items.forEach((it, k) => S.push({ si, k, last: k === sl.items.length - 1, ...it })));
  const $ = (id) => document.getElementById(id);

  // ---------- state ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('nf1p.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('nf1p.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const hot = window.claude && window.claude.hot;
  const hotData = (hot && hot.data) || {};
  let pos = Math.min(hotData.pos ?? store.get('pos', 0), S.length - 1);
  let mode = store.get('mode', 'pace');
  let wpm = store.get('wpm', 110);
  let size = store.get('size', window.matchMedia('(max-width: 560px)').matches ? 26 : 34);   // phones start smaller
  let view = store.get('view', window.matchMedia('(max-width: 560px)').matches ? 'k3' : 'all');
  function applyView() { document.body.classList.toggle('k3', view === 'k3'); const b = $('view'); if (b) b.textContent = view === 'k3' ? '전체 보기' : '3줄 보기'; }
  let running = false;
  let t0 = null, elapsedBefore = store.get('elapsed', 0);
  if (hot && hot.snapshot) hot.snapshot(() => ({ pos }));
  document.documentElement.dataset.theme = store.get('theme', 'dark');
  document.documentElement.style.setProperty('--size', size + 'px');

  // ---------- words ----------
  const NUM = { zero: '0', one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9', ten: '10', eleven: '11', twelve: '12', thirteen: '13', fourteen: '14', fifteen: '15', sixteen: '16', seventeen: '17', eighteen: '18', nineteen: '19', twenty: '20', thirty: '30', forty: '40', fifty: '50', hundred: '100' };
  function norm(w) {
    w = w.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9.'%-]/g, '').replace(/^[.'-]+|[.'%-]+$/g, '').replace(/'s$/, '');
    if (NUM[w]) w = NUM[w];
    if (w.length > 3 && /[a-z]s$/.test(w) && !/ss$/.test(w)) w = w.slice(0, -1);
    return w;
  }
  function spoken(text) {
    return text.replace(/\[[^\]]*\]/g, ' ').replace(/\([^)]*[가-힣][^)]*\)/g, ' ')
      .split(/[\s—–/]+/).flatMap(t => t.includes('-') && !/\d/.test(t) ? t.split('-') : [t]).map(norm).filter(Boolean);
  }
  S.forEach(s => { s.words = spoken(s.text); });
  // planned start time of each slide: word share of a 38-minute talk
  const TALK_SEC = 38 * 60;
  const slideWords = DATA.map((sl, si) => S.filter(x => x.si === si).reduce((a, x) => a + x.words.length, 0));
  const totalWords = slideWords.reduce((a, b) => a + b, 0) || 1;
  const PLAN = []; slideWords.reduce((acc, w, i) => { PLAN[i] = acc / totalWords * TALK_SEC; return acc + w; }, 0);
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 9;
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function same(a, b) {
    if (a === b) return true;
    if (a.length >= 5 && b.length >= 5 && a.slice(0, 5) === b.slice(0, 5)) return true;
    const L = Math.max(a.length, b.length);
    return L >= 4 && lev(a, b) <= (L >= 8 ? 2 : 1);
  }
  const STOP = new Set('a an the and or of in on at to for with by from as is are was were be been it its this that these those we you i they he she can may so but if not also very more than then there here which who what when how do does has have had about into just like one some all each other only now let well our your their'.split(' '));
  // greedy alignment of heard words onto target words; content words may re-sync further ahead after the recognizer drops a chunk
  function align(target, heard) {
    let p = 0, m = 0;
    for (const h of heard) {
      const reach = STOP.has(h) ? 3 : 9;
      for (let j = p; j < Math.min(target.length, p + reach); j++) {
        if (same(target[j], h)) { m++; p = j + 1; break; }
      }
    }
    return { p, m };
  }
  function doneReading(s, heard) {
    const n = s.words.length; if (!n) return true;
    const { p, m } = align(s.words, heard);
    s._prog = n ? p / n : 1;
    // the sentence's last content words were just heard
    const tail = s.words.filter(w => !STOP.has(w)).slice(-2);
    const recent = heard.slice(-6);
    const endHit = tail.some(t => recent.some(h => same(t, h)));
    if (n <= 4) return p >= n - 1 || (endHit && m >= 1);
    return (p >= n - 2 && m >= n * 0.4) || m >= n * 0.65 || (endHit && p >= n * 0.5);
  }
  // the speaker skipped ahead: the next sentence's opening words appear, in order, among the latest heard words
  function startsNext(heard) {
    const nx = S[pos + 1]; if (!nx || heard.length < 3) return false;
    const head = nx.words.slice(0, 5);
    const need = Math.min(4, head.length);
    if (need < 3) return false;
    return align(head, heard.slice(-8)).m >= need;
  }
  function onHeard(h) {
    const s = S[pos];
    const done = doneReading(s, h);
    const m = $('meter'); if (m) m.firstChild.style.width = Math.round((s._prog || 0) * 100) + '%';
    if ((done || startsNext(h)) && pos < S.length - 1) {
      go(pos + 1, true);
      if (!done) carry = h.slice(-8);
    }
  }

  // ---------- render ----------
  let renderedSlide = -1;
  function renderK3() {
    const s = S[pos], sl = DATA[s.si];
    renderedSlide = -1;
    $('slideno').textContent = sl.n + ' / ' + DATA.length;
    $('slidetitle').textContent = sl.title || 'Slide ' + sl.n;
    $('thumb').src = 'img/s' + sl.n + '.jpg';
    // a finger is holding the text pulled down: redraw, but do not yank the view back
    const keep = touching && peeking(), keepTop = $('stage').scrollTop;
    clearTimeout(peekT);
    const st = $('stage'), col = $('col'); col.innerHTML = '';
    // always three sentences: previous, current, next — across slide boundaries too;
    // at the very start / end of the talk the window shifts so three lines are still shown
    let first = Math.max(0, pos - 1);
    if (first + 2 > S.length - 1) first = Math.max(0, S.length - 3);
    // earlier sentences sit above the three lines: pull the text down to read them
    if (first > 0) {
      const hist = document.createElement('div'); hist.className = 'histbox'; hist.id = 'hist';
      let lastSi = -1;
      for (let i = Math.max(0, first - HISTORY); i < first; i++) {
        const x = S[i];
        if (x.si !== lastSi) { const t = document.createElement('span'); t.className = 'histtag'; t.textContent = '슬라이드 ' + DATA[x.si].n; hist.appendChild(t); lastSi = x.si; }
        const p = document.createElement('p'); p.className = 's hist'; p.style.margin = '0'; p.innerHTML = x.html;
        p.addEventListener('click', () => go(i)); hist.appendChild(p);
      }
      col.appendChild(hist);
    }
    const core = document.createElement('div'); core.className = 'core'; core.id = 'core';
    const coreIn = document.createElement('div'); coreIn.className = 'coreIn'; coreIn.id = 'coreIn';
    core.appendChild(coreIn); col.appendChild(core);
    const nodes = [];
    for (let i = first; i <= Math.min(S.length - 1, first + 2); i++) {
      const x = S[i];
      const cls = i < pos ? 'done' : (i === pos ? 'cur' : 'upnext');
      if (i === pos && x.cue) { const c = document.createElement('div'); c.className = 'cue' + (running ? ' flash' : ''); c.textContent = x.cue; coreIn.appendChild(c); }
      const p = document.createElement('p'); p.className = 's ' + cls; p.style.margin = '0'; p.dataset.i = i;
      const tag = x.si !== s.si ? '<span class="nexttag">' + (i < pos ? '◀ 이전 슬라이드 ' : '▶ 다음 슬라이드 ') + DATA[x.si].n + '</span>' : '';
      p.innerHTML = tag + x.html; coreIn.appendChild(p); nodes.push(p);
      p.addEventListener('click', () => go(i));
      if (i === pos) { const m = document.createElement('div'); m.className = 'meter'; m.id = 'meter'; m.innerHTML = '<i></i>'; coreIn.appendChild(m); }
    }
    core.style.minHeight = Math.max(0, st.clientHeight - 24) + 'px';
    fitK3(nodes);
    st.scrollTop = keep ? keepTop : coreTop();
    $('tgt').textContent = '/ 목표 ' + fmt(PLAN[s.si]);
    store.set('pos', pos);
    tick();
  }
  // keep every shown line fully visible: if three lines do not fit, drop the line after the
  // current one (previous + current stay together), then shrink the text a little,
  // and only as a last resort drop the previous line
  function fitK3(nodes) {
    const st = $('stage'), box = $('coreIn');
    const fits = () => box.scrollHeight <= st.clientHeight - 24;
    const setK = (k) => box.style.setProperty('--k3s', String(k));
    const cur = nodes.find(n => +n.dataset.i === pos);
    // the line kept together with the current one: the previous sentence (or the next one at the very start)
    const partner = nodes.find(n => +n.dataset.i === pos - 1) || nodes.find(n => +n.dataset.i === pos + 1);
    const extras = nodes.filter(n => n !== cur && n !== partner)
      .sort((a, b) => Math.abs(+b.dataset.i - pos) - Math.abs(+a.dataset.i - pos));   // farthest first
    setK(1);
    if (fits()) return;                                          // 1) three lines, normal size
    for (let k = 0.95; k >= 0.85; k = +(k - 0.05).toFixed(2)) { setK(k); if (fits()) return; }   // 2) three lines, slightly smaller
    setK(1);
    while (extras.length) { extras.shift().remove(); if (fits()) return; }   // 3) long sentence: previous + current
    for (let k = 0.94; k >= 0.7; k = +(k - 0.06).toFixed(2)) { setK(k); if (fits()) return; }   //    ... a bit smaller
    if (partner) partner.remove();                               // 4) current sentence alone, as large as fits
    for (let k = 1; k >= 0.5; k = +(k - 0.05).toFixed(2)) { setK(k); if (fits()) return; }
    // 5) still too long: the stage scrolls, so the rest can be read by pushing the text up
  }
  // ---------- pull down to read earlier sentences ----------
  const HISTORY = 8;          // sentences kept above the three lines
  let peekT = null, touching = false;
  function coreTop() {
    const c = document.getElementById('core'), st = $('stage');
    return c ? Math.max(0, c.offsetTop - parseFloat(getComputedStyle(st).paddingTop || '0')) : 0;
  }
  function peeking() { return view === 'k3' && $('stage').scrollTop < coreTop() - 4; }
  function snapBack() {
    if (view !== 'k3') return;
    const st = $('stage'), top = coreTop();
    st.scrollTo({ top, behavior: 'smooth' });
    // if the smooth scroll did not get there (e.g. the page was not drawing), jump
    setTimeout(() => { if (!touching && view === 'k3' && Math.abs(st.scrollTop - coreTop()) > 4) st.scrollTop = coreTop(); }, 900);
  }
  // after the finger lets go, earlier sentences stay in view for a few seconds, then the three lines come back
  function schedulePeekReturn() { clearTimeout(peekT); if (peeking()) peekT = setTimeout(() => { if (!touching) snapBack(); }, 5000); }
  $('stage').addEventListener('touchstart', () => { touching = true; clearTimeout(peekT); }, { passive: true });
  $('stage').addEventListener('touchend', () => { touching = false; schedulePeekReturn(); }, { passive: true });
  $('stage').addEventListener('scroll', () => { if (!touching) schedulePeekReturn(); }, { passive: true });
  let refitT = null;
  function refit() {
    clearTimeout(refitT);
    refitT = setTimeout(function again() { if (view !== 'k3') return; if (touching || peeking()) { refitT = setTimeout(again, 600); return; } renderK3(); }, 120);
  }
  if (window.ResizeObserver) new ResizeObserver(refit).observe(document.getElementById('stage'));
  window.addEventListener('resize', refit);
  function render() {
    if (view === 'k3') return renderK3();
    const s = S[pos], sl = DATA[s.si];
    if (renderedSlide !== s.si) {
      renderedSlide = s.si;
      $('slideno').textContent = sl.n + ' / ' + DATA.length;
      $('slidetitle').textContent = sl.title || 'Slide ' + sl.n;
      $('thumb').src = 'img/s' + sl.n + '.jpg';
      const col = $('col'); col.innerHTML = '';
      sl.items.forEach((it, k) => {
        if (it.cue) { const c = document.createElement('div'); c.className = 'cue dim'; c.dataset.k = k; c.textContent = it.cue; col.appendChild(c); }
        const p = document.createElement('p'); p.className = 's'; p.style.margin = '0'; p.dataset.k = k; p.innerHTML = it.html;
        p.addEventListener('click', () => { go(S.findIndex(x => x.si === s.si && x.k === k)); });
        col.appendChild(p);
      });
      const m = document.createElement('div'); m.className = 'meter'; m.id = 'meter'; m.innerHTML = '<i></i>'; col.appendChild(m);
      const nsl = DATA[s.si + 1];
      if (nsl) { const n = document.createElement('div'); n.className = 'next'; n.innerHTML = '다음 슬라이드 <strong>' + nsl.n + ' — ' + esc(nsl.title || '') + '</strong>'; col.appendChild(n); }
      $('stage').scrollTop = 0;
    }
    document.querySelectorAll('#col .s').forEach(p => {
      const k = +p.dataset.k; p.classList.toggle('cur', k === s.k); p.classList.toggle('done', k < s.k);
    });
    document.querySelectorAll('#col .cue').forEach(c => {
      const k = +c.dataset.k; c.classList.toggle('dim', k !== s.k); c.classList.remove('flash');
      if (k === s.k && running) { void c.offsetWidth; c.classList.add('flash'); }
    });
    const cur = document.querySelector('#col .s.cur');
    const meter = $('meter'); if (cur && meter) { cur.after(meter); meter.firstChild.style.width = '0%'; }
    const anchor = document.querySelector('#col .cue:not(.dim)') || cur;
    if (anchor) {
      const st = $('stage');
      const top = anchor.getBoundingClientRect().top - st.getBoundingClientRect().top + st.scrollTop;
      st.scrollTo({ top: Math.max(0, top - st.clientHeight * 0.22) });
    }
    $('tgt').textContent = '/ 목표 ' + fmt(PLAN[s.si]);
    store.set('pos', pos);
    tick();
  }
  function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  function elapsed() { return elapsedBefore + (t0 ? (Date.now() - t0) / 1000 : 0); }
  function tick() {
    const e = elapsed(); $('now').textContent = fmt(e);
    $('clock').classList.toggle('late', e > PLAN[S[pos].si] + 45);
  }
  setInterval(() => { tick(); if (t0) store.set('elapsed', elapsed()); }, 1000);

  // ---------- navigation ----------
  function go(i, fromVoice) {
    i = Math.max(0, Math.min(S.length - 1, i));
    if (i === pos && !fromVoice) return;
    pos = i; heardCut(); render(); if (mode === 'pace' && running) paceStart();
  }
  const next = () => go(pos + 1), prev = () => go(pos - 1);

  // ---------- pace mode ----------
  let paceTimer = null, paceT0 = 0, paceDur = 0, paceRaf = null;
  function sentenceSeconds(s) {
    let sec = s.words.length / wpm * 60 + 0.6;
    const cues = (s.text.match(/\[[^\]]*\]/g) || []).length + (s.cue ? 1 : 0);
    return sec + cues * 1.2;
  }
  function paceStart() {
    paceStop(); if (!running || mode !== 'pace') return;
    paceDur = sentenceSeconds(S[pos]) * 1000; paceT0 = Date.now();
    paceTimer = setTimeout(() => { if (pos < S.length - 1) { go(pos + 1); } else stop(); }, paceDur);
    const bar = () => { const m = $('meter'); if (m) m.firstChild.style.width = Math.min(100, (Date.now() - paceT0) / paceDur * 100) + '%'; paceRaf = requestAnimationFrame(bar); };
    bar();
  }
  function paceStop() { clearTimeout(paceTimer); cancelAnimationFrame(paceRaf); paceTimer = null; }

  // ---------- voice mode ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  // The whole session transcript is flattened into one word list; the current sentence hears everything after `cutCount`.
  // (iPhone Safari keeps rewriting one growing result, so counting words is sturdier than tracking result indexes.)
  let rec = null, listening = false, wantListen = false, allWords = [], cutCount = 0, carry = [], lastHeardAt = 0, rawTail = '';
  function transcriptWords(results) { const out = []; let raw = ''; for (let i = 0; i < results.length; i++) { raw += ' ' + results[i][0].transcript; } rawTail = raw.trim().split(/\s+/).slice(-8).join(' '); raw.split(/\s+/).forEach(w => { const n = norm(w); if (n) out.push(n); }); return out; }
  function heardNow() { if (cutCount > allWords.length) cutCount = allWords.length; return carry.concat(allWords.slice(cutCount)); }
  function heardCut() { carry = []; cutCount = allWords.length; }
  function micUI() {
    const on = mode === 'voice' && running;
    $('micline').hidden = !on;
    if (!on) return;
    const b = $('mic');
    b.classList.toggle('live', listening);
    b.textContent = listening ? '● 듣는 중' : '○ 탭해서 다시 듣기';
    $('heard').textContent = rawTail ? '… ' + rawTail : (listening ? '말씀하시면 여기에 들린 단어가 보여요' : '');
  }
  function newRec() {
    const r = new SR(); r.lang = 'en-US'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onstart = () => { listening = true; micUI(); };
    r.onresult = (e) => { allWords = transcriptWords(e.results); lastHeardAt = Date.now(); micUI(); onHeard(heardNow()); };
    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') { wantListen = false; voiceFail('이 화면에서는 마이크를 쓸 수 없어요. 자동 모드로 바꿨어요.'); }
    };
    r.onend = () => {
      listening = false;
      if (wantListen && running && mode === 'voice') {
        carry = heardNow(); allWords = []; cutCount = 0;
        setTimeout(() => { if (wantListen && !listening) tryListen(); }, 250);
      }
      micUI();
    };
    return r;
  }
  function tryListen() { try { if (rec) { rec.onend = null; try { rec.abort(); } catch (e) {} } rec = newRec(); rec.start(); } catch (err) { listening = false; micUI(); } }
  function voiceStart() {
    if (!SR) { voiceFail('이 브라우저는 음성 인식을 지원하지 않아요. 자동 모드로 바꿨어요.'); return; }
    wantListen = true; allWords = []; cutCount = 0; carry = []; rawTail = ''; lastHeardAt = 0;
    tryListen(); micUI();
  }
  function voiceStop() { wantListen = false; listening = false; if (rec) { rec.onend = null; try { rec.abort(); } catch (e) {} rec = null; } micUI(); }
  function voiceFail(msg) { voiceStop(); toast(msg); setMode('pace'); }
  // watchdog: iPhone ends recognition on its own; bring it back
  setInterval(() => { if (wantListen && running && mode === 'voice' && !listening) tryListen(); }, 2500);
  // pause check: the speaker stopped talking after most of the sentence
  setInterval(() => {
    if (!(wantListen && running && mode === 'voice') || !lastHeardAt) return;
    const s = S[pos], h = heardNow(); if (!h.length) return;
    doneReading(s, h);
    if ((s._prog || 0) >= 0.7 && Date.now() - lastHeardAt > 1500 && pos < S.length - 1) { lastHeardAt = 0; go(pos + 1, true); }
  }, 300);
  // test hook: feed recognized text without a microphone
  window.__prompterFeed = (text) => { text.split(/\s+/).forEach(w => { const n = norm(w); if (n) allWords.push(n); }); lastHeardAt = Date.now(); onHeard(heardNow()); return { slide: DATA[S[pos].si].n, k: S[pos].k }; };

  // ---------- run control ----------
  async function wake() { try { if ('wakeLock' in navigator) window.__wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) wake(); });
  function start() {
    running = true; t0 = Date.now(); $('go').textContent = '멈춤'; wake();
    if (mode === 'pace') { paceStart(); setStatus('자동 진행', true); }
    else if (mode === 'voice') voiceStart();
    else setStatus('탭으로 넘기기', true);
    render();
  }
  function stop() {
    running = false; elapsedBefore = elapsed(); t0 = null; store.set('elapsed', elapsedBefore);
    $('go').textContent = '시작'; paceStop(); voiceStop(); setStatus('멈춤', false);
    try { window.__wl && window.__wl.release(); } catch (e) {}
  }
  function setMode(m) {
    const was = running; if (was) { paceStop(); voiceStop(); }
    mode = m; store.set('mode', m);
    ['voice', 'pace', 'manual'].forEach(x => $('m-' + x).setAttribute('aria-pressed', String(x === m)));
    $('wpmbox').hidden = m !== 'pace';
    if (was) { if (m === 'pace') { paceStart(); setStatus('자동 진행', true); } else if (m === 'voice') voiceStart(); else setStatus('탭으로 넘기기', true); }
    else setStatus('', false);
    micUI();
  }
  function setStatus(t, on) { const e = $('status'); e.textContent = t; e.classList.toggle('on', !!on); }
  let toastT; function toast(t) { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => e.hidden = true, 4000); }

  // ---------- wiring ----------
  $('go').onclick = () => running ? stop() : start();
  $('m-voice').onclick = () => setMode('voice');
  $('m-pace').onclick = () => setMode('pace');
  $('m-manual').onclick = () => setMode('manual');
  $('next').onclick = next; $('prev').onclick = prev;
  $('slower').onclick = () => { wpm = Math.max(70, wpm - 10); $('wpm').textContent = wpm; store.set('wpm', wpm); if (running && mode === 'pace') paceStart(); };
  $('faster').onclick = () => { wpm = Math.min(180, wpm + 10); $('wpm').textContent = wpm; store.set('wpm', wpm); if (running && mode === 'pace') paceStart(); };
  $('font').onclick = () => { const sizes = [26, 30, 34, 40, 48]; size = sizes[(sizes.indexOf(size) + 1) % sizes.length] || 34; document.documentElement.style.setProperty('--size', size + 'px'); store.set('size', size); render(); };
  $('theme').onclick = () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; store.set('theme', t); };
  $('mic').onclick = () => { if (!listening) { wantListen = true; tryListen(); } };
  $('view').onclick = () => { view = view === 'k3' ? 'all' : 'k3'; store.set('view', view); applyView(); renderedSlide = -1; render(); };
  $('more').onclick = () => { const open = $('ctrl').classList.toggle('open'); $('more').setAttribute('aria-expanded', String(open)); $('more').textContent = open ? '닫기' : '설정'; };
  $('slides').onclick = () => { $('list').hidden = false; };
  $('closelist').onclick = () => { $('list').hidden = true; };
  const ol = $('listol');
  DATA.forEach((sl, si) => {
    const li = document.createElement('li'); const b = document.createElement('button');
    b.innerHTML = '<span class="n">' + sl.n + '</span><span class="t">' + esc(sl.title || '—') + '</span><span class="m">' + fmt(PLAN[si]) + '</span>';
    b.onclick = () => { $('list').hidden = true; go(S.findIndex(x => x.si === si)); };
    li.appendChild(b); ol.appendChild(li);
  });
  // no tap-anywhere navigation: tapping a sentence jumps to that sentence (handled where the lines are drawn)
  let sx = null; $('stage').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  $('stage').addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); e.preventDefault(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ' || e.key === 'b' || e.key === '.') { e.preventDefault(); running ? stop() : start(); }
  });
  $('wpm').textContent = wpm;
  $('thumb').onerror = () => { $('thumb').hidden = true; };
  setMode(mode);
  applyView();
  render();
})();
</script>

</body></html>
