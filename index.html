  function paceStop() { clearTimeout(paceTimer); cancelAnimationFrame(paceRaf); paceTimer = null; }

  // ---------- voice mode ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  // The whole session transcript is flattened into one word list; the current sentence hears everything after `cutCount`.
  // (iPhone Safari keeps rewriting one growing result, so counting words is sturdier than tracking result indexes.)
  let rec = null, listening = false, wantListen = false, allWords = [], cutCount = 0, carry = [], lastHeardAt = 0, rawTail = '';
  function transcriptWords(results) { const out = []; let raw = ''; for (let i = 0; i < results.length; i++) { raw += ' ' + results[i][0].transcript; } rawTail = raw.trim().split(/\s+/).slice(-8).join(' '); raw.split(/\s+/).forEach(w => { const n = norm(w); if (n) out.push(n); }); return out; }
  function heardNow() { if (cutCount > allWords.length) cutCount = allWords.length; return carry.concat(allWords.slice(cutCount)); }
  function heardCut() { carry = []; cutCount = allWords.length; }
  function micUI() {
    const on = mode === 'voice' && running;
    $('micline').hidden = !on;
    if (!on) return;
    const b = $('mic');
    b.classList.toggle('live', listening);
    b.textContent = listening ? '● 듣는 중' : '○ 탭해서 다시 듣기';
    $('heard').textContent = rawTail ? '… ' + rawTail : (listening ? '말씀하시면 여기에 들린 단어가 보여요' : '');
  }
  function newRec() {
    const r = new SR(); r.lang = 'en-US'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onstart = () => { listening = true; micUI(); };
    r.onresult = (e) => { allWords = transcriptWords(e.results); lastHeardAt = Date.now(); micUI(); onHeard(heardNow()); };
    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') { wantListen = false; voiceFail('이 화면에서는 마이크를 쓸 수 없어요. 자동 모드로 바꿨어요.'); }
    };
    r.onend = () => {
      listening = false;
      if (wantListen && running && mode === 'voice') {
        carry = heardNow(); allWords = []; cutCount = 0;
        setTimeout(() => { if (wantListen && !listening) tryListen(); }, 250);
      }
      micUI();
    };
    return r;
  }
  function tryListen() { try { if (rec) { rec.onend = null; try { rec.abort(); } catch (e) {} } rec = newRec(); rec.start(); } catch (err) { listening = false; micUI(); } }
  function voiceStart() {
    if (!SR) { voiceFail('이 브라우저는 음성 인식을 지원하지 않아요. 자동 모드로 바꿨어요.'); return; }
    wantListen = true; allWords = []; cutCount = 0; carry = []; rawTail = ''; lastHeardAt = 0;
    tryListen(); micUI();
  }
  function voiceStop() { wantListen = false; listening = false; if (rec) { rec.onend = null; try { rec.abort(); } catch (e) {} rec = null; } micUI(); }

  setInterval(() => { if (wantListen && running && mode === 'voice' && !listening) tryListen(); }, 2500);

  setInterval(() => {
    if (!(wantListen && running && mode === 'voice') || !lastHeardAt) return;
    const s = S[pos], h = heardNow(); if (!h.length) return;
    doneReading(s, h);
    if ((s._prog || 0) >= 0.7 && Date.now() - lastHeardAt > 1500 && pos < S.length - 1) { lastHeardAt = 0; autoGo(pos + 1); }
  }, 300);

  window.__prompterFeed = (text) => { text.split(/\s+/).forEach(w => { const n = norm(w); if (n) allWords.push(n); }); lastHeardAt = Date.now(); onHeard(heardNow()); return { slide: DATA[S[pos].si].n, k: S[pos].k }; };

  // ---------- run control ----------
  async function wake() { try { if ('wakeLock' in navigator) window.__wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) wake(); });
  function start() {
    running = true; t0 = Date.now(); $('go').textContent = '멈춤'; wake();
    if (mode === 'pace') { paceStart(); setStatus('자동 진행', true); }
    else if (mode === 'voice') voiceStart();
    else setStatus('탭으로 넘기기', true);
    render();
  }
  function stop() {
    running = false; elapsedBefore = elapsed(); t0 = null; store.set('elapsed', elapsedBefore);
    $('go').textContent = '시작'; paceStop(); voiceStop(); setStatus('멈춤', false);
    try { window.__wl && window.__wl.release(); } catch (e) {}

  function setMode(m) {
    const was = running; if (was) { paceStop(); voiceStop(); }
    mode = m; store.set('mode', m);
    ['voice', 'pace', 'manual'].forEach(x => $('m-' + x).setAttribute('aria-pressed', String(x === m)));
    $('wpmbox').hidden = m !== 'pace';
    if (was) { if (m === 'pace') { paceStart(); setStatus('자동 진행', true); } else if (m === 'voice') voiceStart(); else setStatus('탭으로 넘기기', true); }

  // ---------- wiring ----------
  $('go').onclick = () => running ? stop() : start();
  $('m-voice').onclick = () => setMode('voice');
  $('m-pace').onclick = () => setMode('pace');
  $('m-manual').onclick = () => setMode('manual');
  $('next').onclick = next; $('prev').onclick = prev;
  $('slower').onclick = () => { wpm = Math.max(70, wpm - 10); $('wpm').textContent = wpm; store.set('wpm', wpm); if (running && mode === 'pace') paceStart(); };
  $('faster').onclick = () => { wpm = Math.min(180, wpm + 10); $('wpm').textContent = wpm; store.set('wpm', wpm); if (running && mode === 'pace') paceStart(); };
  $('font').onclick = () => { const sizes = [26, 30, 34, 40, 48]; size = sizes[(sizes.indexOf(size) + 1) % sizes.length] || 34; document.documentElement.style.setProperty('--size', size + 'px'); store.set('size', size); render(); };
  $('theme').onclick = () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; store.set('theme', t); };
  $('mic').onclick = () => { if (!listening) { wantListen = true; tryListen(); } };
  $('view').onclick = () => { view = view === 'k3' ? 'all' : 'k3'; store.set('view', view); applyView(); renderedSlide = -1; render(); };
  $('more').onclick = () => { const open = $('ctrl').classList.toggle('open'); $('more').setAttribute('aria-expanded', String(open)); $('more').textContent = open ? '닫기' : '설정'; };
  $('slides').onclick = () => { $('list').hidden = false; };
  $('closelist').onclick = () => { $('list').hidden = true; };
  const ol = $('listol');
  DATA.forEach((sl, si) => {
    const li = document.createElement('li'); const b = document.createElement('button');
    b.innerHTML = '<span class="n">' + sl.n + '</span><span class="t">' + esc(sl.title || '—') + '</span><span class="m">' + fmt(PLAN[si]) + '</span>';
    b.onclick = () => { $('list').hidden = true; go(S.findIndex(x => x.si === si)); };
    li.appendChild(b); ol.appendChild(li);
  });
  // no tap-anywhere navigation: tapping a sentence jumps to that sentence (handled where the lines are drawn)
  let sx = null; $('stage').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  $('stage').addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); e.preventDefault(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ' || e.key === 'b' || e.key === '.') { e.preventDefault(); running ? stop() : start(); }
  });
  $('wpm').textContent = wpm;
  $('thumb').onerror = () => { $('thumb').hidden = true; };
  setMode(mode);
  applyView();
  render();
})();
</script>
