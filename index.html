<html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'></head><body>

<style>
/* Layout: one-screen stage — slide bar on top, the current slide's script in the middle (current sentence large), controls at the bottom. Dark stage by default, light for rehearsal. */
:root {
  --stage: #0f1415;        /* hall-dark ground, slight teal bias */
  --panel: #182022;
  --line: #2a3537;
  --ink: #f2f6f5;          /* current sentence */
  --ink-dim: #7f8f8e;      /* read / upcoming */
  --must: #ffc861;         /* bold = not on the slide */
  --teal: #19a6a3;         /* deck teal: cues, progress */
  --teal-ink: #04201f;
  --btn: #26343a;          /* control buttons */
  --warn: #ff8a7a;
  --f-read: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --size: 34px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --stage: #f7f9f9; --panel: #ffffff; --line: #d7e0e0;
  --ink: #0d1718; --ink-dim: #8a9898; --must: #9a5b00;
  --teal: #007f7d; --teal-ink: #ffffff; --warn: #b3261e; --btn: #e4ecec;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--stage); color: var(--ink); font-family: var(--f-read); margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; grid-template-areas: "bar" "stage" "ctrl"; }
.bar { grid-area: bar; } #stage { grid-area: stage; } .ctrl { grid-area: ctrl; }

/* 3-line "karaoke" view: previous / current / next, same size, current in yellow */
.k3 #stage { display: flex; align-items: center; overflow: hidden; padding-block: 12px; }
.k3 .col { width: 100%; gap: 0.9em; }
.k3 .s, .k3 .s.cur { font-size: calc(var(--size) * 0.8); line-height: 1.45; }
.k3 .s { color: var(--ink-dim); opacity: .75; }
.k3 .s.cur { color: var(--must); opacity: 1; }
.k3 .s.cur b { color: var(--must); }
.k3 .s .ko { font-size: .7em; }
.k3 .nexttag { font-family: var(--f-mono); font-size: 12px; color: var(--teal); display: block; margin-bottom: 2px; }
.k3 .next { display: none; }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.slideno { font-family: var(--f-mono); font-size: 15px; color: var(--teal); white-space: nowrap; }
.slidetitle { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { font-family: var(--f-mono); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.clock .tgt { color: var(--ink-dim); }
.clock.late .now { color: var(--warn); }
.thumb { height: 54px; aspect-ratio: 16 / 9; border-radius: 4px; border: 1px solid var(--line); object-fit: cover; background: #000; flex: none; }
.thumb[hidden] { display: none !important; }

/* stage */
#stage { position: relative; overflow-y: auto; padding: 24px 16px 60vh; scroll-behavior: smooth; min-height: 0; }
.col { max-width: 30em; margin: 0 auto; display: flex; flex-direction: column; gap: 0.7em; }
.s { font-size: calc(var(--size) * 0.62); line-height: 1.4; color: var(--ink-dim); transition: color .2s, font-size .2s; cursor: pointer; }
.s b { font-weight: 700; color: inherit; }
.s.cur { font-size: var(--size); color: var(--ink); line-height: 1.32; }
.s.cur b { color: var(--must); }
.s.done { opacity: .55; }
.s .q { font-style: italic; color: var(--teal); font-size: .8em; }
.s .ko { color: var(--ink-dim); font-size: .62em; }
.cue { align-self: flex-start; font-family: var(--f-mono); font-size: calc(var(--size) * 0.5); background: var(--teal); color: var(--teal-ink); padding: .12em .6em; border-radius: 999px; letter-spacing: .04em; }
.cue.dim { background: transparent; color: var(--teal); border: 1px solid var(--teal); }
.cue.flash { animation: flash 1s ease-out 2; }
@keyframes flash { 50% { transform: scale(1.12); } }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: .3em; }
.meter i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .25s linear; }
.next { margin-top: 1.6em; padding-top: 1em; border-top: 1px dashed var(--line); color: var(--ink-dim); font-size: 15px; }
.next strong { color: var(--ink); }

/* controls */
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 2px solid var(--teal); }
.ctrl .grow { flex: 1; }
.ctrl .main { display: flex; gap: 8px; align-items: center; }
.ctrl .extra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#more { display: none; }
button { font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); background: var(--btn); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 44px; }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
button.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 700; min-width: 5.5em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--teal); color: var(--teal-ink); }
.wpm { font-family: var(--f-mono); font-size: 14px; color: var(--ink-dim); white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--teal); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); }
.status { font-size: 13px; color: var(--ink-dim); white-space: nowrap; }
.status.on { color: var(--teal); }

/* slide list */
#list { position: fixed; inset: 0; background: var(--stage); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px; }
#list h2 { font-size: 18px; margin: 0 0 12px; }
#list ol { list-style: none; margin: 0; padding: 0; max-width: 40em; }
#list li button { width: 100%; text-align: left; display: flex; gap: 12px; align-items: baseline; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
#list .n { font-family: var(--f-mono); color: var(--teal); min-width: 2.5em; }
#list .t { flex: 1; min-width: 0; }
#list .m { font-family: var(--f-mono); color: var(--ink-dim); font-size: 13px; }

@media (max-width: 560px) {
  :root { --size: 26px; }
  /* phone: one slim header line, big thumb-friendly controls, extras behind 설정 */
  .bar { gap: 8px; padding: calc(6px + env(safe-area-inset-top, 0px)) 12px 6px; }
  .thumb { display: none; }
  .slideno, .clock { font-size: 13px; }
  .slidetitle { font-size: 13px; }
  #stage { padding-top: 10px; }
  /* phone: controls sit at the top, under the slide line, clear of Safari's bottom toolbar */
  #app { grid-template-rows: auto auto 1fr; grid-template-areas: "bar" "ctrl" "stage"; }
  .ctrl { flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 12px 10px; border-top: 0; border-bottom: 2px solid var(--teal); }
  .ctrl .main { width: 100%; }
  .ctrl .main button { flex: 1; min-height: 56px; font-size: 20px; }
  .ctrl .main #go { flex: 1.4; font-size: 18px; }
  .ctrl .main #more { display: block; flex: 0.9; font-size: 15px; }
  .ctrl .extra { display: none; }
  .ctrl.open .extra { display: flex; }
  .ctrl .status { display: none; }
}
@media (prefers-reduced-motion: reduce) { #stage { scroll-behavior: auto; } .cue.flash { animation: none; } .s, .meter i { transition: none; } }
</style>

your worklist, I want you to know what to look for — and, more importantly, what not to miss.","html":"\u003cb\u003eWhen you see a patient with NF1 on your worklist, I want you to know what to look for — and, more importantly, what not to miss.\u003c/b\u003e","cue":null}]},{"n":2,"title":"Content","target":null,"items":[{"text":"Here is the outline.","html":"\u003cb\u003eHere is the outline.\u003c/b\u003e","cue":null},{"text":"First, I\u0027ll briefly cover the definition and the genetics.","html":"\u003cb\u003eFirst, I\u0026#39;ll briefly cover\u003c/b\u003e the definition and the genetics.","cue":null},{"text":"Then, I\u0027ll spend most of the time on the imaging findings.","html":"\u003cb\u003eThen, I\u0026#39;ll spend most of the time on the imaging findings.\u003c/b\u003e","cue":null},{"text":"And at the end, I’ll briefly touch on surveillance.","html":"\u003cb\u003eAnd at the end, I’ll briefly touch\u003c/b\u003e on surveillance.","cue":null}]},{"n":3,"title":"My NF1 research at Asan Medical Center","target":null,"items":[{"text":"Before we start, let me tell you a little bit about me and NF1.","html":"\u003cb\u003eBefore we start, let me tell you a little bit\u003c/b\u003e about me and NF1.","cue":"~1 minute — personal story. Relaxed tone. Pause for laughs."},{"text":"Before I came to MGH, I worked at Asan Medical Center in Seoul, Korea.","html":"\u003cb\u003eBefore I came to MGH, I worked\u003c/b\u003e at Asan Medical Center in \u003cb\u003eSeoul, Korea.\u003c/b\u003e","cue":null},{"text":"Asan has a very big NF1 clinic — just like MGH.","html":"Asan has a very \u003cb\u003ebig\u003c/b\u003e NF1 \u003cb\u003eclinic — just like MGH.\u003c/b\u003e","cue":null},{"text":"And unfortunately...","html":"\u003cb\u003eAnd unfortunately...\u003c/b\u003e","cue":null},{"text":"[pause] I got very, very deeply involved.","html":"\u003ci class=\u0027q\u0027\u003epause\u003c/i\u003e \u003cb\u003eI got very, very deeply involved.\u003c/b\u003e","cue":null},{"text":"I read the whole-body MRIs of NF1 patients — both children and adults.","html":"\u003cb\u003eI read the whole-body MRIs\u003c/b\u003e of NF1 \u003cb\u003epatients — both children and adults.\u003c/b\u003e","cue":null},{"text":"A lot of whole-body MRIs.","html":"\u003cb\u003eA lot of whole-body MRIs.\u003c/b\u003e","cue":null},{"text":"Well, at least I got some papers out of it. [point to slide]","html":"\u003cb\u003eWell, at least I got some papers out of it.\u003c/b\u003e \u003ci class=\u0027q\u0027\u003epoint to slide\u003c/i\u003e","cue":null},{"text":"To be honest, NF1 was so painful...","html":"\u003cb\u003eTo be honest,\u003c/b\u003e NF1 was so \u003cb\u003epainful...\u003c/b\u003e","cue":null},{"text":"[pause] that it\u0027s actually one of the reasons I moved to Boston.","html":"\u003ci class=\u0027q\u0027\u003epause\u003c/i\u003e \u003cb\u003ethat it\u0026#39;s actually one of the reasons I moved to Boston.\u003c/b\u003e","cue":null},{"text":"But guess what?","html":"\u003cb\u003eBut guess what?\u003c/b\u003e","cue":null},{"text":"The very first case I read here at MGH...","html":"\u003cb\u003eThe very first case I read here at MGH...\u003c/b\u003e","cue":null},{"text":"[pause] was a whole-body MRI of an NF1 patient.","html":"\u003ci class=\u0027q\u0027\u003epause\u003c/i\u003e \u003cb\u003ewas a whole-body MRI\u003c/b\u003e of an NF1 \u003cb\u003epatient.\u003c/b\u003e","cue":null},{"text":"So I feel like NF1 is following me.","html":"\u003cb\u003eSo I feel\u003c/b\u003e like NF1 is \u003cb\u003efollowing me.\u003c/b\u003e","cue":"pause for laughter"},{"text":"And today, here I am — giving an NF1 lecture.","html":"\u003cb\u003eAnd today, here I am — giving\u003c/b\u003e an NF1 \u003cb\u003electure.\u003c/b\u003e","cue":null},{"text":"Just a quick disclosure: all the cases I\u0027ll show you today are from Korea.","html":"\u003cb\u003eJust a quick disclosure: all the cases I\u0026#39;ll show you today are from Korea.\u003c/b\u003e","cue":null},{"text":"Anyway, I hope some of that experience will be useful for you today.","html":"\u003cb\u003eAnyway, I hope some of that experience will be useful for you today.\u003c/b\u003e","cue":null},{"text":"So, let\u0027s start.","html":"\u003cb\u003eSo, let\u0026#39;s start.\u003c/b\u003e","cue":null}]},{"n":4,"title":"Neurofibromatosis type 1 (NF1)","target":null,"items":[{"text":"Let\u0027s start with the basics.","html":"\u003cb\u003eLet\u0026#39;s start with the basics.\u003c/b\u003e","cue":null},{"text":"NF1 is an autosomal dominant syndrome that affects multiple organ systems.","html":"NF1 is an autosomal dominant syndrome that affects multiple organ systems.","cue":null},{"text":"The classic findings are multiple cutaneous café-au-lait spots and neurofibromas.","html":"\u003cb\u003eThe classic findings\u003c/b\u003e are multiple cutaneous caf\u0026#233;-au-lait spots and neurofibromas.","cue":null},{"text":"It is caused by loss-of-function mutations in the tumor suppressor gene NF1, located on chromosome 17q11.2 (seventeen q eleven point two).","html":"\u003cb\u003eIt is caused\u003c/b\u003e by loss-of-function mutations in the tumor suppressor gene NF1, located on \u003cb\u003echromosome 17q11.2 (seventeen q eleven point two).\u003c/b\u003e","cue":null},{"text":"This gene encodes the neurofibromin (뉴로파이브로민) protein.","html":"\u003cb\u003eThis\u003c/b\u003e gene encodes the neurofibromin \u003cspan class=\u0027ko\u0027\u003e(뉴로파이브로민)\u003c/span\u003e protein.","cue":null}]},{"n":5,"title":"David H Gutmann et al. Nat Rev Dis Primers. 2017 Feb 23:3:17…","target":null,"items":[{"text":"This diagram shows what neurofibromin normally does.","html":"\u003cb\u003eThis diagram shows what neurofibromin normally does.\u003c/b\u003e","cue":null},{"text":"Normally, neurofibromin turns RAS off — from the active form to the inactive form.","html":"\u003cb\u003eNormally, neurofibromin turns RAS off — from the active form to the inactive form.\u003c/b\u003e","cue":null},{"text":"It works as a brake on cell growth.","html":"\u003cb\u003eIt works as a brake on cell growth.\u003c/b\u003e","cue":null},{"text":"When neurofibromin is lost, the brake is gone.","html":"\u003cb\u003eWhen neurofibromin is lost, the brake is gone.\u003c/b\u003e","cue":"CLICK"},{"text":"RAS stays active, and it keeps signaling through two main pathways: MEK–ERK and AKT–mTOR.","html":"\u003cb\u003eRAS stays active, and it keeps signaling through two main pathways: MEK–ERK and AKT–mTOR.\u003c/b\u003e","cue":null},{"text":"The result is increased cell growth.","html":"\u003cb\u003eThe result is increased cell growth.\u003c/b\u003e","cue":null},{"text":"Neurofibromin also affects cAMP signaling, and the result is increased cell survival.","html":"\u003cb\u003eNeurofibromin also affects cAMP signaling, and the result is increased cell survival.\u003c/b\u003e","cue":null},{"text":"Please remember MEK.","html":"\u003cb\u003ePlease remember MEK.\u003c/b\u003e","cue":null},{"text":"It will come back later when we talk about treatment.","html":"\u003cb\u003eIt will come back later when we talk about treatment.\u003c/b\u003e","cue":null}]},{"n":6,"title":"Neurofibromatosis type 1 (NF1)","target":null,"items":[{"text":"NF1 is not rare.","html":"NF1 is not \u003cb\u003erare.\u003c/b\u003e","cue":null},{"text":"It affects about 1 in 3,000 people.","html":"\u003cb\u003eIt affects\u003c/b\u003e about 1 in \u003cb\u003e3,000 people.\u003c/b\u003e","cue":null},{"text":"About half of the cases are sporadic, meaning they result from a new mutation with no family history.","html":"\u003cb\u003eAbout half of the cases\u003c/b\u003e are sporadic, \u003cb\u003emeaning they result from a new mutation with no family history.\u003c/b\u003e","cue":null},{"text":"NF1 has a wide range of clinical manifestations, or what we call a heterogeneous phenotype.","html":"NF1 has a wide range of clinical manifestations, or what we \u003cb\u003ecall\u003c/b\u003e a heterogeneous phenotype.","cue":null},{"text":"It has high penetrance, meaning that if someone has the mutation, they are very likely to show clinical features.","html":"It has high penetrance, \u003cb\u003emeaning that if someone has the mutation, they are very likely to show\u003c/b\u003e clinical \u003cb\u003efeatures.\u003c/b\u003e","cue":null},{"text":"But it also has variable expressivity, meaning that the severity and specific features can vary significantly from one patient to another—even within the same family.","html":"But it also has variable expressivity, \u003cb\u003emeaning that the severity and specific features can vary significantly from one patient\u003c/b\u003e to another—even \u003cb\u003ewithin the same family.\u003c/b\u003e","cue":null},{"text":"So, no two patients with NF1 look exactly the same.","html":"\u003cb\u003eSo, no two patients\u003c/b\u003e with NF1 \u003cb\u003elook exactly the same.\u003c/b\u003e","cue":null},{"text":"And that’s one reason why imaging plays such an important role.","html":"\u003cb\u003eAnd that’s one reason why imaging plays such an important role.\u003c/b\u003e","cue":null}]},{"n":7,"title":"Diagnosis NIH criteria","target":null,"items":[{"text":"This is how we make the diagnosis.","html":"\u003cb\u003eThis is how we make\u003c/b\u003e the diagnosis.","cue":null},{"text":"These are the revised diagnostic criteria, updated in 2021.","html":"\u003cb\u003eThese are the revised diagnostic\u003c/b\u003e criteria, \u003cb\u003eupdated\u003c/b\u003e in 2021.","cue":null},{"text":"There are seven features.","html":"\u003cb\u003eThere are seven features.\u003c/b\u003e","cue":null},{"text":"Six or more café-au-lait macules.","html":"\u003cb\u003eSix\u003c/b\u003e or more caf\u0026#233;-au-lait macules.","cue":null},{"text":"Freckling in the axilla or the groin.","html":"Freckling in the \u003cb\u003eaxilla or the groin.\u003c/b\u003e","cue":null},{"text":"Two or more neurofibromas, or one plexiform neurofibroma.","html":"\u003cb\u003eTwo or more neurofibromas, or one plexiform neurofibroma.\u003c/b\u003e","cue":null},{"text":"Optic pathway glioma.","html":"\u003cb\u003eOptic pathway glioma.\u003c/b\u003e","cue":null},{"text":"Two or more Lisch nodules in the iris.","html":"\u003cb\u003eTwo\u003c/b\u003e or more Lisch nodules in the iris.","cue":null},{"text":"A distinctive bone lesion, such as sphenoid dysplasia or tibial bowing.","html":"\u003cb\u003eA distinctive bone lesion, such as sphenoid dysplasia or tibial bowing.\u003c/b\u003e","cue":null},{"text":"And a pathogenic NF1 variant on genetic testing.","html":"\u003cb\u003eAnd a pathogenic NF1 variant on genetic testing.\u003c/b\u003e","cue":null},{"text":"If neither parent has NF1, the patient needs two or more of these features.","html":"\u003cb\u003eIf neither parent has NF1, the patient needs two or more of these features.\u003c/b\u003e","cue":null},{"text":"If a parent has NF1, just one feature is enough.","html":"\u003cb\u003eIf a parent has NF1, just one feature is enough.\u003c/b\u003e","cue":null},{"text":"Now, look at the boxes.","html":"\u003cb\u003eNow, look at the boxes.\u003c/b\u003e","cue":"CLICK"},{"text":"Three of the seven features — neurofibromas, optic pathway glioma, and bone lesions — are found by imaging.","html":"\u003cb\u003eThree of the seven features — neurofibromas, optic pathway glioma, and bone lesions — are found by imaging.\u003c/b\u003e","cue":null},{"text":"So radiologists are really part of the diagnosis.","html":"\u003cb\u003eSo radiologists are really part\u003c/b\u003e of the diagnosis.","cue":null}]},{"n":8,"title":"Radiologic manifestations","target":null,"items":[{"text":"Beyond these three diagnostic features, NF1 has many other imaging findings.","html":"\u003cb\u003eBeyond these three diagnostic features, NF1 has many other imaging findings.\u003c/b\u003e","cue":null},{"text":"I\u0027ve grouped them into four parts: neurofibromas and MPNST; the central nervous system; mesodermal dysplasia, which includes bones and vessels; and other tumors.","html":"\u003cb\u003eI\u0026#39;ve grouped them into four parts:\u003c/b\u003e neurofibromas and MPNST; the \u003cb\u003ecentral nervous system; mesodermal\u003c/b\u003e dysplasia, which \u003cb\u003eincludes\u003c/b\u003e bones and \u003cb\u003evessels;\u003c/b\u003e and other tumors.","cue":null},{"text":"Let\u0027s begin with neurofibromas.","html":"\u003cb\u003eLet\u0026#39;s begin\u003c/b\u003e with neurofibromas.","cue":null}]},{"n":9,"title":"Neurofibromas","target":null,"items":[{"text":"Neurofibromas are the most common tumors in NF1.","html":"Neurofibromas are the most common tumors in NF1.","cue":null},{"text":"They are benign nerve sheath tumors.","html":"They are benign nerve sheath tumors.","cue":null},{"text":"But even though they are benign, they can cause serious problems, as we\u0027ll see.","html":"\u003cb\u003eBut even though\u003c/b\u003e they are benign, they can \u003cb\u003ecause serious problems, as we\u0026#39;ll see.\u003c/b\u003e","cue":null},{"text":"Clinically, neurofibromas are divided into two groups: cutaneous and plexiform.","html":"Clinically, neurofibromas are \u003cb\u003edivided into two groups:\u003c/b\u003e cutaneous and plexiform.","cue":"CLICK"},{"text":"You can see examples in these photos.","html":"\u003cb\u003eYou can see examples in these photos.\u003c/b\u003e","cue":null}]},{"n":10,"title":"Histological classification","target":null,"items":[{"text":"Pathology uses a slightly different system.","html":"\u003cb\u003ePathology uses a slightly different system.\u003c/b\u003e","cue":null},{"text":"There are three main types.","html":"\u003cb\u003eThere are three main types.\u003c/b\u003e","cue":null},{"text":"First, cutaneous neurofibroma.","html":"\u003cb\u003eFirst,\u003c/b\u003e cutaneous neurofibroma.","cue":"CLICK"},{"text":"It can be localized or diffuse.","html":"It can be localized or diffuse.","cue":null},{"text":"It has no capsule, and the tumor cells are loosely arranged.","html":"\u003cb\u003eIt has no capsule,\u003c/b\u003e and the tumor cells are \u003cb\u003eloosely arranged.\u003c/b\u003e","cue":null},{"text":"Second, intraneural neurofibroma.","html":"\u003cb\u003eSecond,\u003c/b\u003e intraneural neurofibroma.","cue":"CLICK"},{"text":"It can be plexiform or localized.","html":"It can be plexiform or localized.","cue":null},{"text":"It grows inside the nerve, expands the nerve fascicles (패시클즈), and is surrounded by the perineurium (페리뉴리엄).","html":"\u003cb\u003eIt grows inside\u003c/b\u003e the nerve, \u003cb\u003eexpands\u003c/b\u003e the nerve fascicles \u003cspan class=\u0027ko\u0027\u003e(패시클즈)\u003c/span\u003e\u003cb\u003e, and is surrounded\u003c/b\u003e by the perineurium \u003cspan class=\u0027ko\u0027\u003e(페리뉴리엄)\u003c/span\u003e.","cue":null},{"text":"Third, massive soft tissue neurofibroma.","html":"\u003cb\u003eThird,\u003c/b\u003e massive soft tissue neurofibroma.","cue":"CLICK"},{"text":"This is a large area of soft tissue overgrowth.","html":"\u003cb\u003eThis is a large area\u003c/b\u003e of soft tissue \u003cb\u003eovergrowth.\u003c/b\u003e","cue":null},{"text":"It can hang down like a bag or a cape, and the skin on top is often darker.","html":"\u003cb\u003eIt can hang down\u003c/b\u003e like a bag or a cape, and the skin on \u003cb\u003etop is often darker.\u003c/b\u003e","cue":null}]},{"n":11,"title":"Imaging classification","target":null,"items":[{"text":"Now, let\u0027s see how each type looks on imaging.","html":"\u003cb\u003eNow, let\u0026#39;s see how each type looks\u003c/b\u003e on imaging.","cue":null},{"text":"First, the localized cutaneous neurofibroma.","html":"\u003cb\u003eFirst,\u003c/b\u003e the localized cutaneous neurofibroma.","cue":"CLICK"},{"text":"On this whole-body STIR, you can see many small bright nodules in the skin.","html":"\u003cb\u003eOn this whole-body\u003c/b\u003e STIR, you can \u003cb\u003esee many small bright nodules in the skin.\u003c/b\u003e","cue":null}]},{"n":12,"title":"Imaging classification","target":null,"items":[{"text":"Localized cutaneous neurofibromas are in the skin and the dermis.","html":"Localized cutaneous neurofibromas are in the \u003cb\u003eskin and the dermis.\u003c/b\u003e","cue":null},{"text":"They are multiple nodular or polypoid lesions, usually up to about 2 cm.","html":"They are multiple nodular or polypoid lesions, \u003cb\u003eusually up to about 2 cm.\u003c/b\u003e","cue":null},{"text":"They show bright high signal on STIR, low attenuation on CT, and they enhance.","html":"\u003cb\u003eThey show\u003c/b\u003e bright high \u003cb\u003esignal\u003c/b\u003e on STIR, low attenuation on CT, and they \u003cb\u003eenhance.\u003c/b\u003e","cue":null}]},{"n":13,"title":"Imaging classification","target":null,"items":[{"text":"Next, the diffuse cutaneous neurofibroma — here, in the buttock.","html":"\u003cb\u003eNext,\u003c/b\u003e the diffuse cutaneous neurofibroma — here, in the \u003cb\u003ebuttock.\u003c/b\u003e","cue":"CLICK"},{"text":"It looks like a plaque that spreads into the subcutaneous fat.","html":"\u003cb\u003eIt looks\u003c/b\u003e like a plaque that \u003cb\u003espreads\u003c/b\u003e into the subcutaneous \u003cb\u003efat.\u003c/b\u003e","cue":"CLICK"},{"text":"The margin is infiltrative, and it enhances strongly.","html":"The margin is infiltrative, and it \u003cb\u003eenhances strongly.\u003c/b\u003e","cue":null},{"text":"In some cases, it goes deeper and involves the muscle.","html":"\u003cb\u003eIn some cases, it goes deeper\u003c/b\u003e and involves the muscle.","cue":null}]},{"n":14,"title":"Imaging classification","target":null,"items":[{"text":"Now, the intraneural neurofibromas.","html":"Now, the intraneural neurofibromas.","cue":null},{"text":"First, the plexiform type.","html":"\u003cb\u003eFirst,\u003c/b\u003e the plexiform \u003cb\u003etype.\u003c/b\u003e","cue":"CLICK"},{"text":"Plexiform intraneural neurofibroma — we usually just call it plexiform neurofibroma — grows along many nerve branches at the same time.","html":"Plexiform intraneural neurofibroma — we \u003cb\u003eusually just call\u003c/b\u003e it plexiform neurofibroma — \u003cb\u003egrows along many nerve branches at the same time.\u003c/b\u003e","cue":null},{"text":"It looks like a group of worms following the nerves, as you can see here in the pelvis and the thigh.","html":"\u003cb\u003eIt looks like a group of worms following the nerves, as you can see here in the pelvis and the thigh.\u003c/b\u003e","cue":null}]},{"n":15,"title":"Imaging classification","target":null,"items":[{"text":"Here are the typical features.","html":"\u003cb\u003eHere are the typical features.\u003c/b\u003e","cue":null},{"text":"First, the \"bag of worms\" appearance.","html":"\u003cb\u003eFirst,\u003c/b\u003e the \u0026quot;bag of worms\u0026quot; appearance.","cue":null},{"text":"Second, the target sign, also called the central dot sign.","html":"\u003cb\u003eSecond,\u003c/b\u003e the target sign, also \u003cb\u003ecalled\u003c/b\u003e the central dot sign.","cue":null},{"text":"The center is dark on T2 because of collagen.","html":"\u003cb\u003eThe center is dark on T2 because of collagen.\u003c/b\u003e","cue":null},{"text":"The outer rim is bright because of myxoid (믹소이드) tissue.","html":"\u003cb\u003eThe outer\u003c/b\u003e rim is \u003cb\u003ebright because of myxoid\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(믹소이드)\u003c/span\u003e tissue.","cue":null},{"text":"After contrast, the enhancement is usually mild, fuzzy, and central.","html":"\u003cb\u003eAfter contrast,\u003c/b\u003e the enhancement is \u003cb\u003eusually\u003c/b\u003e mild, fuzzy, and central.","cue":null},{"text":"The target sign is very helpful.","html":"The target sign is very \u003cb\u003ehelpful.\u003c/b\u003e","cue":null},{"text":"Please remember it — we will use it again when we talk about malignancy.","html":"\u003cb\u003ePlease remember it — we will use it again when we talk about malignancy.\u003c/b\u003e","cue":null}]},{"n":16,"title":"Imaging classification","target":null,"items":[{"text":"This 32-year-old man has plexiform neurofibromas in the left paraspinal area, along the cervical spinal nerves.","html":"\u003cb\u003eThis 32-year-old man\u003c/b\u003e has plexiform neurofibromas in the \u003cb\u003eleft paraspinal area, along the cervical spinal nerves.\u003c/b\u003e","cue":null},{"text":"On CT, they appear as low-density, hypoattenuating masses.","html":"On CT, they \u003cb\u003eappear as low-density,\u003c/b\u003e hypoattenuating masses.","cue":null},{"text":"On ultrasound, they are well-defined, oval, hypoechoic masses.","html":"\u003cb\u003eOn ultrasound,\u003c/b\u003e they are well-defined, oval, hypoechoic masses.","cue":null},{"text":"Vascularity varies.","html":"\u003cb\u003eVascularity varies.\u003c/b\u003e","cue":null},{"text":"Sometimes there is no flow, but sometimes, like here, you can see flow on Doppler.","html":"\u003cb\u003eSometimes there is no flow, but sometimes, like here, you can see flow on Doppler.\u003c/b\u003e","cue":null}]},{"n":17,"title":"Imaging classification","target":null,"items":[{"text":"Next, the localized intraneural neurofibroma.","html":"\u003cb\u003eNext,\u003c/b\u003e the localized intraneural neurofibroma.","cue":null},{"text":"It is a single, fusiform mass along one nerve — like these two lesions in the leg.","html":"\u003cb\u003eIt is a single, fusiform mass along one nerve — like these two lesions in the leg.\u003c/b\u003e","cue":"CLICK"}]},{"n":18,"title":"Imaging classification","target":null,"items":[{"text":"Localized intraneural neurofibroma is a well-defined mass.","html":"Localized intraneural neurofibroma is a well-defined mass.","cue":null},{"text":"It may or may not have a central dot sign, and the enhancement can be heterogeneous or homogeneous.","html":"It may or may not have a central dot sign, and the enhancement can be \u003cb\u003eheterogeneous\u003c/b\u003e or homogeneous.","cue":null},{"text":"Now, here is an important term: distinct nodular lesion.","html":"\u003cb\u003eNow, here is an important term:\u003c/b\u003e distinct nodular lesion.","cue":null},{"text":"It is a well-demarcated, encapsulated-appearing lesion, 3 cm or larger, lacking the central dot sign.","html":"It is a well-demarcated, encapsulated-appearing lesion, \u003cb\u003e3\u003c/b\u003e cm or \u003cb\u003elarger,\u003c/b\u003e lacking the central dot sign.","cue":null},{"text":"Because a distinct nodular lesion can be an atypical neurofibroma — a premalignant lesion — or even an MPNST.","html":"Because a distinct nodular lesion can be an \u003cb\u003eatypical\u003c/b\u003e neurofibroma — a \u003cb\u003epremalignant\u003c/b\u003e lesion — or even an \u003cb\u003eMPNST.\u003c/b\u003e","cue":null},{"text":"Not every one is, but it needs closer attention.","html":"\u003cb\u003eNot every one is, but it needs closer attention.\u003c/b\u003e","cue":null},{"text":"We\u0027ll come back to this soon","html":"\u003cb\u003eWe\u0026#39;ll come back to this soon\u003c/b\u003e","cue":null}]},{"n":19,"title":"Imaging classification","target":null,"items":[{"text":"Lastly, massive soft tissue neurofibroma.","html":"\u003cb\u003eLastly,\u003c/b\u003e massive soft tissue neurofibroma.","cue":null},{"text":"On imaging, it is an extensive, infiltrative diffuse cutaneous neurofibroma — even into the skeletal muscles.","html":"On imaging, it is an extensive, infiltrative diffuse cutaneous neurofibroma — even into the skeletal muscles.","cue":null},{"text":"And there is regional soft tissue enlargement — pendulous (펜쥴러스), bag-like or cape-like masses, as in these patients.","html":"And there is regional soft tissue enlargement — pendulous \u003cspan class=\u0027ko\u0027\u003e(펜쥴러스)\u003c/span\u003e, bag-like or cape-like masses, as in these \u003cb\u003epatients.\u003c/b\u003e","cue":null}]},{"n":20,"title":"Imaging classification","target":null,"items":[{"text":"To summarize: on imaging, massive soft tissue neurofibroma looks like an extensive form of diffuse cutaneous neurofibroma.","html":"\u003cb\u003eTo summarize:\u003c/b\u003e on imaging, massive soft tissue neurofibroma \u003cb\u003elooks like an extensive form\u003c/b\u003e of diffuse cutaneous neurofibroma.","cue":null},{"text":"So we can put them together.","html":"\u003cb\u003eSo we can put them together.\u003c/b\u003e","cue":"CLICK"},{"text":"That leaves us with four imaging types: localized cutaneous, diffuse cutaneous, plexiform, and localized intraneural.","html":"\u003cb\u003eThat leaves us with four\u003c/b\u003e imaging \u003cb\u003etypes:\u003c/b\u003e localized cutaneous, diffuse cutaneous, plexiform, and localized intraneural.","cue":null},{"text":"This is a simple and practical way to think about them.","html":"\u003cb\u003eThis is a simple and practical way to think about them.\u003c/b\u003e","cue":null}]},{"n":21,"title":".","target":null,"items":[{"text":"This table shows the clinicopathologic classifications of neurofibromas proposed over the years.","html":"\u003cb\u003eThis table shows the clinicopathologic classifications of neurofibromas proposed over the years.\u003c/b\u003e","cue":null},{"text":"As you can see, many different systems are used, and there is still no single standard system in clinical practice.","html":"\u003cb\u003eAs you can see, many different systems are used, and there is still no single standard system in clinical practice.\u003c/b\u003e","cue":null},{"text":"So if you find it confusing, you are not alone.","html":"\u003cb\u003eSo if you find it confusing, you are not alone.\u003c/b\u003e","cue":null}]},{"n":22,"title":"Plexiform intraneural neurofibroma","target":null,"items":[{"text":"In my opinion, there are two reasons for this confusion.","html":"\u003cb\u003eIn my opinion, there are two reasons for this confusion.\u003c/b\u003e","cue":null},{"text":"First, the word \"plexiform\" is used differently.","html":"\u003cb\u003eFirst, the word\u003c/b\u003e \u0026quot;plexiform\u0026quot; is \u003cb\u003eused differently.\u003c/b\u003e","cue":null},{"text":"Clinically, when an NF1 patient has soft tissue thickening with a mass, like this foot, it is often called a plexiform neurofibroma.","html":"Clinically, when an \u003cb\u003eNF1 patient has soft tissue thickening with a mass, like this foot, it is often called\u003c/b\u003e a plexiform neurofibroma.","cue":null},{"text":"But on imaging, it may be a diffuse cutaneous neurofibroma — or a true plexiform intraneural neurofibroma.","html":"But on imaging, it may be a diffuse cutaneous neurofibroma — or a \u003cb\u003etrue\u003c/b\u003e plexiform intraneural neurofibroma.","cue":"CLICK"},{"text":"Second, different types often coexist in the same patient:","html":"\u003cb\u003eSecond, different types often coexist in the same patient:\u003c/b\u003e","cue":"CLICK"},{"text":"diffuse cutaneous plus localized intraneural, diffuse cutaneous plus plexiform, and plexiform plus localized intraneural.","html":"diffuse cutaneous \u003cb\u003eplus\u003c/b\u003e localized intraneural, diffuse cutaneous \u003cb\u003eplus\u003c/b\u003e plexiform, and plexiform \u003cb\u003eplus\u003c/b\u003e localized intraneural.","cue":null},{"text":"So it is hard to give them one label.","html":"\u003cb\u003eSo it is hard to give them one label.\u003c/b\u003e","cue":null},{"text":"[Tip] In your report, describe what you see — the location, the extent, and the pattern.","html":"\u003ci class=\u0027q\u0027\u003eTip\u003c/i\u003e \u003cb\u003eIn your report, describe what you see — the location, the extent, and the pattern.\u003c/b\u003e","cue":null},{"text":"Don\u0027t worry too much about the exact name.","html":"\u003cb\u003eDon\u0026#39;t worry too much about the exact name.\u003c/b\u003e","cue":null}]},{"n":23,"title":"Plexiform neurofibroma (PN)","target":780,"items":[{"text":"Now let\u0027s focus on plexiform neurofibromas, or PN, because they matter most in NF1.","html":"\u003cb\u003eNow let\u0026#39;s focus\u003c/b\u003e on plexiform neurofibromas, or PN, because they \u003cb\u003ematter\u003c/b\u003e most in NF1.","cue":null},{"text":"They are found in approximately 50% of patients with NF1, and they are pathognomonic (패쏘그노모닉) for the diagnosis of NF1.","html":"\u003cb\u003eThey are found\u003c/b\u003e in approximately 50% of patients with NF1, and they are pathognomonic \u003cspan class=\u0027ko\u0027\u003e(패쏘그노모닉)\u003c/span\u003e for the diagnosis of NF1.","cue":null},{"text":"They cause significant morbidity:","html":"\u003cb\u003eThey cause\u003c/b\u003e significant morbidity:","cue":null},{"text":"pain, disfigurement, and orthopedic issues — like the leg overgrowth in this patient.","html":"pain, disfigurement, and orthopedic issues — like the \u003cb\u003eleg overgrowth in this\u003c/b\u003e patient.","cue":null},{"text":"They can also compress vital structures, causing airway problems, vision issues, and bowel or bladder dysfunction — as in these images.","html":"\u003cb\u003eThey can also compress\u003c/b\u003e vital structures, \u003cb\u003ecausing\u003c/b\u003e airway problems, vision issues, and bowel or bladder dysfunction — as in these \u003cb\u003eimages.\u003c/b\u003e","cue":null},{"text":"There is a 10 to 15% risk of malignant transformation.","html":"There is a 10 to 15% risk of malignant transformation.","cue":null},{"text":"Complete removal is usually impossible, and they regrow after surgery in about 44% of patients.","html":"Complete removal is \u003cb\u003eusually\u003c/b\u003e impossible, and they \u003cb\u003eregrow\u003c/b\u003e after surgery in about 44% of patients.","cue":null}]},{"n":24,"title":"Selumetinib","target":null,"items":[{"text":"For a long time, surgery was the only treatment.","html":"\u003cb\u003eFor a long time, surgery was the only treatment.\u003c/b\u003e","cue":null},{"text":"That changed with selumetinib (셀루메티닙).","html":"\u003cb\u003eThat changed\u003c/b\u003e with selumetinib \u003cspan class=\u0027ko\u0027\u003e(셀루메티닙)\u003c/span\u003e.","cue":null},{"text":"Selumetinib is a MEK inhibitor.","html":"Selumetinib is a \u003cb\u003eMEK inhibitor.\u003c/b\u003e","cue":null},{"text":"It blocks the MEK step in the pathway I showed you at the beginning.","html":"\u003cb\u003eIt blocks the MEK step in the pathway I showed you at the beginning.\u003c/b\u003e","cue":null},{"text":"It was approved for pediatric patients with NF1 who have symptomatic, inoperable plexiform neurofibromas.","html":"\u003cb\u003eIt was approved\u003c/b\u003e for pediatric patients with NF1 who have symptomatic, inoperable plexiform neurofibromas.","cue":null},{"text":"Here is a 12-year-old boy.","html":"\u003cb\u003eHere is a 12-year-old boy.\u003c/b\u003e","cue":"CLICK"},{"text":"He had extensive plexiform neurofibromas in the neck, the mediastinum, along the portal vein in the liver, and throughout the mesentery.","html":"\u003cb\u003eHe had extensive\u003c/b\u003e plexiform neurofibromas in the \u003cb\u003eneck, the mediastinum, along the portal vein in the liver, and throughout the mesentery.\u003c/b\u003e","cue":null},{"text":"After four years of selumetinib, the tumors decreased a lot.","html":"\u003cb\u003eAfter four years\u003c/b\u003e of selumetinib, the \u003cb\u003etumors decreased a lot.\u003c/b\u003e","cue":null}]},{"n":25,"title":"Selumetinib","target":null,"items":[{"text":"Here are two more patients with inoperable plexiform neurofibromas who were treated with selumetinib.","html":"\u003cb\u003eHere are two more patients with inoperable plexiform neurofibromas who were treated\u003c/b\u003e with selumetinib.","cue":null},{"text":"On the left, there are extensive plexiform neurofibromas in the pelvis and buttocks.","html":"\u003cb\u003eOn the left, there are extensive plexiform neurofibromas in the pelvis and buttocks.\u003c/b\u003e","cue":null},{"text":"After four and a half years of treatment, they decreased dramatically.","html":"\u003cb\u003eAfter four and a half years of treatment, they decreased dramatically.\u003c/b\u003e","cue":"CLICK"},{"text":"On the right, this patient also had extensive plexiform neurofibromas in the chest and abdomen.","html":"\u003cb\u003eOn the right, this patient also had extensive plexiform neurofibromas in the chest and abdomen.\u003c/b\u003e","cue":null},{"text":"You can see the tumor encasing the celiac trunk and the SMA, and extending into the liver.","html":"\u003cb\u003eYou can see\u003c/b\u003e the tumor \u003cb\u003eencasing the celiac trunk and the SMA, and extending into the liver.\u003c/b\u003e","cue":null},{"text":"After four years, it also decreased a lot.","html":"\u003cb\u003eAfter four years, it also decreased a lot.\u003c/b\u003e","cue":null},{"text":"So, both patients responded very well.","html":"\u003cb\u003eSo, both patients responded very well.\u003c/b\u003e","cue":null},{"text":"When we evaluate new drugs like this, response evaluation is very important.","html":"\u003cb\u003eWhen we evaluate new drugs like this,\u003c/b\u003e response evaluation is very \u003cb\u003eimportant.\u003c/b\u003e","cue":null},{"text":"And for plexiform neurofibromas, it is a little unusual.","html":"\u003cb\u003eAnd for plexiform neurofibromas, it is a little unusual.\u003c/b\u003e","cue":null},{"text":"Unlike most other tumors, we use 3D volumetry.","html":"\u003cb\u003eUnlike\u003c/b\u003e most other tumors, we \u003cb\u003euse\u003c/b\u003e 3D \u003cb\u003evolumetry.\u003c/b\u003e","cue":null},{"text":"There are two reasons.","html":"\u003cb\u003eThere are two reasons.\u003c/b\u003e","cue":null},{"text":"First, PN is a benign tumor, so it grows very slowly.","html":"\u003cb\u003eFirst, PN is a benign\u003c/b\u003e tumor, so it \u003cb\u003egrows very slowly.\u003c/b\u003e","cue":null},{"text":"Second, its shape is very irregular.","html":"\u003cb\u003eSecond, its shape is very irregular.\u003c/b\u003e","cue":null},{"text":"So with 1D or 2D measurements, a decrease in size is hard to show.","html":"\u003cb\u003eSo with 1D or 2D\u003c/b\u003e measurements, a \u003cb\u003edecrease in size is hard to show.\u003c/b\u003e","cue":null},{"text":"For these two reasons, the REiNS group (레인즈) — Response Evaluation in Neurofibromatosis and Schwannomatosis (슈와노마토시스) — recommends 3D volumetric MRI for response evaluation.","html":"\u003cb\u003eFor these two reasons,\u003c/b\u003e the REiNS group \u003cspan class=\u0027ko\u0027\u003e(레인즈)\u003c/span\u003e — Response Evaluation in Neurofibromatosis and Schwannomatosis \u003cspan class=\u0027ko\u0027\u003e(슈와노마토시스)\u003c/span\u003e \u003cb\u003e— recommends\u003c/b\u003e 3D volumetric MRI for response evaluation.","cue":null},{"text":"So, what\u0027s new in treatment?","html":"\u003cb\u003eSo, what\u0026#39;s new in treatment?\u003c/b\u003e","cue":null}]},{"n":26,"title":"What’s New in Treatment?","target":null,"items":[{"text":"MEK inhibition has changed the management of plexiform neurofibromas.","html":"MEK inhibition has changed the management of plexiform neurofibromas.","cue":null},{"text":"In 2020, selumetinib (셀루메티닙) was approved for children.","html":"In 2020, selumetinib \u003cspan class=\u0027ko\u0027\u003e(셀루메티닙)\u003c/span\u003e \u003cb\u003ewas approved\u003c/b\u003e for children.","cue":null},{"text":"Then in 2025, a second drug, mirdametinib (미르다메티닙), was approved, and the approval was expanded to adults.","html":"Then in 2025, a \u003cb\u003esecond drug,\u003c/b\u003e mirdametinib \u003cspan class=\u0027ko\u0027\u003e(미르다메티닙)\u003c/span\u003e\u003cb\u003e, was approved, and the approval\u003c/b\u003e was expanded to adults.","cue":null},{"text":"So, NF1-associated PN is now a medically treatable tumor.","html":"So, NF1-associated PN is now a medically treatable tumor.","cue":null},{"text":"But even with these drugs, there is one complication we must never miss.","html":"\u003cb\u003eBut even with these drugs, there is one complication we must never miss.\u003c/b\u003e","cue":null}]},{"n":27,"title":"Malignant peripheral nerve sheath tumors (MPNST)","target":1020,"items":[{"text":"Now, the most important complication: malignant peripheral nerve sheath tumor, or MPNST.","html":"\u003cb\u003eNow, the most important complication:\u003c/b\u003e malignant peripheral nerve sheath tumor, or MPNST.","cue":null},{"text":"MPNSTs are highly malignant soft-tissue sarcomas that can arise from neurofibromas.","html":"MPNSTs are highly malignant soft-tissue sarcomas that can arise from neurofibromas.","cue":null},{"text":"They are key contributors to mortality in patients with NF1.","html":"They are key contributors to mortality in patients with NF1.","cue":null},{"text":"This diagram shows the steps.","html":"\u003cb\u003eThis diagram shows the steps.\u003c/b\u003e","cue":null},{"text":"It starts with loss of NF1 in a Schwann cell, which leads to a plexiform neurofibroma.","html":"\u003cb\u003eIt starts\u003c/b\u003e with loss of NF1 in a \u003cb\u003eSchwann cell, which leads to a plexiform\u003c/b\u003e neurofibroma.","cue":null},{"text":"Then, additional changes — loss of CDKN2A/B, then TP53 mutations or loss of EED or SUZ12, which are part of PRC2 — lead to MPNST.","html":"\u003cb\u003eThen, additional changes\u003c/b\u003e — loss of CDKN2A/B, then TP53 mutations or loss of EED or SUZ12, which are \u003cb\u003epart\u003c/b\u003e of PRC2 — \u003cb\u003elead\u003c/b\u003e to MPNST.","cue":null}]},{"n":28,"title":"Malignant peripheral nerve sheath tumors (MPNST)","target":null,"items":[{"text":"The step in the middle is important — the premalignant lesion.","html":"\u003cb\u003eThe step in the middle is important\u003c/b\u003e — the premalignant lesion.","cue":null},{"text":"Its full name is atypical neurofibromatous neoplasm of uncertain biological potential, or ANNUBP (에이-엔-엔-유-비-피).","html":"\u003cb\u003eIts full name\u003c/b\u003e is atypical neurofibromatous neoplasm of uncertain biological potential, or \u003cb\u003eANNUBP\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(에이-엔-엔-유-비-피)\u003c/span\u003e.","cue":null},{"text":"Most people just say \"atypical neurofibroma.\"","html":"\u003cb\u003eMost people just say\u003c/b\u003e \u0026quot;atypical neurofibroma.\u0026quot;","cue":null},{"text":"Atypical neurofibromas are premalignant lesions.","html":"Atypical neurofibromas are premalignant lesions.","cue":null},{"text":"After resection, they usually do not recur, and they do not metastasize.","html":"After resection, they \u003cb\u003eusually do not recur, and they do not metastasize.\u003c/b\u003e","cue":null},{"text":"MPNST is different.","html":"MPNST is \u003cb\u003edifferent.\u003c/b\u003e","cue":null},{"text":"It has a dismal prognosis, with local recurrence after resection and metastasis at an early stage.","html":"It has a dismal prognosis, with local recurrence after resection and metastasis at an early stage.","cue":null},{"text":"So early detection is the key — we want to find the tumor at the atypical neurofibroma stage.","html":"So early detection is the key — we \u003cb\u003ewant to find\u003c/b\u003e the tumor at the atypical neurofibroma stage.","cue":"CLICK"},{"text":"On imaging, atypical neurofibromas often appear as a distinct nodular lesion — a mass larger than 3 cm.","html":"On imaging, atypical neurofibromas \u003cb\u003eoften appear\u003c/b\u003e as a distinct nodular lesion — a mass \u003cb\u003elarger than 3 cm.\u003c/b\u003e","cue":null}]},{"n":29,"title":"Malignant vs. Benign nerve sheath tumors","target":null,"items":[{"text":"So, how can imaging tell benign from malignant?","html":"\u003cb\u003eSo, how can imaging tell\u003c/b\u003e benign from malignant?","cue":null},{"text":"This is a meta-analysis.","html":"\u003cb\u003eThis is a meta-analysis.\u003c/b\u003e","cue":null},{"text":"It includes nerve sheath tumors in general, not only in NF1, but it is still useful.","html":"\u003cb\u003eIt includes\u003c/b\u003e nerve sheath tumors in \u003cb\u003egeneral,\u003c/b\u003e not only in NF1, but it is still \u003cb\u003euseful.\u003c/b\u003e","cue":null},{"text":"Three points are worth remembering.","html":"\u003cb\u003eThree points are worth remembering.\u003c/b\u003e","cue":null},{"text":"First, ill-defined margins and perilesional edema are highly specific for malignancy — about 95%.","html":"\u003cb\u003eFirst, ill-defined margins and perilesional edema are highly specific for malignancy — about 95%.\u003c/b\u003e","cue":null},{"text":"Like this case, where the tumor infiltrates the surrounding tissue.","html":"\u003cb\u003eLike this case,\u003c/b\u003e where the tumor \u003cb\u003einfiltrates the surrounding tissue.\u003c/b\u003e","cue":null},{"text":"Second, loss of the target sign is very sensitive — about 99%.","html":"\u003cb\u003eSecond, loss of the target sign is very sensitive — about 99%.\u003c/b\u003e","cue":null},{"text":"In other words, if the target sign is still there, malignancy is unlikely.","html":"\u003cb\u003eIn other words, if the target sign is still there, malignancy is unlikely.\u003c/b\u003e","cue":null},{"text":"Third, size.","html":"\u003cb\u003eThird, size.\u003c/b\u003e","cue":null},{"text":"A cutoff of about 5 cm gives a good balance of sensitivity and specificity.","html":"\u003cb\u003eA cutoff of about 5 cm gives a good balance of sensitivity and specificity.\u003c/b\u003e","cue":null}]},{"n":30,"title":"MPNST vs. BPNST","target":null,"items":[{"text":"Now, this study is limited to patients with NF1.","html":"\u003cb\u003eNow, this study\u003c/b\u003e is limited to patients with NF1.","cue":null},{"text":"Here, it is harder.","html":"\u003cb\u003eHere, it is harder.\u003c/b\u003e","cue":null},{"text":"They have many tumors, and the shape alone does not help much.","html":"\u003cb\u003eThey have many tumors, and the shape alone does not help much.\u003c/b\u003e","cue":null},{"text":"Look at the lower table.","html":"\u003cb\u003eLook at the lower table.\u003c/b\u003e","cue":null},{"text":"For shape, margin, target sign, and peritumoral edema, the AUCs are all around 0.5 — almost like flipping a coin.","html":"\u003cb\u003eFor shape, margin, target sign, and peritumoral edema, the AUCs are all around 0.5 — almost like flipping a coin.\u003c/b\u003e","cue":null},{"text":"In contrast, the upper table shows that ADC values work very well, with AUCs of 0.97 to 0.98.","html":"\u003cb\u003eIn contrast, the upper table shows that ADC values work very well, with AUCs of 0.97 to 0.98.\u003c/b\u003e","cue":null},{"text":"So in NF1, DWI is more useful than conventional features.","html":"So in NF1, \u003cb\u003eDWI is more useful than conventional features.\u003c/b\u003e","cue":null}]},{"n":31,"title":"Malignant vs. Benign nerve sheath tumors","target":null,"items":[{"text":"This study also included atypical neurofibromas.","html":"\u003cb\u003eThis study also included atypical neurofibromas.\u003c/b\u003e","cue":null},{"text":"As you can see, the ADC goes down step by step: from benign tumors, to atypical neurofibromas, to MPNST.","html":"\u003cb\u003eAs you can see, the ADC goes down step by step:\u003c/b\u003e from benign tumors, to \u003cb\u003eatypical neurofibromas,\u003c/b\u003e to MPNST.","cue":null},{"text":"Using ADC dark, with a cut-off value of 1.6 (one point six) times ten to the minus three, benign tumors could be separated from atypical neurofibromas and MPNSTs — with a sensitivity of 85% and a specificity of 93%.","html":"\u003cb\u003eUsing ADC dark,\u003c/b\u003e with a cut-off value of 1.6 (one \u003cb\u003epoint six) times ten to the minus three,\u003c/b\u003e benign tumors could be \u003cb\u003eseparated from atypical neurofibromas\u003c/b\u003e and MPNSTs — with a sensitivity of \u003cb\u003e85%\u003c/b\u003e and a specificity of \u003cb\u003e93%.\u003c/b\u003e","cue":null},{"text":"[Take-home] A low ADC in a nodule within a plexiform neurofibroma should raise concern.","html":"\u003ci class=\u0027q\u0027\u003eTake-home\u003c/i\u003e \u003cb\u003eA low ADC in a nodule within a plexiform neurofibroma should raise concern.\u003c/b\u003e","cue":null}]},{"n":32,"title":"Malignant vs. Benign nerve sheath tumors","target":null,"items":[{"text":"Other tools can also help.","html":"\u003cb\u003eOther tools can also help.\u003c/b\u003e","cue":null},{"text":"On perfusion MRI, early arterial enhancement favors MPNST.","html":"On perfusion MRI, early arterial enhancement \u003cb\u003efavors MPNST.\u003c/b\u003e","cue":"CLICK"},{"text":"On PET-CT, an SUVmax of 3.5 or higher is a trigger for biopsy.","html":"On PET-CT, an SUVmax of \u003cb\u003e3.5 or higher is a trigger\u003c/b\u003e for biopsy.","cue":null},{"text":"And watch for the clinical red flags: a painful PN, rapid growth, a new hard texture, or a new neurologic deficit.","html":"\u003cb\u003eAnd watch\u003c/b\u003e for the clinical \u003cb\u003ered flags:\u003c/b\u003e a painful PN, rapid growth, a new hard texture, or a new neurologic deficit.","cue":null}]},{"n":33,"title":"21/M Pelvic pain","target":null,"items":[{"text":"Let me show you a case.","html":"\u003cb\u003eLet me show you a case.\u003c/b\u003e","cue":null},{"text":"This is a 21-year-old man with NF1 and pelvic pain.","html":"\u003cb\u003eThis is a 21-year-old man with NF1\u003c/b\u003e and pelvic pain.","cue":null},{"text":"He had many plexiform neurofibromas along the nerves.","html":"\u003cb\u003eHe had many plexiform neurofibromas along\u003c/b\u003e the nerves.","cue":null},{"text":"But in the pelvis, there was one large mass, about 12 cm — much bigger than the other lesions.","html":"\u003cb\u003eBut in the pelvis, there was one large\u003c/b\u003e mass, about \u003cb\u003e12 cm — much bigger than the other lesions.\u003c/b\u003e","cue":null},{"text":"A distinct nodular lesion.","html":"\u003cb\u003eA distinct nodular lesion.\u003c/b\u003e","cue":null},{"text":"On T2, it was heterogeneous (헤테로지니어스), and it showed heterogeneous enhancement — unlike the other small plexiform tumors.","html":"\u003cb\u003eOn T2, it was heterogeneous\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(헤테로지니어스)\u003c/span\u003e\u003cb\u003e, and it showed heterogeneous enhancement — unlike the other small plexiform\u003c/b\u003e tumors.","cue":null},{"text":"On DWI and the ADC map, part of the mass showed diffusion restriction.","html":"\u003cb\u003eOn DWI and the ADC map, part\u003c/b\u003e of the mass \u003cb\u003eshowed diffusion restriction.\u003c/b\u003e","cue":"CLICK"},{"text":"And PET-CT showed high FDG uptake in the same area.","html":"\u003cb\u003eAnd PET-CT showed high FDG uptake in the same area.\u003c/b\u003e","cue":null},{"text":"All of these findings suggested MPNST.","html":"\u003cb\u003eAll of these findings suggested MPNST.\u003c/b\u003e","cue":null},{"text":"He had surgery.","html":"\u003cb\u003eHe had surgery.\u003c/b\u003e","cue":"CLICK"},{"text":"This is the resected specimen — the tumor was removed together with part of the bladder and the colon.","html":"\u003cb\u003eThis is the resected specimen\u003c/b\u003e — the tumor was \u003cb\u003eremoved together with part of the bladder and the colon.\u003c/b\u003e","cue":null},{"text":"Unfortunately, the tumor came back just 4 months later, and he passed away.","html":"\u003cb\u003eUnfortunately,\u003c/b\u003e the tumor \u003cb\u003ecame back\u003c/b\u003e just 4 months later, and he \u003cb\u003epassed away.\u003c/b\u003e","cue":"CLICK"},{"text":"This case shows why we need both conventional MRI and functional imaging, like DWI and PET-CT, to catch MPNST.","html":"\u003cb\u003eThis case shows why we need both conventional MRI and functional imaging, like DWI and PET-CT, to catch MPNST.\u003c/b\u003e","cue":null}]},{"n":34,"title":"28/F","target":null,"items":[{"text":"Here is another case — a 28-year-old woman with NF1.","html":"\u003cb\u003eHere is another case — a 28-year-old woman with NF1.\u003c/b\u003e","cue":null},{"text":"There is a 7 cm mass in the popliteal fossa.","html":"\u003cb\u003eThere is a 7 cm mass in the popliteal fossa.\u003c/b\u003e","cue":null},{"text":"It is a single, well-defined mass — a localized intraneural neurofibroma.","html":"\u003cb\u003eIt is a single, well-defined mass\u003c/b\u003e — a localized intraneural neurofibroma.","cue":null},{"text":"On T2 fat-sat, it\u0027s bright but heterogeneous, and we don\u0027t see a clear target sign.","html":"\u003cb\u003eOn T2 fat-sat, it\u0026#39;s bright but heterogeneous, and we don\u0026#39;t see a clear target sign.\u003c/b\u003e","cue":null},{"text":"On T1, it is isointense to muscle.","html":"\u003cb\u003eOn T1, it is isointense to muscle.\u003c/b\u003e","cue":null},{"text":"After contrast, it enhances heterogeneously.","html":"\u003cb\u003eAfter contrast, it enhances heterogeneously.\u003c/b\u003e","cue":null},{"text":"On DWI, the mass is bright.","html":"\u003cb\u003eOn DWI, the mass is bright.\u003c/b\u003e","cue":null},{"text":"On the ADC map, it is not very dark.","html":"\u003cb\u003eOn the ADC map, it is not very dark.\u003c/b\u003e","cue":null},{"text":"So the diffusion findings alone were not clearly malignant.","html":"\u003cb\u003eSo the diffusion findings alone were not clearly malignant.\u003c/b\u003e","cue":null},{"text":"So let\u0027s put it together: larger than 3 cm, well-defined, and no target sign.","html":"\u003cb\u003eSo let\u0026#39;s put it together: larger than 3 cm, well-defined, and no target sign.\u003c/b\u003e","cue":null},{"text":"This is a distinct nodular lesion — the pattern I showed you before.","html":"\u003cb\u003eThis is a distinct nodular lesion — the pattern I showed you before.\u003c/b\u003e","cue":null},{"text":"[pause] What would you do with this lesion? [pause]","html":"\u003ci class=\u0027q\u0027\u003epause\u003c/i\u003e \u003cb\u003eWhat would you do with this lesion?\u003c/b\u003e \u003ci class=\u0027q\u0027\u003epause\u003c/i\u003e","cue":null},{"text":"It was excised.","html":"\u003cb\u003eIt was excised.\u003c/b\u003e","cue":null},{"text":"The pathology was atypical neurofibroma — ANNUBP.","html":"\u003cb\u003eThe pathology\u003c/b\u003e was atypical neurofibroma — \u003cb\u003eANNUBP.\u003c/b\u003e","cue":null},{"text":"Compare this with the previous case.","html":"\u003cb\u003eCompare this with the previous case.\u003c/b\u003e","cue":null},{"text":"That MPNST came back only 4 months after surgery.","html":"\u003cb\u003eThat MPNST came back only 4 months after surgery.\u003c/b\u003e","cue":null},{"text":"This patient was caught at the premalignant stage, and a simple excision is usually enough.","html":"\u003cb\u003eThis patient was caught at the premalignant stage, and a simple excision is usually enough.\u003c/b\u003e","cue":null}]},{"n":35,"title":"Radiologic Manifestations","target":1440,"items":[{"text":"So far, we have covered neurofibromas and MPNST.","html":"\u003cb\u003eSo far, we have covered\u003c/b\u003e neurofibromas and MPNST.","cue":null},{"text":"Next, let\u0027s look at the central nervous system.","html":"\u003cb\u003eNext, let\u0026#39;s look at the central nervous system.\u003c/b\u003e","cue":null}]},{"n":36,"title":"Optic pathway glioma","target":null,"items":[{"text":"Optic pathway glioma is the most common CNS tumor in NF1 — about 5 to 20% of patients.","html":"Optic pathway glioma is the most common CNS tumor in NF1 — about 5 to 20% of \u003cb\u003epatients.\u003c/b\u003e","cue":null},{"text":"The majority occur in children under 7 years.","html":"The majority \u003cb\u003eoccur\u003c/b\u003e in children under 7 \u003cb\u003eyears.\u003c/b\u003e","cue":null},{"text":"The mean age is 4.5 years.","html":"The mean \u003cb\u003eage\u003c/b\u003e is 4.5 \u003cb\u003eyears.\u003c/b\u003e","cue":null},{"text":"Most are pilocytic (파일로시틱) astrocytomas.","html":"Most are pilocytic \u003cspan class=\u0027ko\u0027\u003e(파일로시틱)\u003c/span\u003e astrocytomas.","cue":null},{"text":"About half of the patients have symptoms: poor visual acuity, optic atrophy, visual field defects, hypothalamic dysfunction, or papilledema.","html":"\u003cb\u003eAbout half of the patients have symptoms:\u003c/b\u003e poor visual acuity, optic atrophy, visual field defects, hypothalamic dysfunction, or papilledema.","cue":null},{"text":"The treatment is chemotherapy.","html":"The treatment is chemotherapy.","cue":null},{"text":"The indication is visual acuity loss, or a new visual field loss — not the imaging finding alone.","html":"The indication is visual acuity loss, or a new visual field loss — not the \u003cb\u003eimaging finding alone.\u003c/b\u003e","cue":null}]},{"n":37,"title":"Optic pathway glioma","target":null,"items":[{"text":"Optic pathway gliomas can occur anywhere along the optic pathway — the optic nerves, the chiasm, the optic tracts, and the optic radiations.","html":"Optic pathway gliomas can \u003cb\u003eoccur\u003c/b\u003e anywhere along the optic pathway — the optic nerves, the chiasm, the optic tracts, and the optic radiations.","cue":null},{"text":"They look like tubular thickening of the optic nerve, or a suprasellar tumor.","html":"\u003cb\u003eThey look\u003c/b\u003e like tubular thickening of the optic nerve, or a suprasellar tumor.","cue":null},{"text":"They are hyperintense on T2, with variable enhancement.","html":"They are hyperintense on \u003cb\u003eT2,\u003c/b\u003e with variable enhancement.","cue":null},{"text":"And in NF1, they are usually less aggressive than in children without NF1.","html":"And in NF1, they are usually less aggressive than in children without NF1.","cue":null}]},{"n":38,"title":"3yr","target":null,"items":[{"text":"Here are two patients with suspected optic pathway glioma.","html":"\u003cb\u003eHere are two patients with suspected optic pathway glioma.\u003c/b\u003e","cue":null},{"text":"The first child had enhancing thickening in the right optic tract.","html":"\u003cb\u003eThe first child had enhancing thickening in the right optic tract.\u003c/b\u003e","cue":null},{"text":"The second had it in the left optic nerve.","html":"\u003cb\u003eThe second had it in the left optic nerve.\u003c/b\u003e","cue":null},{"text":"Both were asymptomatic, so they were observed without treatment.","html":"\u003cb\u003eBoth were asymptomatic, so they were observed without treatment.\u003c/b\u003e","cue":null},{"text":"On follow-up MRI, 3 years and 6 years later, the enhancement disappeared, and the optic nerve became normal.","html":"\u003cb\u003eOn follow-up MRI,\u003c/b\u003e 3 \u003cb\u003eyears\u003c/b\u003e and 6 \u003cb\u003eyears later, the enhancement disappeared, and the optic nerve became normal.\u003c/b\u003e","cue":"CLICK"},{"text":"This is spontaneous regression.","html":"\u003cb\u003eThis\u003c/b\u003e is spontaneous regression.","cue":"CLICK"},{"text":"So optic pathway gliomas in NF1 can regress on their own.","html":"\u003cb\u003eSo optic pathway gliomas in NF1 can regress on their own.\u003c/b\u003e","cue":null},{"text":"Imaging alone is not a reason to treat.","html":"\u003cb\u003eImaging alone is not a reason to treat.\u003c/b\u003e","cue":null}]},{"n":39,"title":"Focal areas of signal intensity (FASIs)","target":null,"items":[{"text":"Next, focal areas of signal intensity, or FASI.","html":"\u003cb\u003eNext,\u003c/b\u003e focal areas of signal intensity, or FASI.","cue":null},{"text":"You may also hear them called \"UBOs\" — unidentified bright objects.","html":"\u003cb\u003eYou may also hear them called \u0026quot;UBOs\u0026quot; — unidentified bright objects.\u003c/b\u003e","cue":null},{"text":"They are seen in about 70% of children with NF1.","html":"\u003cb\u003eThey are seen\u003c/b\u003e in about 70% of \u003cb\u003echildren with NF1.\u003c/b\u003e","cue":null},{"text":"They usually appear by age 3, change in number and size over time, and usually disappear by late adolescence.","html":"\u003cb\u003eThey usually appear\u003c/b\u003e by age 3, change in number and size over \u003cb\u003etime, and usually disappear\u003c/b\u003e by late adolescence.","cue":null},{"text":"Pathologically, they are areas of myelin vacuolization (배큐얼라이제이션), also called spongiform myelinopathy.","html":"\u003cb\u003ePathologically,\u003c/b\u003e they are areas of myelin vacuolization \u003cspan class=\u0027ko\u0027\u003e(배큐얼라이제이션)\u003c/span\u003e\u003cb\u003e, also called\u003c/b\u003e spongiform myelinopathy.","cue":null},{"text":"They are found in the basal ganglia — especially the globus pallidus — and in the thalamus, cerebellum, and brainstem.","html":"\u003cb\u003eThey are found\u003c/b\u003e in the basal ganglia — \u003cb\u003eespecially the globus pallidus — and in the thalamus,\u003c/b\u003e cerebellum, and brainstem.","cue":null},{"text":"They are bright on T2 and FLAIR, and iso- to slightly bright on T1.","html":"\u003cb\u003eThey are bright on T2\u003c/b\u003e and FLAIR, and \u003cb\u003eiso- to slightly bright on T1.\u003c/b\u003e","cue":null},{"text":"Most importantly: no enhancement, and no mass effect.","html":"\u003cb\u003eMost importantly:\u003c/b\u003e no enhancement, and no mass effect.","cue":null},{"text":"If a \"FASI\" enhances, has mass effect, or keeps growing — think tumor, not FASI.","html":"If a \u0026quot;FASI\u0026quot; \u003cb\u003eenhances,\u003c/b\u003e has mass effect, or \u003cb\u003ekeeps growing — think tumor,\u003c/b\u003e not FASI.","cue":null}]},{"n":40,"title":"Non–Optic Pathway Intracranial Gliomas","target":1680,"items":[{"text":"Non-optic pathway gliomas are less common — about 1 to 2% of NF1 patients.","html":"Non-optic pathway gliomas are \u003cb\u003eless common\u003c/b\u003e — about 1 to 2% of NF1 patients.","cue":null},{"text":"Most are low-grade gliomas, usually pilocytic astrocytomas.","html":"Most are low-grade gliomas, \u003cb\u003eusually\u003c/b\u003e pilocytic astrocytomas.","cue":null},{"text":"They are often asymptomatic, and they usually grow slowly.","html":"\u003cb\u003eThey are often\u003c/b\u003e asymptomatic, and they \u003cb\u003eusually grow slowly.\u003c/b\u003e","cue":null},{"text":"Like FASIs, they are common in the brainstem and the posterior fossa.","html":"\u003cb\u003eLike FASIs, they are common\u003c/b\u003e in the brainstem and the posterior fossa.","cue":null},{"text":"So how do we tell them apart?","html":"\u003cb\u003eSo how do we tell them apart?\u003c/b\u003e","cue":null},{"text":"Compared with FASIs, gliomas have clearer margins, more obvious signal change, variable enhancement, and mass effect — as in this 37-year-old man.","html":"\u003cb\u003eCompared with FASIs,\u003c/b\u003e gliomas have \u003cb\u003eclearer margins, more obvious signal change,\u003c/b\u003e variable enhancement, and mass effect — as in \u003cb\u003ethis 37-year-old man.\u003c/b\u003e","cue":null}]},{"n":41,"title":"Non–Optic Pathway Intracranial Gliomas","target":null,"items":[{"text":"Here is another example.","html":"\u003cb\u003eHere is another example.\u003c/b\u003e","cue":null},{"text":"An 11-year-old boy had right arm weakness.","html":"\u003cb\u003eAn 11-year-old boy\u003c/b\u003e had right \u003cb\u003earm\u003c/b\u003e weakness.","cue":null},{"text":"There is a mass in the left thalamus, with mass effect and heterogeneous enhancement.","html":"\u003cb\u003eThere is a mass in the left thalamus, with mass effect and heterogeneous enhancement.\u003c/b\u003e","cue":null},{"text":"Biopsy showed a pilocytic astrocytoma.","html":"\u003cb\u003eBiopsy showed\u003c/b\u003e a pilocytic astrocytoma.","cue":null},{"text":"Compare it with the FASIs in the globus pallidus.","html":"\u003cb\u003eCompare it with the FASIs in the globus pallidus.\u003c/b\u003e","cue":null},{"text":"They have no mass effect and no enhancement.","html":"\u003cb\u003eThey have no mass effect and no enhancement.\u003c/b\u003e","cue":null},{"text":"The difference is clear.","html":"\u003cb\u003eThe difference is clear.\u003c/b\u003e","cue":null}]},{"n":42,"title":"Non–Optic Pathway Intracranial Gliomas","target":null,"items":[{"text":"High-grade gliomas can also occur in NF1.","html":"High-grade gliomas can also \u003cb\u003eoccur in NF1.\u003c/b\u003e","cue":null},{"text":"They are rare, and they are usually seen in adults — the median age is about 40.","html":"They are rare, and they are \u003cb\u003eusually seen in adults\u003c/b\u003e — the median age is about 40.","cue":null},{"text":"Unlike low-grade gliomas, they usually arise in the cerebral hemispheres, and they grow fast.","html":"\u003cb\u003eUnlike low-grade\u003c/b\u003e gliomas, they \u003cb\u003eusually arise\u003c/b\u003e in the cerebral hemispheres, and they \u003cb\u003egrow fast.\u003c/b\u003e","cue":null},{"text":"This boy was 14 years old at the first MRI, and it was normal.","html":"\u003cb\u003eThis boy\u003c/b\u003e was 14 \u003cb\u003eyears old at the first MRI, and it was normal.\u003c/b\u003e","cue":null},{"text":"One year later, a small focal lesion appeared in the left hemisphere.","html":"\u003cb\u003eOne year later, a small focal lesion appeared in the left\u003c/b\u003e hemisphere.","cue":null},{"text":"The next year, it was a little bigger.","html":"\u003cb\u003eThe next year, it was a little bigger.\u003c/b\u003e","cue":null},{"text":"Just a few months later, it grew rapidly, with hemorrhage.","html":"\u003cb\u003eJust a few months later, it grew rapidly, with hemorrhage.\u003c/b\u003e","cue":null},{"text":"Biopsy confirmed glioblastoma.","html":"\u003cb\u003eBiopsy confirmed\u003c/b\u003e glioblastoma.","cue":null},{"text":"He was 16.","html":"He was 16.","cue":null},{"text":"The lesson: a new lesion in the cerebral hemisphere, especially in an older child or an adult, is not a typical FASI.","html":"\u003cb\u003eThe lesson: a new lesion\u003c/b\u003e in the cerebral hemisphere, \u003cb\u003eespecially in an older child or an adult, is not a typical FASI.\u003c/b\u003e","cue":null},{"text":"It needs close follow-up.","html":"\u003cb\u003eIt needs close follow-up.\u003c/b\u003e","cue":null}]},{"n":43,"title":"Radiologic manifestations","target":1800,"items":[{"text":"Next, let\u0027s look at bone dysplasia, vasculopathy, dural ectasia, meningoceles, and scoliosis.","html":"\u003cb\u003eNext, let\u0026#39;s look\u003c/b\u003e at bone dysplasia, vasculopathy, dural ectasia, meningoceles, and scoliosis.","cue":null},{"text":"These findings share one cause: mesodermal (메소더멀) dysplasia.","html":"\u003cb\u003eThese findings share one cause:\u003c/b\u003e mesodermal \u003cspan class=\u0027ko\u0027\u003e(메소더멀)\u003c/span\u003e dysplasia.","cue":"CLICK"},{"text":"The mesoderm forms bone, connective tissue, and blood vessels.","html":"The mesoderm forms bone, connective tissue, and blood vessels.","cue":null},{"text":"In NF1, these tissues do not develop normally.","html":"\u003cb\u003eIn NF1,\u003c/b\u003e these tissues do not \u003cb\u003edevelop normally.\u003c/b\u003e","cue":null}]},{"n":44,"title":"Bone dysplasia","target":null,"items":[{"text":"Bone dysplasia in NF1 has two causes: primary mesodermal dysplasia, and pressure from nearby neurofibromas.","html":"Bone dysplasia in \u003cb\u003eNF1 has two causes: primary\u003c/b\u003e mesodermal dysplasia, and pressure from \u003cb\u003enearby\u003c/b\u003e neurofibromas.","cue":null},{"text":"Sphenoid wing dysplasia is a classic finding.","html":"Sphenoid wing dysplasia is a \u003cb\u003eclassic finding.\u003c/b\u003e","cue":null},{"text":"It can cause proptosis of the eye on the same side.","html":"\u003cb\u003eIt can cause proptosis of the eye on the same side.\u003c/b\u003e","cue":null},{"text":"Other findings include calvarial defects, and changes in the spine — thin pedicles, thin transverse processes and laminae, and widened neural foramina.","html":"\u003cb\u003eOther findings include\u003c/b\u003e calvarial defects, and \u003cb\u003echanges in the spine — thin\u003c/b\u003e pedicles, \u003cb\u003ethin\u003c/b\u003e transverse processes and laminae, and \u003cb\u003ewidened\u003c/b\u003e neural \u003cb\u003eforamina.\u003c/b\u003e","cue":null},{"text":"These are often caused by plexiform neurofibromas.","html":"\u003cb\u003eThese are often caused by plexiform\u003c/b\u003e neurofibromas.","cue":null}]},{"n":45,"title":"1/F","target":null,"items":[{"text":"Long bone bowing, fracture, and pseudarthrosis (수다쓰로시스) are also typical of NF1.","html":"\u003cb\u003eLong bone\u003c/b\u003e bowing, fracture, and pseudarthrosis \u003cspan class=\u0027ko\u0027\u003e(수다쓰로시스)\u003c/span\u003e \u003cb\u003eare also typical of NF1.\u003c/b\u003e","cue":null},{"text":"The classic example is anterolateral bowing of the tibia.","html":"\u003cb\u003eThe classic example is anterolateral\u003c/b\u003e bowing of the \u003cb\u003etibia.\u003c/b\u003e","cue":null},{"text":"This 1-year-old girl first had bowing of the tibia and fibula, and the fibula was thin, with low bone density.","html":"\u003cb\u003eThis 1-year-old girl first\u003c/b\u003e had bowing of the \u003cb\u003etibia and fibula, and the fibula was thin, with low bone density.\u003c/b\u003e","cue":null},{"text":"One year later, the bowing was worse, and there was a new fibular fracture.","html":"\u003cb\u003eOne year later,\u003c/b\u003e the bowing was \u003cb\u003eworse, and there was a new fibular\u003c/b\u003e fracture.","cue":"CLICK"},{"text":"Three years after that, it became a pseudarthrosis — the fracture never healed.","html":"\u003cb\u003eThree years after that, it became\u003c/b\u003e a pseudarthrosis — the fracture \u003cb\u003enever healed.\u003c/b\u003e","cue":null},{"text":"Tip: in a young child with anterolateral tibial bowing, always think of NF1.","html":"\u003cb\u003eTip: in a young child with anterolateral tibial\u003c/b\u003e bowing, \u003cb\u003ealways think of NF1.\u003c/b\u003e","cue":null}]},{"n":46,"title":"Vasculopathy","target":null,"items":[{"text":"Next, NF1 vasculopathy.","html":"\u003cb\u003eNext, NF1\u003c/b\u003e vasculopathy.","cue":null},{"text":"This is also caused by mesodermal dysplasia, in the arterial wall.","html":"\u003cb\u003eThis is also caused\u003c/b\u003e by mesodermal dysplasia, in the arterial \u003cb\u003ewall.\u003c/b\u003e","cue":null},{"text":"In the brain, it can cause moyamoya, aneurysms, and AVMs.","html":"\u003cb\u003eIn the brain, it can cause\u003c/b\u003e moyamoya, aneurysms, and \u003cb\u003eAVMs.\u003c/b\u003e","cue":null},{"text":"In the first case, a 9-year-old girl, the left MCA is narrowed, with collateral vessels.","html":"\u003cb\u003eIn the first case, a 9-year-old girl, the left MCA is narrowed, with collateral vessels.\u003c/b\u003e","cue":null},{"text":"In the second case, a 19-year-old woman, there is a large aneurysm of the left internal carotid artery.","html":"\u003cb\u003eIn the second case, a 19-year-old woman, there is a large\u003c/b\u003e aneurysm of the \u003cb\u003eleft internal carotid\u003c/b\u003e artery.","cue":null},{"text":"So NF1 vasculopathy can cause both narrowing and dilation (다일레이션).","html":"\u003cb\u003eSo NF1\u003c/b\u003e vasculopathy can \u003cb\u003ecause both\u003c/b\u003e narrowing and \u003cb\u003edilation\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(다일레이션)\u003c/span\u003e.","cue":null},{"text":"A simple tip: on routine T2 images, always check the normal flow voids.","html":"\u003cb\u003eA simple tip: on routine T2 images, always check\u003c/b\u003e the normal \u003cb\u003eflow\u003c/b\u003e voids.","cue":null},{"text":"Look for voids that are lost, and voids that are too big.","html":"\u003cb\u003eLook\u003c/b\u003e for voids that are \u003cb\u003elost,\u003c/b\u003e and voids that are \u003cb\u003etoo big.\u003c/b\u003e","cue":null},{"text":"Outside the brain, it can involve the renal arteries and the aorta.","html":"\u003cb\u003eOutside the brain, it can involve\u003c/b\u003e the renal \u003cb\u003earteries\u003c/b\u003e and the aorta.","cue":null},{"text":"So in a child with NF1 and high blood pressure, think of renal artery stenosis — and also pheochromocytoma.","html":"\u003cb\u003eSo in a child with NF1 and high blood pressure, think\u003c/b\u003e of renal artery stenosis — and also \u003cb\u003epheochromocytoma.\u003c/b\u003e","cue":null}]},{"n":47,"title":"Vasculopathy","target":null,"items":[{"text":"Here is another vasculopathy case — a 13-year-old girl with NF1.","html":"Here is another vasculopathy \u003cb\u003ecase — a 13-year-old girl with NF1.\u003c/b\u003e","cue":null},{"text":"On coronal T2, the normal flow void of the left MCA is hard to see.","html":"\u003cb\u003eOn coronal\u003c/b\u003e T2, the \u003cb\u003enormal\u003c/b\u003e flow void of the \u003cb\u003eleft MCA is hard to see.\u003c/b\u003e","cue":null},{"text":"On FLAIR, there is tissue loss and signal change in the left parietotemporal lobe, from chronic ischemia.","html":"\u003cb\u003eOn FLAIR, there is tissue loss and signal change in the left parietotemporal lobe, from chronic ischemia.\u003c/b\u003e","cue":null},{"text":"So this is NF1 vasculopathy, already with parenchymal damage.","html":"\u003cb\u003eSo this is NF1\u003c/b\u003e vasculopathy, \u003cb\u003ealready with parenchymal damage.\u003c/b\u003e","cue":null},{"text":"Most NF1 brain MRIs don\u0027t include MR angiography.","html":"\u003cb\u003eMost NF1 brain MRIs don\u0026#39;t include MR angiography.\u003c/b\u003e","cue":"Take-home"},{"text":"So when you read them, always check the flow voids of the large vessels on T2 — the ICA, the MCA, and the basilar artery.","html":"\u003cb\u003eSo when you read\u003c/b\u003e them, always check the flow voids of the large vessels on T2 — the \u003cb\u003eICA, the MCA, and the basilar artery.\u003c/b\u003e","cue":null},{"text":"It may be the only clue.","html":"\u003cb\u003eIt may be the only clue.\u003c/b\u003e","cue":null}]},{"n":48,"title":"Dural ectasia and meningoceles","target":null,"items":[{"text":"Next, dural ectasia and meningoceles.","html":"\u003cb\u003eNext,\u003c/b\u003e dural ectasia and meningoceles.","cue":null},{"text":"Dural ectasia is focal dilatation of the dural sac.","html":"Dural ectasia is focal dilatation of the dural sac.","cue":null},{"text":"It is also caused by mesodermal dysplasia, and it is related to underlying bony weakness.","html":"\u003cb\u003eIt is also caused\u003c/b\u003e by mesodermal dysplasia, and it is related to underlying bony weakness.","cue":null},{"text":"It causes scalloping of the back of the vertebral bodies, and it can form meningoceles — such as lateral thoracic meningoceles.","html":"\u003cb\u003eIt causes scalloping of the back of the vertebral bodies, and it can form\u003c/b\u003e meningoceles — \u003cb\u003esuch as lateral thoracic\u003c/b\u003e meningoceles.","cue":null},{"text":"[Tip] A lateral thoracic meningocele can look like a posterior mediastinal mass on a chest X-ray.","html":"\u003ci class=\u0027q\u0027\u003eTip\u003c/i\u003e \u003cb\u003eA lateral thoracic\u003c/b\u003e meningocele can \u003cb\u003elook like a posterior mediastinal mass on a chest X-ray.\u003c/b\u003e","cue":null},{"text":"On MRI, it follows CSF signal.","html":"\u003cb\u003eOn MRI, it follows CSF signal.\u003c/b\u003e","cue":null},{"text":"Don\u0027t call it a neurofibroma.","html":"\u003cb\u003eDon\u0026#39;t call it a neurofibroma.\u003c/b\u003e","cue":null}]},{"n":49,"title":"Scoliosis","target":null,"items":[{"text":"Scoliosis is seen in about 21% of NF1 patients.","html":"Scoliosis is \u003cb\u003eseen\u003c/b\u003e in about 21% of NF1 patients.","cue":null},{"text":"In NF1, it can be dystrophic scoliosis.","html":"In NF1, it can be dystrophic scoliosis.","cue":null},{"text":"It starts earlier, progresses rapidly, and has a worse prognosis.","html":"\u003cb\u003eIt starts\u003c/b\u003e earlier, \u003cb\u003eprogresses\u003c/b\u003e rapidly, and has a worse prognosis.","cue":null},{"text":"It can even cause respiratory compromise.","html":"\u003cb\u003eIt can even cause\u003c/b\u003e respiratory compromise.","cue":null},{"text":"Dystrophic curves are usually short and sharply angled, with abnormal vertebrae — as in this 12-year-old boy.","html":"Dystrophic \u003cb\u003ecurves are usually short and sharply angled, with abnormal vertebrae — as in this 12-year-old boy.\u003c/b\u003e","cue
