":null}]},{"n":50,"title":"Radiologic Manifestations","target":2040,"items":[{"text":"Finally, let\u0027s look at some other findings.","html":"\u003cb\u003eFinally, let\u0026#39;s look at some other findings.\u003c/b\u003e","cue":null}]},{"n":51,"title":"Gastrointestinal stromal tumor (GIST)","target":null,"items":[{"text":"In the bones, multiple non-ossifying fibromas can be seen, as in these knees.","html":"\u003cb\u003eIn the bones, multiple\u003c/b\u003e non-ossifying fibromas can be \u003cb\u003eseen, as in these knees.\u003c/b\u003e","cue":null},{"text":"In the abdomen, NF1 patients have a higher risk of gastrointestinal stromal tumor, or GIST.","html":"\u003cb\u003eIn the abdomen, NF1 patients have a higher risk\u003c/b\u003e of gastrointestinal stromal tumor, or GIST.","cue":null},{"text":"GISTs in NF1 are often multiple, and usually in the small bowel.","html":"GISTs in \u003cb\u003eNF1 are often multiple, and usually in the small bowel.\u003c/b\u003e","cue":null},{"text":"They also have a higher risk of pheochromocytomas and paragangliomas.","html":"\u003cb\u003eThey also have a higher risk\u003c/b\u003e of pheochromocytomas and paragangliomas.","cue":null},{"text":"So when you read abdominal imaging in an NF1 patient, look carefully at the small bowel, the adrenal glands, and along the aorta.","html":"\u003cb\u003eSo when you read abdominal imaging in an NF1 patient, look carefully at the small bowel, the adrenal glands, and along the aorta.\u003c/b\u003e","cue":null}]},{"n":52,"title":"List of sporadic tumors with NF1 mutation","target":null,"items":[{"text":"This slide shows one more interesting point.","html":"\u003cb\u003eThis slide shows one more interesting point.\u003c/b\u003e","cue":null},{"text":"NF1 is not only a germline disease.","html":"NF1 is not only a \u003cb\u003egermline disease.\u003c/b\u003e","cue":null},{"text":"Somatic NF1 mutations are found in many sporadic cancers — for example, in most desmoplastic melanomas, and in some ovarian and breast cancers.","html":"\u003cb\u003eSomatic\u003c/b\u003e NF1 mutations are \u003cb\u003efound in many\u003c/b\u003e sporadic \u003cb\u003ecancers — for example, in most desmoplastic melanomas, and in some ovarian and breast cancers.\u003c/b\u003e","cue":null},{"text":"For NF1 patients themselves, the most practical point is breast cancer.","html":"For NF1 \u003cb\u003epatients themselves, the most practical point is breast cancer.\u003c/b\u003e","cue":null},{"text":"Women with NF1 have a higher risk of breast cancer, especially before age 50.","html":"\u003cb\u003eWomen\u003c/b\u003e with NF1 have a \u003cb\u003ehigher risk of breast cancer, especially before age 50.\u003c/b\u003e","cue":null},{"text":"So breast screening usually starts at age 30.","html":"\u003cb\u003eSo breast screening usually starts at age 30.\u003c/b\u003e","cue":null}]},{"n":53,"title":"Age-appropriate surveillance","target":2160,"items":[{"text":"We\u0027ve now reviewed many different findings.","html":"\u003cb\u003eWe\u0026#39;ve now reviewed many different findings.\u003c/b\u003e","cue":null},{"text":"As this timeline shows, they appear at different ages.","html":"\u003cb\u003eAs this timeline shows, they appear at different\u003c/b\u003e ages.","cue":null},{"text":"Around birth and infancy: café-au-lait macules, orbital and tibial dysplasia, pseudarthrosis, and plexiform neurofibromas.","html":"\u003cb\u003eAround birth and infancy: caf\u0026#233;-au-lait macules, orbital and tibial dysplasia, pseudarthrosis, and plexiform neurofibromas.\u003c/b\u003e","cue":null},{"text":"In early childhood: learning deficits, ADHD or autism, and optic pathway glioma.","html":"\u003cb\u003eIn early childhood: learning deficits, ADHD or autism, and optic pathway glioma.\u003c/b\u003e","cue":null},{"text":"Later in childhood and adolescence: skinfold freckling, Lisch nodules, scoliosis, dermal and paraspinal neurofibromas, and brainstem glioma.","html":"\u003cb\u003eLater in childhood and adolescence: skinfold freckling, Lisch nodules, scoliosis, dermal and paraspinal neurofibromas, and brainstem glioma.\u003c/b\u003e","cue":null},{"text":"And in adulthood: MPNST, breast cancer, and high-grade glioma.","html":"\u003cb\u003eAnd in adulthood: MPNST, breast cancer, and high-grade glioma.\u003c/b\u003e","cue":null},{"text":"So surveillance should be age-appropriate.","html":"So surveillance should be age-appropriate.","cue":null}]},{"n":54,"title":"Role of Imaging in the Management of Plexiform Neurofibroma","target":null,"items":[{"text":"Finally, how should we image plexiform neurofibromas?","html":"\u003cb\u003eFinally, how should we image\u003c/b\u003e plexiform neurofibromas?","cue":null},{"text":"This table shows four situations.","html":"\u003cb\u003eThis table shows four\u003c/b\u003e situations.","cue":null},{"text":"Baseline means the first imaging to map the tumors.","html":"Baseline \u003cb\u003emeans the first\u003c/b\u003e imaging to \u003cb\u003emap the tumors.\u003c/b\u003e","cue":null},{"text":"In a patient without symptoms: whole-body MRI without contrast, at the transition to adulthood.","html":"\u003cb\u003eIn a patient without\u003c/b\u003e symptoms: whole-body MRI \u003cb\u003ewithout\u003c/b\u003e contrast, at the transition to adulthood.","cue":null},{"text":"STIR is the key sequence.","html":"STIR is the key sequence.","cue":null},{"text":"The goal is to know the internal PN burden.","html":"The goal is to \u003cb\u003eknow\u003c/b\u003e the internal PN burden.","cue":null},{"text":"In a patient with symptoms: local or whole-body MRI — to see the extent of PN, and to look for MPNST.","html":"\u003cb\u003eIn a patient\u003c/b\u003e with symptoms: local or whole-body MRI — to \u003cb\u003esee\u003c/b\u003e the extent of PN, and to look for MPNST.","cue":null},{"text":"Surveillance means following a known PN.","html":"Surveillance \u003cb\u003emeans following a known\u003c/b\u003e PN.","cue":null},{"text":"Local MRI with STIR is enough, to check the size and extent.","html":"Local MRI with STIR is \u003cb\u003eenough, to check\u003c/b\u003e the size and extent.","cue":null},{"text":"And if we suspect MPNST: local MRI with contrast — with DWI if possible — and FDG PET/CT.","html":"\u003cb\u003eAnd if we suspect\u003c/b\u003e MPNST: local MRI with contrast — with DWI if \u003cb\u003epossible\u003c/b\u003e — and FDG PET/CT.","cue":null}]},{"n":55,"title":"Summary","target":null,"items":[{"text":"Let me summarize.","html":"\u003cb\u003eLet me summarize.\u003c/b\u003e","cue":null},{"text":"NF1 is one of the most common genetic (저네틱) diseases.","html":"NF1 is one of the most common genetic \u003cspan class=\u0027ko\u0027\u003e(저네틱)\u003c/span\u003e diseases.","cue":null},{"text":"It affects many organs, and patients need lifelong follow-up.","html":"\u003cb\u003eIt affects many organs, and patients need\u003c/b\u003e lifelong \u003cb\u003efollow-up.\u003c/b\u003e","cue":null},{"text":"Three imaging findings are part of the diagnostic criteria: neurofibromas, especially plexiform neurofibromas; optic pathway gliomas; and bone dysplasia.","html":"\u003cb\u003eThree imaging findings are part of the diagnostic criteria:\u003c/b\u003e neurofibromas, \u003cb\u003eespecially\u003c/b\u003e plexiform neurofibromas; optic pathway gliomas; and \u003cb\u003ebone\u003c/b\u003e dysplasia.","cue":null},{"text":"On imaging, think of four types of neurofibroma.","html":"\u003cb\u003eOn imaging, think of four types\u003c/b\u003e of neurofibroma.","cue":null},{"text":"Our most important job is to find atypical neurofibroma or MPNST early.","html":"\u003cb\u003eOur most important job is to find\u003c/b\u003e atypical neurofibroma or MPNST early.","cue":null},{"text":"Look for a distinct nodular lesion, loss of the target sign, and low ADC.","html":"\u003cb\u003eLook for a distinct nodular lesion, loss of the target sign, and low ADC.\u003c/b\u003e","cue":null},{"text":"And finally, surveillance should be age-appropriate.","html":"\u003cb\u003eAnd finally,\u003c/b\u003e surveillance should be age-appropriate.","cue":null}]},{"n":56,"title":"Thank you for your attention","target":2280,"items":[{"text":"Thank you for your attention.","html":"Thank you for your attention.","cue":null},{"text":"I\u0027m happy to take any questions.","html":"\u003cb\u003eI\u0026#39;m happy to take any questions.\u003c/b\u003e","cue":null}]}];
</script>
<script>
(function () {
  const DATA = window.NF1_SCRIPT || [];
  // flatten to sentences
  const S = [];
  DATA.forEach((sl, si) => sl.items.forEach((it, k) => S.push({ si, k, last: k === sl.items.length - 1, ...it })));
  const $ = (id) => document.getElementById(id);

  // ---------- state ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('nf1p.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('nf1p.' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const hot = window.claude && window.claude.hot;
  const hotData = (hot && hot.data) || {};
  let pos = Math.min(hotData.pos ?? store.get('pos', 0), S.length - 1);
  let mode = store.get('mode', 'pace');
  let wpm = store.get('wpm', 110);
  let size = store.get('size', 34);
  let view = store.get('view', window.matchMedia('(max-width: 560px)').matches ? 'k3' : 'all');
  function applyView() { document.body.classList.toggle('k3', view === 'k3'); const b = $('view'); if (b) b.textContent = view === 'k3' ? '전체 보기' : '3줄 보기'; }
  let running = false;
  let t0 = null, elapsedBefore = store.get('elapsed', 0);
  if (hot && hot.snapshot) hot.snapshot(() => ({ pos }));
  document.documentElement.dataset.theme = store.get('theme', 'dark');
  document.documentElement.style.setProperty('--size', size + 'px');

  // ---------- words ----------
  const NUM = { zero: '0', one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9', ten: '10', eleven: '11', twelve: '12', thirteen: '13', fourteen: '14', fifteen: '15', sixteen: '16', seventeen: '17', eighteen: '18', nineteen: '19', twenty: '20', thirty: '30', forty: '40', fifty: '50', hundred: '100' };
  function norm(w) {
    w = w.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9.'%-]/g, '').replace(/^[.'-]+|[.'%-]+$/g, '').replace(/'s$/, '');
    if (NUM[w]) w = NUM[w];
    if (w.length > 3 && /[a-z]s$/.test(w) && !/ss$/.test(w)) w = w.slice(0, -1);
    return w;
  }
  function spoken(text) {
    return text.replace(/\[[^\]]*\]/g, ' ').replace(/\([^)]*[가-힣][^)]*\)/g, ' ')
      .split(/[\s—–/]+/).flatMap(t => t.includes('-') && !/\d/.test(t) ? t.split('-') : [t]).map(norm).filter(Boolean);
  }
  S.forEach(s => { s.words = spoken(s.text); });
  // planned start time of each slide: word share of a 38-minute talk
  const TALK_SEC = 38 * 60;
  const slideWords = DATA.map((sl, si) => S.filter(x => x.si === si).reduce((a, x) => a + x.words.length, 0));
  const totalWords = slideWords.reduce((a, b) => a + b, 0) || 1;
  const PLAN = []; slideWords.reduce((acc, w, i) => { PLAN[i] = acc / totalWords * TALK_SEC; return acc + w; }, 0);
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 9;
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function same(a, b) {
    if (a === b) return true;
    if (a.length >= 5 && b.length >= 5 && a.slice(0, 5) === b.slice(0, 5)) return true;
    const L = Math.max(a.length, b.length);
    return L >= 4 && lev(a, b) <= (L >= 8 ? 2 : 1);
  }
  // greedy alignment of heard words onto target words
  function align(target, heard) {
    let p = 0, m = 0;
    for (const h of heard) {
      for (let j = p; j < Math.min(target.length, p + 4); j++) {
        if (same(target[j], h)) { m++; p = j + 1; break; }
      }
    }
    return { p, m };
  }
  function doneReading(s, heard) {
    const n = s.words.length; if (!n) return true;
    const { p, m } = align(s.words, heard);
    s._prog = n ? p / n : 1;
    if (n <= 4) return p >= n - 1 && m >= Math.max(1, n - 2);
    return (p >= n - 2 && m >= n * 0.5) || m >= n * 0.8;
  }
  // the speaker skipped ahead: the next sentence's opening words appear, in order, among the latest heard words
  function startsNext(heard) {
    const nx = S[pos + 1]; if (!nx || heard.length < 3) return false;
    const head = nx.words.slice(0, 5);
    const need = Math.min(4, head.length);
    if (need < 3) return false;
    return align(head, heard.slice(-8)).m >= need;
  }
  function onHeard(h) {
    const s = S[pos];
    const done = doneReading(s, h);
    const m = $('meter'); if (m) m.firstChild.style.width = Math.round((s._prog || 0) * 100) + '%';
    if ((done || startsNext(h)) && pos < S.length - 1) {
      go(pos + 1, true);
      if (!done) carry = h.slice(-8);
    }
  }

  // ---------- render ----------
  let renderedSlide = -1;
  function renderK3() {
    const s = S[pos], sl = DATA[s.si];
    renderedSlide = -1;
    $('slideno').textContent = sl.n + ' / ' + DATA.length;
    $('slidetitle').textContent = sl.title || 'Slide ' + sl.n;
    $('thumb').src = 'img/s' + sl.n + '.jpg';
    const col = $('col'); col.innerHTML = '';
    const line = (x, cls) => {
      const p = document.createElement('p'); p.className = 's ' + cls; p.style.margin = '0';
      let tag = '';
      if (cls === 'upnext' && x.si !== s.si) tag = '<span class="nexttag">▶ 다음 슬라이드 ' + DATA[x.si].n + '</span>';
      p.innerHTML = tag + x.html; col.appendChild(p); return p;
    };
    if (S[pos - 1] && S[pos - 1].si === s.si) line(S[pos - 1], 'done');
    if (s.cue) { const c = document.createElement('div'); c.className = 'cue' + (running ? ' flash' : ''); c.textContent = s.cue; col.appendChild(c); }
    line(s, 'cur');
    const m = document.createElement('div'); m.className = 'meter'; m.id = 'meter'; m.innerHTML = '<i></i>'; col.appendChild(m);
    if (S[pos + 1]) line(S[pos + 1], 'upnext');
    $('tgt').textContent = '/ 목표 ' + fmt(PLAN[s.si]);
    store.set('pos', pos);
    tick();
  }
  function render() {
    if (view === 'k3') return renderK3();
    const s = S[pos], sl = DATA[s.si];
    if (renderedSlide !== s.si) {
      renderedSlide = s.si;
      $('slideno').textContent = sl.n + ' / ' + DATA.length;
      $('slidetitle').textContent = sl.title || 'Slide ' + sl.n;
      $('thumb').src = 'img/s' + sl.n + '.jpg';
      const col = $('col'); col.innerHTML = '';
      sl.items.forEach((it, k) => {
        if (it.cue) { const c = document.createElement('div'); c.className = 'cue dim'; c.dataset.k = k; c.textContent = it.cue; col.appendChild(c); }
        const p = document.createElement('p'); p.className = 's'; p.style.margin = '0'; p.dataset.k = k; p.innerHTML = it.html;
        p.addEventListener('click', (e) => { e.stopPropagation(); go(S.findIndex(x => x.si === s.si && x.k === k)); });
        col.appendChild(p);
      });
      const m = document.createElement('div'); m.className = 'meter'; m.id = 'meter'; m.innerHTML = '<i></i>'; col.appendChild(m);
      const nsl = DATA[s.si + 1];
      if (nsl) { const n = document.createElement('div'); n.className = 'next'; n.innerHTML = '다음 슬라이드 <strong>' + nsl.n + ' — ' + esc(nsl.title || '') + '</strong>'; col.appendChild(n); }
      $('stage').scrollTop = 0;
    }
    document.querySelectorAll('#col .s').forEach(p => {
      const k = +p.dataset.k; p.classList.toggle('cur', k === s.k); p.classList.toggle('done', k < s.k);
    });
    document.querySelectorAll('#col .cue').forEach(c => {
      const k = +c.dataset.k; c.classList.toggle('dim', k !== s.k); c.classList.remove('flash');
      if (k === s.k && running) { void c.offsetWidth; c.classList.add('flash'); }
    });
    const cur = document.querySelector('#col .s.cur');
    const meter = $('meter'); if (cur && meter) { cur.after(meter); meter.firstChild.style.width = '0%'; }
    const anchor = document.querySelector('#col .cue:not(.dim)') || cur;
    if (anchor) {
      const st = $('stage');
      const top = anchor.getBoundingClientRect().top - st.getBoundingClientRect().top + st.scrollTop;
      st.scrollTo({ top: Math.max(0, top - st.clientHeight * 0.22) });
    }
    $('tgt').textContent = '/ 목표 ' + fmt(PLAN[s.si]);
    store.set('pos', pos);
    tick();
  }
  function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  function elapsed() { return elapsedBefore + (t0 ? (Date.now() - t0) / 1000 : 0); }
  function tick() {
    const e = elapsed(); $('now').textContent = fmt(e);
    $('clock').classList.toggle('late', e > PLAN[S[pos].si] + 45);
  }
  setInterval(() => { tick(); if (t0) store.set('elapsed', elapsed()); }, 1000);

  // ---------- navigation ----------
  function go(i, fromVoice) {
    i = Math.max(0, Math.min(S.length - 1, i));
    if (i === pos && !fromVoice) return;
    pos = i; heardCut(); render(); if (mode === 'pace' && running) paceStart();
  }
  const next = () => go(pos + 1), prev = () => go(pos - 1);

  // ---------- pace mode ----------
  let paceTimer = null, paceT0 = 0, paceDur = 0, paceRaf = null;
  function sentenceSeconds(s) {
    let sec = s.words.length / wpm * 60 + 0.6;
    const cues = (s.text.match(/\[[^\]]*\]/g) || []).length + (s.cue ? 1 : 0);
    return sec + cues * 1.2;
  }
  function paceStart() {
    paceStop(); if (!running || mode !== 'pace') return;
    paceDur = sentenceSeconds(S[pos]) * 1000; paceT0 = Date.now();
    paceTimer = setTimeout(() => { if (pos < S.length - 1) { go(pos + 1); } else stop(); }, paceDur);
    const bar = () => { const m = $('meter'); if (m) m.firstChild.style.width = Math.min(100, (Date.now() - paceT0) / paceDur * 100) + '%'; paceRaf = requestAnimationFrame(bar); };
    bar();
  }
  function paceStop() { clearTimeout(paceTimer); cancelAnimationFrame(paceRaf); paceTimer = null; }

  // ---------- voice mode ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, cut = { idx: 0, len: 0 }, carry = [], lastResults = [];
  function resultWords(results) { const out = []; for (let i = 0; i < results.length; i++) out.push(results[i][0].transcript.split(/\s+/).map(norm).filter(Boolean)); return out; }
  function heardNow() {
    const h = carry.slice();
    for (let i = cut.idx; i < lastResults.length; i++) h.push(...(i === cut.idx ? lastResults[i].slice(cut.len) : lastResults[i]));
    return h;
  }
  function heardCut() { carry = []; const n = lastResults.length; cut = n ? { idx: n - 1, len: lastResults[n - 1].length } : { idx: 0, len: 0 }; }
  function voiceStart() {
    if (!SR) { voiceFail('이 브라우저는 음성 인식을 지원하지 않아요. 자동 모드로 바꿨어요.'); return; }
    try {
      rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
      rec.onresult = (e) => {
        lastResults = resultWords(e.results);
        onHeard(heardNow());
      };
      rec.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') { listening = false; voiceFail('이 화면에서는 마이크를 쓸 수 없어요. 자동 모드로 바꿨어요.'); }
      };
      rec.onend = () => { if (listening && running && mode === 'voice') { carry = heardNow(); lastResults = []; cut = { idx: 0, len: 0 }; try { rec.start(); } catch (err) {} } };
      lastResults = []; cut = { idx: 0, len: 0 }; carry = [];
      rec.start(); listening = true; setStatus('듣는 중', true);
    } catch (err) { voiceFail('음성 인식을 시작하지 못했어요. 자동 모드로 바꿨어요.'); }
  }
  function voiceStop() { listening = false; if (rec) { try { rec.abort(); } catch (e) {} rec = null; } }
  function voiceFail(msg) { voiceStop(); toast(msg); setMode('pace'); }
  // test hook: feed recognized text without a microphone
  window.__prompterFeed = (text) => { lastResults.push(text.split(/\s+/).map(norm).filter(Boolean)); onHeard(heardNow()); return { slide: DATA[S[pos].si].n, k: S[pos].k }; };

  // ---------- run control ----------
  async function wake() { try { if ('wakeLock' in navigator) window.__wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) wake(); });
  function start() {
    running = true; t0 = Date.now(); $('go').textContent = '멈춤'; wake();
    if (mode === 'pace') { paceStart(); setStatus('자동 진행', true); }
    else if (mode === 'voice') voiceStart();
    else setStatus('탭으로 넘기기', true);
    render();
  }
  function stop() {
    running = false; elapsedBefore = elapsed(); t0 = null; store.set('elapsed', elapsedBefore);
    $('go').textContent = '시작'; paceStop(); voiceStop(); setStatus('멈춤', false);
    try { window.__wl && window.__wl.release(); } catch (e) {}
  }
  function setMode(m) {
    const was = running; if (was) { paceStop(); voiceStop(); }
    mode = m; store.set('mode', m);
    ['voice', 'pace', 'manual'].forEach(x => $('m-' + x).setAttribute('aria-pressed', String(x === m)));
    $('wpmbox').hidden = m !== 'pace';
    if (was) { if (m === 'pace') { paceStart(); setStatus('자동 진행', true); } else if (m === 'voice') voiceStart(); else setStatus('탭으로 넘기기', true); }
    else setStatus('', false);
  }
  function setStatus(t, on) { const e = $('status'); e.textContent = t; e.classList.toggle('on', !!on); }
  let toastT; function toast(t) { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => e.hidden = true, 4000); }

  // ---------- wiring ----------
  $('go').onclick = () => running ? stop() : start();
  $('m-voice').onclick = () => setMode('voice');
  $('m-pace').onclick = () => setMode('pace');
  $('m-manual').onclick = () => setMode('manual');
  $('next').onclick = next; $('prev').onclick = prev;
  $('slower').onclick = () => { wpm = Math.max(70, wpm - 10); $('wpm').textContent = wpm; store.set('wpm', wpm); if (running && mode === 'pace') paceStart(); };
  $('faster').onclick = () => { wpm = Math.min(180, wpm + 10); $('wpm').textContent = wpm; store.set('wpm', wpm); if (running && mode === 'pace') paceStart(); };
  $('font').onclick = () => { const sizes = [26, 30, 34, 40, 48]; size = sizes[(sizes.indexOf(size) + 1) % sizes.length] || 34; document.documentElement.style.setProperty('--size', size + 'px'); store.set('size', size); render(); };
  $('theme').onclick = () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; store.set('theme', t); };
  $('view').onclick = () => { view = view === 'k3' ? 'all' : 'k3'; store.set('view', view); applyView(); renderedSlide = -1; render(); };
  $('more').onclick = () => { const open = $('ctrl').classList.toggle('open'); $('more').setAttribute('aria-expanded', String(open)); $('more').textContent = open ? '닫기' : '설정'; };
  $('slides').onclick = () => { $('list').hidden = false; };
  $('closelist').onclick = () => { $('list').hidden = true; };
  const ol = $('listol');
  DATA.forEach((sl, si) => {
    const li = document.createElement('li'); const b = document.createElement('button');
    b.innerHTML = '<span class="n">' + sl.n + '</span><span class="t">' + esc(sl.title || '—') + '</span><span class="m">' + fmt(PLAN[si]) + '</span>';
    b.onclick = () => { $('list').hidden = true; go(S.findIndex(x => x.si === si)); };
    li.appendChild(b); ol.appendChild(li);
  });
  // tap zones on the script: left third = back, right two-thirds = forward (sentence taps handled above)
  $('stage').addEventListener('click', (e) => { const x = e.clientX / window.innerWidth; x < 0.33 ? prev() : next(); });
  let sx = null; $('stage').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  $('stage').addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); e.preventDefault(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ' || e.key === 'b' || e.key === '.') { e.preventDefault(); running ? stop() : start(); }
  });
  $('wpm').textContent = wpm;
  $('thumb').onerror = () => { $('thumb').hidden = true; };
  setMode(mode);
  applyView();
  render();
})();
</script>

</body></html>
