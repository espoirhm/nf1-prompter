<style>
/* Layout: one-screen stage — slide bar on top, the current slide's script in the middle (current sentence large), controls at the bottom. Dark stage by default, light for rehearsal. */
:root {
  --stage: #0f1415;        /* hall-dark ground, slight teal bias */
  --panel: #182022;
  --line: #2a3537;
  --ink: #f2f6f5;          /* current sentence */
  --ink-dim: #7f8f8e;      /* read / upcoming */
  --must: #ffc861;         /* bold = not on the slide */
  --teal: #19a6a3;         /* deck teal: cues, progress */
  --teal-ink: #04201f;
  --btn: #26343a;          /* control buttons */
  --rec: #ff5a4f;          /* microphone live */
  --warn: #ff8a7a;
  --f-read: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --size: 34px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --stage: #f7f9f9; --panel: #ffffff; --line: #d7e0e0;
  --ink: #0d1718; --ink-dim: #8a9898; --must: #9a5b00;
  --teal: #007f7d; --teal-ink: #ffffff; --warn: #b3261e; --btn: #e4ecec; --rec: #c62828;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--stage); color: var(--ink); font-family: var(--f-read); margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto; grid-template-areas: "bar" "mic" "stage" "ctrl"; }
.bar { grid-area: bar; } #stage { grid-area: stage; } .ctrl { grid-area: ctrl; } .micline { grid-area: mic; }
.micline { display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.micline #mic { min-height: 36px; padding: 4px 12px; font-size: 14px; white-space: nowrap; color: var(--ink-dim); }
.micline #mic.live { color: var(--rec); border-color: var(--rec); }
.micline #heard { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }

/* 3-line "karaoke" view: previous / current / next, same size, current in yellow */
.k3 #stage { display: block; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: auto; padding-block: 12px; }
.k3 .col { width: 100%; gap: 0.9em; }
.k3 .histbox { display: flex; flex-direction: column; gap: 0.5em; padding-top: 4px; }
.k3 .s.hist { font-size: calc(var(--size) * 0.7); line-height: 1.4; color: var(--ink-dim); opacity: .7; transition: none; }
.k3 .s.hist b { color: inherit; }
.k3 .histtag { font-family: var(--f-mono); font-size: 12px; color: var(--teal); opacity: .85; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k3 #hist { padding-bottom: 12px; }     /* keeps the extra lines just out of sight while the three lines are shown */
.k3 #ahead { padding-top: 12px; padding-bottom: 8px; }
.k3 .core { display: flex; flex-direction: column; justify-content: center; }
.k3 .coreIn { display: flex; flex-direction: column; gap: 0.9em; }
.k3 .s, .k3 .s.cur { font-size: calc(var(--size) * 0.8 * var(--k3s, 1)); line-height: 1.45; transition: none; }
.k3 .s { color: var(--ink-dim); opacity: .75; }
.k3 .s.cur { color: var(--must); opacity: 1; }
.k3 .s.cur b { color: var(--must); }
.k3 .s .ko { font-size: .7em; }
.k3 .nexttag { font-family: var(--f-mono); font-size: 12px; color: var(--teal); display: block; margin-bottom: 2px; }
.k3 .next { display: none; }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.slideno { font-family: var(--f-mono); font-size: 15px; color: var(--teal); white-space: nowrap; }
.slidetitle { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { font-family: var(--f-mono); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.clock .tgt { color: var(--ink-dim); }
.clock.late .now { color: var(--warn); }
.thumb { height: 54px; aspect-ratio: 16 / 9; border-radius: 4px; border: 1px solid var(--line); object-fit: cover; background: #000; flex: none; }
.thumb[hidden] { display: none !important; }

/* stage */
#stage { position: relative; overflow-y: auto; padding: 24px 16px 60vh; scroll-behavior: smooth; min-height: 0; }
.col { max-width: 30em; margin: 0 auto; display: flex; flex-direction: column; gap: 0.7em; }
.s { font-size: calc(var(--size) * 0.62); line-height: 1.4; color: var(--ink-dim); transition: color .2s, font-size .2s; cursor: pointer; }
.s b { font-weight: 700; color: inherit; }
.s.cur { font-size: var(--size); color: var(--ink); line-height: 1.32; }
.s.cur b { color: var(--must); }
.s.done { opacity: .55; }
.s .q { font-style: italic; color: var(--teal); font-size: .8em; }
.s .ko { color: var(--ink-dim); font-size: .62em; }
.cue { align-self: flex-start; font-family: var(--f-mono); font-size: calc(var(--size) * 0.5); background: var(--teal); color: var(--teal-ink); padding: .12em .6em; border-radius: 999px; letter-spacing: .04em; }
.cue.dim { background: transparent; color: var(--teal); border: 1px solid var(--teal); }
.cue.flash { animation: flash 1s ease-out 2; }
@keyframes flash { 50% { transform: scale(1.12); } }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: .3em; }
.meter i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .25s linear; }
.next { margin-top: 1.6em; padding-top: 1em; border-top: 1px dashed var(--line); color: var(--ink-dim); font-size: 15px; }
.next strong { color: var(--ink); }

/* controls */
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 2px solid var(--teal); }
.ctrl .grow { flex: 1; }
.ctrl .main { display: flex; gap: 8px; align-items: center; }
.ctrl .extra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#more { display: none; }
button { font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); background: var(--btn); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 44px; }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
button.primary { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); font-weight: 700; min-width: 5.5em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--teal); color: var(--teal-ink); }
.wpm { font-family: var(--f-mono); font-size: 14px; color: var(--ink-dim); white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--teal); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); }
.status { font-size: 13px; color: var(--ink-dim); white-space: nowrap; }
.status.on { color: var(--teal); }

/* slide list */
#list { position: fixed; inset: 0; background: var(--stage); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px; }
#list h2 { font-size: 18px; margin: 0 0 12px; }
#list ol { list-style: none; margin: 0; padding: 0; max-width: 40em; }
#list li button { width: 100%; text-align: left; display: flex; gap: 12px; align-items: baseline; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
#list .n { font-family: var(--f-mono); color: var(--teal); min-width: 2.5em; }
#list .t { flex: 1; min-width: 0; }
#list .m { font-family: var(--f-mono); color: var(--ink-dim); font-size: 13px; }

@media (max-width: 560px) {
  :root { --size: 26px; }
  /* phone: one slim header line, big thumb-friendly controls, extras behind 설정 */
  .bar { gap: 8px; padding: calc(6px + env(safe-area-inset-top, 0px)) 12px 6px; }
  .thumb { display: none; }
  .slideno, .clock { font-size: 13px; }
  .slidetitle { font-size: 13px; }
  #stage { padding-top: 10px; }
  /* phone: controls sit at the top, under the slide line, clear of Safari's bottom toolbar */
  #app { grid-template-rows: auto auto auto 1fr; grid-template-areas: "bar" "ctrl" "mic" "stage"; }
  .micline { padding: 6px 12px; }
  .ctrl { flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 12px 10px; border-top: 0; border-bottom: 2px solid var(--teal); }
  .ctrl .main { width: 100%; }
  .ctrl .main button { flex: 1; min-height: 56px; font-size: 20px; }
  .ctrl .main #go { flex: 1.4; font-size: 18px; }
  .ctrl .main #more { display: block; flex: 0.9; font-size: 15px; }
  .ctrl .extra { display: none; }
  .ctrl.open .extra { display: flex; }
  .ctrl .status { display: none; }
}
@media (prefers-reduced-motion: reduce) { #stage { scroll-behavior: auto; } .cue.flash { animation: none; } .s, .meter i { transition: none; } }
</style>

<script>
window.NF1_SCRIPT=[{"n":1,"title":"2026 MGH AM Lecture Radiologic approach to the diagnosis of …","target":null,"items":[{"text":"Good morning, everyone.","html":"\u003cb\u003eGood morning, everyone.\u003c/b\u003e","cue":null},{"text":"I’m Heemang Yoon.","html":"\u003cb\u003eI’m\u003c/b\u003e Heemang Yoon.","cue":null},{"text":"As I mentioned last time, I originally planned to do an AI-related research study during this session.","html":"\u003cb\u003eAs I mentioned last time, I originally planned to do an AI-related research study during this session.\u003c/b\u003e","cue":null},{"text":"But because of some delays with the IRB, we’ll save that for another time.","html":"\u003cb\u003eBut because of some delays with the IRB, we’ll save that for another time.\u003c/b\u003e","cue":null},{"text":"So today, I have another interesting topic for you.","html":"\u003cb\u003eSo today, I have another interesting topic for you.\u003c/b\u003e","cue":null},{"text":"The title is “Radiologic Approach to the Diagnosis of Pediatric Airway and Lung Malformations.”","html":"\u003cb\u003eThe title\u003c/b\u003e is “Radiologic Approach to the Diagnosis of Pediatric Airway and Lung Malformations.”","cue":null},{"text":"Before we start, take a look at these images.","html":"\u003cb\u003eBefore we start, take a look at these images.\u003c/b\u003e","cue":null},{"text":"They’re pretty, right?","html":"\u003cb\u003eThey’re pretty, right?\u003c/b\u003e","cue":null},{"text":"But at first glance, you might be wondering, “What am I looking at?”","html":"\u003cb\u003eBut at first glance, you might be wondering,\u003c/b\u003e “What am I \u003cb\u003elooking at?”\u003c/b\u003e","cue":null},{"text":"Hopefully, by the end of this lecture, you’ll be able to make the diagnosis right away.","html":"\u003cb\u003eHopefully, by the end of this\u003c/b\u003e lecture, \u003cb\u003eyou’ll be able to make\u003c/b\u003e the diagnosis \u003cb\u003eright away.\u003c/b\u003e","cue":null},{"text":"Okay, let’s get started.","html":"\u003cb\u003eOkay, let’s get started.\u003c/b\u003e","cue":null},{"text":"Since I had to prepare this lecture on short notice, I adapted a lecture I gave previously.","html":"\u003cb\u003eSince I had to prepare this\u003c/b\u003e lecture on \u003cb\u003eshort notice, I adapted\u003c/b\u003e a lecture I \u003cb\u003egave previously.\u003c/b\u003e","cue":null},{"text":"So, all the cases I’ll show today are from my previous institution.","html":"So, all the cases \u003cb\u003eI’ll show today are from my previous institution.\u003c/b\u003e","cue":null}]},{"n":2,"title":"Airway and lung malformations","target":null,"items":[{"text":"There are many different types of airway malformations.","html":"\u003cb\u003eThere are many different types\u003c/b\u003e of airway malformations.","cue":null}]},{"n":3,"title":"Airway and lung malformations","target":null,"items":[{"text":"Today, we’ll focus on just two: esophageal bronchus or lung, and tracheal agenesis.","html":"\u003cb\u003eToday, we’ll focus on just two:\u003c/b\u003e esophageal bronchus or lung, and tracheal agenesis.","cue":null}]},{"n":4,"title":"Airway and lung malformations","target":null,"items":[{"text":"There are also many different types of congenital lung anomalies.","html":"\u003cb\u003eThere are also many different types\u003c/b\u003e of congenital lung anomalies.","cue":null},{"text":"They can be broadly divided into parenchymal, vascular, and combined lesions.","html":"\u003cb\u003eThey can be broadly divided\u003c/b\u003e into parenchymal, vascular, and combined lesions.","cue":null}]},{"n":5,"title":"Airway and lung malformations","target":null,"items":[{"text":"Today, we’ll focus on the parenchymal lesions and pulmonary sequestration.","html":"\u003cb\u003eToday, we’ll focus\u003c/b\u003e on the parenchymal lesions and pulmonary sequestration.","cue":null}]},{"n":6,"title":"When should we suspect congenital airway and lung malformati…","target":null,"items":[{"text":"So, when should we suspect a congenital airway or lung malformation?","html":"So, when should we suspect a congenital airway or lung malformation?","cue":null},{"text":"One clue is a persistent unusual opacity or hyperlucency on chest imaging.","html":"\u003cb\u003eOne clue\u003c/b\u003e is a persistent unusual opacity or hyperlucency on chest imaging.","cue":null},{"text":"Another important clue is recurrent pneumonia in the same location.","html":"\u003cb\u003eAnother important clue\u003c/b\u003e is recurrent pneumonia in the same location.","cue":null},{"text":"When you see these findings, think about an underlying congenital airway or lung malformation.","html":"\u003cb\u003eWhen you see these findings, think about an underlying\u003c/b\u003e congenital airway or lung malformation.","cue":null}]},{"n":7,"title":"Postnatal imaging","target":null,"items":[{"text":"So, once we suspect a congenital airway or lung malformation, how do we evaluate it?","html":"\u003cb\u003eSo, once we suspect a congenital\u003c/b\u003e airway or lung \u003cb\u003emalformation, how do we evaluate it?\u003c/b\u003e","cue":null},{"text":"Chest radiography is usually the initial imaging modality.","html":"Chest radiography is \u003cb\u003eusually\u003c/b\u003e the initial imaging modality.","cue":null},{"text":"We look for focal hyperlucency, cystic lesions, vascular or airway abnormalities, and thoracic asymmetry.","html":"\u003cb\u003eWe look\u003c/b\u003e for focal hyperlucency, cystic lesions, vascular or airway abnormalities, and thoracic asymmetry.","cue":null},{"text":"It is also useful for comparison with prior studies and for follow-up.","html":"\u003cb\u003eIt is also useful\u003c/b\u003e for comparison with prior \u003cb\u003estudies\u003c/b\u003e and for follow-up.","cue":null},{"text":"For further evaluation, CT is the modality of choice.","html":"\u003cb\u003eFor further\u003c/b\u003e evaluation, CT is the modality of choice.","cue":null},{"text":"It provides excellent evaluation of the lung parenchyma and vascular anatomy.","html":"\u003cb\u003eIt provides\u003c/b\u003e excellent evaluation of the lung parenchyma and vascular anatomy.","cue":null},{"text":"For the initial evaluation, Contrast-enhanced CT preferred for evaluating associated vascular abnormalities","html":"For the initial evaluation, Contrast-enhanced CT preferred for evaluating associated vascular abnormalities","cue":null},{"text":"The main limitation, of course, is radiation exposure.","html":"The main limitation, of \u003cb\u003ecourse,\u003c/b\u003e is radiation exposure.","cue":null}]},{"n":8,"title":"Postnatal imaging","target":null,"items":[{"text":"So, what about MRI?","html":"So, what about MRI?","cue":null},{"text":"The biggest advantage is no ionizing radiation, but spatial resolution is still lower than CT.","html":"\u003cb\u003eThe biggest advantage\u003c/b\u003e is no ionizing radiation, but spatial resolution is still lower than CT.","cue":null},{"text":"Recently, lung MRI has improved with new techniques like UTE and ZTE.","html":"\u003cb\u003eRecently,\u003c/b\u003e lung MRI has \u003cb\u003eimproved\u003c/b\u003e with new techniques like UTE and ZTE.","cue":null},{"text":"Here is an example of cystic lung lesions in a pediatric patient.","html":"\u003cb\u003eHere is an example of cystic\u003c/b\u003e lung lesions in a \u003cb\u003epediatric patient.\u003c/b\u003e","cue":null},{"text":"Look at this conventional T2 image.","html":"\u003cb\u003eLook at this\u003c/b\u003e conventional \u003cb\u003eT2 image.\u003c/b\u003e","cue":null},{"text":"The lesions are barely visible.","html":"The lesions are \u003cb\u003ebarely visible.\u003c/b\u003e","cue":null},{"text":"But with UTE and ZTE, we can see the lung lesion much better.","html":"But with UTE and ZTE, we can \u003cb\u003esee\u003c/b\u003e the lung lesion \u003cb\u003emuch\u003c/b\u003e better.","cue":null},{"text":"So, these new techniques are promising, although lung MRI is still used more in research than routine clinical practice.","html":"So, these new techniques are \u003cb\u003epromising, although\u003c/b\u003e lung MRI is still used more in research than routine clinical practice.","cue":null}]},{"n":9,"title":"Postnatal imaging","target":null,"items":[{"text":"Ultrasound and fluoroscopy can also be useful in selected cases.","html":"\u003cb\u003eUltrasound\u003c/b\u003e and fluoroscopy can also be \u003cb\u003euseful in selected cases.\u003c/b\u003e","cue":null},{"text":"Ultrasound can assess a systemic feeding vessel and diaphragm , and fluoroscopy can show an abnormal airway–esophageal connection.","html":"\u003cb\u003eUltrasound can assess\u003c/b\u003e a systemic feeding vessel and diaphragm , and fluoroscopy can \u003cb\u003eshow an abnormal\u003c/b\u003e airway–esophageal connection.","cue":null},{"text":"We’ll see examples later.","html":"\u003cb\u003eWe’ll see examples later.\u003c/b\u003e","cue":null}]},{"n":10,"title":"Airway malformations","target":null,"items":[{"text":"Okay, now let’s move on to the actual diseases.","html":"\u003cb\u003eOkay, now let’s move on to the actual diseases.\u003c/b\u003e","cue":null},{"text":"We’ll start with airway malformations.","html":"\u003cb\u003eWe’ll start\u003c/b\u003e with airway malformations.","cue":null}]},{"n":11,"title":"2/M","target":null,"items":[{"text":"Okay, this is our first case.","html":"\u003cb\u003eOkay, this is our first case.\u003c/b\u003e","cue":null},{"text":"This patient had pneumonia at 2 and 3 years of age, and chest radiographs were obtained each time.","html":"\u003cb\u003eThis patient\u003c/b\u003e had pneumonia at 2 and 3 \u003cb\u003eyears of age, and chest radiographs were obtained each time.\u003c/b\u003e","cue":null},{"text":"What do you see?","html":"\u003cb\u003eWhat do you see?\u003c/b\u003e","cue":null},{"text":"Both radiographs show consolidation in the same location—the right lower lobe.","html":"\u003cb\u003eBoth radiographs show consolidation in the same location—the right lower lobe.\u003c/b\u003e","cue":null},{"text":"So, recurrent pneumonia in the same location should raise suspicion for an underlying congenital lung lesion.","html":"So, recurrent pneumonia in the same \u003cb\u003elocation should raise suspicion for an underlying congenital lung lesion.\u003c/b\u003e","cue":null}]},{"n":12,"title":"3/M","target":null,"items":[{"text":"So, we obtained a CT.","html":"\u003cb\u003eSo, we obtained a CT.\u003c/b\u003e","cue":null},{"text":"There is right lower lobe consolidation with bronchiectasis.","html":"\u003cb\u003eThere is right lower lobe consolidation with bronchiectasis.\u003c/b\u003e","cue":null},{"text":"If you look carefully, this bronchus appears to connect with the esophagus.","html":"\u003cb\u003eIf you look carefully, this\u003c/b\u003e bronchus \u003cb\u003eappears to connect\u003c/b\u003e with the esophagus.","cue":null},{"text":"So, we performed an esophagram, which clearly shows an abnormal communication between the distal esophagus and the right lower lobe bronchus.","html":"\u003cb\u003eSo, we performed an esophagram, which clearly shows an abnormal communication between the distal\u003c/b\u003e esophagus and the \u003cb\u003eright lower lobe\u003c/b\u003e bronchus.","cue":null},{"text":"This is an esophageal bronchus supplying the right lower lobe.","html":"\u003cb\u003eThis\u003c/b\u003e is an esophageal bronchus \u003cb\u003esupplying the right lower lobe.\u003c/b\u003e","cue":null},{"text":"This explains the recurrent pneumonia.","html":"\u003cb\u003eThis explains\u003c/b\u003e the recurrent pneumonia.","cue":null}]},{"n":13,"title":"0d/F","target":null,"items":[{"text":"This is another premature baby in the NICU.","html":"\u003cb\u003eThis is another premature baby in the NICU.\u003c/b\u003e","cue":null},{"text":"On the day of birth, there is complete opacification of the right lung with volume loss.","html":"\u003cb\u003eOn the day of birth, there is complete opacification of the right lung with volume loss.\u003c/b\u003e","  trachea is also irregular, and there is abnormal branching of the left bronchial tree.\u003c/b\u003e","cue":null},{"text":"But importantly, there is no right main bronchus at all.","html":"\u003cb\u003eBut importantly, there is no right main bronchus at all.\u003c/b\u003e","cue":null},{"text":"So, the entire right lung is supplied by this airway arising from the esophagus.","html":"\u003cb\u003eSo, the entire right\u003c/b\u003e lung is \u003cb\u003esupplied by this airway arising from the esophagus.\u003c/b\u003e","cue":null},{"text":"When the entire lung is supplied by an esophageal bronchus like this, we call it an esophageal lung.","html":"\u003cb\u003eWhen the entire\u003c/b\u003e lung is \u003cb\u003esupplied\u003c/b\u003e by an esophageal \u003cb\u003ebronchus like this, we call\u003c/b\u003e it an esophageal lung.","cue":null},{"text":"So, this is a right esophageal lung.","html":"\u003cb\u003eSo, this is a right\u003c/b\u003e esophageal lung.","cue":null}]},{"n":15,"title":"Esophageal bronchus or lung","target":null,"items":[{"text":"So, an esophageal bronchus or lung occurs when a lobar or main bronchus arises directly from the esophagus.","html":"So, an esophageal bronchus or lung \u003cb\u003eoccurs\u003c/b\u003e when a lobar or main bronchus arises directly from the esophagus.","cue":null},{"text":"During normal development, the respiratory diverticulum buds from the primitive foregut and then separates from the esophagus.","html":"\u003cb\u003eDuring normal\u003c/b\u003e development, the respiratory diverticulum buds from the \u003cb\u003eprimitive\u003c/b\u003e foregut and then separates from the esophagus.","cue":null},{"text":"If this process is abnormal, an abnormal connection between the esophagus and bronchial tree can remain.","html":"\u003cb\u003eIf this process\u003c/b\u003e is abnormal, an abnormal connection \u003cb\u003ebetween\u003c/b\u003e the esophagus and \u003cb\u003ebronchial tree can remain.\u003c/b\u003e","cue":null},{"text":"Clinically, patients may present with feeding difficulties or recurrent respiratory infections.","html":"\u003cb\u003eClinically, patients may present\u003c/b\u003e with feeding difficulties or recurrent respiratory infections.","cue":null},{"text":"For imaging, an esophagram is the key test.","html":"For imaging, an esophagram is the \u003cb\u003ekey test.\u003c/b\u003e","cue":null},{"text":"It directly shows the communication between the bronchus and the esophagus.","html":"It directly \u003cb\u003eshows\u003c/b\u003e the communication \u003cb\u003ebetween\u003c/b\u003e the bronchus and the esophagus.","cue":null},{"text":"CT evaluates the involved lung and associated anomalies.","html":"CT \u003cb\u003eevaluates\u003c/b\u003e the involved lung and associated anomalies.","cue":null}]},{"n":16,"title":"28+3-week premature neonate, 1.16 kg","target":null,"items":[{"text":"Let’s look at one more case.","html":"\u003cb\u003eLet’s look at one more case.\u003c/b\u003e","cue":null},{"text":"This baby was born at 28 weeks with severe respiratory distress.","html":"\u003cb\u003eThis baby was born at 28\u003c/b\u003e weeks with severe respiratory distress.","cue":null},{"text":"Intubation was unsuccessful, but oxygenation improved with bag-mask ventilation.","html":"Intubation was \u003cb\u003eunsuccessful,\u003c/b\u003e but oxygenation improved with bag-mask ventilation.","cue":null},{"text":"They attempted a tracheostomy, but no trachea was identified.","html":"They attempted a tracheostomy, but no trachea was identified.","cue":null},{"text":"Instead, they found a markedly dilated esophagus.","html":"\u003cb\u003eInstead, they found\u003c/b\u003e a markedly dilated esophagus.","cue":null},{"text":"So, ventilation was maintained through the esophagus, initially by esophageal intubation and then through an esophagotomy with Foley catheter placement.","html":"So, ventilation was \u003cb\u003emaintained through\u003c/b\u003e the esophagus, \u003cb\u003einitially\u003c/b\u003e by assic appearance of bronchial atresia: a bronchocele with distal hyperinflation.","html":"\u003cb\u003eSo, this is the classic appearance\u003c/b\u003e of bronchial atresia: a \u003cb\u003ebronchocele with distal hyperinflation.\u003c/b\u003e","cue":null}]},{"n":21,"title":"Bronchial atresia","target":null,"items":[{"text":"So, what is bronchial atresia?","html":"So, what is bronchial atresia?","cue":null},{"text":"Bronchial atresia is a congenital interruption of a bronchus, as you can see here.","html":"Bronchial atresia is a congenital interruption of a bronchus, as you can \u003cb\u003esee here.\u003c/b\u003e","cue":null},{"text":"Distal to the atresia, mucus accumulates and dilates the bronchus, forming a bronchocele or mucocele.","html":"Distal to the atresia, mucus \u003cb\u003eaccumulates and dilates\u003c/b\u003e the bronchus, \u003cb\u003eforming\u003c/b\u003e a bronchocele or mucocele.","cue":null},{"text":"Interestingly, the distal lung usually doesn’t collapse.","html":"\u003cb\u003eInterestingly,\u003c/b\u003e the distal lung \u003cb\u003eusually doesn’t collapse.\u003c/b\u003e","cue":null},{"text":"On imaging, we typically see distal hyperinflation.","html":"On imaging, we \u003cb\u003etypically see\u003c/b\u003e distal hyperinflation.","cue":null},{"text":"This is due to collateral ventilation, which leads to air trapping.","html":"\u003cb\u003eThis is due\u003c/b\u003e to collateral ventilation, which \u003cb\u003eleads\u003c/b\u003e to air trapping.","cue":null},{"text":"In neonates, however, the affected lung may initially appear atelectatic or consolidated.","html":"In neonates, \u003cb\u003ehowever, the affected\u003c/b\u003e lung may initially appear atelectatic or consolidated.","cue":null},{"text":"The most common location is the apicoposterior segment of the left upper lobe.","html":"The most common \u003cb\u003elocation\u003c/b\u003e is the apicoposterior segment of the \u003cb\u003eleft upper lobe.\u003c/b\u003e","cue":null}]},{"n":22,"tit hyperlucency, with attenuated pulmonary vessels.","cue":null},{"text":"If severe, it can cause mass effect on the adjacent lung and mediastinum.","html":"\u003cb\u003eIf severe,\u003c/b\u003e it can cause mass effect on the adjacent lung and mediastinum.","cue":null}]},{"n":30,"title":"24d/F","target":null,"items":[{"text":"Let’s look at this case.","html":"\u003cb\u003eLet’s look at this case.\u003c/b\u003e","cue":null},{"text":"This is a 24-day-old girl with a tongue mass who underwent tracheostomy and was in the NICU.","html":"\u003cb\u003eThis is a 24-day-old girl\u003c/b\u003e with a tongue mass who \u003cb\u003eunderwent\u003c/b\u003e tracheostomy and was in the \u003cb\u003eNICU.\u003c/b\u003e","cue":null},{"text":"Here is the CT.","html":"\u003cb\u003eHere is the CT.\u003c/b\u003e","cue":null},{"text":"I didn’t include all the images here, but the overall tracheobronchial anatomy was normal.","html":"\u003cb\u003eI didn’t include all the images here, but the overall tracheobronchial anatomy was normal.\u003c/b\u003e","cue":null},{"text":"Here is the right lower lobe bronchus.","html":"\u003cb\u003eHere is the right lower lobe bronchus.\u003c/b\u003e","cue":null},{"text":"It looks slightly narrowed at this level, but it remains patent and is not atretic.","html":"\u003cb\u003eIt looks slightly narrowed at this level, but it remains patent and is not atretic.\u003c/b\u003e","cue":null},{"text":"As you can see, the right lower lobe is markedly hyperinflated, causing compression of the surrounding lung with diffuse haziness, and leftward mediastinal shift.","html":"\u003cb\u003eAs you can see, the right lower lobe is markedly hyperinflated, causing compression of the surrounding lung with diffuse haziness, and leftward mediastinal shift.\u003c/b\u003e","cue":null},{"text":"Because of worsening respiratory distress, the patient underwent surgery, and congenital lobar overinflation was confirmed.","html":"\u003cb\u003eBecause of worsening respiratory distress, the patient underwent surgery,\u003c/b\u003e and congenital lobar overinflation was \u003cb\u003econfirmed.\u003c/b\u003e","cue":null}]},{"n":31,"title":"24d/F","target":null,"items":[{"text":"Now, let’s go back to the radiographs.","html":"\u003cb\u003eNow, let’s go back to the radiographs.\u003c/b\u003e","cue":null},{"text":"On the initial radiograph, the patient has a tracheostomy and pneumomediastinum, but the right lower lung is relatively normal.","html":"\u003cb\u003eOn the initial radiograph, the patient has a tracheostomy and pneumomediastinum, but the right lower lung is relatively normal.\u003c/b\u003e","cue":null},{"text":"By the time of the CT, 24 days later, the right lower lung is markedly hyperinflated, with significant air trapping and mass effect.","html":"\u003cb\u003eBy the time of the CT, 24 days later, the right lower lung is markedly hyperinflated, with significant air trapping and mass effect.\u003c/b\u003e","cue":null},{"text":"So, this case nicely demonstrates the progressive development of air trapping over time in congenital lobar overinflation.","html":"\u003cb\u003eSo, this case nicely demonstrates the progressive development of air trapping over time\u003c/b\u003e in congenital lobar overinflation.","cue":null}]},{"n":32,"title":"Congenital pulmonary airway malformation (CPAM)","target":null,"items":[{"text":"Now, let’s move on to CPAM, the most common congenital lung malformation.","html":"\u003cb\u003eNow, let’s move\u003c/b\u003e on to CPAM, the most common congenital lung malformation.","cue":null},{"text":"It is a congenital cystic lung mass resulting from abnormal development of the terminal airways.","html":"It is a congenital cystic lung mass resulting from abnormal development of the terminal airways.","cue":null},{"text":"CPAM is classified into five types, from type 0 to type 4, based on histologic features and the level of airway involved.","html":"CPAM is \u003cb\u003eclassified into five\u003c/b\u003e types, from type 0 to type 4, \u003cb\u003ebased on histologic features and the level\u003c/b\u003e of airway \u003cb\u003einvolved.\u003c/b\u003e","cue":null},{"text":"From an imaging perspective, cyst size is an important feature.","html":"From an imaging \u003cb\u003eperspective,\u003c/b\u003e cyst size is an \u003cb\u003eimportant feature.\u003c/b\u003e","cue":null},{"text":"For us, types 1, 2, and 3, highlighted in green, are the most important.","html":"For us, types 1, 2, and 3, \u003cb\u003ehighlighted in green, are the most important.\u003c/b\u003e","cue":null},{"text":"Type 1 is the most common, with large cysts, usually greater than 2 centimeters.","html":"Type 1 is the most common, with large cysts, \u003cb\u003eusually greater\u003c/b\u003e than 2 \u003cb\u003ecentimeters.\u003c/b\u003e","cue":null},{"text":"Rarely, it can be associated with mucinous adenocarcinoma.","html":"\u003cb\u003eRarely, it can be associated\u003c/b\u003e with mucinous adenocarcinoma.","cue":null},{"text":"Type 2 has multiple smaller cysts, less than 2 centimeters, and is often associated with other congenital anomalies or pulmonary sequestration.","html":"Type 2 has \u003cb\u003emultiple smaller\u003c/b\u003e cysts, \u003cb\u003eless\u003c/b\u003e than 2 \u003cb\u003ecentimeters,\u003c/b\u003e and is often \u003cb\u003eassociated\u003c/b\u003e with other congenital anomalies or pulmonary sequestration.","cue":null},{"text":"Type 3 has microscopic cysts, so it usually appears solid on imaging.","html":"Type 3 has \u003cb\u003emicroscopic\u003c/b\u003e cysts, so it \u003cb\u003eusually appears\u003c/b\u003e solid on imaging.","cue":null},{"text":"Type 0 is usually lethal at birth, so we rarely see it on imaging.","html":"Type 0 is \u003cb\u003eusually\u003c/b\u003e lethal at birth, so we \u003cb\u003erarely see\u003c/b\u003e it on imaging.","cue":null},{"text":"Type 4 is controversial because it overlaps with type I pleuropulmonary blastoma.","html":"Type 4 is controversial because it overlaps with type I \u003cb\u003epleuropulmonary blastoma.\u003c/b\u003e","cue":null},{"text":"We’ll discuss it later.","html":"\u003cb\u003eWe’ll discuss it later.\u003c/b\u003e","cue":null},{"text":"Let’s look at some cases.","html":"Let’s look at some \u003cb\u003ecases.\u003c/b\u003e","cue":null}]},{"n":33,"title":"3d/F","target":null,"items":[{"text":"This newborn girl had an abnormal lung lesion on fetal ultrasound.","html":"\u003cb\u003eThis newborn girl\u003c/b\u003e had an abnormal lung lesion on fetal \u003cb\u003eultrasound.\u003c/b\u003e","cue":null},{"text":"This is the day-3 radiograph.","html":"\u003cb\u003eThis is the day-3 radiograph.\u003c/b\u003e","cue":null},{"text":"There is a cystic lesion in the left lung, with a large left pneumothorax causing rightward mediastinal shift.","html":"\u003cb\u003eThere is a cystic\u003c/b\u003e lesion in the \u003cb\u003eleft\u003c/b\u003e lung, with a \u003cb\u003elarge left pneumothorax causing rightward mediastinal shift.\u003c/b\u003e","cue":null},{"text":"The left lower lung is collapsed.","html":"\u003cb\u003eThe left lower\u003c/b\u003e lung is \u003cb\u003ecollapsed.\u003c/b\u003e","cue":null},{"text":"CT was obtained after chest tube placement.","html":"\u003cb\u003eCT was obtained after chest tube placement.\u003c/b\u003e","cue":null},{"text":"We can see a large cystic lesion greater tha n 2 cm with an air-fluid level, residual pneumothorax, and significant rightward mediastinal shift.","html":"\u003cb\u003eWe can see a large cystic\u003c/b\u003e lesion \u003cb\u003egreater tha n 2 cm with an air-fluid level, residual pneumothorax, and significant rightward mediastinal shift.\u003c/b\u003e","cue":null},{"text":"The patient underwent surgery, and pathology confirmed type 1 CPAM.","html":"\u003cb\u003eThe patient underwent surgery, and pathology confirmed\u003c/b\u003e type 1 CPAM.","cue":null}]},{"n":34,"title":"3d/F","target":null,"items":[{"text":"Here is another newborn girl with suspected CPAM on fetal ultrasound.","html":"\u003cb\u003eHere is another newborn girl with suspected\u003c/b\u003e CPAM on fetal \u003cb\u003eultrasound.\u003c/b\u003e","cue":null},{"text":"There is a large multicystic lesion in the left lung, with a left pneumothorax and rightward mediastinal shift.","html":"\u003cb\u003eThere is a large multicystic\u003c/b\u003e lesion in the \u003cb\u003eleft\u003c/b\u003e lung, with a \u003cb\u003eleft pneumothorax and rightward mediastinal shift.\u003c/b\u003e","cue":null},{"text":"CT shows multiple air-filled cysts, with the dominant cyst measuring greater than 2 cm, consistent with type 1 CPAM.","html":"\u003cb\u003eCT shows multiple air-filled cysts, with the dominant cyst measuring greater than 2 cm, consistent\u003c/b\u003e with type 1 CPAM.","cue":null}]},{"n":35,"title":"0d/M","target":null,"items":[{"text":"This patient also had an abnormal lung lesion on fetal ultrasound.","html":"\u003cb\u003eThis patient\u003c/b\u003e also had an abnormal lung lesion on fetal \u003cb\u003eultrasound.\u003c/b\u003e","cue":null},{"text":"On the chest radiograph, there are multiple small, round lucencies clustered in the right mid to lower lung zone.","html":"\u003cb\u003eOn the chest radiograph, there are multiple small, round lucencies clustered in the right mid to lower\u003c/b\u003e lung \u003cb\u003ezone.\u003c/b\u003e","cue":null},{"text":"On CT, we can clearly see multiple small cysts clustered together in the right upper lobe.","html":"\u003cb\u003eOn CT, we can clearly see multiple small cysts clustered together in the right upper lobe.\u003c/b\u003e","cue":null},{"text":"Unlike the previous case, these cysts are much smaller, less than 2 cm.","html":"\u003cb\u003eUnlike the previous case, these cysts are much smaller, less\u003c/b\u003e than 2 \u003cb\u003ecm.\u003c/b\u003e","cue":null},{"text":"So, this is the typical appearance of type 2 CPAM, and the diagnosis was confirmed after surgery.","html":"\u003cb\u003eSo, this is the typical appearance\u003c/b\u003e of type 2 CPAM, and the \u003cb\u003ediagnosis was confirmed after surgery.\u003c/b\u003e","cue":null}]},{"n":36,"title":"Congenital pulmonary airway malformation (CPAM)","target":null,"items":[{"text":"CPAM can become infected, resulting in pneumonia or a lung abscess.","html":"CPAM can \u003cb\u003ebecome infected, resulting\u003c/b\u003e in pneumonia or a lung abscess.","cue":null},{"text":"An important differential diagnosis is pleuropulmonary blastoma, or PPB.","html":"An important differential \u003cb\u003ediagnosis\u003c/b\u003e is pleuropulmonary blastoma, or \u003cb\u003ePPB.\u003c/b\u003e","cue":null},{"text":"Let’s look at some examples.","html":"\u003cb\u003eLet’s look at some examples.\u003c/b\u003e","cue":null}]},{"n":37,"title":"10m/M","target":null,"items":[{"text":"Here is an example of superimposed infection.","html":"\u003cb\u003eHere is an example\u003c/b\u003e of superimposed infection.","cue":null},{"text":"This is a 4-month-old girl with multiple congenital anomalies and a tracheostomy.","html":"\u003cb\u003eThis is a 4-month-old girl\u003c/b\u003e with multiple congenital \u003cb\u003eanomalies and a tracheostomy.\u003c/b\u003e","cue":null},{"text":"On the radiograph, there are multiple air-containing cystic lesions in the right mid to lower lung.","html":"\u003cb\u003eOn the radiograph,\u003c/b\u003e there are multiple \u003cb\u003eair-containing cystic lesions in the right mid to lower lung.\u003c/b\u003e","cue":null},{"text":"CT shows a cluster of small cysts in the right lower lobe, suggesting CPAM.","html":"\u003cb\u003eCT shows a cluster of small cysts in the right lower lobe, suggesting\u003c/b\u003e CPAM.","cue":null},{"text":"Now, look at the follow-up study at 10 months.","html":"\u003cb\u003eNow, look at the follow-up study at 10 months.\u003c/b\u003e","cue":null},{"text":"There is new consolidation in the same area, obscuring the underlying cystic lesions.","html":"\u003cb\u003eThere is new consolidation in the same area, obscuring the underlying cystic lesions.\u003c/b\u003e","cue":null},{"text":"CT shows low-attenuation consolidation, consistent with superimposed pneumonia.","html":"\u003cb\u003eCT shows low-attenuation consolidation, consistent\u003c/b\u003e with superimposed \u003cb\u003epneumonia.\u003c/b\u003e","cue":null},{"text":"The patient later underwent surgery, and type 2 CPAM was confirmed.","html":"\u003cb\u003eThe patient later underwent surgery,\u003c/b\u003e and type 2 CPAM was \u003cb\u003econfirmed.\u003c/b\u003e","cue":null},{"text":"The important point is that infection can obscure the underlying CPAM.","html":"\u003cb\u003eThe important point\u003c/b\u003e is that infection can \u003cb\u003eobscure the underlying\u003c/b\u003e CPAM.","cue":null},{"text":"So, comparison with prior imaging is very important.","html":"\u003cb\u003eSo, comparison with prior imaging is very important.\u003c/b\u003e","cue":null}]},{"n":38,"title":"2/M","target":null,"items":[{"text":"Let’s look at the next case.","html":"\u003cb\u003eLet’s look at the next case.\u003c/b\u003e","cue":null},{"text":"This is a 2-year-old boy who was initially treated for pneumonia at an outside hospital.","html":"\u003cb\u003eThis is a 2-year-old boy who was initially treated for pneumonia at an outside hospital.\u003c/b\u003e","cue":null},{"text":"CT showed a thick-walled, air-containing lesion in the right lower lobe.","html":"\u003cb\u003eCT showed a thick-walled, air-containing lesion in the right lower lobe.\u003c/b\u003e","cue":null},{"text":"There was also a soft tissue component within the lesion.","html":"\u003cb\u003eThere was also a soft tissue component within the lesion.\u003c/b\u003e","cue":null},{"text":"It was thought to represent type 1 CPAM with superimposed pneumonia, so the patient was treated with antibiotics and drainage.","html":"\u003cb\u003eIt was thought to represent\u003c/b\u003e type \u003cb\u003e1\u003c/b\u003e CPAM with \u003cb\u003esuperimposed pneumonia, so the patient was treated with antibiotics and drainage.\u003c/b\u003e","cue":null},{"text":"Despite treatment and drainage, the lesion did not improve.","html":"\u003cb\u003eDespite treatment and drainage, the lesion did not improve.\u003c/b\u003e","cue":null},{"text":"Two weeks later, it had significantly increased in size.","html":"\u003cb\u003eTwo\u003c/b\u003e weeks later, it had \u003cb\u003esignificantly increased in size.\u003c/b\u003e","cue":null},{"text":"This rapid growth despite treatment raised concern for a tumor, particularly pleuropulmonary blastoma, which can mimic CPAM.","html":"\u003cb\u003eThis rapid growth despite treatment raised concern for a tumor, particularly\u003c/b\u003e pleuropulmonary blastoma, which can \u003cb\u003emimic\u003c/b\u003e CPAM.","cue":null},{"text":"The patient underwent surgery, and pleuropulmonary blastoma was confirmed.","html":"\u003cb\u003eThe patient underwent surgery,\u003c/b\u003e and pleuropulmonary blastoma was \u003cb\u003econfirmed.\u003c/b\u003e","cue":null},{"text":"So, the important point is that PPB can mimic an infected CPAM, making the diagnosis challenging.","html":"\u003cb\u003eSo, the important point is that PPB can mimic\u003c/b\u003e an infected CPAM, \u003cb\u003emaking the diagnosis challenging.\u003c/b\u003e","cue":null}]},{"n":39,"title":"Pleuropulmonary blastoma (PPB)","target":null,"items":[{"text":"We’ve mentioned PPB several times already.","html":"\u003cb\u003eWe’ve mentioned\u003c/b\u003e PPB \u003cb\u003eseveral times already.\u003c/b\u003e","cue":null},{"text":"So, let’s take a closer look at it.","html":"\u003cb\u003eSo, let’s take a closer look at it.\u003c/b\u003e","cue":null},{"text":"It is a malignant tumor of early childhood.","html":"It is a malignant tumor of early childhood.","cue":null},{"text":"It can involve the lung, pleura, or both, and it is strongly associated with DICER1 mutations.","html":"It can involve the lung, pleura, or both, and it is \u003cb\u003estrongly associated\u003c/b\u003e with DICER1 mutations.","cue":null},{"text":"There are three main types.","html":"\u003cb\u003eThere are three main\u003c/b\u003e types.","cue":null},{"text":"Type I is cystic and can mimic CPAM.","html":"Type I is cystic and can mimic CPAM.","cue":null},{"text":"Type II has both cystic and solid components and can mimic infected CPAM or a lung abscess, like the case we just saw.","html":"Type II has both cystic and solid \u003cb\u003ecomponents\u003c/b\u003e and can mimic infected CPAM or a lung abscess, like the \u003cb\u003ecase we just saw.\u003c/b\u003e","cue":null},{"text":"Type III is predominantly solid and is the most aggressive form.","html":"Type III is \u003cb\u003epredominantly\u003c/b\u003e solid and is the most aggressive \u003cb\u003eform.\u003c/b\u003e","cue":null},{"text":"So, as we move from type I to type III, the lesion becomes more solid and more aggressive.","html":"\u003cb\u003eSo, as we move\u003c/b\u003e from type I to type III, the \u003cb\u003elesion becomes\u003c/b\u003e more solid and more aggressive.","cue":null},{"text":"The important point is that PPB can closely mimic CPAM, especially when the lesion is cystic or infected.","html":"\u003cb\u003eThe important point\u003c/b\u003e is that PPB can \u003cb\u003eclosely\u003c/b\u003e mimic CPAM, \u003cb\u003eespecially when the lesion\u003c/b\u003e is cystic or infected.","cue":null}]},{"n":40,"title":"Bronchopulmonary sequestration","target":null,"items":[{"text":"Next, bronchopulmonary sequestration.","html":"\u003cb\u003eNext,\u003c/b\u003e bronchopulmonary sequestration.","cue":null},{"text":"It is nonfunctioning lung tissue that does not normally communicate with the tracheobronchial tree.","html":"It is nonfunctioning lung tissue that does not \u003cb\u003enormally communicate\u003c/b\u003e with the tracheobronchial tree.","cue":null},{"text":"The key feature is systemic arterial supply, usually from the aorta.","html":"\u003cb\u003eThe key feature\u003c/b\u003e is systemic arterial supply, \u003cb\u003eusually\u003c/b\u003e from the aorta.","cue":null},{"text":"There are two types: extralobar and intralobar sequestration.","html":"\u003cb\u003eThere are two types:\u003c/b\u003e extralobar and intralobar sequestration.","cue":null},{"text":"Extralobar sequestration has its own pleural covering, so it appears as a separate mass.","html":"Extralobar sequestration has its own \u003cb\u003epleural covering, so it appears\u003c/b\u003e as a separate mass.","cue":null},{"text":"It usually has systemic venous drainage, is often diagnosed prenatally or in neonates, and is more commonly associated with other congenital anomalies.","html":"\u003cb\u003eIt usually\u003c/b\u003e has systemic venous drainage, is often \u003cb\u003ediagnosed prenatally\u003c/b\u003e or in neonates, and is more \u003cb\u003ecommonly\u003c/b\u003e associated with other \u003cb\u003econgenital\u003c/b\u003e anomalies.","cue":null},{"text":"Intralobar sequestration is located within a normal lung lobe, without its own pleural covering.","html":"Intralobar sequestration is \u003cb\u003elocated\u003c/b\u003e within a normal lung lobe, \u003cb\u003ewithout\u003c/b\u003e its own \u003cb\u003epleural covering.\u003c/b\u003e","cue":null},{"text":"It usually drains through the pulmonary veins and can present with recurrent infection.","html":"\u003cb\u003eIt usually drains through\u003c/b\u003e the pulmonary veins and can \u003cb\u003epresent\u003c/b\u003e with recurrent infection.","cue":null},{"text":"So, the most important imaging finding is the systemic feeding artery.","html":"\u003cb\u003eSo, the most important\u003c/b\u003e imaging \u003cb\u003efinding\u003c/b\u003e is the systemic \u003cb\u003efeeding artery.\u003c/b\u003e","cue":null}]},{"n":41,"title":"Extralobar (ELS) 25%","target":null,"items":[{"text":"Here are the imaging findings of the two types.","html":"\u003cb\u003eHere are the imaging findings of the two types.\u003c/b\u003e","cue":null},{"text":"On the left is extralobar sequestration (엑스트라로바 시퀘스트레이션).","html":"\u003cb\u003eOn the left\u003c/b\u003e is extralobar \u003cb\u003esequestration\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(엑스트라로바 시퀘스트레이션)\u003c/span\u003e.","cue":null},{"text":"It is a solid, well-defined mass without air.","html":"It is a solid, well-defined mass \u003cb\u003ewithout\u003c/b\u003e air.","cue":null},{"text":"On the right is intralobar sequestration.","html":"\u003cb\u003eOn the right\u003c/b\u003e is intralobar \u003cb\u003esequestration.\u003c/b\u003e","cue":null},{"text":"It is inside a normal lobe, so it is often aerated by collateral air drift.","html":"\u003cb\u003eIt is inside a normal lobe,\u003c/b\u003e so it is often aerated by collateral air drift.","cue":null},{"text":"[CLICK] In both cases, the arrows show the systemic artery from the aorta.","html":"\u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eIn both cases, the arrows show the systemic artery from the aorta.\u003c/b\u003e","cue":null}]},{"n":42,"title":"7d/M, r/o pulmonary sequestration on fetal US","target":null,"items":[{"text":"Let’s look at a case of extralobar sequestration.","html":"\u003cb\u003eLet’s look at a case\u003c/b\u003e of extralobar sequestration.","cue":null},{"text":"CT shows a well-defined, low-density lesion with a systemic feeding artery arising from the aorta.","html":"\u003cb\u003eCT shows a well-defined, low-density lesion with a systemic feeding artery arising from the aorta.\u003c/b\u003e","cue":null},{"text":"Given its separate appearance, this is consistent with extralobar sequestration.","html":"\u003cb\u003eGiven its separate appearance, this is consistent\u003c/b\u003e with extralobar sequestration.","cue":null},{"text":"But notice that the spleen is elevated.","html":"\u003cb\u003eBut notice that the spleen is elevated.\u003c/b\u003e","cue":null},{"text":"This raises suspicion for an associated diaphragmatic defect.","html":"\u003cb\u003eThis raises suspicion for an associated\u003c/b\u003e diaphragmatic \u003cb\u003edefect.\u003c/b\u003e","cue":null},{"text":"At surgery, extralobar sequestration was confirmed, and they found a posterior diaphragmatic defect right here, where it is marked on the image.","html":"\u003cb\u003eAt surgery,\u003c/b\u003e extralobar sequestration was \u003cb\u003econfirmed, and they found a posterior\u003c/b\u003e diaphragmatic \u003cb\u003edefect right here, where it is marked on the image.\u003c/b\u003e","cue":null},{"text":"So, when you see extralobar sequestration, remember to check the diaphragm for associated abnormalities.","html":"\u003cb\u003eSo, when you see\u003c/b\u003e extralobar sequestration, \u003cb\u003eremember to check the diaphragm for associated abnormalities.\u003c/b\u003e","cue":null}]},{"n":43,"title":"Extralobar sequestration (juxtadiaphragmatic)","target":null,"items":[{"text":"This is another case of extralobar sequestration.","html":"\u003cb\u003eThis is another case\u003c/b\u003e of extralobar sequestration.","cue":null},{"text":"On CT, there is a solid mass adjacent to the left hemidiaphragm.","html":"\u003cb\u003eOn CT, there is a solid mass adjacent to the left hemidiaphragm.\u003c/b\u003e","cue":null},{"text":"It had a systemic feeding artery from the distal thoracic aorta, which is not shown here.","html":"\u003cb\u003eIt had a systemic feeding artery from the distal thoracic aorta, which is not shown here.\u003c/b\u003e","cue":null},{"text":"Now, look at the ultrasound image.","html":"\u003cb\u003eNow, look at the ultrasound image.\u003c/b\u003e","cue":null},{"text":"This echogenic soft tissue corresponds to the extralobar sequestration.","html":"\u003cb\u003eThis echogenic soft tissue corresponds\u003c/b\u003e to the extralobar sequestration.","cue":null},{"text":"The yellow dashed lines indicate the diaphragm.","html":"\u003cb\u003eThe yellow dashed lines indicate the diaphragm.\u003c/b\u003e","cue":"CLICK"},{"text":"The lesion extends through a focal diaphragmatic defect, with components both above and below the diaphragm.","html":"\u003cb\u003eThe lesion extends through\u003c/b\u003e a focal \u003cb\u003ediaphragmatic\u003c/b\u003e defect, with \u003cb\u003ecomponents both above and below the diaphragm.\u003c/b\u003e","cue":null},{"text":"Small diaphragmatic defects can be difficult to appreciate on CT, so ultrasound can be very helpful for evaluating the diaphragm.","html":"\u003cb\u003eSmall diaphragmatic\u003c/b\u003e defects can be \u003cb\u003edifficult to appreciate on CT, so ultrasound can be very helpful for evaluating the diaphragm.\u003c/b\u003e","cue":null}]},{"n":44,"title":"Extralobar sequestration (infradiaphragmatic)","target":null,"items":[{"text":"Extralobar sequestration can also occur below the diaphragm.","html":"Extralobar sequestration can also \u003cb\u003eoccur below the diaphragm.\u003c/b\u003e","cue":null},{"text":"In this case, there is an infradiaphragmatic mass medial to the spleen.","html":"\u003cb\u003eIn this case,\u003c/b\u003e there is an infradiaphragmatic \u003cb\u003emass medial to the spleen.\u003c/b\u003e","cue":null},{"text":"On ultrasound, it appears as an echogenic soft tissue mass.","html":"\u003cb\u003eOn ultrasound, it appears as an echogenic soft tissue mass.\u003c/b\u003e","cue":null},{"text":"And on Doppler, we can identify a systemic feeding artery arising from the celiac trunk.","html":"\u003cb\u003eAnd on Doppler, we can identify a systemic feeding artery arising from the celiac trunk.\u003c/b\u003e","cue":null},{"text":"So, ultrasound is very useful for evaluating infradiaphragmatic extralobar sequestration and its systemic arterial supply.","html":"\u003cb\u003eSo, ultrasound is very useful for evaluating\u003c/b\u003e infradiaphragmatic extralobar sequestration and its \u003cb\u003esystemic arterial supply.\u003c/b\u003e","cue":null}]},{"n":45,"title":"6/M fever with chest pain","target":null,"items":[{"text":"This is another interesting case.","html":"\u003cb\u003eThis is another interesting case.\u003c/b\u003e","cue":null},{"text":"This is a 6-year-old boy who presented with fever and chest pain.","html":"\u003cb\u003eThis is a 6-year-old boy who presented\u003c/b\u003e with fever and chest pain.","cue":null},{"text":"The chest radiograph shows left lower lobe consolidation with a pleural effusion.","html":"The chest \u003cb\u003eradiograph shows left lower lobe consolidation with a pleural effusion.\u003c/b\u003e","cue":null},{"text":"On CT, there is a left pleural effusion with adjacent atelectatic lung.","html":"\u003cb\u003eOn CT, there is a left pleural effusion with adjacent atelectatic lung.\u003c/b\u003e","cue":null},{"text":"But if you look carefully, there is a soft tissue lesion with slightly different attenuation from the pleural fluid.","html":"\u003cb\u003eBut if you look carefully, there is a soft tissue lesion with slightly different attenuation from the pleural fluid.\u003c/b\u003e","cue":null}]},{"n":46,"title":"DIAGNOSIS:","target":null,"items":[{"text":"On the coronal image, you can see it much better—a triangular soft tissue mass just above the left hemidiaphragm.","html":"\u003cb\u003eOn the coronal image, you can see it much better—a triangular soft tissue mass just above the left hemidiaphragm.\u003c/b\u003e","cue":null},{"text":"So, we performed an ultrasound.","html":"\u003cb\u003eSo, we performed an ultrasound.\u003c/b\u003e","cue":null},{"text":"Here is the lung, here is the pleural effusion, and this is the mass.","html":"Here is the lung, here is the \u003cb\u003epleural\u003c/b\u003e effusion, and \u003cb\u003ethis is the mass.\u003c/b\u003e","cue":null},{"text":"Below it are the diaphragm and spleen.","html":"\u003cb\u003eBelow it are the diaphragm\u003c/b\u003e and spleen.","cue":null},{"text":"You can also see some branching structures within the lesion.","html":"\u003cb\u003eYou can also see some branching structures within the lesion.\u003c/b\u003e","cue":null},{"text":"Given its location and appearance, we suspected extralobar pulmonary sequestration.","html":"\u003cb\u003eGiven its location and appearance, we suspected\u003c/b\u003e extralobar pulmonary sequestration.","cue":null},{"text":"Arterial flow was detected within the lesion, although the feeding vessel was not clearly identified.","html":"\u003cb\u003eArterial flow was detected within the lesion, although the feeding vessel was not clearly identified.\u003c/b\u003e","cue":null},{"text":"But why did this patient present with acute fever, chest pain, and pleural effusion?","html":"\u003cb\u003eBut why did this patient present with acute\u003c/b\u003e fever, chest pain, and \u003cb\u003epleural\u003c/b\u003e effusion?","cue":null},{"text":"We suspected torsion of the sequestration with infarction.","html":"\u003cb\u003eWe suspected\u003c/b\u003e torsion of the sequestration with \u003cb\u003einfarction.\u003c/b\u003e","cue":null},{"text":"At surgery, the pedicle was indeed torsed, with hemorrhagic infarction of the extralobar sequestration.","html":"\u003cb\u003eAt surgery, the pedicle was indeed torsed,\u003c/b\u003e with hemorrhagic \u003cb\u003einfarction\u003c/b\u003e of the extralobar sequestration.","cue":null},{"text":"So, torsion is a rare complication of extralobar sequestration and can present with acute chest pain and pleural effusion.","html":"So, torsion is a \u003cb\u003erare complication\u003c/b\u003e of extralobar sequestration and can \u003cb\u003epresent with acute\u003c/b\u003e chest pain and \u003cb\u003epleural\u003c/b\u003e effusion.","cue":null},{"text":"And when you see a benign-appearing soft tissue mass near the diaphragm, keep extralobar sequestration in mind.","html":"\u003cb\u003eAnd when you see a benign-appearing soft tissue mass near the diaphragm, keep\u003c/b\u003e extralobar sequestration in \u003cb\u003emind.\u003c/b\u003e","cue":null},{"text":"The feeding vessel may not always be visible, especially if it is very small or compromised by torsion or infarction.","html":"\u003cb\u003eThe feeding vessel may not always be visible, especially if it is very small or compromised\u003c/b\u003e by torsion or \u003cb\u003einfarction.\u003c/b\u003e","cue":null}]},{"n":47,"title":"Spectrum of congenital lung anomalies","target":null,"items":[{"text":"So far, we’ve discussed these congenital lung lesions as separate entities.","html":"\u003cb\u003eSo far, we’ve discussed\u003c/b\u003e these congenital lung lesions as \u003cb\u003eseparate entities.\u003c/b\u003e","cue":null},{"text":"But in reality, they don’t always fit neatly into one category.","html":"\u003cb\u003eBut in reality, they don’t always fit neatly into one category.\u003c/b\u003e","cue":null},{"text":"As you can see in this diagram, congenital lung anomalies actually represent a spectrum, with overlapping airway, parenchymal, foregut, and vascular abnormalities.","html":"\u003cb\u003eAs you can see in this diagram,\u003c/b\u003e congenital lung anomalies actually \u003cb\u003erepresent\u003c/b\u003e a spectrum, with overlapping \u003cb\u003eairway, parenchymal, foregut, and vascular abnormalities.\u003c/b\u003e","cue":null},{"text":"Sometimes, a lesion has features of two or more different malformations.","html":"\u003cb\u003eSometimes,\u003c/b\u003e a lesion has features of two or more \u003cb\u003edifferent\u003c/b\u003e malformations.","cue":null},{"text":"We call this a hybrid lesion.","html":"\u003cb\u003eWe call this\u003c/b\u003e a hybrid lesion.","cue":null}]},{"n":48,"title":"DIAGNOSIS :","target":null,"items":[{"text":"Here is an example of a hybrid lesion.","html":"\u003cb\u003eHere is an example\u003c/b\u003e of a hybrid lesion.","cue":null},{"text":"This is a 2-year-old girl.","html":"\u003cb\u003eThis is a 2-year-old girl.\u003c/b\u003e","cue":null},{"text":"CT shows multiple small cystic lesions in the left lower lobe, with a small solid component at the periphery.","html":"\u003cb\u003eCT shows multiple small cystic\u003c/b\u003e lesions in the left lower lobe, with a \u003cb\u003esmall solid component at the periphery.\u003c/b\u003e","cue":null},{"text":"On the coronal image, you can also see a systemic feeding artery arising from the aorta.","html":"\u003cb\u003eOn the coronal image, you can also see a systemic feeding artery arising from the aorta.\u003c/b\u003e","cue":null},{"text":"So, this lesion has features of both type 2 CPAM and intralobar pulmonary sequestration.","html":"\u003cb\u003eSo, this\u003c/b\u003e lesion has \u003cb\u003efeatures of both\u003c/b\u003e type 2 CPAM and intralobar pulmonary sequestration.","cue":null},{"text":"The diagnosis of a hybrid lesion was confirmed at surgery.","html":"The diagnosis of a hybrid lesion was \u003cb\u003econfirmed at surgery.\u003c/b\u003e","cue":null},{"text":"The important point is, don’t stop after identifying one abnormality.","html":"\u003cb\u003eThe important point is, don’t stop after identifying one abnormality.\u003c/b\u003e","cue":null},{"text":"Always look for additional features, especially abnormal systemic arterial supply, so you don’t miss a hybrid lesion.","html":"\u003cb\u003eAlways look for additional features, especially abnormal systemic arterial supply, so you don’t miss\u003c/b\u003e a hybrid lesion.","cue":null}]},{"n":49,"title":"Now, can you make the diagnosis?","target":null,"items":[{"text":"Okay, we’ve now covered the major congenital airway and lung malformations.","html":"\u003cb\u003eOkay, we’ve now covered the major congenital airway and lung malformations.\u003c/b\u003e","cue":null},{"text":"Do you remember these images from the beginning?","html":"\u003cb\u003eDo you remember these images from the beginning?\u003c/b\u003e","cue":null},{"text":"Now, can you make the diagnosis?","html":"Now, can you make the diagnosis?","cue":null},{"text":"[CLICK] The first one is an esophageal bronchus.","html":"\u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eThe first\u003c/b\u003e one is an esophageal bronchus.","cue":null},{"text":"[CLICK] The second is bronchial atresia.","html":"\u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eThe second\u003c/b\u003e is bronchial atresia.","cue":null},{"text":"[CLICK] The third is type 2 CPAM.","html":"\u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eThe third\u003c/b\u003e is type 2 CPAM.","cue":null},{"text":"[CLICK] And the last one is pulmonary sequestration.","html":"\u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eAnd the last\u003c/b\u003e one is pulmonary sequestration.","cue":null},{"text":"Hopefully, these diagnoses look much easier now.","html":"\u003cb\u003eHopefully, these diagnoses look much easier now.\u003c/b\u003e","cue":null}]},{"n":50,"title":"Take-home points","target":null,"items":[{"text":"Okay, let’s wrap up with a few take-home points.","html":"\u003cb\u003eOkay, let’s wrap up with a few\u003c/b\u003e take-home points.","cue":null},{"text":"When you see recurrent pneumonia in the same location, think about an underlying congenital lung or airway abnormality.","html":"\u003cb\u003eWhen you see\u003c/b\u003e recurrent pneumonia in the same location, \u003cb\u003ethink about an underlying\u003c/b\u003e congenital lung or airway abnormality.","cue":null},{"text":"On CT, look for a few key features.","html":"On CT, look for a \u003cb\u003efew key features.\u003c/b\u003e","cue":null},{"text":"If you see hyperinflation, think about bronchial atresia or congenital lobar overinflation, and carefully evaluate the airway for atresia or bronchial narrowing.","html":"\u003cb\u003eIf you see\u003c/b\u003e hyperinflation, \u003cb\u003ethink\u003c/b\u003e about bronchial atresia or congenital lobar overinflation, and \u003cb\u003ecarefully evaluate\u003c/b\u003e the airway for atresia or bronchial narrowing.","cue":null},{"text":"If you see air-filled cysts, think about CPAM.","html":"\u003cb\u003eIf you see\u003c/b\u003e air-filled cysts, \u003cb\u003ethink\u003c/b\u003e about CPAM.","cue":null},{"text":"If you see systemic arterial supply, think about pulmonary sequestration.","html":"\u003cb\u003eIf you see\u003c/b\u003e systemic arterial supply, \u003cb\u003ethink\u003c/b\u003e about pulmonary sequestration.","cue":null},{"text":"And don’t forget to look for an abnormal connection with the esophagus.","html":"And don’t forget to look for an \u003cb\u003eabnormal\u003c/b\u003e connection with the \u003cb\u003eesophagus.\u003c/b\u003e","cue":null},{"text":"Also, don’t forget hybrid lesions—look for all components.","html":"Also, don’t forget hybrid lesions—look for all components.","cue":null},{"text":"Remember the mimics, especially CPAM versus PPB.","html":"\u003cb\u003eRemember\u003c/b\u003e the mimics, \u003cb\u003eespecially\u003c/b\u003e CPAM \u003cb\u003eversus\u003c/b\u003e PPB.","cue":null},{"text":"And finally, always compare with prior imaging.","html":"\u003cb\u003eAnd finally,\u003c/b\u003e always compare with prior imaging.","cue":null},{"text":"So, remember these five things: airway, cysts, vessels, connections, and prior imaging.","html":"\u003cb\u003eSo, remember these five things:\u003c/b\u003e airway, cysts, vessels, connections, and prior imaging.","cue":null}]},{"n":51,"title":"Thank you for your attention.","target":null,"items":[{"text":"Thank you for your attention.","html":"Thank you for your attention.","cue":null},{"text":"I\u0027m happy to take any questions.","html":"\u003cb\u003eI\u0026#39;m happy to take any questions.\u003c/b\u003e","cue":null}]}];

  const STOP = new Set('a an the and or of in on at to for with by from as is are was were be been it its this that these those we you i they he she can may so but if not also very more than then there here which who what when how do does has have had about into just like one some all each other only now let well our your their'.split(' '));
  // greedy alignment of heard words onto target words; content words may re-sync further ahead after the recognizer drops a chunk
  function align(target, heard) {
    let p = 0, m = 0;
    for (const h of heard) {
      const reach = STOP.has(h) ? 3 : 9;
      for (let j = p; j < Math.min(target.length, p + reach); j++) {
        if (same(target[j], h)) { m++; p = j + 1; break; }
      }
    }
    return { p, m };
  }
  function doneReading(s, heard) {
    const n = s.words.length; if (!n) return true;
    const { p, m } = align(s.words, heard);
    s._prog = n ? p / n : 1;
    // the sentence's last content words were just heard
    const tail = s.words.filter(w => !STOP.has(w)).slice(-2);
    const recent = heard.slice(-6);
    const endHit = tail.some(t => recent.some(h => same(t, h)));
    if (n <= 4) return p >= n - 1 || (endHit && m >= 1);
    return (p >= n - 2 && m >= n * 0.4) || m >= n * 0.65 || (endHit && p >= n * 0.5);
  }
  // the speaker skipped ahead: the next sentence's opening words appear, in order, among the latest heard words
  function startsNext(heard) {
    const nx = S[pos + 1]; if (!nx || heard.length < 3) return false;
    const head = nx.words.slice(0, 5);

  }
  function onHeard(h) {
    const s = S[pos];
    const done = doneReading(s, h);
    const m = $('meter'); if (m) m.firstChild.style.width = Math.round((s._prog || 0) * 100) + '%';
    if ((done || startsNext(h)) && pos < S.length - 1) {
      autoGo(pos + 1);
      if (!done) carry = h.slice(-8);
    }
  }

  // ---------- render ----------
  let renderedSlide = -1;
  function renderK3() {
    const s = S[pos], sl = DATA[s.si];
    renderedSlide = -1;
    $('slideno').textContent = sl.n + ' / ' + DATA.length;
    $('slidetitle').textContent = sl.title || 'Slide ' + sl.n;
    $('thumb').src = 'img/s' + sl.n + '.jpg';
    const st = $('stage'), col = $('col');
    // the text is pulled and someone is reading it (finger on it, or the talk moved on by itself):
    // redraw, but keep the same sentence where it was instead of yanking the view back
    const keep = peeking() && !snapping && (touching || autoNav);
    const anchor = keep ? lineAtTop() : null, keepTop = st.scrollTop;
    if (!keep) disarm();
    col.innerHTML = '';

    // at the very start / end of the talk the window shifts so three lines are still shown
    let first = Math.max(0, pos - 1);
    if (first + 2 > S.length - 1) first = Math.max(0, S.length - 3);
    const last = Math.min(S.length - 1, first + 2);
    // earlier sentences sit above the three lines (pull the text down), later ones below (push it up)
    if (first > 0) col.appendChild(extraLines('hist', Math.max(0, first - AROUND), first - 1, -1));
    const core = document.createElement('div'); core.className = 'core'; core.id = 'core';
    const coreIn = document.createElement('div'); coreIn.className = 'coreIn'; coreIn.id = 'coreIn';
    core.appendChild(coreIn); col.appendChild(core);
    const nodes = [];
    for (let i = first; i <= last; i++) {
      const x = S[i];
      const cls = i < pos ? 'done' : (i === pos ? 'cur' : 'upnext');
      if (i === pos && x.cue) { const c = document.createElement('div'); c.className = 'cue' + (running ? ' flash' : ''); c.textContent = x.cue; coreIn.appendChild(c); }
      const p = document.createElement('p'); p.className = 's ' + cls; p.style.margin = '0'; p.dataset.i = i;
      const tag = x.si !== s.si ? '<span class="nexttag">' + (i < pos ? '◀ 이전 슬라이드 ' : '▶ 다음 슬라이드 ') + DATA[x.si].n + '</span>' : '';
      p.innerHTML = tag + x.html; coreIn.appendChild(p); nodes.push(p);
      p.addEventListener('click', () => go(i));
      if (i === pos) { const m = document.createElement('div'); m.className = 'meter'; m.id = 'meter'; m.innerHTML = '<i></i>'; coreIn.appendChild(m); }
    }
    if (last < S.length - 1) col.appendChild(extraLines('ahead', last + 1, Math.min(S.length - 1, last + AROUND), S[last].si));
    core.style.minHeight = Math.max(0, st.clientHeight - 24) + 'px';
    fitK3(nodes);
    ignoreScrollUntil = Date.now() + 200;
    if (keep) {
      const p = anchor && col.querySelector('.s[data-i="' + anchor.i + '"]');
      st.scrollTop = p ? st.scrollTop + (p.getBoundingClientRect().top - st.getBoundingClientRect().top) - anchor.off : keepTop;
      if (!touching && !peekT) armReturn();
    } else st.scrollTop = coreTop();

    store.set('pos', pos);
    tick();
  }
  // dimmed sentences above / below the three lines; tapping one makes it the current (yellow) sentence
  function extraLines(id, from, to, si0) {
    const box = document.createElement('div'); box.className = 'histbox'; box.id = id;
    let lastSi = si0;
    for (let i = from; i <= to; i++) {
      const x = S[i];
      if (x.si !== lastSi) {
        const t = document.createElement('span'); t.className = 'histtag';
        t.textContent = '슬라이드 ' + DATA[x.si].n + (DATA[x.si].title ? ' · ' + DATA[x.si].title : '');
        box.appendChild(t); lastSi = x.si;
      }
      const p = document.createElement('p'); p.className = 's hist'; p.style.margin = '0'; p.dataset.i = i; p.innerHTML = x.html;
      p.addEventListener('click', () => go(i)); box.appendChild(p);
    }
    return box;
  }
  // the first sentence showing at the top of the stage, and how far below the top it sits
  function lineAtTop() {
    const st = $('stage'), top = st.getBoundingClientRect().top;
    for (const p of $('col').querySelectorAll('.s[data-i]')) {

    }
    return null;
  }
  // keep every shown line fully visible: if three lines do not fit, drop the line after the
  // current one (previous + current stay together), then shrink the text a little,
  // and only as a last resort drop the previous line
  function fitK3(nodes) {
    const st = $('stage'), box = $('coreIn');
    const fits = () => box.scrollHeight <= st.clientHeight - 24;
    const setK = (k) => box.style.setProperty('--k3s', String(k));
    const cur = nodes.find(n => +n.dataset.i === pos);
    // the line kept together with the current one: the previous sentence (or the next one at the very start)
    const partner = nodes.find(n => +n.dataset.i === pos - 1) || nodes.find(n => +n.dataset.i === pos + 1);
    const extras = nodes.filter(n => n !== cur && n !== partner)
      .sort((a, b) => Math.abs(+b.dataset.i - pos) - Math.abs(+a.dataset.i - pos));   // farthest first
    setK(1);
    if (fits()) return;                                          // 1) three lines, normal size
    for (let k = 0.95; k >= 0.85; k = +(k - 0.05).toFixed(2)) { setK(k); if (fits()) return; }   // 2) three lines, slightly smaller
    setK(1);
    while (extras.length) { extras.shift().remove(); if (fits()) return; }   // 3) long sentence: previous + current
    for (let k = 0.94; k >= 0.7; k = +(k - 0.06).toFixed(2)) { setK(k); if (fits()) return; }   //    ... a bit smaller
    if (partner) partner.remove();                               // 4) current sentence alone, as large as fits
    for (let k = 1; k >= 0.5; k = +(k - 0.05).toFixed(2)) { setK(k); if (fits()) return; }
    // 5) still too long: the stage scrolls, so the rest can be read by pushing the text up
  }
  // ---------- pull the text down / push it up to read earlier / later sentences ----------
  const AROUND = 12;          // sentences kept above and below the three lines
  let peekT = null, touching = false, snapping = false, autoNav = false, ignoreScrollUntil = 0;
  function coreTop() {
    const c = document.getElementById('core'), st = $('stage');
    return c ? Math.max(0, c.offsetTop - parseFloat(getComputedStyle(st).paddingTop || '0')) : 0;
  }
  // room to scroll inside the three lines themselves (only when the current sentence is longer than the screen)
  function coreSpan() { const c = document.getElementById('core'); return c ? Math.max(0, c.offsetHeight - ($('stage').clientHeight - 24)) : 0; }
  function peeking() {
    if (view !== 'k3' || !document.getElementById('core')) return false;
    const t = $('stage').scrollTop, c = coreTop();
    return t < c - 4 || t > c + coreSpan() + 4;
  }
  function snapBack() {
    if (view !== 'k3') return;
    const st = $('stage'); snapping = true;
    st.scrollTo({ top: coreTop(), behavior: 'smooth' });
    // if the smooth scroll did not get there (e.g. the page was not drawing), jump
    setTimeout(() => { snapping = false; if (!touching && peeking()) st.scrollTop = coreTop(); }, 900);
  }
  // after the finger lets go, the pulled text stays for a few seconds, then the three lines come back
  function armReturn() { clearTimeout(peekT); peekT = setTimeout(() => { peekT = null; if (!touching && peeking()) snapBack(); }, 5000); }
  function disarm() { clearTimeout(peekT); peekT = null; }
  const letGo = () => { touching = false; if (peeking()) armReturn(); };
  $('stage').addEventListener('touchstart', () => { touching = true; disarm(); }, { passive: true });
  $('stage').addEventListener('touchend', letGo, { passive: true });
  $('stage').addEventListener('touchcancel', letGo, { passive: true });
  $('stage').addEventListener('scroll', () => {
    if (touching || snapping || Date.now() < ignoreScrollUntil) return;   // finger still on it, or our own scrolling
    if (peeking()) armReturn(); else disarm();
  }, { passive: true });
  // the talk moved on by itself (timer or voice): like go(), but a pulled view stays where it is
  function autoGo(i) { autoNav = true; try { go(i, true); } finally { autoNav = false; } }
  let refitT = null;
  function refit() {
    clearTimeout(refitT);

    const s = S[pos], sl = DATA[s.si];
    if (renderedSlide !== s.si) {
      renderedSlide = s.si;
      $('slideno').textContent = sl.n + ' / ' + DATA.length;
      $('slidetitle').textContent = sl.title || 'Slide ' + sl.n;
      $('thumb').src = 'img/s' + sl.n + '.jpg';
      const col = $('col'); col.innerHTML = '';
      sl.items.forEach((it, k) => {
        if (it.cue) { const c = document.createElement('div'); c.className = 'cue dim'; c.dataset.k = k; c.textContent = it.cue; col.appendChild(c); }
        const p = document.createElement('p'); p.className = 's'; p.style.margin = '0'; p.dataset.k = k; p.innerHTML = it.html;
        p.addEventListener('click', () => { go(S.findIndex(x => x.si === s.si && x.k === k)); });
        col.appendChild(p);
      });
      const m = document.createElement('div'); m.className = 'meter'; m.id = 'meter'; m.innerHTML = '<i></i>'; col.appendChild(m);
      const nsl = DATA[s.si + 1];
      if (nsl) { const n = document.createElement('div'); n.className = 'next'; n.innerHTML = '다음 슬라이드 <strong>' + nsl.n + ' — ' + esc(nsl.title || '') + '</strong>'; col.appendChild(n); }
      $('stage').scrollTop = 0;
    }
    document.querySelectorAll('#col .s').forEach(p => {
      const k = +p.dataset.k; p.classList.toggle('cur', k === s.k); p.classList.toggle('done', k < s.k);
    });
    document.querySelectorAll('#col .cue').forEach(c => {
      const k = +c.dataset.k; c.classList.toggle('dim', k !== s.k); c.classList.remove('flash');
      if (k === s.k && running) { void c.offsetWidth; c.classList.add('flash'); }
    });
    const cur = document.querySelector('#col .s.cur');
    const meter = $('meter'); if (cur && meter) { cur.after(meter); meter.firstChild.style.width = '0%'; }
    const anchor = document.querySelector('#col .cue:not(.dim)') || cur;
    if (anchor) {
      const st = $('stage');
      const top = anchor.getBoundingClientRect().top - st.getBoundingClientRect().top + st.scrollTop;
      st.scrollTo({ top: Math.max(0, top - st.clientHeight * 0.22) });
    }
    $('tgt').textContent = '/ 목표 ' + fmt(PLAN[s.si]);
    store.set('pos', pos);
    tick();
  }
  function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  function elapsed() { return elapsedBefore + (t0 ? (Date.now() - t0) / 1000 : 0); }
  function tick() {
    const e = elapsed(); $('now').textContent = fmt(e);
    $('clock').classList.toggle('late', e > PLAN[S[pos].si] + 45);
  }
  setInterval(() => { tick(); if (t0) store.set('elapsed', elapsed()); }, 1000);

  // ---------- navigation ----------
  function go(i, fromVoice) {
    i = Math.max(0, Math.min(S.length - 1, i));
    if (i === pos && !fromVoice) return;
    pos = i; heardCut(); render(); if (mode === 'pace' && running) paceStart();
  }
  const next = () => go(pos + 1), prev = () => go(pos - 1);

  // ---------- pace mode ----------
  let paceTimer = null, paceT0 = 0, paceDur = 0, paceRaf = null;
  function sentenceSeconds(s) {
    let sec = s.words.length / wpm * 60 + 0.6;
    const cues = (s.text.match(/\[[^\]]*\]/g) || []).length + (s.cue ? 1 : 0);
    return sec + cues * 1.2;
  }
  function paceStart() {
    paceStop(); if (!running || mode !== 'pace') return;
    paceDur = sentenceSeconds(S[pos]) * 1000; paceT0 = Date.now();
    paceTimer = setTimeout(() => { if (pos < S.length - 1) { autoGo(pos + 1); } else stop(); }, paceDur);
    const bar = () => { const m = $('meter'); if (m) m.firstChild.style.width = Math.min(100, (Date.now() - paceT0) / paceDur * 100) + '%'; paceRaf = requestAnimationFrame(bar); };
