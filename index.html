3cb\u003epredominantly\u003c/b\u003e solid and is the most aggressive \u003cb\u003eform.\u003c/b\u003e","cue":null},{"text":"So, as you move from type I to type III, the lesion becomes more solid and more aggressive.","html":"\u003cb\u003eSo, as you move\u003c/b\u003e from type I to type III, the \u003cb\u003elesion becomes\u003c/b\u003e more solid and more aggressive.","cue":null},{"text":"The important point for us is that type I PPB can look very similar to CPAM, so sometimes it can be difficult to distinguish them on imaging.","html":"\u003cb\u003eThe important point\u003c/b\u003e for us is that type I PPB can \u003cb\u003elook very similar\u003c/b\u003e to CPAM, so \u003cb\u003esometimes it can be difficult to distinguish them on imaging.\u003c/b\u003e","cue":null}]},{"n":43,"title":"Bronchopulmonary sequestration","target":null,"items":[{"text":"Next, bronchopulmonary sequestration.","html":"\u003cb\u003eNext,\u003c/b\u003e bronchopulmonary sequestration.","cue":null},{"text":"It is nonfunctioning lung tissue that does not normally communicate with the tracheobronchial tree.","html":"It is nonfunctioning lung tissue that does not \u003cb\u003enormally communicate\u003c/b\u003e with the tracheobronchial tree.","cue":null},{"text":"The key feature is systemic arterial supply, usually from the aorta.","html":"\u003cb\u003eThe key feature\u003c/b\u003e is systemic arterial supply, \u003cb\u003eusually\u003c/b\u003e from the aorta.","cue":null},{"text":"There are two types: extralobar and intralobar sequestration.","html":"\u003cb\u003eThere are two types:\u003c/b\u003e extralobar and intralobar sequestration.","cue":null},{"text":"Extralobar sequestration has its own pleural covering, so it is separate from the normal lung.","html":"Extralobar sequestration has its own \u003cb\u003epleural covering,\u003c/b\u003e so it is separate from the normal lung.","cue":null},{"text":"It usually has systemic venous drainage and is often diagnosed prenatally or in neonates.","html":"\u003cb\u003eIt usually\u003c/b\u003e has systemic venous drainage and is often \u003cb\u003ediagnosed prenatally\u003c/b\u003e or in neonates.","cue":null},{"text":"It is also more commonly associated with other congenital anomalies.","html":"\u003cb\u003eIt is also more commonly\u003c/b\u003e associated with other \u003cb\u003econgenital\u003c/b\u003e anomalies.","cue":null},{"text":"Intralobar sequestration is more common and is located within a normal lung lobe, without its own pleural covering.","html":"Intralobar sequestration is more common and is \u003cb\u003elocated\u003c/b\u003e within a normal lung lobe, \u003cb\u003ewithout\u003c/b\u003e its own \u003cb\u003epleural covering.\u003c/b\u003e","cue":null},{"text":"It usually drains through the pulmonary veins and most commonly involves the posterior basal lower lobe.","html":"\u003cb\u003eIt usually drains through\u003c/b\u003e the pulmonary veins and most \u003cb\u003ecommonly involves\u003c/b\u003e the posterior basal lower lobe.","cue":null},{"text":"Because intralobar sequestration can become aerated through collateral ventilation, it may not always look like a solid mass.","html":"Because intralobar sequestration can \u003cb\u003ebecome\u003c/b\u003e aerated \u003cb\u003ethrough\u003c/b\u003e collateral \u003cb\u003eventilation, it may not always look\u003c/b\u003e like a solid mass.","cue":null},{"text":"It can present with cystic change or recurrent infection.","html":"\u003cb\u003eIt can present\u003c/b\u003e with cystic \u003cb\u003echange\u003c/b\u003e or recurrent infection.","cue":null},{"text":"So, again, the most important imaging finding is to identify the systemic feeding artery.","html":"\u003cb\u003eSo, again, the most important\u003c/b\u003e imaging \u003cb\u003efinding is to identify\u003c/b\u003e the systemic \u003cb\u003efeeding artery.\u003c/b\u003e","cue":null}]},{"n":44,"title":"Extralobar (ELS) 25%","target":null,"items":[{"text":"Here are the imaging findings of the two types.","html":"\u003cb\u003eHere are the imaging findings of the two types.\u003c/b\u003e","cue":null},{"text":"On the left is extralobar sequestration (엑스트라로바 시퀘스트레이션).","html":"\u003cb\u003eOn the left\u003c/b\u003e is extralobar \u003cb\u003esequestration\u003c/b\u003e \u003cspan class=\u0027ko\u0027\u003e(엑스트라로바 시퀘스트레이션)\u003c/span\u003e.","cue":null},{"text":"It is a solid, well-defined mass without air.","html":"It is a solid, well-defined mass \u003cb\u003ewithout\u003c/b\u003e air.","cue":null},{"text":"On the right is intralobar sequestration.","html":"\u003cb\u003eOn the right\u003c/b\u003e is intralobar \u003cb\u003esequestration.\u003c/b\u003e","cue":null},{"text":"It is inside a normal lobe, so it is often aerated by collateral air drift.","html":"\u003cb\u003eIt is inside a normal lobe,\u003c/b\u003e so it is often aerated by collateral air drift.","cue":null},{"text":"[CLICK] In both cases, the arrows show the systemic artery from the aorta.","html":"\u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eIn both cases, the arrows show the systemic artery from the aorta.\u003c/b\u003e","cue":null}]},{"n":45,"title":"7d/M, r/o PS on fetal US","target":null,"items":[{"text":"Let’s look at a case of extralobar sequestration.","html":"\u003cb\u003eLet’s look at a case\u003c/b\u003e of extralobar sequestration.","cue":null},{"text":"CT shows a well-defined, low-density lesion with a systemic feeding artery arising from the aorta.","html":"\u003cb\u003eCT shows a well-defined, low-density lesion with a systemic feeding artery arising from the aorta.\u003c/b\u003e","cue":null},{"text":"Given its well-defined, separate appearance, this is consistent with extralobar sequestration.","html":"\u003cb\u003eGiven its well-defined, separate appearance, this is consistent\u003c/b\u003e with extralobar sequestration.","cue":null},{"text":"But notice that the spleen is also elevated.","html":"\u003cb\u003eBut notice that the spleen is also elevated.\u003c/b\u003e","cue":null},{"text":"This raises suspicion for an associated diaphragmatic defect.","html":"\u003cb\u003eThis raises suspicion for an associated\u003c/b\u003e diaphragmatic \u003cb\u003edefect.\u003c/b\u003e","cue":null},{"text":"At surgery, extralobar sequestration was confirmed, along with a left posterior diaphragmatic defect.","html":"\u003cb\u003eAt surgery,\u003c/b\u003e extralobar sequestration was \u003cb\u003econfirmed, along with a left posterior\u003c/b\u003e diaphragmatic \u003cb\u003edefect.\u003c/b\u003e","cue":null},{"text":"So, since extralobar sequestration commonly occurs at the left lung base, always take a careful look at the diaphragm for associated abnormalities.","html":"\u003cb\u003eSo, since\u003c/b\u003e extralobar sequestration \u003cb\u003ecommonly occurs at the left lung base, always take a careful look at the diaphragm for associated abnormalities.\u003c/b\u003e","cue":null}]},{"n":46,"title":"Extralobar sequestration (juxtadiaphragmatic)","target":null,"items":[{"text":"This is another case of extralobar sequestration.","html":"\u003cb\u003eThis is another case\u003c/b\u003e of extralobar sequestration.","cue":null},{"text":"On CT, there is a solid mass adjacent to the left hemidiaphragm.","html":"\u003cb\u003eOn CT, there is a solid mass adjacent to the left hemidiaphragm.\u003c/b\u003e","cue":null},{"text":"It had a systemic feeding artery from the distal thoracic aorta, which is not shown here.","html":"\u003cb\u003eIt had a systemic feeding artery from the distal thoracic aorta, which is not shown here.\u003c/b\u003e","cue":null},{"text":"Now, look at the ultrasound images below.","html":"\u003cb\u003eNow, look at the ultrasound images below.\u003c/b\u003e","cue":null},{"text":"This echogenic soft tissue corresponds to the extralobar sequestration.","html":"\u003cb\u003eThis echogenic soft tissue corresponds\u003c/b\u003e to the extralobar sequestration.","cue":null},{"text":"The yellow dashed lines indicate the diaphragm.","html":"\u003cb\u003eThe yellow dashed lines indicate the diaphragm.\u003c/b\u003e","cue":"CLICK"},{"text":"The lesion extends across the left hemidiaphragm, with juxtadiaphragmatic involvement, and you can see a focal diaphragmatic defect here.","html":"\u003cb\u003eThe lesion extends across the left hemidiaphragm,\u003c/b\u003e with juxtadiaphragmatic \u003cb\u003einvolvement, and you can see\u003c/b\u003e a focal \u003cb\u003ediaphragmatic\u003c/b\u003e defect here.","cue":null},{"text":"Small diaphragmatic defects can be difficult to appreciate on CT.","html":"\u003cb\u003eSmall diaphragmatic\u003c/b\u003e defects can be \u003cb\u003edifficult to appreciate on CT.\u003c/b\u003e","cue":null},{"text":"So, ultrasound can be very helpful for evaluating the diaphragm.","html":"\u003cb\u003eSo, ultrasound can be very helpful for evaluating the diaphragm.\u003c/b\u003e","cue":null}]},{"n":47,"title":"Extralobar sequestration (infradiaphragmatic)","target":null,"items":[{"text":"Extralobar sequestration can also occur below the diaphragm.","html":"Extralobar sequestration can also \u003cb\u003eoccur below the diaphragm.\u003c/b\u003e","cue":null},{"text":"In this case, there is an infradiaphragmatic mass, located medial to the spleen.","html":"\u003cb\u003eIn this case,\u003c/b\u003e there is an infradiaphragmatic \u003cb\u003emass, located medial to the spleen.\u003c/b\u003e","cue":null},{"text":"Because of its intra-abdominal location, it can be well evaluated with ultrasound.","html":"\u003cb\u003eBecause of its intra-abdominal location, it can be well evaluated with ultrasound.\u003c/b\u003e","cue":null},{"text":"Here, you can see an echogenic soft tissue mass.","html":"\u003cb\u003eHere, you can see an echogenic soft tissue mass.\u003c/b\u003e","cue":null},{"text":"And on Doppler, we can identify a systemic feeding artery arising from the celiac trunk.","html":"\u003cb\u003eAnd on Doppler, we can identify a systemic feeding artery arising from the celiac trunk.\u003c/b\u003e","cue":null},{"text":"So again, ultrasound is very useful for evaluating infradiaphragmatic extralobar sequestration and its systemic arterial supply.","html":"\u003cb\u003eSo again, ultrasound is very useful for evaluating\u003c/b\u003e infradiaphragmatic extralobar sequestration and its \u003cb\u003esystemic arterial supply.\u003c/b\u003e","cue":null}]},{"n":48,"title":"6/M fever with chest pain","target":null,"items":[{"text":"This is another interesting case.","html":"\u003cb\u003eThis is another interesting case.\u003c/b\u003e","cue":null},{"text":"This is a 6-year-old boy who presented with fever and chest pain.","html":"\u003cb\u003eThis is a 6-year-old boy who presented\u003c/b\u003e with fever and chest pain.","cue":null},{"text":"The chest radiograph shows left lower lobe consolidation with a pleural effusion.","html":"The chest \u003cb\u003eradiograph shows left lower lobe consolidation with a pleural effusion.\u003c/b\u003e","cue":null},{"text":"On CT, there is a left pleural effusion with adjacent atelectatic lung.","html":"\u003cb\u003eOn CT, there is a left pleural effusion with adjacent atelectatic lung.\u003c/b\u003e","cue":null},{"text":"But if you look more carefully, there is a soft tissue lesion with slightly different attenuation from the pleural fluid.","html":"\u003cb\u003eBut if you look more carefully, there is a soft tissue lesion with slightly different attenuation from the pleural fluid.\u003c/b\u003e","cue":null}]},{"n":49,"title":"DIAGNOSIS:","target":null,"items":[{"text":"On the coronal image, you can see it much better—a triangular soft tissue mass just above the left hemidiaphragm.","html":"\u003cb\u003eOn the coronal image, you can see it much better—a triangular soft tissue mass just above the left hemidiaphragm.\u003c/b\u003e","cue":null},{"text":"So, we performed an ultrasound.","html":"\u003cb\u003eSo, we performed an ultrasound.\u003c/b\u003e","cue":null},{"text":"Here is the lung, here is the pleural effusion, and this is the mass.","html":"Here is the lung, here is the \u003cb\u003epleural\u003c/b\u003e effusion, and \u003cb\u003ethis is the mass.\u003c/b\u003e","cue":null},{"text":"Below it are the diaphragm and spleen.","html":"\u003cb\u003eBelow it are the diaphragm\u003c/b\u003e and spleen.","cue":null},{"text":"You can also see some branching structures within the lesion.","html":"\u003cb\u003eYou can also see some branching structures within the lesion.\u003c/b\u003e","cue":null},{"text":"Given its location and appearance, we suspected extralobar pulmonary sequestration.","html":"\u003cb\u003eGiven its location and appearance, we suspected\u003c/b\u003e extralobar pulmonary sequestration.","cue":null},{"text":"Arterial flow was also detected within the lesion, although the feeding vessel was not clearly identified.","html":"\u003cb\u003eArterial flow was also detected within the lesion, although the feeding vessel was not clearly identified.\u003c/b\u003e","cue":null},{"text":"But why did this patient present with acute fever, chest pain, and pleural effusion?","html":"\u003cb\u003eBut why did this patient present with acute\u003c/b\u003e fever, chest pain, and \u003cb\u003epleural\u003c/b\u003e effusion?","cue":null},{"text":"We suspected torsion of the sequestration with infarction.","html":"\u003cb\u003eWe suspected\u003c/b\u003e torsion of the sequestration with \u003cb\u003einfarction.\u003c/b\u003e","cue":null},{"text":"At surgery, the pedicle was indeed torsed, with hemorrhagic infarction of the extralobar sequestration.","html":"\u003cb\u003eAt surgery, the pedicle was indeed torsed,\u003c/b\u003e with hemorrhagic \u003cb\u003einfarction\u003c/b\u003e of the extralobar sequestration.","cue":null},{"text":"So, when you see a benign-appearing soft tissue mass in the lower hemithorax, especially near the diaphragm, extralobar pulmonary sequestration is a useful diagnosis to keep in mind.","html":"\u003cb\u003eSo, when you see a benign-appearing soft tissue mass in the lower hemithorax, especially near the diaphragm,\u003c/b\u003e extralobar pulmonary sequestration is a \u003cb\u003euseful\u003c/b\u003e diagnosis to \u003cb\u003ekeep in mind.\u003c/b\u003e","cue":null}]},{"n":50,"title":"Spectrum of congenital lung anomalies","target":null,"items":[{"text":"So far, we’ve discussed these congenital lung lesions as separate entities.","html":"\u003cb\u003eSo far, we’ve discussed\u003c/b\u003e these congenital lung lesions as \u003cb\u003eseparate entities.\u003c/b\u003e","cue":null},{"text":"But in reality, they don’t always fit neatly into one category.","html":"\u003cb\u003eBut in reality, they don’t always fit neatly into one category.\u003c/b\u003e","cue":null},{"text":"As you can see in this diagram, congenital lung anomalies actually represent a spectrum, with overlapping airway, parenchymal, foregut, and vascular abnormalities.","html":"\u003cb\u003eAs you can see in this diagram,\u003c/b\u003e congenital lung anomalies actually \u003cb\u003erepresent\u003c/b\u003e a spectrum, with overlapping \u003cb\u003eairway, parenchymal, foregut, and vascular abnormalities.\u003c/b\u003e","cue":null},{"text":"Sometimes, a lesion has features of two or more different malformations.","html":"\u003cb\u003eSometimes,\u003c/b\u003e a lesion has features of two or more \u003cb\u003edifferent\u003c/b\u003e malformations.","cue":null},{"text":"We call this a hybrid lesion.","html":"\u003cb\u003eWe call this\u003c/b\u003e a hybrid lesion.","cue":null}]},{"n":51,"title":"DIAGNOSIS :","target":null,"items":[{"text":"Here is an example of a hybrid lesion.","html":"\u003cb\u003eHere is an example\u003c/b\u003e of a hybrid lesion.","cue":null},{"text":"This is a 2-year-old girl.","html":"\u003cb\u003eThis is a 2-year-old girl.\u003c/b\u003e","cue":null},{"text":"CT shows multiple small cystic lesions in the left lower lobe, with a small solid component at the periphery.","html":"\u003cb\u003eCT shows multiple small cystic\u003c/b\u003e lesions in the left lower lobe, with a \u003cb\u003esmall solid component at the periphery.\u003c/b\u003e","cue":null},{"text":"On the coronal image, you can also see a systemic feeding artery arising from the aorta.","html":"\u003cb\u003eOn the coronal image, you can also see a systemic feeding artery arising from the aorta.\u003c/b\u003e","cue":null},{"text":"So, this lesion has features of both type 2 CPAM and intralobar pulmonary sequestration.","html":"\u003cb\u003eSo, this\u003c/b\u003e lesion has \u003cb\u003efeatures of both\u003c/b\u003e type 2 CPAM and intralobar pulmonary sequestration.","cue":null},{"text":"The diagnosis of a hybrid lesion was confirmed at surgery.","html":"The diagnosis of a hybrid lesion was \u003cb\u003econfirmed at surgery.\u003c/b\u003e","cue":null},{"text":"The important point is, don’t stop after identifying one abnormality.","html":"\u003cb\u003eThe important point is, don’t stop after identifying one abnormality.\u003c/b\u003e","cue":null},{"text":"Always look for additional features, especially abnormal systemic arterial supply, so you don’t miss a hybrid lesion.","html":"\u003cb\u003eAlways look for additional features, especially abnormal systemic arterial supply, so you don’t miss\u003c/b\u003e a hybrid lesion.","cue":null}]},{"n":52,"title":"Take-home points","target":null,"items":[{"text":"Okay, let’s wrap up.","html":"\u003cb\u003eOkay, let’s wrap up.\u003c/b\u003e","cue":null},{"text":"When you see recurrent pneumonia in the same location, think about an underlying congenital lung or airway abnormality.","html":"\u003cb\u003eWhen you see\u003c/b\u003e recurrent pneumonia in the same location, \u003cb\u003ethink about an underlying\u003c/b\u003e congenital lung or airway abnormality.","cue":null},{"text":"CT is our main imaging tool, and I want you to look for a few key features.","html":"CT is our \u003cb\u003emain\u003c/b\u003e imaging \u003cb\u003etool, and I want\u003c/b\u003e you to look for a \u003cb\u003efew key features.\u003c/b\u003e","cue":null},{"text":"If you see hyperinflation, think about bronchial atresia or congenital lobar overinflation, and carefully evaluate the airway for atresia or bronchial narrowing.","html":"\u003cb\u003eIf you see\u003c/b\u003e hyperinflation, \u003cb\u003ethink\u003c/b\u003e about bronchial atresia or congenital lobar overinflation, and \u003cb\u003ecarefully evaluate\u003c/b\u003e the airway for atresia or bronchial narrowing.","cue":null},{"text":"If you see air-filled cysts, think about CPAM.","html":"\u003cb\u003eIf you see\u003c/b\u003e air-filled cysts, \u003cb\u003ethink\u003c/b\u003e about CPAM.","cue":null},{"text":"If there is systemic arterial supply, think about pulmonary sequestration.","html":"If there is systemic arterial supply, \u003cb\u003ethink\u003c/b\u003e about pulmonary sequestration.","cue":null},{"text":"And don’t forget to look for an abnormal connection with the esophagus.","html":"And don’t forget to look for an \u003cb\u003eabnormal\u003c/b\u003e connection with the \u003cb\u003eesophagus.\u003c/b\u003e","cue":null},{"text":"Also, congenital lung lesions can overlap, so don’t stop after finding one abnormality.","html":"Also, congenital lung lesions can \u003cb\u003eoverlap,\u003c/b\u003e so don’t \u003cb\u003estop after finding\u003c/b\u003e one abnormality.","cue":null},{"text":"Look for all components of a possible hybrid lesion.","html":"Look for all components of a \u003cb\u003epossible\u003c/b\u003e hybrid lesion.","cue":null},{"text":"Finally, remember the mimics.","html":"\u003cb\u003eFinally, remember\u003c/b\u003e the mimics.","cue":null},{"text":"In particular, PPB can look very similar to CPAM, especially when there is superimposed infection.","html":"\u003cb\u003eIn particular,\u003c/b\u003e PPB can look very \u003cb\u003esimilar\u003c/b\u003e to CPAM, \u003cb\u003eespecially when there is superimposed infection.\u003c/b\u003e","cue":null},{"text":"And as always, comparison with prior imaging can be extremely helpful.","html":"And as always, \u003cb\u003ecomparison\u003c/b\u003e with prior imaging can be \u003cb\u003eextremely helpful.\u003c/b\u003e","cue":null},{"text":"So, look at the airway, the cysts, the vessels, and the connections—and always compare with prior imaging.","html":"So, look at the airway, the cysts, the vessels, and the connections—and always compare with prior imaging.","cue":null}]},{"n":53,"title":"Now, can you make the diagnosis?","target":null,"items":[{"text":"Do you remember these images from the beginning?","html":"\u003cb\u003eDo you remember these images from the beginning?\u003c/b\u003e","cue":null},{"text":"Now, can you make the diagnosis?","html":"Now, can you make the diagnosis?","cue":null},{"text":"[CLICK] The first one is an esophageal bronchus.","html":"\u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eThe first\u003c/b\u003e one is an esophageal bronchus.","cue":null},{"text":"Contrast goes from the esophagus into the right lower lobe bronchus.","html":"\u003cb\u003eContrast goes from the esophagus into the right lower lobe\u003c/b\u003e bronchus.","cue":null},{"text":"[CLICK] The second one is bronchial atresia.","html":"\u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eThe second\u003c/b\u003e one is bronchial atresia.","cue":null},{"text":"There is no bronchus intermedius, and the distal bronchi are disconnected.","html":"\u003cb\u003eThere is no\u003c/b\u003e bronchus \u003cb\u003eintermedius, and the distal bronchi are disconnected.\u003c/b\u003e","cue":null},{"text":"[CLICK] The third one is CPAM, type 2, with multiple small cysts.","html":"\u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eThe third\u003c/b\u003e one is CPAM, type 2, with \u003cb\u003emultiple small cysts.\u003c/b\u003e","cue":null},{"text":"[CLICK] And the last one is pulmonary sequestration, with a systemic artery from the aorta.","html":"\u003ci class=\u0027q\u0027\u003eCLICK\u003c/i\u003e \u003cb\u003eAnd the last\u003c/b\u003e one is pulmonary sequestration, with a \u003cb\u003esystemic artery from the aorta.\u003c/b\u003e","cue":null},{"text":"I hope you can now make these diagnoses right away.","html":"\u003cb\u003eI hope\u003c/b\u003e you can now make these \u003cb\u003ediagnoses right away.\u003c/b\u003e","cue":null}]},{"n":54,"title":"Thank you for your attention.","target":null,"items":[{"text":"Thank you for your attention.","html":"Thank you for your attention.","cue":null},{"text":"I\u0027m happy to take any questions.","html":"\u003cb\u003eI\u0026#39;m happy to take any questions.\u003c/b\u003e","cue":null}]}];

    // the sentence's last content words were just heard
    const tail = s.words.filter(w => !STOP.has(w)).slice(-2);
    const recent = heard.slice(-6);
    const endHit = tail.some(t => recent.some(h => same(t, h)));
    if (n <= 4) return p >= n - 1 || (endHit && m >= 1);
    return (p >= n - 2 && m >= n * 0.4) || m >= n * 0.65 || (endHit && p >= n * 0.5);
  }
  // the speaker skipped ahead: the next sentence's opening words appear, in order, among the latest heard words
  function startsNext(heard) {
    const nx = S[pos + 1]; if (!nx || heard.length < 3) return false;
    const head = nx.words.slice(0, 5);
    const need = Math.min(4, head.length);
    if (need < 3) return false;
    return align(head, heard.slice(-8)).m >= need;
  }
  function onHeard(h) {
    const s = S[pos];
    const done = doneReading(s, h);
    const m = $('meter'); if (m) m.firstChild.style.width = Math.round((s._prog || 0) * 100) + '%';
    if ((done || startsNext(h)) && pos < S.length - 1) {
      autoGo(pos + 1);
      if (!done) carry = h.slice(-8);
    }
  }

  // ---------- render ----------
  let renderedSlide = -1;
  function renderK3() {
    const s = S[pos], sl = DATA[s.si];
    renderedSlide = -1;
    $('slideno').textContent = sl.n + ' / ' + DATA.length;
    $('slidetitle').textContent = sl.title || 'Slide ' + sl.n;
    $('thumb').src = 'img/s' + sl.n + '.jpg';
    const st = $('stage'), col = $('col');
    // the text is pulled and someone is reading it (finger on it, or the talk moved on by itself):
    // redraw, but keep the same sentence where it was instead of yanking the view back
    const keep = peeking() && !snapping && (touching || autoNav);
    const anchor = keep ? lineAtTop() : null, keepTop = st.scrollTop;
    if (!keep) disarm();
    col.innerHTML = '';
    // always three sentences: previous, current, next — across slide boundaries too;
    // at the very start / end of the talk the window shifts so three lines are still shown
    let first = Math.max(0, pos - 1);
    if (first + 2 > S.length - 1) first = Math.max(0, S.length - 3);
    const last = Math.min(S.length - 1, first + 2);
    // earlier sentences sit above the three lines (pull the text down), later ones below (push it up)
    if (first > 0) col.appendChild(extraLines('hist', Math.max(0, first - AROUND), first - 1, -1));
    const core = document.createElement('div'); core.className = 'core'; core.id = 'core';
    const coreIn = document.createElement('div'); coreIn.className = 'coreIn'; coreIn.id = 'coreIn';
    core.appendChild(coreIn); col.appendChild(core);
    const nodes = [];
    for (let i = first; i <= last; i++) {
      const x = S[i];
      const cls = i < pos ? 'done' : (i === pos ? 'cur' : 'upnext');
      if (i === pos && x.cue) { const c = document.createElement('div'); c.className = 'cue' + (running ? ' flash' : ''); c.textContent = x.cue; coreIn.appendChild(c); }
      const p = document.createElement('p'); p.className = 's ' + cls; p.style.margin = '0'; p.dataset.i = i;
      const tag = x.si !== s.si ? '<span class="nexttag">' + (i < pos ? '◀ 이전 슬라이드 ' : '▶ 다음 슬라이드 ') + DATA[x.si].n + '</span>' : '';
      p.innerHTML = tag + x.html; coreIn.appendChild(p); nodes.push(p);
      p.addEventListener('click', () => go(i));
      if (i === pos) { const m = document.createElement('div'); m.className = 'meter'; m.id = 'meter'; m.innerHTML = '<i></i>'; coreIn.appendChild(m); }
    }
    if (last < S.length - 1) col.appendChild(extraLines('ahead', last + 1, Math.min(S.length - 1, last + AROUND), S[last].si));
    core.style.minHeight = Math.max(0, st.clientHeight - 24) + 'px';
    fitK3(nodes);
    ignoreScrollUntil = Date.now() + 200;
    if (keep) {
      const p = anchor && col.querySelector('.s[data-i="' + anchor.i + '"]');
      st.scrollTop = p ? st.scrollTop + (p.getBoundingClientRect().top - st.getBoundingClientRect().top) - anchor.off : keepTop;
      if (!touching && !peekT) armReturn();
    } else st.scrollTop = coreTop();
    $('tgt').textContent = '/ 목표 ' + fmt(PLAN[s.si]);
    store.set('pos', pos);
    tick();
  }
  // dimmed sentences above / below the three lines; tapping one makes it the current (yellow) sentence
  function extraLines(id, from, to, si0) {
    const box = document.createElement('div'); box.className = 'histbox'; box.id = id;
    let lastSi = si0;
    for (let i = from; i <= to; i++) {
      const x = S[i];
      if (x.si !== lastSi) {
        const t = document.createElement('span'); t.className = 'histtag';
        t.textContent = '슬라이드 ' + DATA[x.si].n + (DATA[x.si].title ? ' · ' + DATA[x.si].title : '');
        box.appendChild(t); lastSi = x.si;
      }
      const p = document.createElement('p'); p.className = 's hist'; p.style.margin = '0'; p.dataset.i = i; p.innerHTML = x.html;
      p.addEventListener('click', () => go(i)); box.appendChild(p);
    }
    return box;
  }
  // the first sentence showing at the top of the stage, and how far below the top it sits
  function lineAtTop() {
    const st = $('stage'), top = st.getBoundingClientRect().top;
    for (const p of $('col').querySelectorAll('.s[data-i]')) {
      const r = p.getBoundingClientRect();
      if (r.bottom > top + 1) return { i: +p.dataset.i, off: r.top - top };
    }
    return null;
  }
  // keep every shown line fully visible: if three lines do not fit, drop the line after the
  // current one (previous + current stay together), then shrink the text a little,
  // and only as a last resort drop the previous line
  function fitK3(nodes) {
    const st = $('stage'), box = $('coreIn');
    const fits = () => box.scrollHeight <= st.clientHeight - 24;
    const setK = (k) => box.style.setProperty('--k3s', String(k));
    const cur = nodes.find(n => +n.dataset.i === pos);
    // the line kept together with the current one: the previous sentence (or the next one at the very start)
    const partner = nodes.find(n => +n.dataset.i === pos - 1) || nodes.find(n => +n.dataset.i === pos + 1);
    const extras = nodes.filter(n => n !== cur && n !== partner)
      .sort((a, b) => Math.abs(+b.dataset.i - pos) - Math.abs(+a.dataset.i - pos));   // farthest first
    setK(1);
    if (fits()) return;                                          // 1) three lines, normal size
    for (let k = 0.95; k >= 0.85; k = +(k - 0.05).toFixed(2)) { setK(k); if (fits()) return; }   // 2) three lines, slightly smaller
    setK(1);
    while (extras.length) { extras.shift().remove(); if (fits()) return; }   // 3) long sentence: previous + current
    for (let k = 0.94; k >= 0.7; k = +(k - 0.06).toFixed(2)) { setK(k); if (fits()) return; }   //    ... a bit smaller
    if (partner) partner.remove();                               // 4) current sentence alone, as large as fits
    for (let k = 1; k >= 0.5; k = +(k - 0.05).toFixed(2)) { setK(k); if (fits()) return; }
    // 5) still too long: the stage scrolls, so the rest can be read by pushing the text up
  }
  // ---------- pull the text down / push it up to read earlier / later sentences ----------
  const AROUND = 12;          // sentences kept above and below the three lines
  let peekT = null, touching = false, snapping = false, autoNav = false, ignoreScrollUntil = 0;
  function coreTop() {
    const c = document.getElementById('core'), st = $('stage');
    return c ? Math.max(0, c.offsetTop - parseFloat(getComputedStyle(st).paddingTop || '0')) : 0;
  }
  // room to scroll inside the three lines themselves (only when the current sentence is longer than the screen)
  function coreSpan() { const c = document.getElementById('core'); return c ? Math.max(0, c.offsetHeight - ($('stage').clientHeight - 24)) : 0; }
  function peeking() {
    if (view !== 'k3' || !document.getElementById('core')) return false;
    const t = $('stage').scrollTop, c = coreTop();
    return t < c - 4 || t > c + coreSpan() + 4;
  }
  function snapBack() {
    if (view !== 'k3') return;
    const st = $('stage'); snapping = true;
    st.scrollTo({ top: coreTop(), behavior: 'smooth' });
    // if the smooth scroll did not get there (e.g. the page was not drawing), jump
    setTimeout(() => { snapping = false; if (!touching && peeking()) st.scrollTop = coreTop(); }, 900);
  }
  // after the finger lets go, the pulled text stays for a few seconds, then the three lines come back
  function armReturn() { clearTimeout(peekT); peekT = setTimeout(() => { peekT = null; if (!touching && peeking()) snapBack(); }, 5000); }
  function disarm() { clearTimeout(peekT); peekT = null; }
  const letGo = () => { touching = false; if (peeking()) armReturn(); };
  $('stage').addEventListener('touchstart', () => { touching = true; disarm(); }, { passive: true });
  $('stage').addEventListener('touchend', letGo, { passive: true });
  $('stage').addEventListener('touchcancel', letGo, { passive: true });
  $('stage').addEventListener('scroll', () => {
    if (touching || snapping || Date.now() < ignoreScrollUntil) return;   // finger still on it, or our own scrolling
    if (peeking()) armReturn(); else disarm();
  }, { passive: true });
  // the talk moved on by itself (timer or voice): like go(), but a pulled view stays where it is
  function autoGo(i) { autoNav = true; try { go(i, true); } finally { autoNav = false; } }
  let refitT = null;
  function refit() {
    clearTimeout(refitT);
    refitT = setTimeout(function again() { if (view !== 'k3') return; if (touching || peeking()) { refitT = setTimeout(again, 600); return; } renderK3(); }, 120);
  }
  if (window.ResizeObserver) new ResizeObserver(refit).observe(document.getElementById('stage'));
  window.addEventListener('resize', refit);
  function render() {
    if (view === 'k3') return renderK3();
    const s = S[pos], sl = DATA[s.si];
    if (renderedSlide !== s.si) {
      renderedSlide = s.si;
      $('slideno').textContent = sl.n + ' / ' + DATA.length;
      $('slidetitle').textContent = sl.title || 'Slide ' + sl.n;
      $('thumb').src = 'img/s' + sl.n + '.jpg';
      const col = $('col'); col.innerHTML = '';
      sl.items.forEach((it, k) => {
        if (it.cue) { const c = document.createElement('div'); c.className = 'cue dim'; c.dataset.k = k; c.textContent = it.cue; col.appendChild(c); }
        const p = document.createElement('p'); p.className = 's'; p.style.margin = '0'; p.dataset.k = k; p.innerHTML = it.html;
        p.addEventListener('click', () => { go(S.findIndex(x => x.si === s.si && x.k === k)); });
        col.appendChild(p);
      });
      const m = document.createElement('div'); m.className = 'meter'; m.id = 'meter'; m.innerHTML = '<i></i>'; col.appendChild(m);
      const nsl = DATA[s.si + 1];
      if (nsl) { const n = document.createElement('div'); n.className = 'next'; n.innerHTML = '다음 슬라이드 <strong>' + nsl.n + ' — ' + esc(nsl.title || '') + '</strong>'; col.appendChild(n); }
      $('stage').scrollTop = 0;
    }
    document.querySelectorAll('#col .s').forEach(p => {
      const k = +p.dataset.k; p.classList.toggle('cur', k === s.k); p.classList.toggle('done', k < s.k);
    });
    document.querySelectorAll('#col .cue').forEach(c => {
      const k = +c.dataset.k; c.classList.toggle('dim', k !== s.k); c.classList.remove('flash');
      if (k === s.k && running) { void c.offsetWidth; c.classList.add('flash'); }
    });
    const cur = document.querySelector('#col .s.cur');
    const meter = $('meter'); if (cur && meter) { cur.after(meter); meter.firstChild.style.width = '0%'; }
    const anchor = document.querySelector('#col .cue:not(.dim)') || cur;
    if (anchor) {
      const st = $('stage');
      const top = anchor.getBoundingClientRect().top - st.getBoundingClientRect().top + st.scrollTop;
      st.scrollTo({ top: Math.max(0, top - st.clientHeight * 0.22) });
    }
    $('tgt').textContent = '/ 목표 ' + fmt(PLAN[s.si]);
    store.set('pos', pos);
    tick();
  }
  function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  function elapsed() { return elapsedBefore + (t0 ? (Date.now() - t0) / 1000 : 0); }
  function tick() {
    const e = elapsed(); $('now').textContent = fmt(e);
    $('clock').classList.toggle('late', e > PLAN[S[pos].si] + 45);
  }
  setInterval(() => { tick(); if (t0) store.set('elapsed', elapsed()); }, 1000);

  // ---------- navigation ----------
  function go(i, fromVoice) {
    i = Math.max(0, Math.min(S.length - 1, i));
    if (i === pos && !fromVoice) return;
    pos = i; heardCut(); render(); if (mode === 'pace' && running) paceStart();
  }
  const next = () => go(pos + 1), prev = () => go(pos - 1);

  // ---------- pace mode ----------
  let paceTimer = null, paceT0 = 0, paceDur = 0, paceRaf = null;
  function sentenceSeconds(s) {
    let sec = s.words.length / wpm * 60 + 0.6;
    const cues = (s.text.match(/\[[^\]]*\]/g) || []).length + (s.cue ? 1 : 0);
    return sec + cues * 1.2;
  }
  function paceStart() {
    paceStop(); if (!running || mode !== 'pace') return;
    paceDur = sentenceSeconds(S[pos]) * 1000; paceT0 = Date.now();
    paceTimer = setTimeout(() => { if (pos < S.length - 1) { autoGo(pos + 1); } else stop(); }, paceDur);
    const bar = () => { const m = $('meter'); if (m) m.firstChild.style.width = Math.min(100, (Date.now() - paceT0) / paceDur * 100) + '%'; paceRaf = requestAnimationFrame(bar); };
    bar();
  }
  function paceStop() { clearTimeout(paceTimer); cancelAnimationFrame(paceRaf); paceTimer = null; }

  // ---------- voice mode ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  // The whole session transcript is flattened into one word list; the current sentence hears everything after `cutCount`.
  // (iPhone Safari keeps rewriting one growing result, so counting words is sturdier than tracking result indexes.)
  let rec = null, listening = false, wantListen = false, allWords = [], cutCount = 0, carry = [], lastHeardAt = 0, rawTail = '';
  function transcriptWords(results) { const out = []; let raw = ''; for (let i = 0; i < results.length; i++) { raw += ' ' + results[i][0].transcript; } rawTail = raw.trim().split(/\s+/).slice(-8).join(' '); raw.split(/\s+/).forEach(w => { const n = norm(w); if (n) out.push(n); }); return out; }
  function heardNow() { if (cutCount > allWords.length) cutCount = allWords.length; return carry.concat(allWords.slice(cutCount)); }
  function heardCut() { carry = []; cutCount = allWords.length; }
  function micUI() {
    const on = mode === 'voice' && running;
    $('micline').hidden = !on;
    if (!on) return;
    const b = $('mic');
    b.classList.toggle('live', listening);
    b.textContent = listening ? '● 듣는 중' : '○ 탭해서 다시 듣기';
    $('heard').textContent = rawTail ? '… ' + rawTail : (listening ? '말씀하시면 여기에 들린 단어가 보여요' : '');
  }
  function newRec() {
    const r = new SR(); r.lang = 'en-US'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onstart = () => { listening = true; micUI(); };
    r.onresult = (e) => { allWords = transcriptWords(e.results); lastHeardAt = Date.now(); micUI(); onHeard(heardNow()); };
    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') { wantListen = false; voiceFail('이 화면에서는 마이크를 쓸 수 없어요. 자동 모드로 바꿨어요.'); }
    };
    r.onend = () => {
      listening = false;
      if (wantListen && running && mode === 'voice') {
        carry = heardNow(); allWords = []; cutCount = 0;
        setTimeout(() => { if (wantListen && !listening) tryListen(); }, 250);
      }
      micUI();
    };
    return r;
  }
  function tryListen() { try { if (rec) { rec.onend = null; try { rec.abort(); } catch (e) {} } rec = newRec(); rec.start(); } catch (err) { listening = false; micUI(); } }
  function voiceStart() {
    if (!SR) { voiceFail('이 브라우저는 음성 인식을 지원하지 않아요. 자동 모드로 바꿨어요.'); return; }
    wantListen = true; allWords = []; cutCount = 0; carry = []; rawTail = ''; lastHeardAt = 0;
    tryListen(); micUI();
  }
  function voiceStop() { wantListen = false; listening = false; if (rec) { rec.onend = null; try { rec.abort(); } catch (e) {} rec = null; } micUI(); }
  function voiceFail(msg) { voiceStop(); toast(msg); setMode('pace'); }
  // watchdog: iPhone ends recognition on its own; bring it back
  setInterval(() => { if (wantListen && running && mode === 'voice' && !listening) tryListen(); }, 2500);
  // pause check: the speaker stopped talking after most of the sentence
  setInterval(() => {
    if (!(wantListen && running && mode === 'voice') || !lastHeardAt) return;
    const s = S[pos], h = heardNow(); if (!h.length) return;
    doneReading(s, h);
    if ((s._prog || 0) >= 0.7 && Date.now() - lastHeardAt > 1500 && pos < S.length - 1) { lastHeardAt = 0; autoGo(pos + 1); }
  }, 300);
  // test hook: feed recognized text without a microphone
  window.__prompterFeed = (text) => { text.split(/\s+/).forEach(w => { const n = norm(w); if (n) allWords.push(n); }); lastHeardAt = Date.now(); onHeard(heardNow()); return { slide: DATA[S[pos].si].n, k: S[pos].k }; };

  // ---------- run control ----------
  async function wake() { try { if ('wakeLock' in navigator) window.__wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) wake(); });
  function start() {
    running = true; t0 = Date.now(); $('go').textContent = '멈춤'; wake();
    if (mode === 'pace') { paceStart(); setStatus('자동 진행', true); }
    else if (mode === 'voice') voiceStart();
    else setStatus('탭으로 넘기기', true);
    render();
  }
  function stop() {
    running = false; elapsedBefore = elapsed(); t0 = null; store.set('elapsed', elapsedBefore);
    $('go').textContent = '시작'; paceStop(); voiceStop(); setStatus('멈춤', false);
    try { window.__wl && window.__wl.release(); } catch (e) {}
  }
  function setMode(m) {
    const was = running; if (was) { paceStop(); voiceStop(); }
    mode = m; store.set('mode', m);
    ['voice', 'pace', 'manual'].forEach(x => $('m-' + x).setAttribute('aria-pressed', String(x === m)));
    $('wpmbox').hidden = m !== 'pace';
    if (was) { if (m === 'pace') { paceStart(); setStatus('자동 진행', true); } else if (m === 'voice') voiceStart(); else setStatus('탭으로 넘기기', true); }
    else setStatus('', false);
    micUI();
  }
  function setStatus(t, on) { const e = $('status'); e.textContent = t; e.classList.toggle('on', !!on); }
  let toastT; function toast(t) { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => e.hidden = true, 4000); }

  // ---------- wiring ----------
  $('go').onclick = () => running ? stop() : start();
  $('m-voice').onclick = () => setMode('voice');
  $('m-pace').onclick = () => setMode('pace');
  $('m-manual').onclick = () => setMode('manual');
  $('next').onclick = next; $('prev').onclick = prev;
  $('slower').onclick = () => { wpm = Math.max(70, wpm - 10); $('wpm').textContent = wpm; store.set('wpm', wpm); if (running && mode === 'pace') paceStart(); };
  $('faster').onclick = () => { wpm = Math.min(180, wpm + 10); $('wpm').textContent = wpm; store.set('wpm', wpm); if (running && mode === 'pace') paceStart(); };
  $('font').onclick = () => { const sizes = [26, 30, 34, 40, 48]; size = sizes[(sizes.indexOf(size) + 1) % sizes.length] || 34; document.documentElement.style.setProperty('--size', size + 'px'); store.set('size', size); render(); };
  $('theme').onclick = () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; store.set('theme', t); };
  $('mic').onclick = () => { if (!listening) { wantListen = true; tryListen(); } };
  $('view').onclick = () => { view = view === 'k3' ? 'all' : 'k3'; store.set('view', view); applyView(); renderedSlide = -1; render(); };
  $('more').onclick = () => { const open = $('ctrl').classList.toggle('open'); $('more').setAttribute('aria-expanded', String(open)); $('more').textContent = open ? '닫기' : '설정'; };
  $('slides').onclick = () => { $('list').hidden = false; };
  $('closelist').onclick = () => { $('list').hidden = true; };
  const ol = $('listol');
  DATA.forEach((sl, si) => {
    const li = document.createElement('li'); const b = document.createElement('button');
    b.innerHTML = '<span class="n">' + sl.n + '</span><span class="t">' + esc(sl.title || '—') + '</span><span class="m">' + fmt(PLAN[si]) + '</span>';
    b.onclick = () => { $('list').hidden = true; go(S.findIndex(x => x.si === si)); };
    li.appendChild(b); ol.appendChild(li);
  });
  // no tap-anywhere navigation: tapping a sentence jumps to that sentence (handled where the lines are drawn)
  let sx = null; $('stage').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  $('stage').addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); e.preventDefault(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
    else if (e.key === ' ' || e.key === 'b' || e.key === '.') { e.preventDefault(); running ? stop() : start(); }
  });
  $('wpm').textContent = wpm;
  $('thumb').onerror = () => { $('thumb').hidden = true; };
  setMode(mode);
  applyView();
  render();
})();
</script>
